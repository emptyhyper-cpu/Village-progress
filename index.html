<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AIS Fibre · Village Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --amber-dk:#B57A00;
    --green:#78BE20; --green-dark:#5A9417; --forest:#0F3D24; --forest2:#14532D;
    --tint:#F0F7E8; --paper:#FFFFFF; --ink:#1B2A20; --muted:#5C6B60;
    --amber:#F5A623; --line:#DCE8D2; --red:#D64545;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Sarabun',system-ui,sans-serif; background:var(--tint); color:var(--ink);
    min-height:100vh; font-size:15px;
  }
  h1,h2,h3,.display{font-family:'Taviraj',serif;}

  /* ===== Header ===== */
  header{
    background:linear-gradient(135deg,var(--forest) 0%,var(--forest2) 70%);
    color:#fff; padding:18px 16px 20px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;background:var(--green);
    display:flex;align-items:center;justify-content:center;
    font-family:'Taviraj',serif;font-weight:700;font-size:20px;color:var(--forest);
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .brand h1{font-size:20px;font-weight:600;line-height:1.15;}
  .brand small{display:block;font-family:'Sarabun',sans-serif;font-weight:400;font-size:12px;opacity:.75;letter-spacing:.4px;}
  .header-stats{display:flex;gap:8px;margin-top:14px;}
  .hstat{
    flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:8px 10px;
  }
  .hstat b{font-size:20px;font-family:'Taviraj',serif;color:var(--green);display:block;line-height:1.1;}
  .hstat span{font-size:11px;opacity:.8;}

  main{max-width:760px;margin:0 auto;padding:14px 12px 90px;}

  /* ===== Village cards ===== */
  .vcard{
    background:var(--paper);border-radius:var(--radius);padding:14px;margin-bottom:12px;
    border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,61,36,.06);cursor:pointer;
    transition:box-shadow .15s;
  }
  .vcard:active{box-shadow:0 0 0 2px var(--green);}
  .vcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .vcard h3{font-size:17px;font-weight:600;}
  .vcard .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .chip{
    font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;
  }
  .chip.done{background:#E4F3D2;color:var(--green-dark);}
  .chip.doing{background:#FDF0D8;color:#A86E08;}
  .chip.idle{background:#EDEFEA;color:var(--muted);}
  .bar{height:9px;background:#E9EFE3;border-radius:99px;margin-top:12px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#9BD84A);transition:width .3s;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .bar-row .bar{flex:1;margin-top:0;}
  .pct{font-family:'Taviraj',serif;font-weight:700;font-size:19px;color:var(--forest);min-width:52px;text-align:right;}

  /* ===== Buttons ===== */
  .btn{
    font-family:'Sarabun',sans-serif;font-size:14px;font-weight:600;border:none;border-radius:10px;
    padding:10px 16px;cursor:pointer;transition:filter .12s;
  }
  .btn:active{filter:brightness(.92);}
  .btn-green{background:var(--green);color:var(--forest);}
  .btn-lime{background:#DCEFC4;color:var(--forest);border:1.5px solid var(--green);}
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px;}
  .btn-grid .btn{padding:12px 10px;font-size:13.5px;line-height:1.35;}
  @media(max-width:480px){ .btn-grid{grid-template-columns:1fr;} }
  .btn-dark{background:var(--forest);color:#fff;}
  .btn-ghost{background:transparent;color:var(--forest);border:1.5px solid var(--line);}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn-red{background:#FBEAEA;color:var(--red);}

  .fab{
    position:fixed;bottom:18px;right:16px;z-index:30;
    box-shadow:0 4px 14px rgba(15,61,36,.35);font-size:15px;padding:13px 20px;border-radius:99px;
  }

  /* ===== Detail view ===== */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .back{background:none;border:none;font-size:22px;cursor:pointer;color:var(--forest);padding:4px 8px;}
  .section-label{
    font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--green-dark);
    text-transform:uppercase;margin:18px 0 8px;
  }
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .field input,.field textarea,.field select{
    width:100%;font-family:'Sarabun',sans-serif;font-size:15px;padding:9px 11px;
    border:1.5px solid var(--line);border-radius:9px;background:#FBFDF8;color:var(--ink);
  }
  .field input:focus,.field textarea:focus{outline:2px solid var(--green);border-color:transparent;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ===== Task rows ===== */
  .task{
    border-bottom:1px dashed var(--line);padding:12px 0;
  }
  .task:last-child{border-bottom:none;}
  .task-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .task-name{font-weight:600;font-size:14.5px;flex:1;}
  .task-name input{
    width:100%;border:none;background:transparent;font:inherit;color:inherit;padding:2px 0;
  }
  .task-name input:focus{outline:none;border-bottom:1.5px solid var(--green);}
  .task-pct{font-family:'Taviraj',serif;font-weight:700;font-size:16px;min-width:44px;text-align:right;}
  .task-pct.p100{color:var(--green-dark);}
  .task-pct.p0{color:#B7C2BA;}
  .task-pct.pmid{color:var(--amber);}
  .qchips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .q{
    border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 0;width:46px;
    font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;
  }
  .q.on{background:var(--green);border-color:var(--green);color:var(--forest);}
  .task input[type=range]{width:100%;margin-top:8px;accent-color:var(--green);}
  .task-meta{display:flex;gap:8px;margin-top:8px;}
  .task-meta input{
    flex:1;font-family:'Sarabun',sans-serif;font-size:13px;padding:6px 9px;
    border:1.5px solid var(--line);border-radius:8px;background:#FBFDF8;
  }
  .task-meta .w{flex:0 0 84px;}
  .task-del{background:none;border:none;color:#C4CFC7;font-size:16px;cursor:pointer;padding:2px 6px;}
  .weight-warn{font-size:12.5px;color:var(--red);margin-top:8px;font-weight:600;}

  /* ===== LINE report card (signature) ===== */
  .report-wrap{margin-top:10px;}
  .report{
    background:linear-gradient(160deg,var(--forest) 0%,var(--forest2) 100%);
    color:#fff;border-radius:16px;padding:18px 16px;position:relative;overflow:hidden;
  }
  .report::after{
    content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(120,190,32,.28),transparent 70%);
  }
  .report .r-brand{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .report .r-dot{width:10px;height:10px;border-radius:50%;background:var(--green);}
  .report .r-brand span{font-size:12px;letter-spacing:1.6px;font-weight:700;opacity:.85;}
  .report h3{font-size:21px;font-weight:600;margin-bottom:2px;}
  .report .r-sub{font-size:12.5px;opacity:.7;margin-bottom:12px;}
  .report .r-big{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .report .r-big b{font-family:'Taviraj',serif;font-size:44px;font-weight:700;color:var(--green);line-height:1;}
  .report .r-big span{font-size:13px;opacity:.75;}
  .report .bar{background:rgba(255,255,255,.15);margin:8px 0 14px;}
  .r-task{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;}
  .r-task .ic{width:18px;text-align:center;}
  .r-task .nm{flex:1;opacity:.92;}
  .r-task .pv{font-weight:700;font-family:'Taviraj',serif;}
  .r-issue{
    margin-top:12px;background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.4);
    border-radius:10px;padding:8px 11px;font-size:13px;
  }
  .r-foot{margin-top:12px;font-size:11.5px;opacity:.6;display:flex;justify-content:space-between;}
  .report-actions{display:flex;gap:8px;margin-top:10px;}
  .report-actions .btn{flex:1;}

  /* ===== Gantt / ตารางแผนงาน ===== */
  .gantt{background:#fff;border-radius:12px;padding:14px 12px 12px;}
  .g-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-bottom:2px solid var(--forest);padding-bottom:8px;margin-bottom:12px;}
  .g-title{font-family:'Taviraj',serif;font-weight:600;font-size:16px;color:var(--forest);}
  .g-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .g-brand{font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:var(--green-dark);border:1.5px solid var(--green);border-radius:99px;padding:3px 9px;white-space:nowrap;}
  .g-axis{position:relative;height:18px;margin-bottom:4px;}
  .g-tick{position:absolute;top:0;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;}
  .g-body{position:relative;}
  .g-gridline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #DCE8D2;}
  .g-row{position:relative;padding:4px 0 9px;}
  .g-label{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;}
  .g-label .g-dates{font-weight:500;color:var(--muted);font-size:11px;white-space:nowrap;}
  .g-track{height:20px;background:#F2F6EE;border-radius:6px;position:relative;}
  .g-bar{position:absolute;top:0;height:100%;background:#D8ECBC;border-radius:6px;overflow:hidden;min-width:8px;}
  .g-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-dark));}
  .g-bar.late i{background:linear-gradient(90deg,var(--amber),#D98C0A);}
  .g-today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--red);z-index:2;}
  .g-legend{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;}
  .g-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;}
  .g-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:20px 10px;}

  /* ===== Date steppers (ปรับวันแบบเร็ว) ===== */
  .dctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;}
  .dgroup{display:flex;align-items:center;gap:3px;background:#F6FAF1;border:1.5px solid var(--line);border-radius:9px;padding:3px 4px;}
  .dgroup label{font-size:11px;color:var(--muted);font-weight:700;padding:0 3px;}
  .dbtn{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:27px;height:27px;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;color:var(--forest);cursor:pointer;padding:0 3px;}
  .dbtn:active{background:var(--green);}
  .dval{font-size:12.5px;font-weight:700;color:var(--forest);min-width:54px;text-align:center;}
  .dend{font-size:11.5px;color:var(--muted);font-weight:600;}
  .chain-btn{border:1.5px dashed var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Sarabun',sans-serif;}
  .chain-btn:active{border-color:var(--green);color:var(--green-dark);}
  .shift-all{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600;}

  .vgroup{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;gap:8px;}
  .vgroup h2{font-size:15px;color:var(--forest);font-weight:600;}
  .vgroup span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .vgroup:first-child{margin-top:4px;}

  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
    background:var(--forest);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;
  }
  .toast.show{opacity:1;}

  .empty{
    text-align:center;padding:50px 20px;color:var(--muted);
  }
  .empty .display{font-size:19px;color:var(--forest);margin-bottom:6px;}

  /* modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(15,61,36,.45);display:none;
    align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:#fff;border-radius:18px 18px 0 0;padding:18px 16px 24px;width:100%;max-width:760px;
    max-height:88vh;overflow:auto;
  }
  .modal h2{font-size:19px;margin-bottom:14px;color:var(--forest);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .btn{flex:1;}

  .data-row{display:flex;gap:8px;margin-top:10px;}
  .data-row .btn{flex:1;}
  @media(min-width:600px){
    .modal-bg{align-items:center;}
    .modal{border-radius:18px;}
  }
  @media(prefers-reduced-motion:reduce){ *{transition:none!important;} }


  /* ===== Unit editor (Excel-like) ===== */
  .ugrid-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;}
  table.ugrid{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px;}
  table.ugrid th{background:var(--forest);color:#fff;padding:7px 6px;text-align:left;position:sticky;top:0;white-space:nowrap;font-weight:600;font-size:11.5px;}
  table.ugrid td{border:1px solid var(--line);padding:0;}
  table.ugrid td input,table.ugrid td select{width:100%;border:none;background:transparent;font-family:'Sarabun',sans-serif;font-size:12.5px;padding:6px 6px;color:var(--ink);}
  table.ugrid td input:focus,table.ugrid td select:focus{outline:2px solid var(--green);background:#F7FBF1;}
  table.ugrid tr:nth-child(even) td{background:#FAFCF7;}
  table.ugrid td.rownum{background:#EEF4E6;text-align:center;color:var(--muted);font-weight:600;width:36px;padding:6px 4px;}
  table.ugrid td.del{width:34px;text-align:center;}
  table.ugrid td.del button{border:none;background:none;color:#C4CFC7;cursor:pointer;font-size:14px;padding:4px;}
  table.ugrid td.del button:hover{color:var(--red);}
  .ustat-done{background:#E4F3D2 !important;}
  .unit-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .unit-count{font-size:12.5px;color:var(--muted);font-weight:600;}
  .sec-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px;}
  .sec-head-row .section-label{flex:1;min-width:0;}
  .sync-sec{margin-top:12px;background:#F7FBF1;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;}
  .sync-h{font-size:13.5px;font-weight:800;color:var(--forest);margin-bottom:3px;}
  .sync-note{font-size:12px;color:var(--muted);line-height:1.5;background:#FDF0D8;border:1px solid var(--amber);
    color:#7A5200;border-radius:8px;padding:7px 10px;margin:5px 0;}
  .sync-sec ul{margin:5px 0 0 18px;padding:0;font-size:12.5px;line-height:1.7;}
  .sync-steps{margin-top:12px;background:#EAF3DD;border:1.5px solid #B9DCA8;border-radius:11px;padding:10px 13px;}
  .sync-steps ol{margin:4px 0 0 18px;padding:0;font-size:12.5px;line-height:1.8;}
  .peek-title{font-size:18px;font-weight:800;color:var(--forest);line-height:1.3;}
  .peek-sub{font-size:13px;color:var(--muted);margin:2px 0 12px;font-weight:600;}
  .peek-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .peek-box{background:#F7FBF1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;}
  .peek-k{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.2px;}
  .peek-v{font-size:20px;font-weight:800;color:var(--forest);line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums;}
  .peek-s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .peek-note{margin-top:8px;background:#FDF0D8;border:1.5px solid var(--amber);color:#7A5200;
    border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.5;}
  @media(max-width:420px){ .peek-grid{grid-template-columns:1fr} }
  .dup-warn{display:inline-flex;align-items:center;background:#FBEAEA;border:1.5px solid #E5A0A0;color:#8A1F1F;
    border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:help;}
  tr.dup-row td{background:#FBEAEA!important;}
  tr.dup-row td input, tr.dup-row td select{border-color:#E5A0A0!important;}
  .dup-flag{display:inline-block;margin-left:4px;background:var(--red);color:#fff;border-radius:50%;
    width:15px;height:15px;line-height:15px;text-align:center;font-size:10px;font-weight:800;cursor:help;}
  .dup-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBEAEA;
    border:1.5px solid #E5A0A0;color:#8A1F1F;border-radius:11px;padding:9px 13px;margin:0 0 8px;font-size:13px;font-weight:700;}
  .irow.priceonly{background:#FFFBF0;}
  .need-qty{display:inline-block;background:var(--amber);color:#5A3E00;font-size:10px;font-weight:800;
    padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;}
  .sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:middle;flex:0 0 auto;cursor:help;}
  .sdot.warn{background:var(--amber);box-shadow:0 0 0 2px rgba(240,180,41,.22);}
  .sdot.late{background:var(--red);box-shadow:0 0 0 2px rgba(214,69,69,.22);}
  .sdot.none{background:#C9D2C6;}
  .stale-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;}
  .stale-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;
    border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--forest);cursor:pointer;transition:all .15s;}
  .stale-chip:hover{border-color:var(--green);}
  .stale-chip.on{background:var(--forest);color:#fff;border-color:var(--forest);}
  .stale-chip .n{font-variant-numeric:tabular-nums;}
  .hscope{display:flex;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    color:#fff;border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;}
  .sync-stamp{font-size:11px;color:var(--muted);white-space:nowrap;align-self:center;padding:0 4px;}
  @media(max-width:520px){ .sync-stamp{display:none} }
  .save-btn{background:var(--green)!important;color:var(--forest)!important;font-weight:700!important;min-width:110px;}
  .pull-btn{background:#EAF3DD!important;color:var(--forest)!important;font-weight:700!important;min-width:96px;}
  .pull-btn.hasnew{background:#CFE3FF!important;color:#0B3D91!important;animation:savePulse 1.6s ease-in-out infinite;}
  .save-btn.dirty{background:var(--amber)!important;color:#5A3E00!important;animation:savePulse 1.6s ease-in-out infinite;}
  .save-btn.saving{background:#DCEFC4!important;color:var(--forest)!important;}
  .save-btn.saved{background:var(--green-dark)!important;color:#fff!important;}
  @keyframes savePulse{0%,100%{opacity:1}50%{opacity:.6}}
  .cap-btn{flex-shrink:0;background:#fff;border:1.5px solid var(--line);border-radius:9px;

/* ================= Default underground task template ================= */
/* ================= Default task template: แผนทีม 9 ขั้นตอน ================= */
const TEMPLATE = [
  {name:'Presale (sale AIS)', w:5},
  {name:'ติดตั้งตู้ ภายในโครงการ', w:15},
  {name:'เชื่อมต่อสาย ภายในตู้ ในโครงการ', w:10},
  {name:'เดินสายชุมสายภายนอกเข้าตู้โครงการ', w:15},
  {name:'เทสสัญญาณ เตรียมพร้อมให้บริการในโครงการ', w:5},
  {name:'เดินสาย Fiber Main จากตู้โครงการ เชื่อมต่อหัวต่อในโครงการ', w:20},
  {name:'เดินสาย Fiber 1 Core จากหัวต่อเข้าบ้านลูกบ้านตามรีเควส', w:15},
  {name:'เทสค่าสัญญาณภายในบ้านลูกบ้าน พร้อมติดตั้งอินเทอร์เน็ต', w:5},
  {name:'สมัครและติดตั้งอินเทอร์เน็ตบ้านที่เทสแล้วเสร็จ', w:10},
];

let state = { villages: [] };
let currentId = null;


/* ================= Persistence ================= */
const LS_KEY = 'ftth-village-progress';

/* ==================================================================
   ☁️ CLOUD (Supabase) — ใส่ค่า 2 บรรทัดนี้เพื่อเปิดโหมด cloud
   ดูวิธีหาค่าในคู่มือ (Settings > API): Project URL และ anon public key
   ถ้าเว้นว่างไว้ = แอปทำงานแบบเดิม (เก็บในเครื่อง) ไม่พัง
================================================================== */
const SUPABASE_URL = 'https://fxlxmqrgczbpgjliquft.supabase.co';   // ✅ เชื่อม cloud แล้ว
/* ปิด cloud เมื่อไหร่ ให้ลบค่าใน 2 บรรทัดนี้ให้เหลือ '' */
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bHhtcXJnY3picGdqbGlxdWZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NTIxNjMsImV4cCI6MjEwMDMyODE2M30._Vd-qNcjfodT3a3CzbRegRZ0EC0KxmmCk6oTBWvsTSI';

let sb = null, cloudOn = false, cloudUser = null;
function initCloud(){
  if(SUPABASE_URL && SUPABASE_KEY && window.supabase){
    try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); cloudOn = true; }catch(e){ cloudOn=false; }
  }
}
function persist(){
  try{ if(session && session.role) markUnsaved(); }catch(e){}
  try{ if(currentId){ const cv = state.villages.find(x=>x.id===currentId); if(cv) cv._dirty = true; } }catch(e){}
  const json = JSON.stringify(state);
  try{ localStorage.setItem(LS_KEY, json); }catch(e){}
  cloudQueue();
}
function restore(){
  try{
    const s = localStorage.getItem(LS_KEY);
    if(s) state = JSON.parse(s);
  }catch(e){}
  state = state || {villages:[]};
  try{ normalizeData(); }catch(e){}
}
function importJSON(ev){
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = e => {
    try{
      const obj = JSON.parse(e.target.result);
      if(obj && obj.type === 'vendor-package'){
        state.villages = obj.villages || [];
        B.vendors = obj.boqVendors || [];
        B.jobs = obj.boqJobs || [];
        persist(); bqPersist();
        toast('นำเข้าข้อมูล Vendor สำเร็จ เข้าสู่ระบบได้เลย');
      } else if(obj && obj.villages){
        state = obj;
        persist();
        toast('โหลดข้อมูลสำเร็จ');
      } else { toast('ไฟล์ไม่ถูกต้อง'); return; }
      if(session.role){ render(); }
    }catch(err){ toast('ไฟล์ไม่ถูกต้อง'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
}
function exportVendorPackage(vid){
  if(!requireAdmin('ส่งออกไฟล์ให้ Vendor')) return;
  /* ไฟล์ที่ส่งให้ผรม. ต้องไม่มีข้อมูลความคุ้มทุนเด็ดขาด (ไม่มี sheet ROI อยู่แล้ว) */
  const v = vendorById(vid); if(!v) return;
  const nm = v.name.trim();
  const wb = XLSX.utils.book_new();
  const wsA = XLSX.utils.aoa_to_sheet([
    ['Vendor', v.name],
    ['Username / อีเมล', v.user || '(ดูในแท็บ Vendor ของผู้ดูแล)'],

/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function thDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  const m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return dt.getDate() + ' ' + m[dt.getMonth()] + ' ' + (dt.getFullYear()+543);
}
function thDateShort(d){
  if(!d) return '-';
  const dt = new Date(d);
  const m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return dt.getDate() + ' ' + m[dt.getMonth()];
}
function dayDiff(a,b){ return Math.round((new Date(b) - new Date(a))/86400000); }
function addDays(d,n){
  const dt = new Date(d); dt.setDate(dt.getDate()+n);
  return dt.toISOString().slice(0,10);
}
/* จำนวนหลังที่ต้องเดินสาย — ใช้ข้อมูลรายหลังถ้ามี (แม่นกว่าพอร์ตที่อาจไม่ได้กรอก) */
/* ต้องเดินสาย = พอร์ต (Progress คอลัมน์ D) · ถ้ายังไม่กรอกจึงใช้จำนวนหลังแทน */
function targetHomes(v){
  if(!v) return 0;
  const p = +v.ports||0;
  if(p > 0) return p;
  return (v.houses||[]).length;
}
/* จำนวนหลัง = แถวที่ลงข้อมูลไว้ในแท็บ Unit */
function unitHomes(v){ return (v && v.houses ? v.houses.length : 0); }
/* พอร์ตกับข้อมูลรายหลังไม่ตรงกัน — ใช้เตือนให้ไปแก้ */
function portsMismatch(v){
  const u = (v&&v.houses||[]).length, p = +(v&&v.ports)||0;
  if(!u) return null;
  if(!p) return {type:'noports', unit:u};
  if(p !== u) return {type:'diff', unit:u, ports:p};
  return null;
}
/* ผู้รับเหมาที่ทำงานจริงของบ้านหลังนี้
   ลำดับ: ค่าที่ระบุรายหลัง → Vendor ของหมู่บ้าน → งาน BOQ ที่ผูกไว้ */
function houseSub(v, h){
  const own = String((h&&h.sub)||'').trim();
  if(own) return own;
  const byVillage = String((v&&v.contractor)||'').trim();
  if(byVillage) return byVillage;
  const jb = B.jobs.find(j=>j.villageId===(v&&v.id));
  return jb ? ((vendorById(jb.vendorId)||{}).name || '') : '';
}
/* ===== ติดตามความเคลื่อนไหว: บันทึกวันที่ยอดเดินสายเพิ่มขึ้นล่าสุด ===== */
/* บันทึกวันที่มีการอัปเดตข้อมูลรายหลัง (ผู้ใช้กรอกเอง/วางจาก Excel/นำเข้า) */
function markMoved(v){
  if(!v || isClosed(v)) return;
  const d = todayISO();
  if(v.lastMove === d) return;
  v.lastMove = d;
  v._lastHomes = +v.homesDone||0;
}
function touchProgress(v){
  if(!v) return;
  const now = +v.homesDone || 0;
  const prev = (v._lastHomes == null) ? null : +v._lastHomes;
  if(prev === null){ v._lastHomes = now; if(!v.lastMove) v.lastMove = todayISO(); return; }
  if(now > prev){ v.lastMove = todayISO(); }     /* เพิ่มขึ้นเท่านั้นถึงนับว่าขยับ */
  v._lastHomes = now;
}
/* สถานะความเคลื่อนไหวของหมู่บ้าน */
function staleInfo(v){
  if(!v || isClosed(v)) return {level:'closed', days:0, date:v&&v.lastMove};
  const d = v.lastMove;
  if(!d) return {level:'none', days:null, date:null};
  const t = new Date(d + 'T00:00:00');
  if(isNaN(t.getTime())) return {level:'none', days:null, date:null};
  const days = Math.floor((Date.now() - t.getTime()) / 86400000);
  let level = 'ok';
  if(days >= 180) level = 'late';        /* เกิน 6 เดือน */
  else if(days >= 90) level = 'warn';    /* เกิน 3 เดือน */
  return {level, days, date:d};
}
function staleDot(v){
  const s = staleInfo(v);
  if(s.level === 'closed' || s.level === 'ok') return '';
  if(s.level === 'none') return `<i class="sdot none" title="ยังไม่มีประวัติการเดินสายเพิ่ม"></i>`;
  const m = Math.floor(s.days/30);
  return `<i class="sdot ${s.level}" title="เดินสายเพิ่มล่าสุด ${thDate(s.date)} · ไม่ขยับมา ${s.days} วัน (~${m} เดือน)"></i>`;
}
/* บ้านเลขที่ซ้ำในหมู่บ้านเดียวกันไม่ควรมี — เก็บแถวที่ข้อมูลครบกว่า */
function dedupeHouses(list){
  const out = [], seen = new Map();
  (list||[]).filter(Boolean).forEach(h=>{
    const raw = String(h.no==null?'':h.no).trim();
    const k = normName(raw);
    /* ลบซ้ำเฉพาะ "บ้านเลขที่จริง" (ต้องมีตัวเลข) —
       ป้ายอาคารอย่าง GUARD / Club House ซ้ำชื่อได้ ไม่ถือว่าซ้ำ */
    if(!k || !/\d/.test(raw)){ out.push(h); return; }
    if(seen.has(k)){
      const i = seen.get(k), old = out[i];
      const score = x => (x.st?2:0)+(x.name?1:0)+(x.lat?1:0)+(x.phone?1:0);
      if(score(h) >= score(old)) out[i] = h;
    } else { seen.set(k, out.length); out.push(h); }
  });
  return out;
}
/* บ้านเลขที่นี้ซ้ำกับแถวอื่นไหม (ข้ามแถวตัวเอง) — ใช้เฉพาะเลขที่ที่มีตัวเลข */
function dupRowIndex(v, no, skipIdx){
  const raw = String(no==null?'':no).trim();
  if(!raw || !/\d/.test(raw)) return -1;
  const k = normName(raw);
  const hs = (v && v.houses) || [];
  for(let i=0;i<hs.length;i++){
    if(i===skipIdx) continue;
    const r = String(hs[i].no==null?'':hs[i].no).trim();
    if(/\d/.test(r) && normName(r)===k) return i;
  }
  return -1;
}
/* รายการเลขที่ซ้ำทั้งหมดในหมู่บ้าน */
function dupNumbers(v){
  const seen = {}, dup = [];
  ((v&&v.houses)||[]).forEach(h=>{
    const raw = String(h.no==null?'':h.no).trim();
    if(!raw || !/\d/.test(raw)) return;
    const k = normName(raw);
    seen[k] = (seen[k]||0)+1;
    if(seen[k]===2) dup.push(raw);
  });
  return dup;
}
/* แถวไหนบ้างที่ซ้ำกับแถวอื่น (ใช้ทำไฮไลต์) */
function dupRowSet(v){
  const seen = new Map(), dup = new Set();
  ((v&&v.houses)||[]).forEach((h,i)=>{
    const raw = String(h&&h.no==null?'':h.no).trim();
    if(!raw || !/\d/.test(raw)) return;
    const k = normName(raw);
    if(seen.has(k)){ dup.add(seen.get(k)); dup.add(i); }
    else seen.set(k, i);
  });
  return dup;
}
function dedupeVillage(v){
  if(!v || !Array.isArray(v.houses)) return 0;
  const before = v.houses.length;
  v.houses = dedupeHouses(v.houses);
  const removed = before - v.houses.length;
  if(removed){ v.homesDone = v.houses.filter(unitDone).length; v._hDirty = true; v._dirty = true; }
  return removed;
}
function dedupeAll(){
  let n = 0; (state.villages||[]).forEach(v=>{ n += dedupeVillage(v); }); return n;
}
/* หลังที่ถือว่าเสร็จ = พร้อมติดตั้ง ONU เท่านั้น */
function unitDone(h){ return h && (h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')); }
function unitStats(v){
  const hs = (v && v.houses) || [];
  const done = hs.filter(unitDone).length;
  return { total: hs.length, done, pending: hs.length-done,
           pct: hs.length ? Math.round(done/hs.length*100) : null };
}
function overall(v){
  if(isClosed(v)) return 100;
  /* % = เดินสายแล้ว ÷ ต้องเดินสาย (พอร์ต) */
  const need = targetHomes(v);
  if(need > 0){
    const done = +v.homesDone || unitStats(v).done || 0;
    return Math.min(100, Math.round(done / need * 100));
  }
  const tw = v.tasks.reduce((s,t)=>s+(+t.w||0),0);
  if(!tw) return 0;
  return Math.round(v.tasks.reduce((s,t)=>s+(+t.w||0)*(+t.p||0),0)/tw);
}
function statusOf(pct){
  if(pct>=100) return ['done','ส่งมอบแล้ว'];
  if(pct>0) return ['doing','กำลังดำเนินการ'];
  return ['idle','ยังไม่เริ่ม'];
}
function emojiBar(pct){
  const n = Math.round(pct/10);
  return '▰'.repeat(n) + '▱'.repeat(10-n);
}
function taskIcon(p){ return p>=100 ? '✅' : (p>0 ? '🔶' : '⬜'); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
/* ทำให้ข้อมูลมีรูปร่างถูกต้องเสมอ — กันแอปพังเมื่อเจอข้อมูลไม่ครบ */
/* ระบุ role ของแถวบัญชี — ทนกรณียังไม่ได้รัน supabase-planning-role.sql
   (คอลัมน์ role ยังไม่มี → เดาจาก is_admin และชื่อที่ระบบตั้งให้ทีม Planning) */
function vendorRoleOf(x){
  if(!x) return 'vendor';
  if(x.role) return x.role;
  if(x.is_admin) return 'admin';
  /* ยังไม่ได้รัน supabase-planning-role.sql → เดาจากชื่อ/อีเมลของทีม Planning */
  const nm = normName(x.name);
  if(nm==='ais planning' || nm.indexOf('planning')>=0) return 'planning';
  const em = normName(x.user || x.email || '');
  if(PLANNING_EMAILS.some(e=> em.indexOf(e)>=0)) return 'planning';
  return 'vendor';
}
/* อีเมลทีม AIS Planning (ใช้เป็นตาข่ายรองเมื่อ cloud ยังไม่มีคอลัมน์ role) */
const PLANNING_EMAILS = ['jakkapan','thanaphat'];
/* รายชื่อผู้รับเหมาจริงเท่านั้น (ตัดบัญชี admin / AIS Planning ออก) */
function realVendors(){
  return (B.vendors||[]).filter(v=> vendorRoleOf(v)==='vendor');
}
function normalizeData(){
  state = state || {};
  state.villages = (state.villages||[]).filter(Boolean);
  state.villages.forEach(v=>{
    v.id = v.id || uid();
    v.name = String(v.name==null ? '' : v.name);
    v.contractor = String(v.contractor==null ? '' : v.contractor);
    v.tasks = Array.isArray(v.tasks) ? v.tasks.filter(Boolean) : [];
    v.houses = Array.isArray(v.houses) ? v.houses.filter(Boolean) : [];
    if(v.roi && typeof v.roi==='object'){ v.roi.arpu = +v.roi.arpu||0; v.roi.cust = v.roi.cust||{}; }
    if(v.lastMove != null) v.lastMove = String(v.lastMove).slice(0,10);
    if(v._lastHomes == null) v._lastHomes = +v.homesDone||0;
    v.houses.forEach(h=>{ h.no = String(h.no==null?'':h.no); h.st = String(h.st==null?'':h.st); h.sub = String(h.sub==null?'':h.sub); });
    const _hBefore = v.houses.length;
    v.houses = dedupeHouses(v.houses);
    /* มีข้อมูลรายหลัง → ยอดเดินสายแล้วต้องตรงกับจำนวน ONU เสมอ */
    if(v.houses.length && (_hBefore !== v.houses.length || v.homesDone == null || v.homesDone === ''))
      v.homesDone = v.houses.filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
  });
  B = B || {};
  B.vendors = (B.vendors||[]).filter(Boolean).filter(v=> vendorRoleOf(v)==='vendor');
  B.vendors.forEach(v=>{ v.id = v.id || uid(); v.name = String(v.name==null?'':v.name); v.prices = v.prices||{}; });
  B.jobs = (B.jobs||[]).filter(Boolean);
  B.jobs.forEach(j=>{ j.id = j.id || uid(); j.qty = j.qty||{}; j.bqty = j.bqty||{}; j.prices = j.prices||{}; });
  B.pos = (B.pos||[]).filter(Boolean);
  B.pos.forEach(p=>{ p.id = p.id || uid(); p.code = String(p.code==null?'':p.code); p.name = String(p.name==null?'':p.name); });
  if(!B.trends || typeof B.trends !== 'object') B.trends = {};
}
/* เทียบชื่อโครงการแบบยืดหยุ่น: ตัดเว้นวรรคซ้อน/หัวท้าย/อักขระล่องหน + ไม่สนตัวพิมพ์ */
/* อ่านวันที่จาก Excel ได้หลายรูปแบบ: Date · 2026-08-05 · 05/08/2026 · 5 ส.ค. 2569 · ตัวเลข serial */
function parseAnyDate(x){
  if(x == null || x === '') return null;
  if(x instanceof Date && !isNaN(x)) return isoOf(x);
  if(typeof x === 'number' && x > 20000 && x < 80000){        /* Excel serial */
    const d = new Date(Date.UTC(1899,11,30) + x*86400000);
    return isNaN(d) ? null : isoOf(d);
  }
  const t = String(x).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
  if(m) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(t);       /* 05/08/2026 หรือ 05/08/2569 */
  if(m){ let y=+m[3]; if(y>2400) y-=543; return y+'-'+p2(m[2])+'-'+p2(m[1]); }
  const TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  m = /^(\d{1,2})\s+([ก-๙.]+)\s+(\d{2,4})$/.exec(t);              /* 5 ส.ค. 2569 */
  if(m){
    const mi = TH.findIndex(n=>n.replace(/\./g,'')===m[2].replace(/\./g,''));
    if(mi>=0){ let y=+m[3]; if(y<100) y+=2500; if(y>2400) y-=543; return y+'-'+p2(mi+1)+'-'+p2(m[1]); }
  }
  const d2 = new Date(t);
  return isNaN(d2) ? null : isoOf(d2);
}
function p2(n){ return String(+n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function normName(x){
  return String(x==null?'':x)
    .replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}
function findVillageByName(name){
  const k = normName(name);
  if(!k) return null;

/* เรียง: ยังไม่ปิดขึ้นก่อน · ปิดแล้วลงล่าง (ใช้ร่วมทุก tab) */
function sortVillages(list){
  return list.slice().sort((a,b)=>{
    const ca = isClosed(a)?1:0, cb = isClosed(b)?1:0;
    if(ca!==cb) return ca-cb;
    return String(a.name||'').localeCompare(String(b.name||''),'th');
  });
}
function sortJobs(list){
  return list.slice().sort((a,b)=>{
    const ca = jobClosed(a)?1:0, cb = jobClosed(b)?1:0;
    if(ca!==cb) return ca-cb;
    return String(jobName(a)||'').localeCompare(String(jobName(b)||''),'th');
  });
}
function villageGroupsHTML(list){
  const groups = {};
  list.forEach(v=>{
    const k = (v.contractor||'').trim() || 'ยังไม่ระบุ Vendor';
    (groups[k] = groups[k] || []).push(v);
  });
  return Object.keys(groups).sort((a,b)=>{
    const oa = groups[a].every(isClosed)?1:0, ob = groups[b].every(isClosed)?1:0;
    if(oa!==ob) return oa-ob;
    return a.localeCompare(b,'th');
  }).map(k=>{
    const vs = sortVillages(groups[k]);
    const avg = Math.round(vs.reduce((s,v)=>s+overall(v),0)/vs.length);
    const cN = vs.filter(isClosed).length;
    return `<div class="vgroup"><h2>👷 ${esc(k)}</h2><span>${vs.length} โครงการ${cN?' · ปิดแล้ว '+cN:''} · เฉลี่ย ${avg}%</span></div>`
      + vs.map(vcardHTML).join('');
  }).join('') || '<div class="panel" style="color:var(--muted);font-size:13px">ไม่พบโครงการที่ตรงกับคำค้น</div>';
}
function filterVillageList(q){
  ui.vilQ = q;
  const box = $('vilGroups'); if(!box) return;
  const qq = (q||'').trim().toLowerCase();
  let list = visibleVillages().filter(v=> matchVendor(v, ui.vilVendor) && matchPO(v, ui.vilPO));
  if(qq) list = list.filter(v=> String(v.name||'').toLowerCase().includes(qq) || String(v.contractor||'').toLowerCase().includes(qq));
  box.innerHTML = villageGroupsHTML(list);
}

function importExcelForVendor(ev){
  if(!requireAdmin('นำเข้าไฟล์ Master')){ ev.target.value=''; return; }
  const vid = ui.importVendorId;
  const vd = vendorById(vid);
  const f = ev.target.files[0]; if(!f || !vd){ ev.target.value=''; return; }
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const before = new Set(state.villages.map(v=>v.id));
      const ok = importMaster3(wb, {authoritative:isAdmin()});
      if(!ok){ toast('ไม่พบรูปแบบที่รู้จักในไฟล์'); ev.target.value=''; return; }
      // บังคับให้ทุกโครงการที่เพิ่ง import/แตะ เป็นของ Vendor ที่เลือก
      let n=0;
      state.villages.forEach(v=>{
        if(!before.has(v.id) || !v.vendorId){
          v.vendorId = vd.id; v.contractor = vd.name;
          B.jobs.filter(j=>j.villageId===v.id).forEach(j=>{ j.vendorId = vd.id; });
          n++;
        }
      });
      autoFixShifted(); persist(); bqPersist();
      if(session.role){ currentId=null; render(); }
      toast('นำเข้าให้ '+vd.name+' แล้ว (ผูก Vendor '+n+' โครงการ)');
    }catch(err){ toast('อ่านไฟล์ Excel ไม่สำเร็จ'); }
    ev.target.value='';
  };
  rd.readAsArrayBuffer(f);
}

/* ================= Gantt / ตารางแผนงาน ================= */
/* วันเริ่มโครงการเป็นจุดอ้างอิง: ขยับวันเริ่มโครงการ = ทุกขั้นตอน + วันส่งมอบ เลื่อนตามเท่ากัน */
function setStartAnchor(vid, val){
  if(villageClosed(vid)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); render(); return; }
  const v = state.villages.find(v=>v.id===vid);
  const old = v.start;
  v.start = val;
  if(old && val){
    const delta = dayDiff(old, val);
    if(delta !== 0){
      v.tasks.forEach(t=>{
        if(t.s) t.s = addDays(t.s, delta);
        if(t.e) t.e = addDays(t.e, delta);
      });
      if(v.end) v.end = addDays(v.end, delta);
      toast('เลื่อนทุกขั้นตอนตามวันเริ่มโครงการ (' + (delta>0?'+':'') + delta + ' วัน)');
    }
  } else if(!old && val && v.end && !v.tasks.some(t=>t.s)){
    toast('ตั้งวันเริ่มแล้ว กด ⚡ Gen เพื่อสร้างแผนทุกขั้นตอน');
  }
  persist(); renderDetail();
}

function shiftTask(vid,tid,days){
  const t = state.villages.find(v=>v.id===vid).tasks.find(t=>t.id===tid);
  if(!t.s || !t.e) return;
  t.s = addDays(t.s,days); t.e = addDays(t.e,days);
  persist(); renderDetail();
}
function changeDur(vid,tid,days){
  const t = state.villages.find(v=>v.id===vid).tasks.find(t=>t.id===tid);
  if(!t.s || !t.e) return;
  let d = dayDiff(t.s,t.e)+1+days;
  if(d < 1) d = 1;
  t.e = addDays(t.s, d-1);
  persist(); renderDetail();
}
function chainAfterPrev(vid,tid){
  const v = state.villages.find(v=>v.id===vid);
  const i = v.tasks.findIndex(t=>t.id===tid);
  if(i <= 0){ toast('เป็นงานแรก ไม่มีงานก่อนหน้า'); return; }
  const prev = v.tasks[i-1];
  if(!prev.e){ toast('งานก่อนหน้ายังไม่มีวันที่'); return; }
  const t = v.tasks[i];
  const dur = (t.s && t.e) ? dayDiff(t.s,t.e)+1 : 7;
  t.s = addDays(prev.e,1); t.e = addDays(t.s,dur-1);
  persist(); renderDetail();
}
function quickStart(vid,tid){
  const t = state.villages.find(v=>v.id===vid).tasks.find(t=>t.id===tid);
  t.s = todayISO(); t.e = addDays(t.s,6);
  persist(); renderDetail();
}
function toggleDateEdit(tid){
  const el = $('dedit-'+tid);
  if(el) el.style.display = (el.style.display==='none') ? 'flex' : 'none';
}
function shiftAll(vid,days){
  const v = state.villages.find(v=>v.id===vid);
  v.tasks.forEach(t=>{ if(t.s && t.e){ t.s = addDays(t.s,days); t.e = addDays(t.e,days); } });
  if(v.start) v.start = addDays(v.start,days);
  if(v.end) v.end = addDays(v.end,days);
  persist(); renderDetail();
  toast(days>0 ? 'เลื่อนทั้งแผนออกไป '+days+' วัน' : 'เลื่อนทั้งแผนเข้ามา '+(-days)+' วัน');
}
function genSchedule(vid){
  const v = state.villages.find(v=>v.id===vid);
  if(!v.start || !v.end){ toast('ใส่วันเริ่มงานและกำหนดส่งมอบก่อนครับ'); return; }
  if(dayDiff(v.start, v.end) < 1){ toast('กำหนดส่งมอบต้องอยู่หลังวันเริ่มงาน'); return; }
  const total = dayDiff(v.start, v.end) + 1;
  const tw = v.tasks.reduce((s,t)=>s+(+t.w||0),0);
  let cum = 0;
  v.tasks.forEach(t=>{
    const w = tw ? (+t.w||0) : 1;
    const TW = tw || v.tasks.length;
    const startOff = Math.min(Math.round(cum/TW*total), total-1);
    cum += w;
    let endOff = Math.round(cum/TW*total) - 1;
    if(endOff < startOff) endOff = startOff;
    endOff = Math.min(endOff, total-1);
    t.s = addDays(v.start, startOff);
    t.e = addDays(v.start, endOff);
  });
  persist(); renderDetail();
  toast('สร้างแผนงานตามน้ำหนักงานแล้ว ปรับวันที่รายงานได้เลย');
}

function ganttHTML(v){
  const dated = v.tasks.filter(t=>t.s && t.e);
  if(!dated.length){
    return `<div class="g-empty">ยังไม่มีวันที่ในแผนงาน<br>ใส่วันเริ่มงาน / กำหนดส่งมอบด้านบน แล้วกด ⚡ Gen แผนงานอัตโนมัติ<br>หรือใส่วันที่รายขั้นตอนเองในแต่ละงาน</div>`;
  }
  let min = dated.reduce((m,t)=> t.s<m? t.s:m, dated[0].s);
  let max = dated.reduce((m,t)=> t.e>m? t.e:m, dated[0].e);
  if(v.start && v.start<min) min = v.start;
  if(v.end && v.end>max) max = v.end;
  const total = Math.max(dayDiff(min,max)+1, 1);
  const step = total<=60 ? 7 : (total<=180 ? 14 : 30);
  const today = todayISO();

  let ticks='', grid='';
  for(let off=0; off<total; off+=step){
    const pct = (off/total*100).toFixed(2);
    ticks += `<div class="g-tick" style="left:${pct}%">${thDateShort(addDays(min,off))}</div>`;
    grid  += `<div class="g-gridline" style="left:${pct}%"></div>`;
  }

  const rows = v.tasks.map(t=>{
    if(!t.s || !t.e) return `<div class="g-row"><div class="g-label"><span>${esc(t.name)}</span><span class="g-dates">ยังไม่กำหนดวัน</span></div><div class="g-track"></div></div>`;
    const left = (dayDiff(min,t.s)/total*100).toFixed(2);
    const width = ((dayDiff(t.s,t.e)+1)/total*100).toFixed(2);
    const late = today > t.e && +t.p < 100;
    return `<div class="g-row">
      <div class="g-label"><span>${esc(t.name)}</span><span class="g-dates">${thDateShort(t.s)} – ${thDateShort(t.e)} · ${t.p}%</span></div>
      <div class="g-track"><div class="g-bar ${late?'late':''}" style="left:${left}%;width:${width}%"><i style="width:${t.p}%"></i></div></div>
    </div>`;
  }).join('');

  let todayLine = '';
  if(today >= min && today <= max){
    const tp = ((dayDiff(min,today)+0.5)/total*100).toFixed(2);
    todayLine = `<div class="g-today" style="left:${tp}%"></div>`;
  }

  return `<div class="gantt" id="ganttChart">
    <div class="g-head">
      <div>
        <div class="g-title">แผนงานก่อสร้าง · ${esc(v.name)}</div>
        <div class="g-sub">${esc(v.contractor)||'-'} · ${thDate(min)} – ${thDate(max)}${v.ports? ' · '+v.ports+' พอร์ต':''}</div>
      </div>
      <div class="g-brand">AIS FIBRE</div>
    </div>
    <div class="g-axis">${ticks}</div>
    <div class="g-body">${grid}${todayLine}${rows}</div>
    <div class="g-legend">
      <span><i style="background:#D8ECBC"></i>แผนงาน</span>
      <span><i style="background:linear-gradient(90deg,var(--green),var(--green-dark))"></i>ผลงานจริง</span>
      <span><i style="background:var(--amber)"></i>ล่าช้ากว่าแผน</span>
      <span><i style="background:var(--red);width:3px;border-radius:1px"></i> เส้นวันนี้ (${thDateShort(today)})</span>
    </div>
  </div>`;
}

function villageAOA(v){
  const p = overall(v);
  const rows = [
    ['โครงการ', v.name],
    ['ผู้รับเหมา', v.contractor||''],
    ['พอร์ต / หลังคาเรือน', v.ports||''],
    ['วันเริ่มงาน', v.start||''],
    ['กำหนดส่งมอบ', v.end||''],
    ['ความคืบหน้ารวม (%)', p],
    ['ปัญหา / อุปสรรค', v.issue||''],
    [],
    ['ลำดับ','ขั้นตอนงาน','น้ำหนัก (%)','ความคืบหน้า (%)','วันเริ่ม','วันเสร็จ','หมายเหตุ']
  ];
  v.tasks.forEach((t,i)=>rows.push([i+1, t.name, +t.w||0, +t.p||0, t.s||'', t.e||'', t.note||'']));
  return rows;
}
function excelSheetName(base, used){
  let n = (base||'โครงการ').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,25).trim() || 'โครงการ';
  let name = n, i = 2;
  while(used.has(name)){ name = n.slice(0,22) + ' ' + i++; }
  used.add(name);
  return name;
}
function excelWidths(ws){ ws['!cols'] = [{wch:6},{wch:48},{wch:11},{wch:15},{wch:12},{wch:12},{wch:28}]; }
function exportExcelVillage(vid){
  const v = state.villages.find(v=>v.id===vid);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(villageAOA(v));
  excelWidths(ws);
  XLSX.utils.book_append_sheet(wb, ws, excelSheetName(v.name, new Set()));
  XLSX.writeFile(wb, 'progress-' + v.name.replace(/\s+/g,'-') + '-' + todayISO() + '.xlsx');
  toast('Export Excel แล้ว');
}
/* ===== ไฟล์กลางสำหรับ Chatbot องค์กร =====
   หนึ่งแถว = หนึ่งบ้าน · ชื่อไฟล์คงที่เพื่ออัปทับของเดิมบน SharePoint ได้
   ไม่มีงบ/ราคา/ROI · ข้อมูลลูกค้าถามก่อนใส่                              */
/* ===== Sync ข้อมูลจากระบบ → ไฟล์กลางบน SharePoint =====
   จับคู่ด้วย "หมู่บ้าน + บ้านเลขที่" · เติมเฉพาะช่องที่ระบบมีข้อมูล
   คงคอลัมน์/ชีตอื่นในไฟล์เดิมไว้ทั้งหมด · สรุปส่วนที่ไม่ตรงให้คนนำเข้า   */
/* กด Sync = ใช้ลิงก์ที่ตั้งไว้เลย
   ลองดึงไฟล์จากลิงก์ก่อน · ถ้าองค์กรบล็อก (ปกติจะบล็อก) ค่อยขอไฟล์ที่โหลดไว้ */
async function syncNow(){
  if(!requirePlanner('Sync ข้อมูลลงไฟล์')) return;
  const u = sourceUrl();
  if(!u){ toast('ยังไม่ได้ตั้งลิงก์ไฟล์กลาง — กด "แก้ลิงก์" ก่อน'); setSourceUrl(); return; }
  toast('กำลังดึงไฟล์จากลิงก์ที่ตั้งไว้...');
  try{
    const dl = u.includes('download=1') ? u : (u + (u.includes('?')?'&':'?') + 'download=1');
    const res = await fetch(dl, {credentials:'include'});
    if(!res.ok) throw new Error('http '+res.status);
    const buf = await res.arrayBuffer();
    const head = new Uint8Array(buf.slice(0,2));
    if(head[0]!==0x50 || head[1]!==0x4B) throw new Error('not xlsx');   /* ไม่ใช่ไฟล์ Excel */
    runSync(buf, 'ไฟล์กลาง (จากลิงก์)');
  }catch(e){
    /* เข้าเคสนี้แทบทุกครั้ง เพราะ SharePoint ต้อง login และบล็อกเว็บนอก */
    openSyncHelp();
  }
}

function syncToFile(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  if(!requirePlanner('Sync ข้อมูลลงไฟล์')) return;

  const rd = new FileReader();
  rd.onload = e=>{ runSync(e.target.result, file.name); };
  rd.readAsArrayBuffer(file);
}
function runSync(buffer, fileName){
  const file = {name: fileName || 'ไฟล์กลาง'};
    try{
      const wb = XLSX.read(buffer, {type:'array', cellDates:true, cellStyles:true});
      /* หาชีตที่มีคอลัมน์ โครงการ + บ้านเลขที่ */
      let sheetName = null, aoa = null, hdr = null;
      for(const nm of wb.SheetNames){
        const a = XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, defval:''});
        if(a.length < 2) continue;
        const h = (a[0]||[]).map(x=>String(x==null?'':x).toLowerCase());
        const hasV = h.findIndex(x=>x.includes('โครงการ')||x.includes('หมู่บ้าน')||x.includes('village'));
        const hasN = h.findIndex(x=>x.includes('บ้านเลขที่')||x.includes('address'));
        if(hasV>=0 && hasN>=0){ sheetName=nm; aoa=a; hdr=h; break; }
      }
      if(!sheetName){ toast('ไม่พบชีตที่มีคอลัมน์ "โครงการ" และ "บ้านเลขที่"'); return; }

      const col = (...keys)=>{ for(const k of keys){ const i=hdr.findIndex(h=>h.includes(k)); if(i>=0) return i; } return -1; };
      const cV=col('โครงการ','หมู่บ้าน','village'), cN=col('บ้านเลขที่','address');
      const cSt=col('status','สถานะ'), cSub=col('sub-contract','subcontract','ผู้รับเหมา'),
            cSol=col('solution'), cLat=col('lat'), cLng=col('lot','lng','long'),
            cVen=col('vendor'), cPo=col('po'), cUpd=col('อัปเดต','update');

      /* ทำดัชนีข้อมูลระบบ: หมู่บ้าน|บ้านเลขที่ */
      const sys = new Map();
      const vil = visibleVillages();
      vil.forEach(v=>{
        (v.houses||[]).forEach(h=>{
          const k = normName(v.name)+'|'+normName(h.no);
          if(!normName(h.no)) return;
          sys.set(k, {v, h});
        });
      });

      const ws = wb.Sheets[sheetName];
      const range = XLSX.utils.decode_range(ws['!ref']);
      const setCell = (r,c,val)=>{
        if(c < 0 || val==null || val==='') return false;
        const ref = XLSX.utils.encode_cell({r, c});
        const cur = ws[ref] ? String(ws[ref].v==null?'':ws[ref].v).trim() : '';
        if(cur === String(val).trim()) return false;
        ws[ref] = {t: typeof val==='number' ? 'n' : 's', v: val};
        return true;
      };

      let matched=0, changed=0;
      const fileKeys = new Set();
      const noVillage = new Map();     /* ชื่อหมู่บ้านในไฟล์ที่ไม่มีในระบบ */
      const noHouse = [];              /* มีหมู่บ้านตรง แต่บ้านเลขที่ไม่มีในระบบ */

      for(let r=1; r<=range.e.r; r++){
        const gv = (c)=>{ if(c<0) return ''; const cell = ws[XLSX.utils.encode_cell({r,c})]; return cell? String(cell.v==null?'':cell.v).trim() : ''; };
        const vn = gv(cV), no = gv(cN);
        if(!vn && !no) continue;
        const key = normName(vn)+'|'+normName(no);
        fileKeys.add(key);
        const hit = sys.get(key);
        if(!hit){
          const vHit = vil.some(x=>normName(x.name)===normName(vn));
          if(!vHit){ noVillage.set(vn, (noVillage.get(vn)||0)+1); }
          else if(no){ noHouse.push({v:vn, no}); }
          continue;
        }
        matched++;
        let did = false;
        did = setCell(r, cSt,  hit.h.st||'')            || did;
        did = setCell(r, cSub, houseSub(hit.v, hit.h))  || did;
        did = setCell(r, cSol, hit.h.sol||'')           || did;
        did = setCell(r, cLat, hit.h.lat||'')           || did;
        did = setCell(r, cLng, hit.h.lng||'')           || did;
        did = setCell(r, cVen, hit.v.contractor||'')    || did;
        if(cPo >= 0){
          const jb = villageJobs(hit.v)[0];
          did = setCell(r, cPo, jb ? jobPOName(jb) : '') || did;
        }
        did = setCell(r, cUpd, hit.v.lastMove||'')      || did;
        if(did) changed++;
      }

      /* มีในระบบ แต่ไม่มีในไฟล์ */
      const notInFile = [];
      sys.forEach((val, key)=>{ if(!fileKeys.has(key)) notInFile.push({v:val.v.name, no:val.h.no}); });

      /* บันทึกไฟล์ผลลัพธ์ (ชื่อเดิม + ระบุว่า sync แล้ว) */
      const base = String(file.name).replace(/\.(xlsx|xlsm|xls)$/i,'');
      const out = base + '-synced-' + todayISO() + '.xlsx';
      XLSX.writeFile(wb, out);

      B.syncAt = new Date().toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      bqPersist();
      showSyncReport({file:file.name, out, sheet:sheetName, matched, changed,
                      noVillage:[...noVillage.entries()], noHouse, notInFile,
                      total:sys.size, isXlsm:/\.xlsm$/i.test(file.name)});
      renderUnitMode();
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ: '+(err.message||'')); }
}

function cellDate(val){
  if(val instanceof Date){
    const d = new Date(val.getTime() - val.getTimezoneOffset()*60000);
    return d.toISOString().slice(0,10);
  }
  if(typeof val === 'number' && val > 20000){
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    return d.toISOString().slice(0,10);
  }
  if(typeof val === 'string'){
    const s = val.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  }
  return '';
}
function importExcel(ev){
  const f = ev.target.files[0]; if(!f) return;
  if(!requireAdmin('นำเข้าไฟล์ Master')){ ev.target.value=''; return; }
  const rd = new FileReader();
  rd.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      // บัญชี Vendor: จากไฟล์ package ('บัญชี') หรือ Master ('บัญชีทั้งหมด')
      let accVendor = null, touchedB = false;
      const acc = parseAccountSheet(wb);
      if(acc){
        let vd = B.vendors.find(x=>x.user===acc.user);
        if(!vd){ vd = {id:uid(), name:acc.name, user:acc.user, pass:acc.pass, prices:{}}; B.vendors.push(vd); }
        else { vd.pass = acc.pass; vd.name = acc.name; }
        accVendor = vd; touchedB = true;
      }
      const snAll = wb.SheetNames.find(x=>x==='บัญชีทั้งหมด');
      if(snAll){
        const aa = XLSX.utils.sheet_to_json(wb.Sheets[snAll], {header:1, defval:''});
        aa.slice(1).forEach(r=>{
          if(!r || !r[1]) return;
          const name=String(r[0]||r[1]), user=String(r[1]), pass=String(r[2]||'');
          let vd = B.vendors.find(x=>x.user===user);
          if(!vd){ B.vendors.push({id:uid(), name, user, pass, prices:{}}); }
          else { vd.name = name; if(pass) vd.pass = pass; }
          touchedB = true;
        });
      }
      // ราคา: ทุก sheet ที่ขึ้นต้นด้วย 'ราคา' — จับคู่ Vendor จากแถว meta หรือจากบัญชีใน package
      wb.SheetNames.filter(x=>x.startsWith('ราคา')).forEach(psn=>{
        const pa = XLSX.utils.sheet_to_json(wb.Sheets[psn], {header:1, defval:''});
        let vd = accVendor;
        const metaRow = pa.find(r=> r && String(r[0]).trim()==='Vendor');
        if(metaRow){
          const nm = String(metaRow[1]||'').trim();
          vd = B.vendors.find(x=>x.name.trim()===nm) || vd;
        }
        if(!vd) return;
        const hi = pa.findIndex(r=> r && String(r[2]).trim()==='รายการ');
        if(hi<0) return;
        const nameIdx = {}; ITEMS.forEach((it,i)=> nameIdx[it.n.trim()] = i);
        for(let i=hi+1;i<pa.length;i++){
          const r = pa[i]; if(!r) continue;
          const nm = String(r[2]||'').trim(); const pr = +r[4];
          if(nm && nameIdx[nm]!=null && !isNaN(pr)) vd.prices['i'+nameIdx[nm]] = pr;
        }
        touchedB = true;
      });
      if(touchedB) bqPersist();
      // ไฟล์ Master รูปแบบ 3 sheet (Progress / BOQ / Unit)
      const beforeIds = new Set(state.villages.map(v=>v.id));
      if(importMaster3(wb, {authoritative:isAdmin()})){
        autoFixShifted();
        persist(); bqPersist();
        if(session.role){ currentId = null; render(); }
        /* นำเข้าไฟล์ = ข้อมูลเปลี่ยนทั้งชุด → ต้องส่งขึ้นระบบทุกหมู่บ้านเมื่อกดบันทึก */
        state.villages.forEach(v=>{ v._dirty = true; if((v.houses||[]).length) v._hDirty = true; });
        cloudDirty = true;
        try{ markUnsaved(); }catch(e){}
        B.srcAt = new Date().toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        const created = state.villages.filter(v=>!beforeIds.has(v.id)).length;
        const updated = state.villages.length - created;
        /* นับรายการ BOQ ที่มีข้อมูล เพื่อยืนยันว่าเข้าจริง */
        let boqN = 0, boqNoQty = 0;
        B.jobs.forEach(j=>{
          Object.keys(j.prices||{}).forEach(k=>{
            if(!(+j.prices[k] > 0)) return;
            boqN++;
            if(!((j.qty||{})[k] > 0) && !((j.bqty||{})[k] > 0)) boqNoQty++;
          });
        });
        toast('นำเข้าสำเร็จ · อัปเดต ' + updated + ' โครงการ' + (created? ' · สร้างใหม่ ' + created + ' โครงการ':'')
              + (boqN? ' · BOQ ' + boqN + ' รายการ' : ''));
        if(boqNoQty) setTimeout(()=>toast('หมายเหตุ: BOQ ' + boqNoQty + ' รายการมีราคาแต่ยังไม่ได้ใส่จำนวน — ยังไม่ถูกคิดเป็นงบ'), 2600);
        showMisplacedWarning();
        showBoqImportReport();
        showDupWarning();
        showSavePrompt(state.villages.length);
        return;
      }
      let added = 0, updated = 0, teamFmt = 0;
      wb.SheetNames.forEach(sn=>{
        if(sn === 'สรุปรวม' || sn === 'สรุปราย Vendor' || sn.startsWith('บัญชี') || sn.startsWith('ราคา') || sn === 'วิธีกรอก' || /ลูกบ้าน/.test(sn)) return;
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
        let v = parseAppFormat(aoa);
        if(!v){ v = parseTeamFormat(aoa, sn); if(v) teamFmt++; }
        if(v){ state.villages.push(v); added++; }
      });
      if(added || updated || acc){
        persist(); bqPersist();
        if(session.role){ currentId = null; render(); }
        toast('นำเข้าสำเร็จ: ใหม่ ' + added + ' · อัปเดต ' + updated + (acc?' · บัญชี Vendor 1':'') + (teamFmt ? ' (กด ⚡ Gen เพื่อใส่วันที่)' : ''));
      } else toast('ไม่พบรูปแบบที่รู้จักในไฟล์');
    }catch(err){ toast('อ่านไฟล์ Excel ไม่สำเร็จ'); }
  };
  rd.readAsArrayBuffer(f);
  ev.target.value = '';
}

/* รูปแบบที่ export จากแอปนี้ — อ่านกลับได้ครบทุกช่อง */
function parseAppFormat(aoa){
  const hi = aoa.findIndex(r => r && r[1] === 'ขั้นตอนงาน');
  if(hi < 0) return null;
  const meta = {};
  for(let i=0;i<hi;i++){ if(aoa[i] && aoa[i][0] !== '') meta[String(aoa[i][0])] = aoa[i][1]; }
  const tasks = [];
  for(let i=hi+1;i<aoa.length;i++){
    const r = aoa[i];
    if(!r || r[1] === '' || r[1] == null) continue;
    tasks.push({id:uid(), name:String(r[1]), w:+r[2]||0, p:+r[3]||0, s:cellDate(r[4]), e:cellDate(r[5]), note:String(r[6]||'')});
  }
  if(!tasks.length) return null;
  return {
    id: uid(),
    name: String(meta['โครงการ']||'โครงการนำเข้า'),
    contractor: String(meta['ผู้รับเหมา']||''),
    ports: String(meta['พอร์ต / หลังคาเรือน']||''),
    start: cellDate(meta['วันเริ่มงาน']),
    end: cellDate(meta['กำหนดส่งมอบ']),
    issue: String(meta['ปัญหา / อุปสรรค']||''),
    tasks
  };
}
/* รูปแบบแผนทีม (no / description / ผู้รับผิดชอบ) — อ่านชื่องานได้ แต่ช่องสีที่ระบายวันไม่สามารถอ่านได้ */
function parseTeamFormat(aoa, sn){
  const hi = aoa.findIndex(r => r && String(r[0]).trim().toLowerCase() === 'no' && String(r[1]).trim().toLowerCase() === 'description');
  if(hi < 0) return null;
  const name = (aoa[0] && aoa[0][0]) ? String(aoa[0][0]) : sn;
  const tasks = [];
  for(let i=hi+1;i<aoa.length;i++){
    const r = aoa[i];
    if(!r || r[1] === '' || r[1] == null) continue;
    tasks.push({id:uid(), name:String(r[1]), w:0, p:0, s:'', e:'', note:String(r[2]||'')});
  }
  if(!tasks.length) return null;
  const w = Math.floor(100/tasks.length);
  tasks.forEach((t,i)=> t.w = (i === tasks.length-1) ? 100 - w*(tasks.length-1) : w);
  return {id:uid(), name, contractor:'', ports:'', start:'', end:'', issue:'', tasks};
}

    vil[0].tasks.forEach((t,i)=> XLSX.utils.sheet_add_aoa(wsP, [['งาน'+(i+1), t.name]], {origin:'A'+(lr+1+i)}));

  wsU['!freeze'] = {xSplit:0, ySplit:1};
  XLSX.utils.book_append_sheet(wb, wsU, 'Unit');

  /* ---------- backup sheets (admin): accounts + vendor prices ---------- */

/* สร้าง sheet BOQ: fix 4 คอลัมน์ซ้าย + บล็อก 6 คอลัมน์ต่อโครงการ พร้อมสูตร + เส้นแบ่ง */
function boqSheet(wb, vil){
  const jobsFor = v => villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId);
  const projs = vil.map(v=>({v, jb: jobsFor(v)[0]||null}));
  const nItem = ITEMS.length;
  const H1 = ['','','','FIX'];        // row 1: project name banner
  const H2 = ['ลำดับ','หมวด','รายการ','หน่วย'];  // row 2: column labels
  const blockCols = ['ราคา/หน่วย (โครงการนี้)','จำนวนตั้งงบ','งบประมาณ (บาท)','จำนวนที่ใช้แล้ว','ค่างานที่ใช้แล้ว (บาท)','งบคงเหลือ (บาท)'];
  projs.forEach(pr=>{
    H1.push(pr.v.name, '', '', '', '', '');
    blockCols.forEach(c=>H2.push(c));
  });
  const aoa = [H1, H2];
  ITEMS.forEach((it,idx)=>{
    const row = [idx+1, it.s, (it.on||it.n), it.u];
    projs.forEach(pr=>{
      const jb = pr.jb;
      const p  = (jb && jb.prices) ? jb.prices['i'+idx] : '';
      const bq = (jb && jb.bqty) ? jb.bqty['i'+idx] : '';
      const uq = (jb && jb.qty) ? jb.qty['i'+idx] : '';
      row.push(p===undefined?'':p, bq===undefined?'':bq, '', uq===undefined?'':uq, '', '');
    });
    aoa.push(row);
  });
  const totalRow = ['','','รวมทั้งโครงการ',''];
  projs.forEach(()=> totalRow.push('','','','','',''));
  aoa.push(totalRow);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const colName = c => { let s=''; c++; while(c>0){ s=String.fromCharCode(65+(c-1)%26)+s; c=Math.floor((c-1)/26);} return s; };
  const first = 3, last = 2 + nItem, trow = last + 1;
  const cols = [{wch:6},{wch:22},{wch:48},{wch:7}];
  const merges = [];
  projs.forEach((pr,pi)=>{
    const base = 4 + pi*6;                    // 0-indexed first col of this block
    const cP=colName(base), cB=colName(base+1), cBud=colName(base+2), cU=colName(base+3), cUse=colName(base+4), cR=colName(base+5);
    merges.push({s:{r:0,c:base}, e:{r:0,c:base+5}});   // merge project-name banner
    for(let n=first;n<=last;n++){
      ws[cBud+n] = {t:'n', f:'IF(OR('+cP+n+'="",'+cB+n+'=""),"",'+cP+n+'*'+cB+n+')'};
      ws[cUse+n] = {t:'n', f:'IF(OR('+cP+n+'="",'+cU+n+'=""),"",'+cP+n+'*'+cU+n+')'};
      ws[cR+n]   = {t:'n', f:'IF('+cBud+n+'="","",'+cBud+n+'-IF('+cUse+n+'="",0,'+cUse+n+'))'};
    }
    ws[cBud+trow] = {t:'n', f:'SUM('+cBud+first+':'+cBud+last+')'};
    ws[cUse+trow] = {t:'n', f:'SUM('+cUse+first+':'+cUse+last+')'};
    ws[cR+trow]   = {t:'n', f:'SUM('+cR+first+':'+cR+last+')'};
    cols.push({wch:13},{wch:11},{wch:14},{wch:12},{wch:16},{wch:14});
    // thick left border to separate projects
    for(let n=1;n<=trow;n++){
      const cell = ws[cP+n]; if(cell){ cell.s = cell.s||{}; cell.s.border = {left:{style:'medium',color:{rgb:'0F3D24'}}}; }
    }
  });
  ws['!cols'] = cols;
  ws['!merges'] = merges;
  ws['!freeze'] = {xSplit:4, ySplit:2};
  XLSX.utils.book_append_sheet(wb, ws, 'BOQ');
}

/* ============ อ่านไฟล์ Master 3-sheet กลับเข้าโปรแกรม ============ */
function importMaster3(wb, opts){
  const authoritative = !!(opts && opts.authoritative);
  const hasP = wb.SheetNames.includes('Progress');
  const hasB = wb.SheetNames.includes('BOQ');
  const hasU = wb.SheetNames.includes('Unit');
  if(!hasP && !hasB && !hasU) return false;
  const nameIdx = {}; ITEMS.forEach((it,i)=> nameIdx[it.n.trim()] = i);

  /* Progress sheet */
  const pa = hasP ? XLSX.utils.sheet_to_json(wb.Sheets['Progress'], {header:1, defval:''}) : [];
  const ph = (pa[0]||[]).map(String);
  const stepCols = [];
  ph.forEach((h,i)=>{ const m=/^งาน(\d+)/.exec(h); if(m) stepCols.push({i, n:+m[1]}); });
  if(wb.SheetNames.includes('PO')){
    const poa = XLSX.utils.sheet_to_json(wb.Sheets['PO'], {header:1, defval:''});
    B.pos = B.pos || [];
    for(let r=1;r<poa.length;r++){
      const code = String(poa[r][0]||'').trim(); if(!code) continue;
      let p = B.pos.find(x=>String(x.code).trim()===code);
      if(!p){ p={id:uid(), code, name:'', amount:0}; B.pos.push(p); }
      p.name = String(poa[r][1]||'');
      p.amount = +poa[r][2]||0;
    }
  }
  const poCol = ph.findIndex(h=>String(h).includes('PO'));
  /* หาคอลัมน์จากชื่อหัวตาราง (กันพังเมื่อมีการเพิ่ม/สลับคอลัมน์) */
  const H = (...keys)=>{ for(const k of keys){ const i=ph.findIndex(h=>String(h).includes(k)); if(i>=0) return i; } return -1; };
  const cName  = (()=>{ const i=H('โครงการ','หมู่บ้าน'); return i>=0?i:0; })();
  const cVend  = H('Vendor','ผู้รับเหมา');
  const cPorts = H('พอร์ต','หลังคาเรือน');
  const cDone  = H('เดินสายสำเร็จ','เดินสายแล้ว');
  const cStart = H('วันเริ่ม');
  const cEnd   = H('กำหนดส่ง','วันเสร็จ');
  const cIssue = H('ปัญหา');
  const cStat  = H('สถานะโครงการ');
  const cCAt   = H('วันที่ปิด');
  const cCB    = H('งบตอนปิด','งบที่ใช้ implement','งบก่อสร้าง');
  const cOH    = H('บ้านตอนเปิด');
  const cCH    = H('บ้านตอนปิด');
  const cOB    = H('งบตอนเปิด');
  const cLM    = H('เดินสายเพิ่มล่าสุด','วันอัปเดตล่าสุด');
  const byName = {};
  for(let r=1;r<pa.length;r++){
    const row = pa[r];
    const nm = String(row[cName]||'').trim();
    if(!nm || nm.startsWith('ชื่อขั้นตอน') || /^งาน\d+$/.test(nm)) continue;
    let v = findVillageByName(nm);
    const contractor = cVend>=0 ? String(row[cVend]||'') : '';
    const mv = B.vendors.find(x=>x.name.trim()===contractor.trim());
    if(!v){ v = {id:uid(), name:nm, contractor, vendorId:mv?mv.id:null, ports:'', homesDone:'', start:'', end:'', issue:'', tasks:TEMPLATE.map(t=>({id:uid(),name:t.name,w:t.w,p:0,note:''})), houses:[]}; state.villages.push(v); }
    v.contractor = contractor; if(mv) v.vendorId = mv.id;
    if(cPorts>=0) v.ports = row[cPorts]||'';
    if(cDone>=0)  v.homesDone = row[cDone]||'';
    if(cStart>=0) v.start = cellDate(row[cStart]);
    if(cEnd>=0)   v.end = cellDate(row[cEnd]);
    if(cIssue>=0) v.issue = String(row[cIssue]||'');
    if(cStat>=0){
      if(String(row[cStat]||'').indexOf('ปิด')>=0){
        v.closed = true;
        v.closedAt = cCAt>=0 ? (cellDate(row[cCAt]) || String(row[cCAt]||'')) : todayISO();
        v.builtBudget = cCB>=0 ? (+row[cCB]||0) : 0;
        v.builtHomes  = cCH>=0 ? (+row[cCH]||0) : (+v.homesDone||0);
        v.openHomes   = cOH>=0 ? (+row[cOH]||0) : (+v.ports||0);
        v.planBudget  = cOB>=0 ? (+row[cOB]||0) : 0;
      } else {
        delete v.closed; delete v.closedAt; delete v.builtBudget; delete v.builtHomes;
        delete v.openHomes; delete v.planBudget; delete v.builtUnits; delete v.planUnits;
      }
    }
    if(cLM>=0 && row[cLM]!=='' && row[cLM]!=null){
      const d = parseAnyDate(row[cLM]);
      if(d) v.lastMove = d;
      else if(authoritative) delete v.lastMove;     /* ล้างค่าถ้า admin ลบช่องนั้น */
    } else if(authoritative && cLM>=0){
      delete v.lastMove;
    }
    touchProgress(v);
    stepCols.forEach(sc=>{
      if(!v.tasks[sc.n-1]) return;
      const raw = row[sc.i];
      if(raw!=='' && raw!=null) v.tasks[sc.n-1].p = Math.max(0,Math.min(100,+raw||0));
      else if(authoritative) v.tasks[sc.n-1].p = 0;
    });
    byName[normName(nm)] = v;
    if(!B.jobs.some(j=>j.villageId===v.id)) B.jobs.push({id:uid(), name:nm, villageId:v.id, vendorId:v.vendorId||'', budget:'', qty:{}, bqty:{}, prices:{}, date:todayISO()});
    if(poCol >= 0){
      const pcode = String(row[poCol]||'').trim();
      const jb = B.jobs.find(j=>j.villageId===v.id);
      if(jb && pcode){
        let p = (B.pos||[]).find(x=>String(x.code).trim()===pcode);
        if(!p){ B.pos = B.pos||[]; p={id:uid(), code:pcode, name:'', amount:0}; B.pos.push(p); }
        jb.poId = p.id;
      }
    }
  }

  const misplaced = [];
  const dupReport = [];
  /* BOQ sheet: read project blocks by banner row */
  const ba = hasB ? XLSX.utils.sheet_to_json(wb.Sheets['BOQ'], {header:1, defval:''}) : [];
  const banner = ba[0]||[]; const labels = ba[1]||[];
  const blocks = [];
  for(let c=4;c<banner.length;c++){
    if(String(banner[c]).trim()){ blocks.push({name:String(banner[c]).trim(), c}); }
  }
  const boqNoMatch = [], boqEmpty = [], boqOk = [];
  const badItems = new Set();
  blocks.forEach(bl=>{
    const v = byName[normName(bl.name)] || findVillageByName(bl.name);
    if(!v){ boqNoMatch.push(bl.name); return; }
    let anyPrice = false;
    for(let r=2;r<ba.length;r++){ if(+ba[r][bl.c] > 0){ anyPrice = true; break; } }
    if(anyPrice) boqOk.push(bl.name); else boqEmpty.push(bl.name);
    let jb = B.jobs.find(j=>j.villageId===v.id);
    if(!jb){ jb={id:uid(),name:v.name,villageId:v.id,vendorId:v.vendorId||'',budget:'',qty:{},bqty:{},prices:{},date:todayISO()}; B.jobs.push(jb); }
    jb.prices=jb.prices||{}; jb.bqty=jb.bqty||{}; jb.qty=jb.qty||{};
    for(let r=2;r<ba.length;r++){
      const row = ba[r];
      const nm = String(row[2]||'').trim();
      if(!nm) continue;
      if(nameIdx[nm]==null){
        /* ชื่อรายการไม่ตรงกับรายการมาตรฐาน — ถ้ามีตัวเลขกรอกไว้ ถือว่าข้อมูลหาย */
        if(+row[bl.c]>0 || +row[bl.c+1]>0 || +row[bl.c+3]>0) badItems.add(nm);
        continue;
      }
      const k='i'+nameIdx[nm];
      const p  = +row[bl.c];
      const bq = +row[bl.c+1];
      const uq = +row[bl.c+3];
      const price = (!isNaN(p) && row[bl.c]!=='' && p>0) ? p : 0;
      /* ตรวจจับ: มีตัวเลขในช่องสูตร (งบประมาณ/ค่างาน) แต่ช่องจำนวนว่าง = กรอกผิดช่อง */
      if(price>0 && !(bq>0) && +row[bl.c+2]>0)
        misplaced.push({v:bl.name, item:ITEMS[nameIdx[nm]].n, col:'งบประมาณ', want:'จำนวนตั้งงบ', val:row[bl.c+2]});
      if(price>0 && !(uq>0) && +row[bl.c+4]>0)
        misplaced.push({v:bl.name, item:ITEMS[nameIdx[nm]].n, col:'ค่างานที่ใช้แล้ว', want:'จำนวนที่ใช้แล้ว', val:row[bl.c+4]});
      if(!isNaN(p) && row[bl.c]!=='' && p>=0) jb.prices[k]=p; else delete jb.prices[k];
      if(bq>0) jb.bqty[k]=bq; else delete jb.bqty[k];
      if(uq>0) jb.qty[k]=uq; else delete jb.qty[k];
    }
  });

  /* Unit sheet → houses per village (แหล่งหลักของสถานะรายหลัง) */
  if(wb.SheetNames.includes('Unit')){
    const ua = XLSX.utils.sheet_to_json(wb.Sheets['Unit'], {header:1, defval:''});
    const uh = (ua[0]||[]).map(x=>String(x).toLowerCase());
    const col = (...keys)=>{ for(const key of keys){ const i=uh.findIndex(h=>h.includes(key)); if(i>=0) return i; } return -1; };
    const cVil=col('โครงการ'), cNo=col('บ้านเลขที่','address'), cLat=col('lat'), cLng=col('lot','lng','long'),
          cSt=col('status','สถานะ'), cSol=col('solution'), cEst=col('estimate'), cDet=col('detail'),
          cVlc=col('vlc'), cOlt=col('olt'), cName=col('name','ชื่อ'), cPhone=col('phone','เบอร์'), cInt=col('สนใจ','interest'), cSub=col('sub-contract','subcontract','ผู้รับเหมาย่อย');
    const grouped = {};
    for(let r=1;r<ua.length;r++){
      const row = ua[r];
      const vil = String(row[cVil]||'').trim(); if(!vil) continue;
      (grouped[vil]=grouped[vil]||[]).push({
        no:String(row[cNo]||'').trim(), lat:cLat>=0?(+row[cLat]||''):'', lng:cLng>=0?(+row[cLng]||''):'',
        st:cSt>=0?String(row[cSt]||'').trim():'', sol:cSol>=0?String(row[cSol]||''):'', est:cEst>=0?String(row[cEst]||''):'',
        detail:cDet>=0?String(row[cDet]||''):'', vlc:cVlc>=0?String(row[cVlc]||''):'', olt:cOlt>=0?String(row[cOlt]||''):'',
        name:cName>=0?String(row[cName]||''):'', phone:cPhone>=0?String(row[cPhone]||''):'', interest:cInt>=0?String(row[cInt]||''):'', sub:cSub>=0?String(row[cSub]||''):''
      });
    }
    Object.keys(grouped).forEach(vil=>{
      let v = findVillageByName(vil) || byName[normName(vil)];
      if(!v){ v={id:uid(),name:vil,contractor:'',vendorId:null,ports:'',homesDone:'',start:'',end:'',issue:'',tasks:TEMPLATE.map(t=>({id:uid(),name:t.name,w:t.w,p:0,note:''})),houses:[]}; state.villages.push(v); if(!B.jobs.some(j=>j.villageId===v.id)) B.jobs.push({id:uid(),name:vil,villageId:v.id,vendorId:'',budget:'',qty:{},bqty:{},prices:{},date:todayISO()}); }
      const _raw = grouped[vil];
      v.houses = dedupeHouses(_raw);
      if(_raw.length !== v.houses.length) dupReport.push({v:vil, n:_raw.length - v.houses.length});
      v._hDirty = true;
      v.homesDone = v.houses.filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
    });
  }
  if(misplaced.length) window._importMisplaced = misplaced;
  else delete window._importMisplaced;
  window._importBoq = {noMatch:boqNoMatch, empty:boqEmpty, ok:boqOk.length, blocks:blocks.length,
                       badItems:[...badItems], sysNames: state.villages.map(v=>v.name)};
  window._importDup = dupReport.length ? dupReport : null;
  return true;
}

function parseAccountSheet(wb){
  const sn = wb.SheetNames.find(x=>x==='บัญชี');
  if(!sn) return null;
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
  const m = {}; aoa.forEach(r=>{ if(r && r[0]!=='') m[String(r[0])] = String(r[1]||''); });
  if(!m['Username'] || !m['Password']) return null;
  return {user:m['Username'], pass:m['Password'], name:m['Vendor']||m['Username']};
}

  L.push('🏘️ ' + v.name);

function copyLine(vid){
  const v = state.villages.find(v=>v.id===vid);
  const txt = lineText(v);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกแล้ว วางในกลุ่ม LINE ได้เลย'))
      .catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
  toast('คัดลอกแล้ว วางในกลุ่ม LINE ได้เลย');
}

  B = B || {};
  try{ normalizeData(); }catch(e){}
  migrateItemInsert();

function fmt(n){ return (Math.round((+n||0)*100)/100).toLocaleString('th-TH'); }

function vendorById(id){ return B.vendors.find(v=>v.id===id); }
function priceOf(vendor, idx){
  if(!ITEMS[idx]) return 0;
  if(vendor && vendor.prices && vendor.prices['i'+idx] != null && vendor.prices['i'+idx] !== '') return +vendor.prices['i'+idx];
  return 0;
}
function jobPrice(job, idx){
  if(job && job.prices && job.prices['i'+idx] != null && job.prices['i'+idx] !== '') return +job.prices['i'+idx];

}

  ['Sep-25',6004,3352],['Oct-25',6004,3475],['Nov-25',6004,3510],['Dec-25',6004,3520],

/* แทรกรายการ "Install duct in Sand" ที่ตำแหน่ง 89 -> เลื่อน key เดิมที่ >= 89 ไป +1 (ทำครั้งเดียว) */
const ITEM_INSERT_AT = 89, ITEMS_VERSION = 2;
function shiftKeys(obj){
  if(!obj) return obj;
  const out = {};
  Object.keys(obj).forEach(k=>{
    const idx = +k.slice(1);
    out['i' + (idx >= ITEM_INSERT_AT ? idx+1 : idx)] = obj[k];
  });
  return out;
}
function migrateItemInsert(){
  if((B.itemsV||1) >= ITEMS_VERSION) return;
  (B.jobs||[]).forEach(j=>{ j.prices = shiftKeys(j.prices); j.bqty = shiftKeys(j.bqty); j.qty = shiftKeys(j.qty); });
  (B.vendors||[]).forEach(v=>{ v.prices = shiftKeys(v.prices); });
  B.itemsV = ITEMS_VERSION;
  try{ localStorage.setItem(LS, JSON.stringify(B)); }catch(e){}
}

/* ============ 💰 ความคุ้มทุนรายหมู่บ้าน (ADMIN เท่านั้น · ความลับสูงสุด) ============
   v.roi = { arpu: ค่าแพ็คเกจเฉลี่ย/เดือน, cust: { 'YYYY-MM': จำนวนลูกค้า } }        */
function roiOf(v){
  if(!v) return {arpu:0, cust:{}};
  if(!v.roi || typeof v.roi !== 'object' || Array.isArray(v.roi)) v.roi = {};
  v.roi.arpu = +v.roi.arpu || 0;
  if(!v.roi.cust || typeof v.roi.cust !== 'object' || Array.isArray(v.roi.cust)) v.roi.cust = {};
  return v.roi;
}
function roiMonths(v){ return Object.keys(roiOf(v).cust).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort(); }
/* เงินลงทุน = งบที่ใช้ implement (ปิดแล้วใช้ค่าที่ล็อก) */
function roiInvest(v){
  if(isClosed(v)) return +v.builtBudget||0;
  return B.jobs.filter(j=>j.villageId===v.id).reduce((a,j)=>a+jobCost(j),0);
}
/* สรุปผลตอบแทน */
function roiCalc(v){
  const r = roiOf(v), ms = roiMonths(v);
  const invest = roiInvest(v);
  const arpu = +r.arpu||0;
  let cum = 0, paybackMonth = null, rows = [];
  ms.forEach(m=>{
    const n = +r.cust[m]||0;
    const rev = n * arpu;
    cum += rev;
    if(paybackMonth===null && invest>0 && cum>=invest) paybackMonth = m;
    rows.push({m, n, rev, cum});
  });
  const last = rows.length ? rows[rows.length-1] : null;
  const cur = last ? last.n : 0;
  const monthly = cur * arpu;
  const remain = Math.max(0, invest - cum);
  const monthsLeft = (monthly>0 && remain>0) ? Math.ceil(remain/monthly) : (remain>0? null : 0);
  const roiPct = invest>0 ? Math.round((cum-invest)/invest*100) : null;
  const ports = +v.ports||0;
  return { invest, arpu, rows, cum, cur, monthly, remain, monthsLeft, paybackMonth, roiPct,
           penetration: ports? Math.round(cur/ports*100) : null,
           firstMonth: ms[0]||null, lastMonth: last? last.m : null };
}
function thMonth(m){
  if(!m) return '-';
  const [y,mo] = String(m).split('-');
  const names=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return (names[+mo-1]||mo)+' '+(+y+543-2500>=0? String(+y+543).slice(-2) : y);
}
function monthKey(d){
  const x = d instanceof Date ? d : new Date();
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
}

function setRoiArpu(vid, val){
  if(!requireAdmin('แก้ค่าแพ็คเกจ')) return;
  const v = state.villages.find(x=>x.id===vid); if(!v) return;
  roiOf(v).arpu = +val||0;
  persist(); openRoiDetail(vid); renderRoiMode();
}
function addRoiMonth(vid){
  if(!requireAdmin('บันทึกจำนวนลูกค้า')) return;
  const m = $('roiNewM').value, n = $('roiNewN').value;
  if(!m){ toast('เลือกเดือนก่อน'); return; }
  const v = state.villages.find(x=>x.id===vid); if(!v) return;
  roiOf(v).cust[m] = +n||0;
  persist(); openRoiDetail(vid); renderRoiMode();
  toast('บันทึก '+thMonth(m)+' · '+(+n||0)+' ราย');
}
function setRoiMonth(vid, m, val){
  if(!requireAdmin('แก้จำนวนลูกค้า')) return;
  const v = state.villages.find(x=>x.id===vid); if(!v) return;
  roiOf(v).cust[m] = +val||0;
  persist(); renderRoiMode();
}
function delRoiMonth(vid, m){
  if(!requireAdmin('ลบข้อมูล')) return;
  const v = state.villages.find(x=>x.id===vid); if(!v) return;
  delete roiOf(v).cust[m];
  persist(); openRoiDetail(vid); renderRoiMode();
}
