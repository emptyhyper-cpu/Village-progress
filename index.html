window._houseErrs = [];
async function pushHouses(v){
  if(!cloudOn || !cloudUser || !v) return false;
  try{
    if(!(await ensureVillageRow(v))){ window._houseErrs.push(v.name+': สร้างหมู่บ้านบนระบบไม่สำเร็จ'); return false; }
    /* อัปเดตยอดหลังพร้อมกันในรอบเดียว (ไม่ต้องรอกัน) */
    const res = await replaceHouses(v);
    if(!res.ok){ window._houseErrs.push(v.name+': '+res.err); return false; }
    /* ยอดหลังที่เสร็จ: นับจากระบบหลังบันทึก (รวมที่คนอื่นเพิ่งแก้) · อ่านไม่ได้ → ใช้ยอดในเครื่องแบบเดิม */
    const dn = await cloudDoneCount(v.cloudId);
    if(dn != null) v.homesDone = dn;
    try{ await sb.from('villages').update({ homes_done:+v.homesDone||0 }).eq('id', v.cloudId); }catch(e){}
    if(v._vbase) v._vbase.homes_done = +v.homesDone||0;
    delete v._hDirty;      /* อย่าล้าง _dirty — งบ BOQ ยังต้องส่งในรอบถัดไป */
    persistLocalOnly();
    refreshSaveBtn();
    return true;
  }catch(e){ window._houseErrs.push(v.name+': '+errMsg(e)); return false; }
}
/* บันทึกทุกหมู่บ้านที่ยังค้างอยู่ (ใช้ตอนกดปุ่มบันทึก / ก่อนปิดหน้า) */
async function flushPendingHouses(){
  Object.keys(unitSaveTimers).forEach(k=>clearTimeout(unitSaveTimers[k]));
  const pend = state.villages.filter(v=>v._hDirty);
  const dot0 = document.getElementById('syncDot');
  let doneN = 0;
  const tick = ()=>{ if(dot0 && pend.length>1) dot0.textContent = '⏳ '+(++doneN)+'/'+pend.length; };
  /* ส่งหลายหมู่บ้านพร้อมกัน ครั้งละ 3 (เร็วขึ้นแต่ไม่ถล่มเซิร์ฟเวอร์) */
  for(let i=0;i<pend.length;i+=6){
    await Promise.all(pend.slice(i,i+6).map(v=>pushHouses(v).then(r=>{ tick(); return r; })));
  }
  return pend.length;
}

/* ===== ซ่อมข้อมูลที่คอลัมน์เลื่อนอัตโนมัติ (ช่องพอร์ตได้เลข PO มา) ===== */
function autoFixShifted(){
  const bad = (state.villages||[]).filter(v=>{
    const p = String(v.ports==null?'':v.ports).trim();
    return /^\d+$/.test(p) && +p >= 100000;
  });
  if(!bad.length) return 0;
  bad.forEach(v=>{
    const poNumber = String(v.ports).trim();
    v.ports = v.homesDone || '';
    v.homesDone = (v.houses||[]).filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
    let p = (B.pos||[]).find(x=>String(x.code).trim()===poNumber);
    if(!p){ B.pos = B.pos||[]; p = {id:uid(), code:poNumber, name:'', amount:0}; B.pos.push(p); }
    const jb = B.jobs.find(j=>j.villageId===v.id);
    if(jb && !jb.poId) jb.poId = p.id;
  });
  persist(); bqPersist();
  return bad.length;
}


/* ===== กราฟความเคลื่อนไหวรายเดือน ===== */
/* กราฟแยกตามสิทธิ์: admin ไม่กรอง = ภาพรวมทั้งหมด · กรอง Vendor หรือ login เป็นผรม. = ของรายนั้น */
/* ===== กราฟติดตามรายเดือน =====
   เริ่มเก็บ ก.ย. 2026 · บันทึกยอดของเดือน ณ วันสุดท้ายของเดือนนั้น
   แสดงย้อนหลัง 12 เดือน                                              */
const TREND_START = '2026-09';                  /* เริ่มบันทึกอัตโนมัติจากระบบ */
const TREND_SHOW  = 12;                         /* แสดงย้อนหลังกี่เดือน */
const MON_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* '2026-09' → 'Sep-26' (รูปแบบเดิมที่ใช้อยู่) */
function ymToLabel(ym){
  const [y,m] = String(ym).split('-').map(Number);
  if(!y || !m) return String(ym);
  return MON_EN[m-1] + '-' + String(y % 100).padStart(2,'0');
}
/* 'Sep-26' → '2026-09' */
function labelToYm(lb){
  const m = String(lb||'').trim().match(/^([A-Za-z]{3})-(\d{2})$/);
  if(!m) return '';
  const i = MON_EN.findIndex(x=> x.toLowerCase() === m[1].toLowerCase());
  if(i < 0) return '';
  return '20' + m[2] + '-' + String(i+1).padStart(2,'0');
}
function thisYm(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function ymAdd(ym, n){
  const [y,m] = String(ym).split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
/* วันสุดท้ายของเดือน */
function ymLastDay(ym){
  const [y,m] = String(ym).split('-').map(Number);
  return localISO(new Date(y, m, 0));          /* เดิม toISOString → เวลาไทยได้วันก่อนวันสุดท้าย (ต.ค. ได้ 30) */
}
/* เดือนที่แสดง — ย้อนหลัง 12 เดือนจากเดือนปัจจุบันเสมอ
   (ข้อมูลก่อนเดือนเริ่มบันทึกอัตโนมัติ กรอกย้อนหลังเองได้) */
function trendMonths(){
  const cur = thisYm();
  const out = [];
  for(let i = TREND_SHOW - 1; i >= 0; i--) out.push(ymAdd(cur, -i));
  return out;
}
/* ===== ข้อมูลย้อนหลังที่บันทึกไว้ (Oct-25 → Aug-26) =====
   total = ต้องเดินสายทั้งหมด · done = เดินสายแล้ว · doing = อยู่ระหว่างเดินสาย */
const TREND_SEED = [
  {m:'Oct-25', total:7859, done:4687, doing:35},
  {m:'Nov-25', total:7859, done:4722, doing:32},
  {m:'Dec-25', total:7859, done:4737, doing:45},
  {m:'Jan-26', total:7954, done:4737, doing:40},
  {m:'Feb-26', total:7954, done:4760, doing:32},
  {m:'Mar-26', total:7954, done:4794, doing:28},
  {m:'Apr-26', total:7954, done:4870, doing:25},
  {m:'May-26', total:7954, done:4900, doing:20},
  {m:'Jun-26', total:8048, done:4920, doing:145},
  {m:'Jul-26', total:8048, done:4950, doing:130},
  {m:'Aug-26', total:8048, done:4983, doing:95}
];
/* แบ่งจำนวนตามสัดส่วน — ใช้วิธีเศษเหลือมากสุด ผลรวมตรงเป๊ะเสมอ */
function splitByShare(amount, weights){
  const sum = weights.reduce((a,b)=>a+b, 0);
  const n = weights.length;
  if(!sum || !n) return weights.map(()=>0);
  const raw = weights.map(wgt=> amount * wgt / sum);
  const out = raw.map(x=> Math.floor(x));
  let left = amount - out.reduce((a,b)=>a+b, 0);
  const order = raw.map((x,i)=>({i, frac: x - Math.floor(x)}))
                   .sort((a,b)=> b.frac - a.frac);
  for(let k=0; k<order.length && left>0; k++, left--) out[order[k].i]++;
  return out;
}
/* ใส่ข้อมูลย้อนหลังครั้งเดียว — แบ่งให้แต่ละ Vendor ตามสัดส่วนจำนวนบ้านที่รับผิดชอบ */
function seedTrendHistory(force){
  if(!canViewAll()) return 0;
  B.trends = B.trends || {};
  B.trends._all = B.trends._all || [];
  const vds0 = realVendors();
  const sub0 = trendSubSums();
  const allRow = m => B.trends._all.find(r=> r.m === m);
  /* ไม่บังคับ: เติมเฉพาะเดือนที่ยังไม่มีข้อมูลราย Sub
     ถ้าภาพรวมเดือนนั้นเป็นตัวเลขที่ผู้ใช้กรอกเอง (ไม่ใช่ค่าตั้งต้นเก่า) → แบ่งตัวเลขนั้นแทนค่าตั้งต้น */
  const todo = TREND_SEED.filter(r=>{
    if(force) return true;
    const a = allRow(r.m);
    if(vds0.length) return !sub0[labelToYm(r.m)];
    return !a || trendIsLegacy(a);
  }).map(r=>{
    const a = allRow(r.m);
    return (!force && a && !trendIsLegacy(a)) ? { m:r.m, total:+a.total||0, done:+a.done||0, doing:+a.doing||0 } : r;
  });
  if(!todo.length) return 0;

  const vds = realVendors();
  /* น้ำหนัก = จำนวนพอร์ตที่แต่ละเจ้ารับผิดชอบตอนนี้ */
  const wgt = vds.map(vd=> villagesOfVendor(vd).reduce((a,v)=> a + ((+v.ports||0) || (v.houses||[]).length), 0));
  const anyW = wgt.some(x=>x>0);

  todo.forEach(r=>{
    /* ภาพรวม */
    const all = B.trends._all;
    const cur = all.find(x=> x.m === r.m);
    if(cur) Object.assign(cur, r, {src:'seed'}); else all.push({...r, src:'seed'});
    /* แยกรายเจ้า */
    if(vds.length){
      const w = anyW ? wgt : vds.map(()=>1);       /* ยังไม่มีข้อมูลพอร์ต → แบ่งเท่ากัน */
      const T = splitByShare(r.total, w);
      const D = splitByShare(r.done,  w);
      const G = splitByShare(r.doing, w);
      vds.forEach((vd,i)=>{
        B.trends[vd.id] = B.trends[vd.id] || [];
        const rows = B.trends[vd.id];
        const ex = rows.find(x=> x.m === r.m);
        const val = {m:r.m, total:T[i], done:D[i], doing:G[i], src:'seed'};
        if(ex) Object.assign(ex, val); else rows.push(val);
      });
    }
  });
  Object.keys(B.trends).forEach(k=> trendSort(B.trends[k]));
  if(window._trendCloud){ trendSaveLocal(); trendCloudSync(); } else bqPersist();
  return todo.length;
}
function trendKey(){
  if(!canViewAll()) return session.vendorId || '_none';
  const sel = dashVendorIds();
  return sel.length===1 ? sel[0] : '_all';
}
function trendScopeName(){
  const keys = trendKeys();
  if(keys.length === 1){
    if(keys[0] === '_all') return 'ภาพรวมทั้งหมด';
    const v = vendorById(keys[0]);
    return v ? v.name : 'ของคุณ';
  }
  return keys.map(k=> (vendorById(k)||{}).name || '?').join(' + ');
}
function trendList(){
  B.trends = B.trends || {};
  const k = trendKey();
  if(!B.trends[k]) B.trends[k] = [];
  return B.trends[k];
}
/* คีย์ที่ต้องรวมตัวเลข ตามที่ติ๊กไว้ */
function trendKeys(){
  if(!canViewAll()) return [session.vendorId || '_none'];
  const sel = dashVendorIds();
  if(!sel.length || sel.length === realVendors().length) return ['_all'];
  return sel;
}
/* รวมสถิติหลายเจ้าเข้าด้วยกันรายเดือน */
/* ===== ยอดรวมจาก Sub (ผรม.รายเจ้า) =====
   ภาพรวม "ทั้งหมด" อ้างอิงผลรวมรายเจ้าเป็นหลัก — เดือนที่ไม่มีข้อมูลรายเจ้าเลยจึงใช้ค่าภาพรวมที่บันทึกไว้
   ค่าตั้งต้นชุดเก่า (DEFAULT_TREND · ฐาน ~6,000 หลัง) ไม่นำมาปนกับข้อมูลชุดใหม่ (ฐาน ~8,000 หลัง) */
function trendIsLegacy(r){
  const ym = labelToYm(r && r.m); if(!ym) return false;
  return DEFAULT_TREND.some(x=> labelToYm(x[0])===ym && +x[1]===(+r.total||0) && +x[2]===(+r.done||0) && !(+r.doing));
}
function trendSubSums(){
  B.trends = B.trends || {};
  const by = {};
  realVendors().forEach(vd=>{
    (B.trends[vd.id]||[]).forEach(r=>{
      const ym = labelToYm(r.m); if(!ym || trendRowZero(r)) return;      /* แถว 0 = ไม่มีข้อมูล */
      const o = by[ym] = by[ym] || { m:ymToLabel(ym), total:0, done:0, doing:0, n:0, _sub:true };
      o.total += (+r.total||0); o.done += (+r.done||0); o.doing += (+r.doing||0); o.n++;
    });
  });
  return by;
}
function trendOverall(){
  const sub = trendSubSums();
  const by = {};
  (B.trends._all||[]).forEach(r=>{
    const ym = labelToYm(r.m); if(!ym) return;
    if(trendIsLegacy(r) || trendRowZero(r)) return;      /* ค่าตั้งต้นชุดเก่า / แถว 0 — ไม่ใช้ */
    by[ym] = { m:ymToLabel(ym), total:+r.total||0, done:+r.done||0, doing:+r.doing||0 };
  });
  Object.keys(sub).forEach(ym=>{ by[ym] = sub[ym]; });    /* มีข้อมูลราย Sub = ใช้ผลรวม Sub */
  return trendSort(Object.values(by));
}
function trendMerged(){
  B.trends = B.trends || {};
  const keys = trendKeys();
  if(keys.length === 1 && keys[0]==='_all' && canViewAll()) return trendOverall();
  if(keys.length === 1) return trendSort((B.trends[keys[0]]||[]).filter(r=> !trendRowZero(r)));
  const by = {};
  keys.forEach(k=>{
    (B.trends[k]||[]).forEach(r=>{
      if(trendRowZero(r)) return;
      const ym = labelToYm(r.m) || r.m;
      if(!by[ym]) by[ym] = { m:r.m, total:0, done:0, doing:0 };
      by[ym].total += (+r.total||0);
      by[ym].done  += (+r.done||0);
      by[ym].doing += (+r.doing||0);
    });
  });
  return trendSort(Object.values(by));
}
/* แถวสำหรับวาดกราฟ — 12 เดือนล่าสุด
   เดือนปัจจุบัน = ใช้ยอดสดจากระบบเสมอ (เห็นตัวเลข ณ วันนี้)
   พอสิ้นเดือน ค่าที่บันทึกไว้จะกลายเป็นค่าถาวรของเดือนนั้น              */
function trendRows(){
  const rows = trendMerged();
  const show = trendMonths();
  const inRange = rows.filter(r=>{
    const ym = labelToYm(r.m);
    return !ym || show.indexOf(ym) >= 0;
  });
  let use = (inRange.length ? inRange : rows).slice(-TREND_SHOW);

  /* เดือนนี้ — แทนที่ด้วยยอดสด */
  const ym = thisYm(), lb = ymToLabel(ym);
  const live = trendAutoNow(dashScopeVillages());
  if(live.total || live.done || live.doing){
    const i = use.findIndex(r=> labelToYm(r.m) === ym || r.m === lb);
    const row = { m: lb, total: live.total, done: live.done, doing: live.doing, _live: true };
    if(i >= 0) use[i] = row; else use.push(row);
    use = use.slice(-TREND_SHOW);
  }
  return use;
}
/* สถานะที่ถือว่า "อยู่ระหว่างเดินสาย" (เริ่มแล้วแต่ยังไม่พร้อม ONU) */
const ST_DOING = [
  'อยู่ระหว่างการเดินสาย Main Fiber',
  'อยู่ระหว่างการเดินสาย Drop Fiber เข้าบ้าน',
  'อยู่ระหว่างการ Terminate ปล่อยสัญญาณ',
  'ปล่อยสัญญาณที่ตู้ Post'
];
function isDoing(h){
  const st = String((h && h.st) || '').trim();
  if(!st || unitDone(h)) return false;
  return ST_DOING.indexOf(st) >= 0;
}
/* ยอดปัจจุบันของขอบเขตที่กำหนด */
function trendAutoNow(vil){
  let total = 0, done = 0, doing = 0;
  (vil||[]).forEach(v=>{
    total += (+v.ports || 0) || (v.houses||[]).length;
    done  += (+v.homesDone || 0);
    doing += (v.houses||[]).filter(isDoing).length;
  });
  return { total, done, doing };
}
/* หมู่บ้านของผรม.รายนี้ (ใช้เก็บสถิติแยกราย Vendor) */
function villagesOfVendor(vd){
  const nm = normName(vd && vd.name);
  return state.villages.filter(v=> v.vendorId===vd.id || normName(v.contractor)===nm);
}

/* ===== สรุปจำนวนหลัง YoY (ใช้ข้อมูลกราฟทั้งหมด ไม่จำกัด 12 เดือน + ยอดสดเดือนนี้) ===== */
function trendAllRows(){
  const by = {};
  trendMerged().forEach(r=>{
    const ym = labelToYm(r.m); if(!ym) return;
    by[ym] = { ym, total:+r.total||0, done:+r.done||0 };
  });
  const ym = thisYm(), live = trendAutoNow(dashScopeVillages());
  if(live.total || live.done) by[ym] = { ym, total:live.total, done:live.done, live:true };
  return Object.values(by).sort((a,b)=> a.ym<b.ym ? -1 : (a.ym>b.ym ? 1 : 0));
}
function trendYoY(){
  const rows = trendAllRows();
  if(!rows.length) return null;
  const by = {}; rows.forEach(r=> by[r.ym] = r);
  const yOf = r => +r.ym.slice(0,4);
  const endOf = yr => { const a = rows.filter(r=> yOf(r)===yr); return a.length ? a[a.length-1] : null; };
  const firstOf = yr => rows.find(r=> yOf(r)===yr) || null;
  const last = rows[rows.length-1];
  const Y = yOf(last), M = last.ym.slice(5);
  const prev = by[(Y-1)+'-'+M] || null;                     /* เดือนเดียวกันปีก่อน */
  /* ยอดเพิ่มรายปี = ยอดสิ้นปี − ยอดสิ้นปีก่อน (ปีแรกที่มีข้อมูล = เทียบเดือนแรกที่มี) */
  const years = [...new Set(rows.map(yOf))].sort();
  const yrs = years.map(yr=>{
    const e = endOf(yr), pe = endOf(yr-1), base = pe || firstOf(yr);
    return { yr, end:e, added: e.done - base.done, totalAdded: e.total - base.total,
             partial: !pe, from: pe ? '' : base.ym, toMonth: e.ym.slice(5) };
  });
  yrs.forEach((x,i)=>{ const p = yrs[i-1]; x.prevAdded = (p && p.yr===x.yr-1) ? p.added : null; x.prevPartial = p ? p.partial : false; });
  /* ปีนี้ถึงเดือนล่าสุด เทียบ ช่วงเดียวกันปีก่อน */
  const pe = endOf(Y-1);
  const ytd = { cur: pe ? last.done - pe.done : null, prev: null, prevFrom: '' };
  if(prev){
    const ppe = endOf(Y-2), base = ppe || firstOf(Y-1);
    if(base && base.ym <= prev.ym){ ytd.prev = prev.done - base.done; if(!ppe) ytd.prevFrom = base.ym; }
  }
  return { last, prev, yrs, ytd, Y, M };
}
function yoyDelta(cur, old){
  if(cur==null || old==null) return '<span class="yoy-na">-</span>';
  const d = cur - old, pc = old ? Math.round(d/old*100) : null;
  const cls = d>0 ? 'up' : (d<0 ? 'down' : '');
  return `<b class="yoy-d ${cls}">${d>0?'+':''}${fmt(d)}</b>${pc===null?'':` <small class="yoy-d ${cls}">(${pc>0?'+':''}${pc}%)</small>`}`;
}

/* แคปกล่องใดๆ เป็นรูป → คลิปบอร์ด (สำรอง: ดาวน์โหลด) */
function capSection(id, title){
  if(!needLib('html2canvas')) return;
  if(title==null) title = capTitleOf(id);
  const el = document.getElementById(id);
  if(!el){ toast('ไม่พบส่วนนี้'); return; }
  if(typeof html2canvas === 'undefined'){ toast('ยังโหลดตัวแคปไม่เสร็จ ลองใหม่อีกครั้ง'); return; }

  /* หาความกว้างจริงที่ต้องใช้ — วัดจากตารางที่ถูกบีบอยู่ ไม่ใช่แค่กล่องนอก
     (บนมือถือ scrollWidth ของกล่องมักเท่าจอ ทำให้รูปขาดคอลัมน์ท้าย) */
  let need = el.scrollWidth || 0;
  el.querySelectorAll('.tbl-scroll, table, .kpis, .kpi-grid').forEach(n=>{
    need = Math.max(need, n.scrollWidth || 0, n.offsetWidth || 0);
  });
  /* วัดจากตัวตาราง: เอาความกว้างที่มากที่สุดของแต่ละคอลัมน์จากทุกแถว
     (บนมือถือ offsetWidth มักถูกบีบ จึงประมาณจากจำนวนตัวอักษรควบคู่ไปด้วย) */
  el.querySelectorAll('table').forEach(tb=>{
    const rows = tb.querySelectorAll('tr');
    if(!rows.length) return;
    const colW = [];
    rows.forEach(r=>{
      [...r.querySelectorAll('th,td')].forEach((c,ci)=>{
        const span = +c.getAttribute('colspan') || 1;
        if(span > 1) return;                       /* ข้ามช่องรวม */
        const txt = (c.textContent||'').trim();
        const longest = txt.split(/\s{2,}|\n/).reduce((m,x)=>Math.max(m,x.length),0) || txt.length;
        const est = Math.min(longest, 34) * 10 + 26;     /* ไทย ~10px/ตัว + ขอบ */
        const w = Math.max(c.scrollWidth||0, c.offsetWidth||0, est);
        colW[ci] = Math.max(colW[ci]||0, w);
      });
    });
    const sum = colW.reduce((a,b)=>a+(b||0),0);
    /* กันแคบ: อย่างน้อย 96px ต่อคอลัมน์ */
    need = Math.max(need, sum, colW.length * 96);
  });
  need = Math.max(Math.ceil(need) + 40, 760);   /* เผื่อขอบ + กันแคบเกินบนมือถือ */
  need = Math.min(need, 3000);                  /* กันกว้างเกินจนไฟล์ใหญ่ */

  toast('กำลังสร้างรูป...');
  html2canvas(el, {
    scale: Math.min(2, Math.max(1.5, 1400/need)),
    backgroundColor:'#FFFFFF',
    width: need,
    windowWidth: need,
    scrollX: 0, scrollY: 0,
    useCORS: true,
    /* แก้บนสำเนา ไม่แตะหน้าจอจริง — คลี่ทุกกล่องที่เลื่อนได้ให้เห็นครบ */
    onclone: (doc)=>{
      const t = doc.getElementById(id);
      if(!t) return;
      t.style.width = need + 'px';
      t.style.maxWidth = 'none';
      t.style.overflow = 'visible';
      doc.querySelectorAll('#'+id+' .tbl-scroll').forEach(n=>{
        n.style.overflow = 'visible';
        n.style.maxHeight = 'none';         /* กล่องหัวตารางค้าง → คลี่ให้เห็นครบทุกแถว */
        n.style.width = 'max-content';
        n.style.background = 'none';        /* เอาเงาบอกเลื่อนออก */
      });
      doc.querySelectorAll('#'+id+' table').forEach(n=>{
        n.style.width = 'max-content';
        n.style.minWidth = '100%';
        n.style.tableLayout = 'auto';
      });
      doc.querySelectorAll('#'+id+' .panel').forEach(n=>{
        n.style.overflow = 'visible';
        n.style.width = 'max-content';
        n.style.minWidth = '100%';
      });
      doc.querySelectorAll('#'+id+' td, #'+id+' th').forEach(n=>{ n.style.whiteSpace = 'nowrap'; });
      doc.querySelectorAll('#'+id+' th').forEach(n=>{ n.style.position = 'static'; n.style.boxShadow = 'none'; });
      doc.querySelectorAll('#'+id+' .cap-btn').forEach(n=>{ n.style.display = 'none'; });
    }
  })
   .then(cv=>{
     const out = document.createElement('canvas');
     const pad = 18, head = 52;
     out.width = cv.width + pad*2;
     out.height = cv.height + pad*2 + head;
     const cx = out.getContext('2d');
      if(!cx){ toast('เครื่องนี้สร้างรูปไม่ได้ — ลองใช้ปุ่มแคปหน้าจอของเครื่องแทน'); return; }
     cx.fillStyle='#fff'; cx.fillRect(0,0,out.width,out.height);
     const fs = Math.max(22, Math.round(out.width/48));
     cx.fillStyle='#0F3D24'; cx.font='700 '+fs+'px Sarabun, Tahoma, sans-serif'; cx.textBaseline='middle';
     cx.fillText(String(title||'Dashboard'), pad, head/2 - 4);
     cx.fillStyle='#5C6B60'; cx.font='500 '+Math.round(fs*0.62)+'px Sarabun, Tahoma, sans-serif';
     cx.textAlign='right';
     cx.fillText('อัปเดต '+thDate(todayISO()), out.width-pad, head/2 - 4);
     cx.textAlign='left';
     cx.fillStyle='#78BE20'; cx.fillRect(pad, head-10, out.width-pad*2, 3);
     cx.drawImage(cv, pad, head + pad - 8);
     out.toBlob(blob=>{
       if(!blob){ toast('สร้างรูปไม่สำเร็จ'); return; }
       const fname='dashboard-'+String(title||'').replace(/[^\u0E00-\u0E7F\w]+/g,'-').slice(0,40)+'-'+todayISO()+'.png';
       const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
                      setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('⬇️ บันทึกรูปแล้ว'); };
       try{
         if(navigator.clipboard && window.ClipboardItem){
           navigator.clipboard.write([new ClipboardItem({'image/png':blob})])
             .then(()=>toast('📋 คัดลอกแล้ว — ไปที่ไลน์กด Ctrl+V')).catch(dl);
         } else dl();
       }catch(e){ dl(); }
     },'image/png');
   })
   .catch(()=>{ toast('สร้างรูปไม่สำเร็จ ลองใหม่อีกครั้ง'); });
}

/* ===== ยอดรายเดือนของกราฟ — เก็บบนระบบ (ตาราง trend_months) =====
   เดิมเก็บในเบราว์เซอร์แต่ละเครื่อง → ออกจากระบบ/เปลี่ยนเครื่อง = หาย และเครื่องที่เปิดตอนข้อมูลยังไม่โหลดจะปิดยอดเป็น 0
   ตอนนี้: เก็บบนระบบ ทุกเครื่องเห็นชุดเดียวกัน · ยอด 0 ทั้งแถว = ถือว่าไม่มีข้อมูล (ไม่วาด ไม่บันทึก) */
window._trendCloud = null;          /* null = ยังไม่รู้ · false = ระบบยังไม่มีตาราง (ใช้แบบเดิมในเครื่อง) · {} = ลายเซ็นแถวบนระบบ */
window._trendDel = {};              /* แถวที่ผู้ใช้ลบ (ลบบนระบบตอนบันทึก) */
function trendRowZero(r){ return !r || (!(+r.total||0) && !(+r.done||0) && !(+r.doing||0)); }
function trendCloudKnown(){ return !(cloudOn && cloudUser) || window._trendCloud !== null; }
/* ข้อมูลหมู่บ้านโหลดจากระบบครบแล้วหรือยัง — ยังไม่ครบ ห้ามเก็บยอด (สาเหตุยอด Sep-26 เป็น 0) */
function trendDataReady(){
  if(!state || !(state.villages||[]).length) return false;
  if(cloudOn && cloudUser) return window._lastPullOk === true && trendCloudKnown();
  return true;
}
const trendSigOf = r=> [+r.total||0, +r.done||0, +r.doing||0, r.at||'', r.src||''].join('|');
function trendSaveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(B)); }catch(e){} }
/* แถวทั้งหมดในเครื่อง (ภาพรวม + ราย Vendor) ที่ส่งขึ้นระบบได้ */
function trendRowsFlat(){
  const out = [];
  Object.keys(B.trends||{}).forEach(scope=>{
    if(scope !== '_all' && !isUuid(scope)) return;
    (B.trends[scope]||[]).forEach(r=>{
      const ym = labelToYm(r.m); if(!ym || trendRowZero(r)) return;
      if(scope === '_all' && trendIsLegacy(r)) return;
      out.push({ scope, ym, total:+r.total||0, done:+r.done||0, doing:+r.doing||0, at:r.at||'', src:r.src||'' });
    });
  });
  return out;
}
/* ผลจากระบบ → ใส่ในเครื่อง (ของบนระบบเป็นหลัก) แล้วส่งเดือนที่มีแต่ในเครื่องขึ้นไป (เช่น เครื่องที่เคยบันทึกยอดถูกไว้) */
function trendCloudApply(res){
  if(!cloudOn || !cloudUser) return;
  if(!res || res.error){
    const e = res && res.error, m = String((e && (e.message||e.code)) || '');
    if(e && (e.code==='42P01' || e.code==='PGRST205' || /trend_months|does not exist|schema cache/i.test(m))) window._trendCloud = false;   /* ยังไม่ได้รัน SQL */
    return;                                                       /* เน็ตสะดุด → ยังไม่รู้ ลองใหม่รอบหน้า */
  }
  B.trends = B.trends || {};
  Object.keys(B.trends).forEach(k=>{ B.trends[k] = (B.trends[k]||[]).filter(r=> !trendRowZero(r)); });   /* ล้างแถว 0 */
  const have = {};
  (res.data||[]).forEach(x=>{
    if(!x || !x.scope || !x.ym) return;
    const arr = B.trends[x.scope] = B.trends[x.scope] || [];
    const val = { m:ymToLabel(x.ym), total:+x.total||0, done:+x.done||0, doing:+x.doing||0, at:x.at||'', src:x.src||'' };
    const ex = arr.find(r=> labelToYm(r.m) === x.ym);
    if(ex) Object.assign(ex, val); else arr.push(val);
    have[x.scope+'|'+x.ym] = trendSigOf(val);
  });
  Object.keys(B.trends).forEach(k=> trendSort(B.trends[k]));
  window._trendCloud = have;
  trendSaveLocal();
  if(canViewAll()) trendCloudSync();
}
/* ส่งแถวที่ต่างจากบนระบบขึ้นไป (เพิ่ม/แก้) + ลบแถวที่ผู้ใช้ลบเอง · แถวที่ไม่มีในเครื่องไม่ลบบนระบบ */
let _trendSyncP = null, _trendSyncAgain = false;
async function trendCloudSync(){
  if(!cloudOn || !cloudUser || !canViewAll() || !window._trendCloud) return true;
  if(_trendSyncP){ _trendSyncAgain = true; return _trendSyncP.then(()=> trendCloudSync()); }   /* กำลังส่งอยู่ → ส่งรอบใหม่ต่อท้าย (ไม่ทิ้งของที่เพิ่งแก้) */
  _trendSyncP = (async()=>{
    const have = window._trendCloud;
    const flat = trendRowsFlat();
    const put = flat.filter(r=> have[r.scope+'|'+r.ym] !== trendSigOf(r));
    const del = Object.keys(window._trendDel||{}).filter(k=> k in have && !flat.some(r=> r.scope+'|'+r.ym === k));
    let ok = true;
    for(let i=0; i<put.length; i+=200){
      const part = put.slice(i, i+200);
      let r; try{ r = await sb.rpc('trend_put', { rows: part }); }catch(e){ r = { error:e }; }
      if(!r || r.error){ ok = false; break; }
      part.forEach(x=>{ have[x.scope+'|'+x.ym] = trendSigOf(x); });
    }
    if(ok && del.length){
      let r; try{ r = await sb.rpc('trend_del', { keys: del.map(k=>{ const i = k.lastIndexOf('|'); return { scope:k.slice(0,i), ym:k.slice(i+1) }; }) }); }catch(e){ r = { error:e }; }
      if(r && !r.error){ del.forEach(k=>{ delete have[k]; delete window._trendDel[k]; }); } else ok = false;
    }
    return ok;
  })();
  try{ return await _trendSyncP; } finally { _trendSyncP = null; _trendSyncAgain = false; }
}
/* ===== เก็บยอดอัตโนมัติ — ทำเฉพาะช่วงปลายเดือน/ต้นเดือน (วันอื่นไม่ทำอะไร) =====
   1) 5 วันสุดท้ายของเดือน: ผู้ดูแล/Planning เปิดระบบวันไหน → เก็บยอด ณ วันนั้น (วันละครั้ง) · วันสุดท้ายที่มีคนเปิด = ยอดสิ้นเดือน
   2) 3 วันแรกของเดือนใหม่ → ใช้ยอดตอนนั้นปิดเดือนก่อน (ใกล้สิ้นเดือนที่สุด) ถ้าเดือนก่อนยังไม่มียอดวันสุดท้าย
   ไม่ทับตัวเลขที่กรอกเอง · ข้อมูลยังโหลดไม่ครบ = ไม่ทำ                                                      */
const TREND_END_DAYS = 5, TREND_START_DAYS = 3;     /* เก็บยอด: 5 วันสุดท้ายของเดือน · ปิดยอดเดือนก่อน: 3 วันแรก */
function trendAutoRecord(){
  if(!canViewAll() || !trendDataReady()) return '';
  const today = todayISO(), day = +today.slice(8,10);
  if(window._trendAutoDay === today) return '';
  const cur = thisYm(), prev = ymAdd(cur, -1);
  const lastDay = +ymLastDay(cur).slice(8,10);
  const endWin = day > lastDay - TREND_END_DAYS, startWin = day <= TREND_START_DAYS;
  if(!endWin && !startWin){ window._trendAutoDay = today; return ''; }   /* กลางเดือน → ไม่เก็บ */
  B.trends = B.trends || {};
  let changed = false, closed = '';
  const setRow = (key, ym, st)=>{
    const rows = B.trends[key] = B.trends[key] || [];
    const lb = ymToLabel(ym), val = { m:lb, total:st.total, done:st.done, doing:st.doing, at:today, src:'auto' };
    const r = rows.find(x=> labelToYm(x.m) === ym);
    if(r) Object.assign(r, val); else rows.push(val);
    trendSort(rows); changed = true;
  };
  const scopes = [['_all', state.villages]].concat(realVendors().map(vd=> [vd.id, villagesOfVendor(vd)]));
  scopes.forEach(([key, vil])=>{
    const st = trendAutoNow(vil);
    if(trendRowZero(st)) return;
    const rows = B.trends[key] || [];
    const find = ym=> rows.find(x=> labelToYm(x.m) === ym);
    if(prev >= TREND_START && startWin){
      const p = find(prev);
      if(!p || trendRowZero(p) || (p.src !== 'manual' && p.src !== 'seed' && (p.at||'') < ymLastDay(prev))){ setRow(key, prev, st); if(key === '_all') closed = ymToLabel(prev); }
    }
    if(cur >= TREND_START && endWin){
      const c = find(cur);
      if(!c || trendRowZero(c) || (c.src !== 'manual' && (c.at||'') < today)) setRow(key, cur, st);
    }
  });
  window._trendAutoDay = today;
  if(changed){ trendSaveLocal(); trendCloudSync(); }
  return closed || (changed ? 'cur' : '');
}
/* เดือนที่ขาดยอด (ตั้งแต่เริ่มเก็บจากระบบ ถึงเดือนก่อน) — แจ้งให้กรอกเอง */
function trendMissingMonths(){
  const have = new Set(trendMerged().filter(r=> !trendRowZero(r)).map(r=> labelToYm(r.m)));
  const out = [];
  for(let ym = TREND_START; ym < thisYm(); ym = ymAdd(ym, 1)) if(!have.has(ym)) out.push(ym);
  return out;
}
function trendSyncNow(){
  if(!requirePlanner('บันทึกข้อมูลกราฟ')) return;
  const ym = thisYm();
  if(ym < TREND_START){
    toast('เริ่มเก็บข้อมูลตั้งแต่ ' + ymToLabel(TREND_START) + ' เป็นต้นไป');
    return;
  }
  const lb = ymToLabel(ym);
  const isEnd = todayISO() === ymLastDay(ym);
  B.trends = B.trends || {};
  const put = (key, st)=>{
    B.trends[key] = B.trends[key] || [];
    const rows = B.trends[key];
    const r = rows.find(x=> x.m === lb || labelToYm(x.m) === ym);
    const at = todayISO();
    if(r){ r.m = lb; r.total = st.total; r.done = st.done; r.doing = st.doing; r.at = at; r.src = 'auto'; }
    else rows.push({ m: lb, total: st.total, done: st.done, doing: st.doing, at, src:'auto' });
    trendSort(rows);
  };
  if(!trendDataReady()){ toast('ข้อมูลยังโหลดไม่ครบ — รอสักครู่หรือกด 🔄 ซิงค์ ก่อน'); return; }
  if(canViewAll()){
    /* เก็บแยกทุกเจ้า — เลือกติ๊กแล้วรวมตัวเลขได้ถูกต้องทุกแบบ */
    realVendors().forEach(vd=> put(vd.id, trendAutoNow(villagesOfVendor(vd))));
    put('_all', trendAutoNow(state.villages));
  } else {
    put(trendKey(), trendAutoNow(visibleVillages()));
  }
  const now = trendAutoNow(dashScopeVillages());
  if(window._trendCloud){ trendSaveLocal(); trendCloudSync(); } else bqPersist();       /* บนระบบ: ส่งทันที */
  renderDash();
  toast('บันทึกยอดเดือน ' + lb + ' แล้ว · ต้องเดินสาย ' + fmt(now.total)
        + ' · เดินสายแล้ว ' + fmt(now.done) + ' · กำลังเดินสาย ' + fmt(now.doing)
        + (isEnd ? ' (วันสุดท้ายของเดือน)' : ''));
}
/* เรียงตามเดือนจริง ไม่ใช่ตามลำดับที่กรอก */
function trendSort(rows){
  rows.sort((a,b)=>{
    const A = labelToYm(a.m) || a.m, B2 = labelToYm(b.m) || b.m;
    return String(A).localeCompare(String(B2));
  });
  return rows;
}
/* เตือนให้บันทึกเมื่อถึงวันสุดท้ายของเดือนแล้วยังไม่ได้บันทึก */
function trendDueNote(){
  const ym = thisYm();
  if(ym < TREND_START) return '';
  const rows = trendList();
  const has = rows.some(r=> labelToYm(r.m) === ym);
  if(has) return '';
  const last = ymLastDay(ym);
  const left = Math.round((new Date(last+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
  if(left > 3) return '';

    · กด <b>อัปเดตเดือนล่าสุด</b></div>`;

/* แก้ตัวเลขรายเดือน — สร้างแถวให้เองถ้ายังไม่มี */
function loadTrendHistory(){
  if(!requirePlanner('ใส่ข้อมูลย้อนหลัง')) return;
  const already = TREND_SEED.filter(r=> (B.trends&&B.trends._all||[]).some(x=>x.m===r.m)).length;
  const msg = already
    ? 'มีข้อมูลย้อนหลังอยู่แล้ว ' + already + ' เดือน\n\nเขียนทับด้วยค่าตั้งต้น (Oct-25 → Aug-26)?\n(ค่าที่แก้ไว้เองจะหายไป)'
    : 'ใส่ข้อมูลย้อนหลัง 11 เดือน (Oct-25 → Aug-26)?\n\nจะแบ่งให้แต่ละ Vendor ตามสัดส่วนจำนวนบ้านที่รับผิดชอบ';
  if(!confirm(msg)) return;
  const n = seedTrendHistory(true);
  renderDash();
  toast('ใส่ข้อมูลย้อนหลัง ' + n + ' เดือนแล้ว' + (window._trendCloud ? ' · บันทึกขึ้นระบบแล้ว' : ' · กด 💾 บันทึก เพื่อส่งขึ้นระบบ'));
}
function trendSetMonth(ym, key, val){
  if(!requirePlanner('แก้ข้อมูลกราฟ')) return;
  const keys = trendKeys();
  if(keys.length > 1){
    toast('เลือก Vendor ทีละเจ้าก่อนแก้ตัวเลข (หรือกด "ทั้งหมด")');
    return;
  }
  if(keys[0]==='_all' && trendSubSums()[ym]){
    toast('เดือน ' + ymToLabel(ym) + ' ภาพรวมรวมจากยอดราย Sub อัตโนมัติ — เลือก Vendor แล้วแก้ที่เจ้านั้น');
    renderDash(); return;
  }
  B.trends = B.trends || {};
  B.trends[keys[0]] = B.trends[keys[0]] || [];
  const rows = B.trends[keys[0]];
  const lb = ymToLabel(ym);
  let r = rows.find(x=> labelToYm(x.m) === ym || x.m === lb);
  const num = String(val).trim()==='' ? null : (+val||0);
  if(num === null){
    if(r && key==='total' && !(+r.done) && !(+r.doing)){ rows.splice(rows.indexOf(r),1); window._trendDel[keys[0]+'|'+ym] = 1; }
    else if(r){ r[key] = 0; r.src = 'manual'; r.at = todayISO(); }
  } else {
    if(!r){ r = {m: lb, total:0, done:0, doing:0}; rows.push(r); }
    r.m = lb; r[key] = num; r.src = 'manual'; r.at = todayISO();      /* กรอกเอง = ระบบไม่เขียนทับ */
  }
  trendSort(rows);
  bqPersist();
  renderDash();
}
function trendDelMonth(ym){
  if(!requirePlanner('แก้ข้อมูลกราฟ')) return;
  const keys = trendKeys();
  if(keys.length > 1){ toast('เลือก Vendor ทีละเจ้าก่อนลบ'); return; }
  if(keys[0]==='_all' && trendSubSums()[ym]){ toast('เดือนนี้รวมจากยอดราย Sub — ลบที่ราย Vendor'); return; }
  B.trends = B.trends || {};
  const rows = B.trends[keys[0]] = B.trends[keys[0]] || [];
  const i = rows.findIndex(x=> labelToYm(x.m) === ym || x.m === ymToLabel(ym));
  if(i < 0) return;
  if(!confirm('ลบข้อมูลเดือน ' + ymToLabel(ym) + ' ?')) return;
  rows.splice(i,1); window._trendDel[keys[0]+'|'+ym] = 1;
  bqPersist(); renderDash();
  toast('ลบข้อมูลเดือน ' + ymToLabel(ym) + ' แล้ว');
}
/* ===== 🔍 ตรวจยอดรายเดือน: ยอดราย Sub · ผลรวม Sub · ภาพรวมที่บันทึกไว้ · การเปลี่ยนแปลงรายเดือน ===== */
function trendAuditRows(){
  B.trends = B.trends || {};
  const vds = realVendors(), sub = trendSubSums();
  const all = {}, legacy = {};
  (B.trends._all||[]).forEach(r=>{ const ym = labelToYm(r.m); if(!ym) return; (trendIsLegacy(r) ? legacy : all)[ym] = r; });
  const yms = new Set(Object.keys(sub).concat(Object.keys(all), Object.keys(legacy)));
  const per = {};
  vds.forEach(vd=> (B.trends[vd.id]||[]).forEach(r=>{ const ym = labelToYm(r.m); if(ym) (per[ym] = per[ym] || {})[vd.id] = r; }));
  const list = [...yms].sort().map(ym=>{
    const s = sub[ym] || null, a = all[ym] || null, lg = legacy[ym] || null;
    const use = s || a;
    return { ym, s, a, lg, use, per: per[ym] || {} };
  });
  /* เปลี่ยนจากเดือนก่อน + หาจุดกระโดด (เทียบค่ากลางของการเปลี่ยนแปลงรายเดือน) */
  let prev = null;
  list.forEach(x=>{
    x.dDone = (prev && x.use) ? (+x.use.done||0) - (+prev.done||0) : null;
    x.dTotal = (prev && x.use) ? (+x.use.total||0) - (+prev.total||0) : null;
    if(x.use) prev = x.use;
  });
  const ds = list.map(x=>Math.abs(x.dDone||0)).filter(v=>v>0).sort((a,b)=>a-b);
  const med = ds.length ? ds[Math.floor(ds.length/2)] : 0;
  list.forEach(x=>{
    x.jump = x.dDone!=null && (x.dDone < 0 || (Math.abs(x.dDone) > Math.max(100, med*4)));
    x.mismatch = !!(x.s && x.a && ((+x.a.done||0)!==(+x.s.done||0) || (+x.a.total||0)!==(+x.s.total||0)));
  });
  return { list, vds, med };
}

        <th class="r">ภาพรวมเดิม<br><small>เดินสายแล้ว / ทั้งหมด</small></th>
        <th class="r">เปลี่ยนจาก<br><small>เดือนก่อน</small></th><th>หมายเหตุ</th></tr>
      ${shown.slice().reverse().map(x=>{

        if(x.lg && !x.s) notes.push('<span style="color:var(--muted)">ค่าตั้งต้นชุดเก่า (ฐาน ~6,000 หลัง) — ไม่ใช้</span>');
        const live = x.ym===thisYm();
        return `<tr class="${x.jump?'audit-jump':''}">
          <td style="white-space:nowrap"><b>${esc(ymToLabel(x.ym))}</b>${live?' <small style="color:var(--green-dark)">● เดือนนี้</small>':''}</td>
          ${vds.map(vd=>{ const r = x.per[vd.id]; return `<td class="r num">${r?fmt(+r.done||0)+'<br><small style="color:var(--muted)">/'+fmt(+r.total||0)+'</small>':'<span style="color:var(--muted)">-</span>'}</td>`; }).join('')}
          <td class="r num">${x.s?`<b>${fmt(x.s.done)}</b> / ${fmt(x.s.total)}`:'<span style="color:var(--muted)">-</span>'}</td>

      <button class="btn btn-ghost btn-sm" onclick="trendAuditExport()">💾 Export ตารางนี้ (Excel)</button>

  if(!m){
    m = document.createElement('div'); m.className = 'modal-bg'; m.id = 'trendAuditModal';
    m.innerHTML = `<div class="modal" style="max-width:980px"><h2>🔍 ตรวจยอดเดินสายรายเดือน · อ้างอิงราย Sub</h2><div id="trendAuditBody"></div>
      <div class="modal-actions"><button class="btn btn-green" onclick="$('trendAuditModal').classList.remove('open')">ปิด</button></div></div>`;
    document.body.appendChild(m);
  }
  $('trendAuditBody').innerHTML = html;
  m.classList.add('open');

/* เขียนค่าภาพรวมที่บันทึกไว้ให้ตรงผลรวม Sub (เครื่องอื่น/ไฟล์ export เห็นตรงกัน) */
function trendAuditApply(){
  if(!requirePlanner('แก้ข้อมูลกราฟ')) return;
  const sub = trendSubSums();
  B.trends._all = B.trends._all || [];
  let n = 0;
  Object.keys(sub).forEach(ym=>{
    const s = sub[ym], rows = B.trends._all;
    const r = rows.find(x=> labelToYm(x.m) === ym);
    const val = { m:ymToLabel(ym), total:s.total, done:s.done, doing:s.doing, at:todayISO(), src:'manual' };
    if(!r){ rows.push(val); n++; }
    else if((+r.total||0)!==s.total || (+r.done||0)!==s.done || (+r.doing||0)!==s.doing){ Object.assign(r, val); n++; }
  });
  trendSort(B.trends._all);
  bqPersist(); renderDash(); openTrendAudit();
  toast('ปรับภาพรวมให้ตรงผลรวม Sub แล้ว ' + n + ' เดือน · กด 💾 บันทึก');
}
function trendAuditExport(){
  if(!needLib('XLSX')) return;
  const { list, vds } = trendAuditRows();
  const aoa = [['เดือน'].concat(vds.map(v=>v.name+' เดินสายแล้ว'), vds.map(v=>v.name+' ทั้งหมด'),
              ['รวม Sub เดินสายแล้ว','รวม Sub ทั้งหมด','ภาพรวมเดิม เดินสายแล้ว','ภาพรวมเดิม ทั้งหมด','เปลี่ยนจากเดือนก่อน','หมายเหตุ'])];
  list.filter(x=>x.use||x.lg).forEach(x=>{
    aoa.push([ymToLabel(x.ym)].concat(
      vds.map(v=> x.per[v.id] ? +x.per[v.id].done||0 : ''), vds.map(v=> x.per[v.id] ? +x.per[v.id].total||0 : ''),
      [x.s?x.s.done:'', x.s?x.s.total:'', x.a?+x.a.done||0:(x.lg?+x.lg.done||0:''), x.a?+x.a.total||0:(x.lg?+x.lg.total||0:''),
       x.dDone==null?'':x.dDone,
       [x.jump?'กระโดด':'', x.mismatch?'ภาพรวมเดิมไม่ตรง Sub':'', (!x.s&&x.a)?'ไม่มียอดราย Sub':'', (x.lg&&!x.s)?'ค่าตั้งต้นชุดเก่า ไม่ใช้':''].filter(Boolean).join(' · ')]));
  });
  const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = aoa[0].map((h,i)=>({wch: i===0?10:(i===aoa[0].length-1?36:14)}));
  XLSX.utils.book_append_sheet(wb, ws, 'ตรวจยอดรายเดือน');
  XLSX.writeFile(wb, 'ตรวจยอดเดินสายรายเดือน-'+todayISO()+'.xlsx');
}

  rows[i][key] = (key==='m') ? String(val) : (+val||0);

function trendAdd(){
  if(!requireAdmin('เพิ่มข้อมูลกราฟ')) return;
  const rows = trendList();
  const now = trendAutoNow(dashScopeVillages());
  rows.push({m:'', total:now.total, done:now.done});

function trendDel(i){
  if(!requireAdmin('ลบข้อมูลกราฟ')) return;
  const rows = trendList();
  const ym = rows[i] && labelToYm(rows[i].m); if(ym) window._trendDel[trendKey()+'|'+ym] = 1;

/* ===== ลูกค้า Active รายหมู่บ้าน (อ้างอิงเดือนล่าสุดของข้อมูลความคุ้มทุนที่นำเข้า) =====
   ติดตามตาม VLC: หมู่บ้านหลาย VLC = รวมทุก VLC · VLC เดียวกันหลายเฟส = ยอดเดียวกัน แสดงทุกเฟส แต่แถวรวมนับครั้งเดียว */
/* Planning เห็นได้แค่จำนวนลูกค้า + VLC — ไม่มีค่าแพ็คเกจ/รายได้ */
function roiStripForPlanning(r){
  if(!r || typeof r!=='object') return null;
  const o = {};
  if(r.cust) o.cust = r.cust;
  if(r.custVlc) o.custVlc = r.custVlc;
  if(r.vlcExtra) o.vlcExtra = r.vlcExtra;
  return o;
}
/* ล้างข้อมูลความคุ้มทุนที่ค้างในเครื่อง (จากเวอร์ชันเก่า) ตามสิทธิ์ปัจจุบัน */
function roiSanitizeForRole(){
  if(!session || !session.role || isAdmin()) return;
  (state.villages||[]).forEach(v=>{
    if(!v || !v.roi) return;
    v.roi = canViewAll() ? roiStripForPlanning(v.roi) : null;
  });
}
function dashActiveIndex(){
  const idx = {}, units = [];
  let latest = '';
  roiUnits().forEach(u=>{
    const c = roiUnitCust(u);
    const ms = Object.keys(c).filter(k=>ROI_MON.test(k)).sort();
    if(!ms.length) return;
    const m = ms[ms.length-1], n = +c[m]||0;
    if(m > latest) latest = m;
    units.push({ u, n, m });
    u.villages.forEach(v=>{
      const o = idx[v.id] = idx[v.id] || { n:0, m:'', shared:0 };
      o.n += n; if(m > o.m) o.m = m;
      if(u.villages.length > 1) o.shared = Math.max(o.shared, u.villages.length);
    });
  });
  if(!units.length) return null;
  return { idx, units, latest };
}
function dashActiveCell(A, v, done){
  const o = A.idx[v.id];
  if(!o) return `<td class="r num c-n" data-l="ลูกค้า Active"><span style="color:var(--muted)">-</span></td>`;
  const old = o.m && o.m < A.latest;
  const sub = o.shared
    ? `ร่วม ${o.shared} เฟส`
    : (done ? '('+Math.round(o.n/done*100)+'%)' : '');
  return `<td class="r num c-n" data-l="ลูกค้า Active" title="ข้อมูลเดือน ${esc(thMonth(o.m))}${old?' (เก่ากว่าเดือนล่าสุด)':''} · % = ลูกค้า Active ÷ เดินสายแล้ว${o.shared?' · ยอดของ VLC ที่ใช้ร่วม '+o.shared+' เฟส':''}"><b style="color:#1F5F99">${fmt(o.n)}</b>
${sub?` <small class="act-sub">${sub}</small>`:''}${old?` <small class="act-old">${esc(thMonth(o.m))}</small>`:''}</td>`;
}
/* แถวรวม: นับแต่ละ VLC ครั้งเดียว แม้หลายเฟสจะแสดงยอดเดียวกัน */
function dashActiveTotal(A, rows){
  const ids = new Set(rows.map(v=>v.id));
  let n = 0;
  A.units.forEach(x=>{ if(x.u.villages.some(v=> ids.has(v.id))) n += x.n; });
  return { n };
}
function renderDash(){
  /* ครั้งแรกที่เปิด — ใส่ข้อมูลย้อนหลังให้เอง (ไม่ทับของที่มีอยู่) */

  if(canViewAll() && !window._seededTrend && trendCloudKnown()){
    window._seededTrend = true;
    try{ seedTrendHistory(false); }catch(e){}
  }
  /* เก็บยอดเดือนนี้/ปิดยอดเดือนก่อน อัตโนมัติ — ทำเมื่อโหลดข้อมูลจริงครบแล้วเท่านั้น (กันยอด 0) */

  if(canViewAll() && realVendors().length){
    const sel = dashVendorsSel();
    fv = sel.length===1 ? sel[0] : null;      /* PO ใช้ได้เมื่อเลือกเจ้าเดียว */
    if(sel.length){
      vil = vil.filter(inDashVendors);
      vil = sortVillages(vil);   /* เรียงตามวันเดินสายล่าสุด — ใหม่สุดอยู่บน */
      const ids = new Set(vil.map(v=>v.id));
      const sid = new Set(sel.map(x=>x.id));
      jobs = jobs.filter(j=> sid.has(j.vendorId) || ids.has(j.villageId));
    }
    const nSel = sel.length;
    filterBar = `<div class="filter-bar">
      <div class="vpick-row">
        <span class="unit-count" style="min-width:52px">👷 Vendor</span>
        ${(()=>{ const total = realVendors().length;
          const allOn = nSel===0 || nSel===total;      /* ไม่เลือกเลย = เห็นทุกเจ้าอยู่แล้ว */
          return `<button class="vpick ${allOn?'on':''}" onclick="dashClearVendors()"
            title="${nSel===total&&total?'กดเพื่อเอาออกทั้งหมด':'กดเพื่อติ๊กทุกเจ้า แล้วไล่กดออกทีละเจ้าได้'}">
            <i class="vbox">${allOn?'✓':''}</i>ทั้งหมด</button>`; })()}
        ${realVendors().map(x=>{
          const on = dashVendorIds().indexOf(x.id)>=0;
          const cnt = visibleVillages().filter(v=> v.vendorId===x.id || String(v.contractor||'').trim()===String(x.name).trim()).length;
          return `<button class="vpick ${on?'on':''}" onclick="dashToggleVendor('${x.id}')" title="ติ๊กเลือกได้หลายเจ้าพร้อมกัน">
            <i class="vbox">${on?'✓':''}</i>${esc(x.name)} <b>${cnt}</b></button>`;
        }).join('')}
        ${(()=>{ const total = realVendors().length;
          if(nSel===0) return `<span class="vpick-note">แสดงทุกเจ้า · กด "ทั้งหมด" เพื่อติ๊กแล้วไล่เอาออก</span>`;
          if(nSel===total) return `<span class="vpick-note">ติ๊กครบ ${total} เจ้า · กดเจ้าไหนเพื่อเอาออกได้</span>`;
          if(nSel>1) return `<span class="vpick-note">เลือก ${nSel} จาก ${total} เจ้า · รวมข้อมูลให้แล้ว</span>`;
          return '';
        })()}
      </div>`;
    if(fv && (B.pos||[]).length){
      const myPos = B.pos.filter(p=> poJobs(p.id).some(j=> j.vendorId===fv.id));
      if(ui.dashPO && !myPos.some(p=>p.id===ui.dashPO)) ui.dashPO = null;
      if(ui.dashPO){
        const vids = new Set(poJobs(ui.dashPO).filter(j=>j.vendorId===fv.id).map(j=>j.villageId));
        vil = vil.filter(v=> vids.has(v.id));
        jobs = jobs.filter(j=> j.poId===ui.dashPO);
      }
      filterBar += myPos.length
        ? `<div class="unit-toolbar" style="margin:8px 0 0">
             <span class="unit-count" style="min-width:52px">📄 PO</span>
             <select class="vfilter" onchange="dashPickPO(this.value)">
               <option value="">📄 ทุก PO (${myPos.length} ใบ)</option>
               ${myPos.map(p=>{
                  const cnt = poJobs(p.id).filter(j=>j.vendorId===fv.id).length;
                  return `<option value="${p.id}" ${ui.dashPO===p.id?'selected':''}>${esc(p.code||p.name)}${p.amount?' · วงเงิน '+fmt(p.amount)+' ฿':''} · ${cnt} โครงการ</option>`;
                }).join('')}
             </select>
             ${ui.dashPO?`<button class="btn btn-ghost btn-sm" onclick="dashPickPO('')">✕ ล้าง</button>`:''}
           </div>`
        : `<div class="unit-count" style="margin-top:8px">— ${esc(fv.name)} ยังไม่มีงานผูกกับ PO —</div>`;
    } else if(!fv && (B.pos||[]).length){
      filterBar += `<div class="unit-count" style="margin-top:8px">เลือก Vendor ก่อน เพื่อกรองตาม PO</div>`;
    }
    filterBar += `</div>`;
  }
  const n = vil.length;
  const done = vil.filter(v=>overall(v)>=100).length;
  const doing = vil.filter(v=>{const p=overall(v);return p>0&&p<100;}).length;
  const avg = n ? Math.round(vil.reduce((s,v)=>s+overall(v),0)/n) : 0;
  const closedList = vil.filter(isClosed);
  const closedN = closedList.length;
  const closedBudget = closedList.reduce((s,v)=>s+(+v.builtBudget||0),0);
  const closedHomes  = closedList.reduce((s,v)=>s+(+v.builtHomes||0),0);
  const closedOpenH  = closedList.reduce((s,v)=>s+(+v.openHomes||0),0);
  const closedPlanB  = closedList.reduce((s,v)=>s+(+v.planBudget||0),0);
  const ports = vil.reduce((s,v)=>s+(+v.ports||0),0);
  const homes = vil.reduce((s,v)=>s+(+v.homesDone||0),0);
  const po = jobs.reduce((s,j)=>s+jobBudget(j),0);
  const built = jobs.reduce((s,j)=>s+jobCost(j),0);
  const overPo = po && built > po;

  let vendorTable = '';
  const vendorsForTable = fv ? [fv] : realVendors();
  if(canViewAll() && vendorsForTable.length){
    vendorTable = `
    ${secCap('แยกราย Vendor'+(fv?' · '+esc(fv.name):'')+(ui.dashPO?' · '+esc((poById(ui.dashPO)||{}).code||''):''), 'secVendorTbl')}
    <div class="panel" id="secVendorTbl"><div class="tbl-scroll">
      <table class="sum">
        <tr><th>Vendor</th><th class="r">จำนวนงาน</th><th class="r">งาน %</th><th class="r">เดินสาย (หลัง)</th><th class="r">เดินสายแล้ว (หลัง)</th><th class="r">ค่างานสร้าง</th><th class="r">งบ PO</th><th class="r">คงเหลือ</th></tr>
        ${vendorsForTable.map(vd=>{
          const vv = vil.filter(x=>x.vendorId===vd.id || (x.contractor||'').trim()===vd.name.trim());
          const vvIds = new Set(vv.map(x=>x.id));
          const jj = jobs.filter(j=>j.vendorId===vd.id && (!j.villageId || vvIds.has(j.villageId)));
          const a = vv.length ? Math.round(vv.reduce((s,x)=>s+overall(x),0)/vv.length) : 0;
          const h = vv.reduce((s,x)=>s+(+x.homesDone||0),0);
          const pt = vv.reduce((s,x)=>s+targetHomes(x),0);
          const c = jj.reduce((s,j)=>s+jobCost(j),0);
          const b = jj.reduce((s,j)=>s+jobBudget(j),0);
          const d = b - c;
          const doneN = vv.filter(x=>overall(x)>=100).length;
          return `<tr style="cursor:pointer" title="กดเพื่อดูเฉพาะ ${esc(vd.name)}" onclick="ui.dashVendors=['${vd.id}'];ui.dashVendor='${vd.id}';ui.dashPO=null;renderDash();renderHeader()">
            <td>${esc(vd.name)}</td>
            <td class="r"><b>${vv.length}</b>${doneN?` <small style="color:var(--muted)">(เสร็จ ${doneN})</small>`:''}</td>
            <td class="r">${a}%</td><td class="r">${pt||'-'}</td><td class="r"><b>${h}</b></td>
            <td class="r">${fmt(c)}</td><td class="r">${fmt(b)}</td>
            <td class="r money ${d<0?'neg':'pos'}">${fmt(d)}</td></tr>`;
        }).join('')}
      </table>
    </div></div>`;
  }

  /* ลูกค้า active จากข้อมูลความคุ้มทุน — เห็นเฉพาะผู้ดูแลและ AIS Planning */
  roiSanitizeForRole();
  const ACT = canViewAll() ? dashActiveIndex() : null;
  window._dashVil = vil; window._dashACT = ACT;
  $('modeDash').innerHTML = filterBar + `
  ${secCap('1 · ภาพรวมงานสรุป'+(()=>{ if(!canViewAll()) return '';
      const sv = dashVendorsSel();
      if(!sv.length) return '';
      return ' · ' + esc(sv.length<=2 ? sv.map(x=>x.name).join(' + ') : sv.length+' Vendor');
    })(), 'secSummary')}
  <div class="panel" id="secSummary">
    <div style="display:flex;align-items:baseline;gap:10px">
      <b style="font-family:'Taviraj',serif;font-size:42px;color:var(--forest);line-height:1">${avg}%</b>
      <span style="font-size:13px;color:var(--muted)">ความคืบหน้าเฉลี่ย ${n} หมู่บ้าน</span>
    </div>
    <div class="bar" style="margin-top:10px"><i style="width:${avg}%"></i></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <span class="chip idle">ยังไม่เริ่ม ${n-doing-done}</span>
      <span class="chip doing">กำลังดำเนินการ ${doing}</span>
      <span class="chip done">ส่งมอบแล้ว ${Math.max(0,done-closedN)}</span>
      ${closedN?`<span class="chip closed">✔ ปิดโครงการ ${closedN}</span>`:''}
    </div>
    ${closedN?`<div style="font-size:12.5px;color:var(--green-dark);margin-top:8px;font-weight:600">ปิดแล้ว ${closedN} โครงการ · บ้าน ${fmt(closedHomes)}/${fmt(closedOpenH)} หลัง · งบใช้ ${fmt(closedBudget)}/${fmt(closedPlanB)} ฿ · ${closedBudget<=closedPlanB?'ประหยัด '+fmt(closedPlanB-closedBudget):'เกิน '+fmt(closedBudget-closedPlanB)} ฿</div>`:''}
  </div>

  ${secCap('2 · ความเคลื่อนไหวรายเดือน (หลัง)', 'trendChartBox')}
  <div id="trendChartBox">${trendChartHTML(vil)}</div>
  ${canViewAll()?trendDueNote():''}
  ${canViewAll()?trendEditHTML():''}

  ${secCap('3 · เดินสายเข้าบ้านสำเร็จ', 'secHomes')}
  <div class="panel" id="secHomes">
    <div style="display:flex;align-items:baseline;gap:10px">
      <b style="font-family:'Taviraj',serif;font-size:42px;color:var(--forest);line-height:1">${homes}</b>
      <span style="font-size:13px;color:var(--muted)">หลัง ${ports?'จากทั้งหมด '+ports+' หลัง ('+Math.round(homes/ports*100)+'%)':''}</span>
    </div>
    ${ports?`<div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,Math.round(homes/ports*100))}%"></i></div>`:''}
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px">กรอกจำนวนหลังที่สำเร็จได้ในหน้าหมู่บ้านแต่ละแห่ง (ช่อง "เดินสายเข้าบ้านสำเร็จ")</div>
  </div>

  ${secCap('4 · งบประมาณ · ข้อมูลภายใน', 'secBudget')}
  <div id="secBudget">
  <div class="kpis">
    <div class="kpi"><span class="lbl">งบใน PO</span><b>${fmt(po)} ฿</b><small>${jobs.length} งาน BOQ</small></div>
    <div class="kpi"><span class="lbl">งบที่สร้างงานไปแล้ว</span><b style="color:${overPo?'var(--red)':'var(--forest)'}">${fmt(built)} ฿</b><small class="${overPo?'neg':'pos'}" style="font-weight:700">${po? (overPo?'เกิน PO '+fmt(built-po):'คงเหลือ '+fmt(po-built))+' ฿':''}</small></div>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)"><span>เบิกใช้จาก PO</span><span>${po?Math.round(built/po*100)+'%':'-'}</span></div>
    <div class="budget-bar"><i class="${overPo?'over':''}" style="width:${po?Math.min(100,built/po*100):0}%"></i></div>
  </div>
  </div>
  ${vendorTable}
  ${staleChipsHTML(vil)}
  ${secCap('รายหมู่บ้าน'+(ui.staleFilter?(ui.staleFilter==='late'?' · ค้างเกิน 6 เดือน':' · ค้างเกิน 3 เดือน'):'ทั้งหมด')+' <span id="dashVilN">('+dashFilter(vil).length+')</span>', 'secVillageTbl')}
  ${vilSearchBox('dashVilQ', ui.dashQ, 'dashSearch')}
  <div id="dashVilWrap">${dashVilTblHTML(vil, ACT)}</div>`;
}

/* ===== ค้นหาโครงการ (ใช้ร่วมทุกหน้า) — ชื่อหมู่บ้าน / Vendor / รหัส / VLC · ไม่สนเว้นวรรค ตัวเล็กใหญ่ ===== */
function vilQMatch(v, q){
  const qq = normName(q||'').toLowerCase().replace(/\s+/g,'');
  if(!qq) return true;
  const hay = [v && v.name, v && v.contractor, v && v.code].concat((()=>{ try{ return villageVLCs(v)||[]; }catch(e){ return []; } })())
    .map(x=> normName(x||'').toLowerCase().replace(/\s+/g,'')).join('|');
  return hay.indexOf(qq) >= 0;
}
/* ช่องค้นหา: พิมพ์แล้ววาดใหม่เฉพาะรายการ (ไม่วาดทั้งหน้า → ไม่ช้า ช่องพิมพ์ไม่หลุด) */
function vilSearchBox(id, val, fn, ph){
  return `<input class="search" id="${id}" placeholder="🔍 ${ph||'ค้นหาโครงการ / Vendor / VLC...'}" value="${esc(val||'')}" oninput="clearTimeout(window._qT);const _v=this.value;window._qT=setTimeout(()=>${fn}(_v),180)" style="margin-bottom:10px">`;
}
/* Dashboard: ตารางรายหมู่บ้าน */
function dashFilter(list){ return staleApply(list).filter(v=> vilQMatch(v, ui.dashQ)); }
function dashSearch(q){ ui.dashQ = q; const vil = window._dashVil||[];
  const w = document.getElementById('dashVilWrap'); if(w) w.innerHTML = dashVilTblHTML(vil, window._dashACT||null);
  const n = document.getElementById('dashVilN'); if(n) n.textContent = '('+dashFilter(vil).length+')'; }
function dashVilTblHTML(vil, ACT){
  return `<div class="panel" id="secVillageTbl"><div class="tbl-scroll tbl-sticky">
    <table class="sum">
      <tr>
        <th>หมู่บ้าน<br><small style="font-weight:500;opacity:.75">% · เดินสายเพิ่มล่าสุด</small></th>
        <th class="r c-n">ต้อง<br>เดินสาย</th><th class="r c-n">เดินสาย<br>แล้ว</th>
        ${ACT?`<th class="r c-n" title="จำนวนลูกค้า active จากข้อมูลความคุ้มทุนที่นำเข้า (เดือนล่าสุด) · (%) = เทียบกับบ้านที่เดินสายแล้ว">ลูกค้า<br>Active${ACT.latest?`<br><small style="font-weight:500;opacity:.75">${esc(thMonth(ACT.latest))}</small>`:''}</th>`:''}
        <th class="r c-n">คง<br>เหลือ</th>
        <th class="r c-m">งบ<br>โครงการ</th><th class="r c-m">ใช้ไป<br>แล้ว</th><th class="r c-m">งบ<br>คงเหลือ</th>
      </tr>
      ${sortVillages(dashFilter(vil)).map(v=>{
        const p = overall(v);
        const jj = villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId);
        const b = villageBudget(v);
        const c = villageCost(v);
        const poNm = jj.length ? jobPOName(jj[0]) : '';
        const ports = targetHomes(v), done = +v.homesDone||0;
        const left = Math.max(0, ports - done), bLeft = b ? b-c : 0;
        const cl = isClosed(v);
        return `<tr class="${cl?'closed-row':''}">
          <td class="vname"><div class="vline">
            <span class="vnm">${cl?'✔ ':''}<a class="vlink" href="javascript:void(0)" onclick="gotoUnit('${v.id}')"
              title="เปิดตาราง Unit ของ ${esc(v.name)}">${esc(v.name)}</a>${portsWarn(v)}</span>
            <b class="vpct" style="color:${p>=100?'var(--green-dark)':(p>=50?'var(--forest)':'var(--amber-dk)')}">${p}%</b>
            ${unitHomes(v) && unitHomes(v)!==ports ? `<span class="vdim" title="จำนวนหลังในตาราง Unit">ในระบบ ${unitHomes(v)}</span>` : ''}
            <span class="vdate">${staleClock(v)}</span>
          </div></td>
          <td class="r num c-n" data-l="ต้องเดินสาย">${ports||'-'}</td>
          <td class="r num c-n" data-l="เดินสายแล้ว" style="color:var(--green-dark)"><b>${done}</b></td>
          ${ACT?dashActiveCell(ACT, v, done):''}
          <td class="r num c-n" data-l="คงเหลือ" style="color:${left>0?'var(--amber-dk)':'var(--muted)'}">${ports?left:'-'}</td>
          <td class="r num c-m" data-l="งบโครงการ">${b?fmt(b):'-'}</td>
          <td class="r num c-m" data-l="ใช้ไปแล้ว">${c?fmt(c):'-'}</td>
          <td class="r num c-m ${b&&bLeft<0?'neg':'pos'}" data-l="งบคงเหลือ">${b?fmt(bLeft):'-'}</td>
        </tr>`;
      }).join('') || `<tr><td colspan="${ACT?8:7}" style="color:var(--muted)">${ui.dashQ?'ไม่พบโครงการที่ตรงกับคำค้น':'ยังไม่มีหมู่บ้าน'}</td></tr>`}
      ${(()=>{
        const rows = dashFilter(vil);              /* ต้องตรงกับแถวที่แสดงจริง */
        if(!rows.length) return '';
        const sNeed = rows.reduce((a,v)=>a+targetHomes(v),0);
        const sDone = rows.reduce((a,v)=>a+(+v.homesDone||0),0);
        const sLeft = rows.reduce((a,v)=>a+Math.max(0, targetHomes(v)-(+v.homesDone||0)),0);
        const sB = rows.reduce((a,v)=>a+villageBudget(v),0);
        const sC = rows.reduce((a,v)=>a+villageCost(v),0);
        const sPct = Math.round(rows.reduce((a,v)=>a+overall(v),0)/rows.length);
        return `<tr style="border-top:2px solid var(--forest)">
        <td class="vname"><div class="vline"><b>รวม ${rows.length} โครงการ</b>
          <b class="vpct" style="color:var(--forest)">${sPct}%</b>
          <span class="vdim">เฉลี่ย · ในระบบ ${fmt(rows.reduce((a,v)=>a+unitHomes(v),0))} หลัง</span></div></td>
        <td class="r num" data-l="ต้องเดินสาย"><b>${fmt(sNeed)}</b></td>
        <td class="r num" data-l="เดินสายแล้ว" style="color:var(--green-dark)"><b>${fmt(sDone)}</b></td>
        ${ACT?(()=>{ const t = dashActiveTotal(ACT, rows);
          return `<td class="r num c-n" data-l="ลูกค้า Active"><b>${t.n?fmt(t.n):'-'}</b>${t.n&&sDone?` <small class="act-sub">(${Math.round(t.n/sDone*100)}%)</small>`:''}</td>`; })():''}
        <td class="r num" data-l="คงเหลือ"><b>${fmt(sLeft)}</b></td>
        <td class="r num" data-l="งบโครงการ"><b>${sB?fmt(sB):'-'}</b></td>
        <td class="r num" data-l="ใช้ไปแล้ว"><b>${sC?fmt(sC):'-'}</b></td>
        <td class="r num ${sB&&(sB-sC)<0?'neg':'pos'}" data-l="งบคงเหลือ"><b>${sB?fmt(sB-sC):'-'}</b></td>
      </tr>`;
      })()}
    </table>
  </div></div>`;
}

</script>
</body>
</html>
