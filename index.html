/* ---------- Excel: นำเข้า/ส่งออกข้อมูลความคุ้มทุน ---------- */
function roiParseMonth(x){
  if(x==null) return null;
  if(x instanceof Date) return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
  const t = String(x).trim();
  let m = /^(\d{4})[-\/](\d{1,2})$/.exec(t);                    // 2017-01 · 2017/1
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0');
  m = /^(\d{1,2})[-\/](\d{4})$/.exec(t);                        // 01-2017
  if(m) return m[2]+'-'+String(+m[1]).padStart(2,'0');
  m = /^(\d{4})(\d{2})$/.exec(t);                               // 201701
  if(m) return m[1]+'-'+m[2];
  const d = new Date(t);
  if(!isNaN(d.getTime()) && /\d{4}/.test(t)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return null;
}
function importRoiExcel(ev){
  const f = ev.target.files[0]; if(!f){ return; }
  if(!requireAdmin('นำเข้าข้อมูลความคุ้มทุน')){ ev.target.value=''; return; }
  /* แบบใหม่: ต้องมีข้อมูลครบ + เลข Non ก่อน (ใช้เทียบ/คงข้อมูลเดิม) */
  if(roiCloudPending() || roiNeedsLoad(true)){
    /* ล้างช่องเลือกไฟล์ทันที (โหลดไม่สำเร็จ → เลือกไฟล์เดิมซ้ำได้) แล้วค่อยนำเข้าเมื่อพร้อม */
    try{ ev.target.value = ''; }catch(e){}
    roiWhenReady(true, ()=> importRoiExcel({ target:{ files:[f], value:'' } })); return; }
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      /* อ่านทุกชีตที่ใช้ได้ (ไฟล์ฟอร์มมี 2 ชีต: ลูกค้ารายเดือน + แพ็คเกจรายเดือน)
         · แบบกว้าง: (VLC | โครงการ) | ค่าแพ็คเกจเฉลี่ย | 2017-01 | 2017-02 ...   → จำนวนลูกค้ารวมรายเดือน
         · แบบยาว:   (VLC | โครงการ) | เดือน | [แพ็คเกจ] | [ราคา] | จำนวนลูกค้า   → มีราคา = ข้อมูลแพ็คเกจ (หลายแถวต่อเดือนได้) */
      const sheets = [], skippedSheets = [];
      for(const sn of wb.SheetNames){
        if(/เปลี่ยนแปลง|รายได้|สรุป|วิธีกรอก|ต้นทุน|เทียบ/.test(sn)) continue;         /* ชีตสูตร/สรุป — ไม่ใช่ข้อมูลกรอก */
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
        if(rows.length<2) continue;
        /* เลข Non แบบคอลัมน์ละหมู่บ้าน: คอลัมน์ A มีป้าย "VLC" และ "Non Mobile ..." ใน 8 แถวแรก */
        const labA = rows.slice(0,12).map(r=> String((r||[])[0]==null?'':(r||[])[0]).trim());
        const rVlcT = labA.findIndex(x=>/^vlc$/i.test(x)), rNonT = labA.findIndex(x=>/non\s*mobile/i.test(x));
        if(rVlcT>=0 && rNonT>rVlcT){
          const rNameT = labA.findIndex(x=>/ชื่อหมู่บ้าน|โครงการ|หมู่บ้าน/.test(x));
          sheets.push({ sn, rows, nonCols:true, rName:rNameT, rVlc:rVlcT, rStart:rNonT+1, iName:0, iVlc:1, ord:3 });
          continue;
        }
        const h = (rows[0]||[]).map(x=>String(x==null?'':x).trim());
        const iName = h.findIndex(x=>/โครงการ|หมู่บ้าน|village/i.test(x) && x!=='รหัสโครงการ');
        const iVlc  = h.findIndex(x=>/(^|[^a-z])vlc([^a-z]|$)/i.test(x));
        if(iName<0 && iVlc<0) continue;
        /* รายชื่อเลข Non Mobile Number: แถวละ 1 ลูกค้า */
        const iNon = h.findIndex(x=>/non.?mobile|non.?number|^non$|เลข\s*non|เลขลูกค้า|เลขที่ลูกค้า|account/i.test(x));
        if(iNon>=0){
          sheets.push({ sn, rows, h, iName, iVlc, iNon, nonSheet:true, ord:3,
            iPkg: h.findIndex(x=>/แพ็?คเกจ|package/i.test(x)), iPrice: h.findIndex(x=>/ราคา|price/i.test(x)),
            iHouse: h.findIndex(x=>/บ้านเลขที่|เลขที่บ้าน|house/i.test(x)) });
          continue;
        }
        /* แพ็คเกจปัจจุบันแบบกว้าง: มีแถว "ราคา" ใต้หัวคอลัมน์ (แถว 2-3) */
        let iPriceRow = [1,2].find(r=> rows[r] && (rows[r]||[]).slice(0,3).some(x=>/ราคา|price/i.test(String(x||''))));
        /* ชีตแพ็คเกจปัจจุบัน (ชื่อชีต/หัวคอลัมน์ของฟอร์ม) แต่แถวราคาหาย เช่น วางข้อมูลทับแถว 2 → ใช้ราคาจากชื่อแพ็ค */
        const mixLike = /แพ็?คเกจปัจจุบัน/.test(sn) || h.some(x=> x===ROI_MIX_AVG_HEAD || /ลูกค้าเดือนล่าสุด\s*\(อ้างอิง\)/.test(x));
        if(iPriceRow!=null || mixLike){
          /* ชีตแพ็คเกจที่เป็นสูตรอัตโนมัติ (นับจากชีตเลข Non) → ไม่อ่าน (ระบบนับจากเลข Non เอง) */
          const wsM = wb.Sheets[sn];
          if(Object.keys(wsM).some(k=> k[0]!=='!' && wsM[k] && typeof wsM[k].f==='string' && wsM[k].f.indexOf(ROI_SH.non)>=0 && /COUNTIF/i.test(wsM[k].f))){
            skippedSheets.push(sn+' (อัตโนมัติ)'); continue;
          }
          const pr = iPriceRow!=null ? rows[iPriceRow] : [];
          const pcols = h.map((x,i)=>{
                           const raw = String(pr[i]==null?'':pr[i]).replace(/[,\s฿]/g,'');
                           let p = raw==='' ? NaN : +raw;                 /* ใส่ 0 = แพ็ค 0 ฿ (ใช้ได้) · ว่าง = ไม่มีราคา */
                           if(!(p>=0)) p = roiPriceFromName(x);           /* ช่องราคาว่าง → ดูราคาในชื่อแพ็ค เช่น "499 ฿" */
                           return { i, k: (roiIsPriceName(x) && p>=0) ? roiStdPackName(p) : x, p };
                         })
                         .filter(c=> c.i!==iName && c.i!==iVlc && c.k && !/อ้างอิง|รวม|total|^olt$|เพิ่ม\/ลด|เฉลี่ย|สูตร/i.test(c.k));
          sheets.push({ sn, rows, h, iName, iVlc, mixWide:true, pcols, start:(iPriceRow!=null ? iPriceRow+1 : 1), noPriceRow: iPriceRow==null, ord:1 });
          continue;
        }
        const iMon  = h.findIndex(x=>/^เดือน$|^month$/i.test(x));
        const iCust = h.findIndex(x=>/^จำนวนลูกค้า|^ลูกค้า$|^จำนวนคน|customer|subscriber|^จำนวน$/i.test(x));
        const iPrice= h.findIndex(x=>/ราคา|price|arpu|ค่าบริการ|ค่าแพ็ค/i.test(x));
        const iPkg  = h.findIndex((x,i)=> i!==iPrice && /แพ็?คเกจ|package|^แพ็?ค/i.test(x));
        const long = iMon>=0 && iCust>=0;
        const hasMonthCols = h.some((x,i)=> i!==iName && i!==iVlc && roiParseMonth(x));
        /* แพ็คเกจปัจจุบัน: แพ็คเกจ/ราคา + จำนวนลูกค้า แต่ไม่มีคอลัมน์เดือน */
        const mix = !long && !hasMonthCols && iCust>=0 && (iPrice>=0 || iPkg>=0);
        if(long || hasMonthCols || mix) sheets.push({ sn, rows, h, iName, iVlc, iMon, iCust, iPrice, iPkg, long, mix, ord: hasMonthCols?0:(mix?1:2) });
        else skippedSheets.push(sn);
      }
      if(!sheets.length){ toast('ไม่พบชีตที่มีคอลัมน์ โครงการ หรือ VLC + คอลัมน์เดือน (เช่น 2017-01) หรือ เดือน+จำนวนลูกค้า'); ev.target.value=''; return; }
      let notFound=[], cells=0, byVlc=0, packRows=0, packSkipped=[];
      /* หาเป้าหมายของแถว:
         VLC เดียว → หน่วย VLC (ทุกเฟสที่ใช้ VLC นี้)
         ไม่มี VLC → ชื่อโครงการ: VLC เดียว = หน่วย VLC · ไม่มี VLC = หมู่บ้าน · หลาย VLC = ข้อมูลรวมเดิม */
      const resolve = (S,row)=>{
        const vlcRaw = S.iVlc>=0 ? String(row[S.iVlc]||'').trim() : '';
        const nm = S.iName>=0 ? String(row[S.iName]||'').trim() : '';
        if(vlcRaw){
          const codes = vlcRaw.split(/[,;\s]+/).map(vlcClean).filter((x,i,arr)=> x && arr.indexOf(x)===i);
          if(codes.length===1 && villageByVLC(codes[0]).length) return { kind:'vlc', code:codes[0], key:'vlc:'+codes[0] };
          if(codes.length>1){
            const vs = []; codes.forEach(cd=> villageByVLC(cd).forEach(v=>{ if(vs.indexOf(v)<0) vs.push(v); }));
            if(vs.length===1) return { kind:'legacy', v:vs[0], key:'lg:'+vs[0].id, sub:codes.join('+') };
            if(vs.length>1){ const lab = 'VLC '+vlcRaw+' อยู่หลายโครงการ ('+vs.map(v=>v.name).join(' / ')+') — แยกแถวละ VLC'; if(notFound.indexOf(lab)<0) notFound.push(lab); return null; }
          }
        }
        if(nm && !vlcRaw){
          const v = findVillageByName(nm);
          if(v){
            const cs = villageVLCs(v);
            if(cs.length===1) return { kind:'vlc', code:cs[0], key:'vlc:'+cs[0] };
            if(cs.length===0) return { kind:'village', v, key:'vil:'+v.id };
            return { kind:'legacy', v, key:'lg:'+v.id, sub:'name' };
          }
        }
        const lab = vlcRaw ? ('VLC '+vlcRaw+(nm?' ('+nm+')':'')) : nm;
        if(lab && notFound.indexOf(lab)<0) notFound.push(lab);
        return null;
      };
      /* เก็บค่า: VLC/หมู่บ้านเดิมซ้ำ = ทับค่า (ไม่บวกซ้ำ) · แพ็คเกจ: รวมตามชื่อ+ราคา ภายในไฟล์ */
      const vals = {};
      const slot = res=> (vals[res.key] = vals[res.key] || { res, m:{}, pk:{}, mx:null });
      let mixRows = 0;
      let oldMonths = 0;
      const put = (res, mk, n)=>{
        if(mk < ROI_START){ oldMonths++; return; }          /* ก่อนเริ่มมีลูกค้า — ไม่รับ */
        const t = slot(res);
        if(res.kind==='legacy') (t.m[mk] = t.m[mk] || {})[res.sub] = n;
        else t.m[mk] = n;
        cells++; if(res.kind==='vlc') byVlc++;
      };
      const putPack = (res, mk, name, price, n)=>{
        if(mk < ROI_START){ oldMonths++; return; }
        if(res.kind==='legacy'){                         /* ระบุ VLC ไม่ได้ → ใช้แค่จำนวนลูกค้า */
          const lab = (res.v && res.v.name) || ''; if(packSkipped.indexOf(lab)<0) packSkipped.push(lab);
          const t = slot(res); const o = (t.m[mk] = t.m[mk] || {}); o[res.sub] = (+o[res.sub]||0) + n; return;
        }
        const t = slot(res); const ls = (t.pk[mk] = t.pk[mk] || []);
        const k = String(name||'').trim() || (fmt(price)+' บาท');
        const ex = ls.find(l=> l.k===k && l.p===price);
        if(ex) ex.n += n; else ls.push({ k, p:price, n });
        packRows++; if(res.kind==='vlc') byVlc++;
      };
      const arpuOf = (res, val)=>{
        return;   /* ค่าแพ็คเฉลี่ยมาจากข้อมูลแพ็คเกจของ VLC นั้นเท่านั้น — ไม่เก็บตัวเลขจากคอลัมน์ D */
        if(!(+val>0)) return;
        /* ค่าเท่าที่ระบบมีอยู่แล้ว (ค่าจากสูตร/ไฟล์ที่ส่งออก) → ไม่ตั้งเป็นค่ากรอกเอง */
        const u0 = res.kind==='vlc' ? roiUnitByKey('vlc:'+res.code) : (res.kind==='village' ? roiUnitByKey('vil:'+res.v.id) : null);
        if(u0){ try{ const cur = roiUnitArpuInfo(u0).avg; if(cur>0 && Math.abs(cur - (+val)) < 0.5) return; }catch(_){} }
        if(res.kind==='vlc') villageByVLC(res.code).forEach(v=>{ roiArpuMap(v)[res.code] = +val; if(villageVLCs(v).length===1) roiOf(v).arpu = +val; });
        else roiOf(res.v).arpu = +val;
      };
      const num = x=>{ const t = String(x==null?'':x).replace(/[,\s฿]/g,''); return t==='' ? NaN : +t; };
      /* แบบกว้างก่อน แล้วค่อยแบบยาว (ข้อมูลแพ็คเกจของเดือนเดียวกันมาแทนยอดรวม) */
      const noPrice = [], nonDup = [], mixNotes = [];
      let mixSkipRows = 0;
      let badCells = 0;
      let nonRows = 0, nonHouseN = 0, nonPkgN = 0;
      const nonSeen = {};
      sheets.sort((x,y)=> x.ord - y.ord).forEach(S=>{
        const a = S.rows;
        if(S.nonCols){
          const width = Math.max.apply(null, a.map(r=> (r||[]).length));
          for(let c=1;c<width;c++){
            const pseudo = [ S.rName>=0 ? (a[S.rName]||[])[c] : '', (a[S.rVlc]||[])[c] ];
            if(!String(pseudo[0]||'').trim() && !String(pseudo[1]||'').trim()) continue;
            const nos = [], hs = {}, pks = {};
            /* คอลัมน์ถัดไป: "บ้านเลขที่" และ "แพ็คเกจ" ของเลข Non แถวเดียวกัน (ไฟล์เก่าไม่มี = ใช้ค่าเดิม) */
            const hdr = x=> String((a[S.rStart-1]||[])[x]==null ? '' : (a[S.rStart-1]||[])[x]);
            const hasH = /บ้านเลขที่|house/i.test(hdr(c+1));
            const cP = /แพ็?คเกจ|package|ราคา/i.test(hdr(c+2)) ? c+2 : (/แพ็?คเกจ|package|ราคา/i.test(hdr(c+1)) ? c+1 : -1);
            for(let r=S.rStart;r<a.length;r++){ const no = roiCleanNon((a[r]||[])[c]); if(!no) continue; nos.push(no);
              if(hasH){ const hv = String((a[r]||[])[c+1]==null ? '' : (a[r]||[])[c+1]).trim(); if(hv) hs[no] = hv; }
              if(cP>=0){ const pk = roiParsePkg((a[r]||[])[cP]); if(pk) pks[no] = pk; } }
            if(!nos.length) continue;                                     /* คอลัมน์ที่ยังไม่กรอก ข้าม */
            const res = resolve(S, pseudo); if(!res) continue;
            if(res.kind==='legacy'){ const lab = (res.v && res.v.name) || ''; if(packSkipped.indexOf(lab)<0) packSkipped.push(lab); continue; }
            const t = slot(res); t.non = t.non || [];
            /* ชีตนี้ไม่มีช่องแพ็คเกจ/ราคา → คงค่าที่เคยบันทึกไว้ของเลขเดิม */
            const u0 = roiUnitByKey(res.kind==='vlc' ? 'vlc:'+res.code : 'vil:'+res.v.id);
            const old = {}; ((u0 && roiUnitNon(u0)) ? roiUnitNon(u0).list : []).forEach(x=>{ old[x.no] = x; });
            nos.forEach(no=>{
              if(nonSeen[no] && nonSeen[no]!==res.key){ if(nonDup.indexOf(no)<0) nonDup.push(no); }
              nonSeen[no] = res.key;
              const pk = pks[no];
              t.non.push({ no, k: pk ? pk.k : (old[no] ? old[no].k||'' : ''), p: pk ? pk.p : (old[no] ? +old[no].p||0 : 0), h: hs[no] || (old[no] ? old[no].h||'' : '') }); nonRows++;
              if(pk) nonPkgN++;
              if(hs[no]) nonHouseN++;
            });
          }
          return;
        }
        if(S.nonSheet){
          for(let r=1;r<a.length;r++){
            const row = a[r]||[];
            const no = roiCleanNon(row[S.iNon]); if(!no) continue;          /* แถวว่าง ข้าม */
            const res = resolve(S, row); if(!res) continue;
            if(res.kind==='legacy'){ const lab = (res.v && res.v.name) || ''; if(packSkipped.indexOf(lab)<0) packSkipped.push(lab); continue; }
            if(nonSeen[no] && nonSeen[no]!==res.key){ const lab = no; if(nonDup.indexOf(lab)<0) nonDup.push(lab); }
            nonSeen[no] = res.key;
            const t = slot(res); t.non = t.non || [];
            const hv = S.iHouse>=0 ? String(row[S.iHouse]==null?'':row[S.iHouse]).trim() : '';
            const pk = roiParsePkg(S.iPrice>=0 && row[S.iPrice]!=='' && row[S.iPrice]!=null ? row[S.iPrice] : (S.iPkg>=0 ? row[S.iPkg] : ''));
            const kTxt = S.iPkg>=0 ? String(row[S.iPkg]||'').trim() : '';
            t.non.push({ no, k: kTxt && isNaN(num(kTxt)) ? kTxt : (pk ? pk.k : kTxt), p: pk ? pk.p : 0, h: hv });
            if(pk) nonPkgN++;
            if(hv) nonHouseN++;
            nonRows++;
          }
          return;
        }
        if(S.mixWide){
          const before = mixRows; let filled = 0;
          if(S.noPriceRow) mixNotes.push('ชีต "'+S.sn+'" ไม่พบแถวราคา (แถว 2 ต้องขึ้นต้นด้วย "'+ROI_MIX_PRICE_ROW+'") — ใช้ราคาจากชื่อแพ็คแทนเท่าที่หาได้');
          for(let r=S.start;r<a.length;r++){
            const row = a[r]||[];
            const cells = S.pcols.map(c=>({ c, n: num(row[c.i]) })).filter(x=> !isNaN(x.n) && x.n>0);
            if(!cells.length) continue;                                   /* แถวที่ยังไม่กรอก ข้าม */
            filled++;
            const res = resolve(S, row); if(!res) continue;
            if(res.kind==='legacy'){ const lab = (res.v && res.v.name) || ''; if(packSkipped.indexOf(lab)<0) packSkipped.push(lab); continue; }
            /* แพ็คที่ไม่มีราคาในแถวนี้ → ข้ามทั้งแถว (ไม่เอาชุดที่ขาดไปทับของเดิม ค่าเฉลี่ยจะเพี้ยน) */
            const bad = cells.filter(({c})=> !(c.p>=0));
            if(bad.length){ bad.forEach(({c})=>{ if(noPrice.indexOf(c.k)<0) noPrice.push(c.k); }); mixSkipRows++; continue; }
            const t = slot(res); t.mx = [];                                 /* แถวนี้ = แพ็คเกจทั้งชุดของ VLC นี้ */
            cells.forEach(({c,n})=>{ t.mx.push({ k:c.k, p:c.p, n }); mixRows++; });
            if(res.kind==='vlc') byVlc++;
          }
          /* เตือนเฉพาะเมื่อมีตัวเลขกรอกไว้แต่นำเข้าไม่ได้ (ชีตว่างทั้งชีต = ยังไม่ได้กรอก ไม่ต้องเตือน) */
          if(filled && mixRows===before) mixNotes.push('ชีต "'+S.sn+'" ไม่ได้นำเข้าแพ็คเกจเลย — ตรวจว่ามีจำนวนลูกค้าใต้แพ็ค และมีราคาในแถว 2');
          return;
        }
        if(S.mix){
          for(let r=1;r<a.length;r++){
            const n = num(a[r][S.iCust]);
            let price = S.iPrice>=0 ? num(a[r][S.iPrice]) : NaN;
            const pkg = S.iPkg>=0 ? String(a[r][S.iPkg]||'').trim() : '';
            if(isNaN(price) && pkg && !isNaN(num(pkg))) price = num(pkg);
            if(isNaN(n) || n<=0 || isNaN(price) || price<0) continue;        /* แถวว่าง/แถวอ้างอิง ข้าม · ราคา 0 ใช้ได้ */
            const res = resolve(S, a[r]); if(!res) continue;
            if(res.kind==='legacy'){ const lab = (res.v && res.v.name) || ''; if(packSkipped.indexOf(lab)<0) packSkipped.push(lab); continue; }
            const t = slot(res); t.mx = t.mx || [];
            const k = (pkg && isNaN(num(pkg))) ? pkg : (fmt(price)+' บาท');
            const ex = t.mx.find(l=> l.k===k && l.p===price);
            if(ex) ex.n += n; else t.mx.push({ k, p:price, n });
            mixRows++; if(res.kind==='vlc') byVlc++;
          }
          return;
        }
        if(S.long){
          for(let r=1;r<a.length;r++){
            const res = resolve(S, a[r]); if(!res) continue;
            const mk = roiParseMonth(a[r][S.iMon]); if(!mk) continue;
            const n = num(a[r][S.iCust]); if(isNaN(n)) continue;
            let price = S.iPrice>=0 ? num(a[r][S.iPrice]) : NaN;
            const pkg = S.iPkg>=0 ? String(a[r][S.iPkg]||'').trim() : '';
            if(isNaN(price) && pkg && !isNaN(num(pkg))) price = num(pkg);   /* ช่องแพ็คเกจเป็นตัวเลขราคา */
            const rawP = S.iPrice>=0 ? a[r][S.iPrice] : (pkg || '');
            /* ราคา 0 ฿ เป็นแพ็คจริงได้ — นับเมื่อช่องราคามีค่า (ช่องว่าง = ไม่มีแพ็ค) */
            if(!isNaN(price) && price>=0 && rawP!=='' && rawP!=null) putPack(res, mk, pkg && isNaN(num(pkg)) ? pkg : '', price, n);
            else put(res, mk, n);
          }
        } else {
          const cArpu = S.iPrice;
          const monCols = S.h.map((h,i)=>({i, m:roiParseMonth(h)})).filter(x=>x.m && x.i!==S.iName && x.i!==cArpu && x.i!==S.iVlc);
          for(let r=1;r<a.length;r++){
            const res = resolve(S, a[r]); if(!res) continue;
            if(cArpu>=0) arpuOf(res, a[r][cArpu]);
            monCols.forEach(mc=>{
              const raw = a[r][mc.i];
              if(raw==='' || raw==null) return;
              const n = num(raw);
              if(isNaN(n)){ badCells++; return; }          /* #N/A / ข้อความ → ข้าม (เดิมกลายเป็น 0 ลูกค้า) */
              put(res, mc.m, n);
            });
            slot(res);
          }
        }
      });
      /* แพ็คเกจปัจจุบัน = นับจากแพ็คเกจของเลข Non (ถ้ากรอกไว้) — แทนการกรอกชีตแพ็คเกจแยก */
      let mixFromNon = 0;
      Object.keys(vals).forEach(key=>{
        const t = vals[key]; if(!t.non || !t.non.length) return;
        const priced = t.non.filter(x=> roiPkgPriced(x));
        if(!priced.length) return;
        /* กรอกแพ็คเกจใน Non ยังไม่ครบเท่าแพ็คเกจเดิม → คงแพ็คเกจเดิมไว้ (ไม่ให้ยอดลดลงเพราะกรอกได้บางส่วน) */
        let u0 = null; try { u0 = roiUnitByKey(key); } catch(e){}
        const old = t.mx || ((u0 && roiUnitMix(u0)) || {}).lines || [];
        const oldN = old.reduce((a,x)=> a+(+x.n||0), 0);
        if(t.non.filter(x=> x.k).length < oldN) return;
        const g = {};
        priced.forEach(x=>{ const k = x.k || roiStdPackName(+x.p||0), id = k+'|'+(+x.p||0); (g[id] = g[id] || { k, p:+x.p||0, n:0 }).n++; });
        t.mx = Object.values(g).sort((a,b)=> a.p-b.p); mixFromNon++;
      });
      /* สำรองก่อนแก้ (ย้อนกลับได้) */
      const bakOk = roiBackupTake(f && f.name);
      const sigBefore = stableSig(state.villages.map(v=> v.roi||null));
      /* บันทึก: VLC ก่อน (ทุกเฟส) → หมู่บ้านไม่มี VLC → ข้อมูลรวมเดิม (= ผลรวม VLC + ส่วนที่ไม่ระบุ) → แพ็คเกจ */
      const touchV = new Set();
      const unitOf = res=> res.kind==='vlc' ? roiUnitByKey('vlc:'+res.code) : (res.kind==='village' ? roiUnitByKey('vil:'+res.v.id) : null);
      ['vlc','village','legacy'].forEach(kind=> Object.keys(vals).forEach(key=>{
        const t = vals[key]; if(t.res.kind!==kind) return;
        const u0 = unitOf(t.res), pk0 = u0 ? roiUnitPacks(u0) : {};
        Object.keys(t.m).forEach(mk=>{
          /* ยอดรวมเท่าผลรวมแพ็คเกจเดิม (เช่น นำไฟล์ฟอร์มเดิมกลับเข้า) → ไม่แตะ คงรายละเอียดแพ็คเกจไว้ */
          if(kind!=='legacy' && !t.pk[mk] && Array.isArray(pk0[mk]) && pk0[mk].length
             && pk0[mk].reduce((s2,l)=>s2+(+l.n||0),0) === (+t.m[mk]||0)) return;
          if(kind==='vlc'){
            villageByVLC(t.res.code).forEach(v=>{
              const pm = roiPackVlcMap(v); if(pm[t.res.code]) delete pm[t.res.code][mk];   /* ยอดรวมใหม่ = ล้างแพ็คเกจเดิมของเดือนนั้น */
              roiSetVlcMonth(v, t.res.code, mk, t.m[mk]); touchV.add(v);
            });
          }
          else if(kind==='village'){ delete roiPackVil(t.res.v)[mk]; roiOf(t.res.v).cust[mk] = +t.m[mk]||0; touchV.add(t.res.v); }
          else { const sum = Object.keys(t.m[mk]).reduce((s,x)=>s+(+t.m[mk][x]||0),0); roiSyncMonth(t.res.v, mk, sum); touchV.add(t.res.v); }
        });
        const u = Object.keys(t.pk).length ? unitOf(t.res) : null;
        if(u) Object.keys(t.pk).forEach(mk=>{ roiUnitSetPack(u, mk, t.pk[mk]); u.villages.forEach(v=>touchV.add(v)); });
        const um = (t.mx && t.mx.length) ? unitOf(t.res) : null;      /* แพ็คเกจปัจจุบัน = แทนที่ทั้งชุด */
        if(um){ roiUnitSetMix(um, t.mx); um.villages.forEach(v=>touchV.add(v)); }
        const un = (t.non && t.non.length) ? unitOf(t.res) : null;    /* เลข Non = แทนที่รายชื่อของ VLC นั้นทั้งชุด */
        if(un){ roiUnitSetNon(un, t.non); un.villages.forEach(v=>touchV.add(v)); }
      }));
      touchV.forEach(v=>{ v._dirty = true; v._roiDirty = true; window._roiGen = (window._roiGen||0) + 1; });
      if(nonDup.length) notFound = notFound.concat(['เลข Non ซ้ำอยู่หลาย VLC '+nonDup.length+' เลข: '+nonDup.slice(0,5).join(', ')+(nonDup.length>5?' …':'')]);
      if(noPrice.length) notFound = notFound.concat(noPrice.map(k=>'แพ็คเกจ "'+k+'" ไม่มีราคาในแถว 2 (ราคา)'))
                                    .concat(mixSkipRows ? ['แพ็คเกจปัจจุบัน '+mixSkipRows+' แถวไม่ได้นำเข้า (มีแพ็คที่ไม่มีราคา) — ใส่ราคาในแถว 2 แล้วนำเข้าใหม่ · ข้อมูลเดิมของแถวนั้นยังอยู่'] : []);
      if(mixNotes.length) notFound = notFound.concat(mixNotes);
      if(oldMonths) notFound = notFound.concat(['ข้อมูลก่อน ม.ค. 2561 (2018) '+oldMonths+' ช่อง — ไม่รับ (ระบบเริ่มนับลูกค้าตั้งแต่ 2018-01)']);
      if(badCells) notFound = notFound.concat(['ช่องจำนวนลูกค้าที่ไม่ใช่ตัวเลข (เช่น #N/A จาก XLOOKUP) '+badCells+' ช่อง — ข้ามไป ไม่นับเป็น 0']);
      const skipUseful = skippedSheets.filter(n=> !/^sheet\d*$/i.test(n) && !/ \(อัตโนมัติ\)$/.test(n));   /* ชีตสูตรอัตโนมัติ = ตั้งใจไม่อ่าน ไม่ใช่ปัญหา */
      if(skipUseful.length) notFound = notFound.concat(skipUseful.map(n=>'ชีต "'+n+'" ไม่ได้อ่าน — ไม่รู้จักรูปแบบ (ต้องมีคอลัมน์ โครงการ/VLC)'));
      if(packSkipped.length) notFound = notFound.concat(packSkipped.map(n=>'แพ็คเกจของ '+n+' ระบุ VLC ไม่ได้ (โครงการมีหลาย VLC) — ใส่ VLC ในแถวแพ็คเกจ'));
      persist();
      renderRoiMode();
      const changed = stableSig(state.villages.map(v=> v.roi||null)) !== sigBefore;
      const kindOf = S => S.nonCols||S.nonSheet ? 'เลข Non' : (S.mixWide||S.mix ? 'แพ็คเกจปัจจุบัน' : (S.long ? 'รายเดือน (แถวยาว)' : 'ลูกค้ารายเดือน'));
      const stats = { file: f && f.name, units: Object.keys(vals).length, cells, mixRows, nonRows, nonHouseN, nonPkgN, mixFromNon, packRows, byVlc, changed, bakOk,
                      sheets: sheets.map(S=> S.sn+' → '+kindOf(S)), skipped: skippedSheets };
      toast(changed ? 'นำเข้าแล้ว · กำลังบันทึกขึ้นระบบ...' : 'นำเข้าแล้ว · ข้อมูลตรงกับที่มีอยู่ ไม่มีอะไรเปลี่ยน');
      showRoiImportResult(stats, notFound, changed ? { state:'saving' } : null);
      if(changed) saveRoiNow().then(res=> showRoiImportResult(stats, notFound, res));
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ: '+(err.message||'')); }
    ev.target.value='';
  };
  rd.readAsArrayBuffer(f);
}
/* สรุปผลนำเข้า: อ่านอะไรได้ · จับคู่ไม่ได้อะไร · บันทึกขึ้นระบบแล้วหรือยัง (ตรวจสอบซ้ำ) · ย้อนกลับได้ */

    saveHTML = '⚠️ ยังไม่ขึ้นระบบ: '+esc(save.err||'')+' — ข้อมูลอยู่ในเครื่องนี้ '+(save.mode==='nosql'?'':'<button class="btn btn-sm btn-green" onclick="saveRoiClick()">ลองบันทึกอีกครั้ง</button>');
    bg='#FDF0D8'; bd='var(--amber)'; ink='#7A5200';

  bar.innerHTML = `<div><b>📥 นำเข้า ${esc(st.file||'')}: ${got.join(' · ')}</b>

    <div style="margin-top:4px">${saveHTML}</div>

/* แถวสำหรับไฟล์ Excel = แถวละ VLC (นำไฟล์กลับเข้าระบบได้ ไม่นับซ้ำ)
   แถว "ไม่ระบุ VLC" ใช้ชื่อโครงการเดียว ช่อง VLC ว่าง */
function roiSheetUnits(){
  return roiUnits().map(u=>({ u, name: u.type==='rest' ? u.villages[0].name : roiUnitName(u), vlc: u.vlc, arpu: roiUnitArpu(u), cust: roiUnitCust(u) }));
}
/* แถวแพ็คเกจสำหรับไฟล์ Excel (นำกลับเข้าได้) */
function roiPackSheetRows(){
  const out = [];
  roiUnits().forEach(u=>{
    if(u.type==='rest') return;
    const pk = roiUnitPacks(u), name = roiUnitName(u);
    Object.keys(pk).filter(m=>ROI_MON.test(m)).sort().forEach(m=>{
      (pk[m]||[]).forEach(l=> out.push([name, u.vlc||'', m, l.k||'', +l.p||0, +l.n||0]));
    });
  });
  return out;
}
const ROI_PACK_HEAD = ['โครงการ','VLC','เดือน','แพ็คเกจ','ราคา (บาท/เดือน)','จำนวนลูกค้า'];
/* ชีต "แพ็คเกจปัจจุบัน" — หน้าตาเหมือนชีตลูกค้ารายเดือน
   แถว 1 = หัว: โครงการ | VLC | ลูกค้าเดือนล่าสุด (อ้างอิง) | แพ็คเกจ A | แพ็คเกจ B | ...
   แถว 2 = ราคา (บาท/เดือน) ของแต่ละแพ็คเกจ
   แถว 3+ = แถวละ VLC · ช่องใต้แพ็คเกจ = จำนวนลูกค้าที่ใช้แพ็คนั้น                                     */
const ROI_MIX_PRICE_ROW = 'ราคา (บาท/เดือน) →';
const ROI_MIX_AVG_HEAD  = 'ค่าแพ็คเฉลี่ย (สูตร)';
/* ราคาจากชื่อแพ็ค — เฉพาะที่ระบุหน่วยเงินชัด เช่น "499 ฿" / "1,199 ฿" / "0 ฿" / "Fibre 1Gb 799 บาท"

/* ชื่อแพ็คที่เป็นราคาล้วน เช่น "499 ฿" / "1,199 บาท" / 499 (ช่องตัวเลขแบบสกุลเงิน) */
function roiIsPriceName(name){ return /^\s*[฿]?\s*\d[\d,]*(\.\d+)?\s*(฿|บาท|thb|baht)?\s*$/i.test(String(name==null?'':name)); }
function roiPackColName(l){ return roiIsPriceName(l.k) || !String(l.k||'').trim() ? roiStdPackName(+l.p||0) : l.k; }
function roiPriceFromName(name){
  if(roiIsPriceName(name)){ const n = +String(name).replace(/[^\d.]/g,''); return (n>=0 && n<=50000) ? n : NaN; }
  const t = String(name||'').replace(/,/g,'');
  const m = t.match(/(\d+(?:\.\d+)?)\s*(?:บาท|฿|thb|baht)/i) || t.match(/(?:฿|thb)\s*(\d+(?:\.\d+)?)/i);
  const n = m ? +m[1] : NaN;
  return (n>=0 && n<=50000) ? n : NaN;
}
/* แพ็คมาตรฐานในฟอร์ม: 0 ฿ · 499 ถึง 2,999 (ทีละ 100) · 500 ฿ · 600 ฿ */
const ROI_STD_PRICES = (()=>{ const a = [0, 500, 600]; for(let p=499; p<=2999; p+=100) a.push(p); return a.sort((x,y)=>x-y); })();
function roiStdPackName(p){ return Number(p).toLocaleString('en-US') + ' ฿'; }
const ROI_SH = { cust:'ลูกค้ารายเดือน', mix:'แพ็คเกจปัจจุบัน', non:'เลข Non Mobile', chg:'เปลี่ยนแปลงรายเดือน', rev:'รายได้รายเดือน', sync:'เทียบบ้านร้อยสาย-สมัคร' };

/* เดือนในฟอร์ม: ตั้งแต่ ROI_START (เดือนแรกที่มีลูกค้า) ถึง ธ.ค. ปีหน้า — เผื่อกรอกเดือนใหม่ต่อได้เรื่อยๆ */
function roiFormMonths(){
  const start = ROI_START;
  const end = (new Date().getFullYear()+1) + '-12';
  const out = []; let m = start;
  while(m <= end){ out.push(m); m = ymAdd(m, 1); }
  return out;
}
const xlQ = n => "'" + String(n).replace(/'/g,"''") + "'";
function roiMixSheet(){
  /* อัตโนมัติ: นับจากคอลัมน์ "แพ็คเกจ (ราคา)" ในชีตเลข Non ของ VLC นั้น
     VLC ที่ยังไม่กรอกแพ็คเกจในชีตเลข Non → แสดงแพ็คเกจที่ระบบมีอยู่ (ค่าคงที่) */
  const units = roiUnits().filter(u=> u.type!=='rest');
  const prices = [];
  units.forEach(u=>{ const mx = roiUnitMix(u); (mx ? mx.lines : []).forEach(l=>{ const p = +l.p||0; if(prices.indexOf(p)<0) prices.push(p); }); });
  ROI_STD_PRICES.forEach(p=>{ if(prices.indexOf(p)<0) prices.push(p); });

  const cols = prices.map(p=>({ k:roiStdPackName(p), p }));
  for(let i=1;i<=3;i++) cols.push({ k:'แพ็คเกจใหม่ '+i, p:'' });       /* ใส่ราคาในแถว 2 แล้วนับให้เอง */
  const head = ['โครงการ','VLC','OLT','ลูกค้าเดือนล่าสุด (อ้างอิง)', ROI_MIX_AVG_HEAD].concat(cols.map(c=>c.k));
  const price = [ROI_MIX_PRICE_ROW,'','','',''].concat(cols.map(c=>c.p));
  const NQ = xlQ(ROI_SH.non), NL = roiNonFormulaLastCol(), S0 = ROI_NON_START, S1 = ROI_NON_START + 4999;
  const ws = XLSX.utils.aoa_to_sheet([head, price]);
  const put = (ref, cell)=>{ ws[ref] = cell; };
  units.forEach((u, i)=>{
    const r = i + 3, mx = roiUnitMix(u);
    const cu = roiUnitCust(u), ms = Object.keys(cu).filter(m=>ROI_MON.test(m)).sort();
    put('A'+r, { t:'s', v:roiUnitName(u) }); put('B'+r, { t:'s', v:u.vlc||'' }); put('C'+r, { t:'s', v:roiUnitOLT(u) });
    if(ms.length) put('D'+r, { t:'n', v:+cu[ms[ms.length-1]]||0 });
    const key = u.vlc ? `$B${r}` : `$A${r}`, keyRow = u.vlc ? 2 : 1;
    const R = `INDEX(${NQ}!$B$${S0}:$${NL}$${S1},0,MATCH(${key},${NQ}!$B$${keyRow}:$${NL}$${keyRow},0)+2)`;
    /* ใช้ยอดจากแพ็คเกจของเลข Non เมื่อกรอกครบอย่างน้อยเท่ายอดแพ็คเกจเดิม (ไม่งั้นคงค่าเดิม) */
    const tot = (mx ? mx.lines : []).reduce((a,x)=> a+(+x.n||0), 0), need = Math.max(1, tot);
    const nl = (roiUnitNon(u)||{list:[]}).list || [], useNon = nl.filter(x=> x.k).length >= need;
    cols.forEach((c, k)=>{
      const X = XLSX.utils.encode_col(5 + k);
      const n0 = (mx && c.p!=='') ? mx.lines.filter(x=> (+x.p||0)===c.p).reduce((t,x)=> t+(+x.n||0), 0) : 0;
      const st = n0 ? String(n0) : '""';
      const f = `IF(${X}$2="","",IFERROR(IF(COUNTA(${R})<${need},${st},COUNTIF(${R},${X}$2)+COUNTIF(${R},"*("&${X}$2&")")),${st}))`;
      const v = !useNon ? n0 : (c.p==='' ? 0 : nl.filter(x=> roiPkgPriced(x) && (+x.p||0)===c.p).length);
      put(X+r, v ? { t:'n', v, f, z:'0;-0;;@' } : { t:'s', v:'', f, z:'0;-0;;@' });
    });
  });
  /* คอลัมน์ E = ค่าแพ็คเฉลี่ย: Σ(ราคา × คน) ÷ Σ คน — ชีตลูกค้ารายเดือนดึงไปใช้ */
  const c0 = XLSX.utils.encode_col(5), c1 = XLSX.utils.encode_col(5 + cols.length - 1);
  units.forEach((u, i)=>{
    const r = i + 3, st = roiMixStats(roiUnitMix(u));
    const f = `IFERROR(SUMPRODUCT($${c0}$2:$${c1}$2,${c0}${r}:${c1}${r})/SUM(${c0}${r}:${c1}${r}),"")`;
    ws['E'+r] = st.n ? { t:'n', v: Math.round(st.avg*100)/100, f } : { t:'s', v:'', f };
  });
  ws['!ref'] = 'A1:' + c1 + (units.length + 2);
  ws['!cols'] = [{wch:40},{wch:12},{wch:14},{wch:14},{wch:14}].concat(cols.map(()=>({wch:11})));
  ws['!freeze'] = { xSplit:2, ySplit:2 };
  return ws;
}
/* ชีต "เลข Non Mobile" — คอลัมน์ละ 1 หมู่บ้าน/VLC · เลข Non บันทึกต่อลงไปเรื่อยๆ ใต้หมู่บ้านนั้น
   แถว 1 ชื่อหมู่บ้าน · 2 VLC · 3 OLT · 4 ลูกค้าเดือนล่าสุด (สูตรจากชีตลูกค้ารายเดือน) · 5 จำนวน Non ที่กรอก (สูตร) · 6 หัว · 7+ เลข Non */
const ROI_NON_LABELS = ['ชื่อหมู่บ้าน','VLC','OLT',
  'ลูกค้าเดือนล่าสุด (สูตร)','เดือนล่าสุด (สูตร)','เพิ่ม/ลด จากเดือนก่อน (สูตร) · 🟩 เพิ่ม 🟥 ลด',
  'เลข Non ที่กรอกแล้ว (สูตร)','ต้องเพิ่มเลข Non อีก (สูตร) · 🟧 ยังขาด 🟥 เกิน 🟩 ครบ','Non Mobile Number ↓  |  บ้านเลขที่ ↓  |  แพ็คเกจ (ราคา) ↓'];
const ROI_NON_W = 3;                      /* หมู่บ้านละ 3 คอลัมน์: เลข Non | บ้านเลขที่ | แพ็คเกจ */
/* ช่วงคอลัมน์ที่สูตรชีตอื่นอ้างถึงชีตเลข Non (เผื่อเพิ่มหมู่บ้านใหม่ต่อท้าย ~30 หมู่บ้าน) */
function roiNonFormulaLastCol(){ return XLSX.utils.encode_col(roiUnits().filter(u=> u.type!=='rest').length * ROI_NON_W + 90); }
const ROI_NON_START = 10;
function roiNonSheet(wide){

  ROI_NON_LABELS.forEach((t,i)=> put(i, 0, { t:'s', v:t }));

    put(2, c, { t:'s', v: roiUnitOLT(u) });
    /* แถวของ VLC นี้ในชีตลูกค้ารายเดือน (ไม่มี VLC → จับด้วยชื่อ) */

    const rowRef = `INDEX(${CS}!$${mF}$2:$${mL}$${nLast},${match},0)`;

    put(3, c, last==='' ? { t:'s', v:'', f:fLast } : { t:'n', v:last, f:fLast });
    const fMon = `IFERROR(LOOKUP(2,1/(${rowRef}<>""),${CS}!$${mF}$1:$${mL}$1),"")`;
    put(4, c, { t:'s', v: lc.k>=0 ? months[lc.k] : '', f:fMon });
    const fChg = `IFERROR(1*INDEX(${CS}!$E$2:$E$${nLast},${match}),"")`;
    put(5, c, lc.d==='' ? { t:'s', v:'', f:fChg } : { t:'n', v:lc.d, f:fChg });
    put(6, c, { t:'n', v:list.length, f:`COUNTA(${col}${S0}:${col}${S1})` });
    const fNeed = `IF(${col}4="","",${col}4-${col}7)`;
    put(7, c, last==='' ? { t:'s', v:'', f:fNeed } : { t:'n', v:last - list.length, f:fNeed });
    put(S0-2, c, { t:'s', v:'Non Mobile ↓' }); put(S0-2, c+1, { t:'s', v:'บ้านเลขที่ ↓' }); put(S0-2, c+2, { t:'s', v:'แพ็คเกจ (ราคา) ↓' });
    list.forEach((x,i)=>{
      put(S0-1+i, c, { t:'s', v:String(x.no), z:'@' });
      if(x.h) put(S0-1+i, c+1, { t:'s', v:String(x.h), z:'@' });
      if(roiPkgPriced(x)){ const pz = roiStdPackName(+x.p||0) === x.k ? +x.p||0 : null;
        put(S0-1+i, c+2, pz!==null ? { t:'n', v:pz } : { t:'s', v:`${x.k} (${+x.p||0})` }); }

  /* คอลัมน์เลข Non + บ้านเลขที่ = ข้อความ (พิมพ์ 5/12 ไม่กลายเป็นวันที่ · 0812… ไม่หาย 0) · คอลัมน์แพ็คเกจคงเป็นตัวเลข */
  _txtColJobs[ROI_SH.non] = [].concat.apply([], units.map((u,i)=> [1+i*ROI_NON_W, 2+i*ROI_NON_W]));
  ws['!freeze'] = { xSplit:1, ySplit:S0-1 };
  /* ช่องกรอก = เหลืองอ่อน */
  _cfJobs.push({ sheet: ROI_SH.non, sqref: 'B'+S0+':'+lastCol+S1, rules:[ { type:'expression', f:'TRUE', bg:ROI_INPUT_BG, plain:true } ] });

  /* ชื่อหมู่บ้าน + แถวเพิ่ม/ลด: เพิ่ม = เขียว · ลด = แดง */
  _cfJobs.push({ sheet: ROI_SH.non, sqref: 'B1:'+lastCol+'1',
    rules:[ Object.assign({ type:'expression', f:'AND(ISNUMBER(B$6),B$6>0)' }, UP), Object.assign({ type:'expression', f:'AND(ISNUMBER(B$6),B$6<0)' }, DN) ] });
  _cfJobs.push({ sheet: ROI_SH.non, sqref: 'B6:'+lastCol+'6',
    rules:[ Object.assign({ type:'cellIs', op:'greaterThan', f:'0' }, UP), Object.assign({ type:'cellIs', op:'lessThan', f:'0' }, DN) ] });
  /* ต้องเพิ่มเลข Non: ขาด = ส้ม · เกิน = แดง · ครบ = เขียว */
  _cfJobs.push({ sheet: ROI_SH.non, sqref: 'B8:'+lastCol+'8',
    rules:[ Object.assign({ type:'expression', f:'AND(ISNUMBER(B$8),B$8>0)' }, AMB), Object.assign({ type:'expression', f:'AND(ISNUMBER(B$8),B$8<0)' }, DN),
            Object.assign({ type:'expression', f:'AND(ISNUMBER(B$8),B$8=0)' }, UP) ] });
  return ws;
}
function roiPackSheet(rows){
  const ws = XLSX.utils.aoa_to_sheet([ROI_PACK_HEAD].concat(rows));

/* เดือนล่าสุดที่มีข้อมูล และเดือนก่อนหน้า (ใช้ไฮไลต์ลูกค้าเพิ่ม/ลด) */
function roiLatestPair(){
  const ms = roiAllMonths();
  const L = ms.length ? ms[ms.length-1] : '';
  return { L, P: L ? ymAdd(L, -1) : '' };
}
function roiDelta(cust, L, P){
  if(!L || cust[L]==null || cust[L]==='') return null;
  const cur = +cust[L]||0;
  const prev = (cust[P]==null || cust[P]==='') ? 0 : (+cust[P]||0);
  return cur - prev;
}
const ROI_UP   = { bg:'C6EFCE', ink:'006100' };   /* ลูกค้าเพิ่ม */
const ROI_DOWN = { bg:'FFC7CE', ink:'9C0006' };   /* ลูกค้าลด */
function roiPaint(sheetName, cells){ if(cells.length) _paintJobs.push({ sheet: sheetName, cells }); }
/* ===== ชีต "ลูกค้ารายเดือน" + "เปลี่ยนแปลงรายเดือน" + "รายได้รายเดือน" (สูตร Excel ทั้งหมด) =====
   ลูกค้ารายเดือน: A โครงการ | B VLC | C OLT | D ค่าแพ็คเฉลี่ย (สูตรจากแพ็คเกจปัจจุบัน) | E เพิ่ม/ลดล่าสุด (สูตร) | F… เดือน
   เปลี่ยนแปลงรายเดือน: ช่องเดือน = เดือนนี้ − เดือนก่อน (สูตร) · รายได้รายเดือน: ช่องเดือน = ลูกค้า × ค่าแพ็คเฉลี่ย (สูตร)
   กรอก/XLOOKUP เดือนใหม่ในชีตลูกค้ารายเดือน → อีก 2 ชีตและสีเขียว/แดง อัปเดตเอง                                        */
/* เพิ่ม/ลดล่าสุด = เดือนล่าสุดที่มีตัวเลข − เดือนก่อนหน้านั้น (ว่าง = ไม่มีข้อมูลเทียบ) — ตรงกับสูตรในไฟล์ */
function roiLastChange(cu, months){
  let k = -1;
  months.forEach((m,i)=>{ const v = cu[m]; if(!(v==null || v==='')) k = i; });
  if(k < 1) return { k, d:'' };
  const p = cu[months[k-1]];

/* สูตร Excel ของเพิ่ม/ลดล่าสุดในแถว R (อ่านจากคอลัมน์เดือนแถวเดียวกันเท่านั้น ไม่อ้างอิงชีตอื่น) */

  return `IFERROR(IF(${pos}<2,"",IF(INDEX(${RNG},${pos}-1)="","",INDEX(${RNG},${pos})-INDEX(${RNG},${pos}-1))),"")`;
}

    /* รายได้: A-C อ้างอิง · D ค่าแพ็คเฉลี่ย · E สะสม */
    ['A','B','C'].forEach(x=> put(rev, x+R, Object.assign({}, cust[x+R], { f:`${xlQ(C)}!${x}${R}&""` })));
    put(rev, 'D'+R, Object.assign({}, cust['D'+R], { f:`${xlQ(C)}!D${R}` }));
    put(rev, 'E'+R, { t:'n', v:Math.round(cum*100)/100, f:`SUM(${F}${R}:${L}${R})` });
    tot.revCum += cum;
  });
  /* แถวสูตรเพิ่ม/ลด ในแถวที่เผื่อไว้ (เพิ่ม VLC ใหม่ต่อท้ายได้ สูตรมีให้แล้ว) */
  for(let R = rows.length + 2; R <= nLast; R++) put(cust, 'E'+R, { t:'s', v:'', f:roiChangeFormula(R, L) });
  /* แถวรวม (ชีตรายได้) — อยู่ใต้แถวที่เผื่อไว้ */
  const TR = nLast + 2;
  put(rev, 'A'+TR, { t:'s', v:'รวมทุกหมู่บ้าน' });
  months.forEach((m,k)=>{ const col = colOf(k); put(rev, col+TR, { t:'n', v:Math.round(tot.rev[k]*100)/100, f:`SUM(${col}2:${col}${nLast})` }); });
  put(rev, 'E'+TR, { t:'n', v:Math.round(tot.revCum*100)/100, f:`SUM(E2:E${nLast})` });
  cust['!ref'] = 'A1:' + L + nLast;
  rev['!ref']  = 'A1:' + L + TR;
  cust['!cols'] = [{wch:40},{wch:12},{wch:14},{wch:16},{wch:16}].concat(months.map(()=>({wch:9})));
  rev['!cols'] = [{wch:40},{wch:12},{wch:14},{wch:16},{wch:16}].concat(months.map(()=>({wch:11})));
  /* สีอัตโนมัติ: เพิ่ม = เขียว · ลด = แดง (ช่องเพิ่ม/ลด และชื่อหมู่บ้าน) */
  const UP = { bg:ROI_UP.bg, ink:ROI_UP.ink }, DN = { bg:ROI_DOWN.bg, ink:ROI_DOWN.ink };
  _cfJobs.push({ sheet:C, sqref:`E2:E${nLast}`, rules:[ Object.assign({ type:'cellIs', op:'greaterThan', f:'0' }, UP), Object.assign({ type:'cellIs', op:'lessThan', f:'0' }, DN) ] });
  _cfJobs.push({ sheet:C, sqref:`A2:C${nLast}`, rules:[ Object.assign({ type:'expression', f:'AND(ISNUMBER($E2),$E2>0)' }, UP), Object.assign({ type:'expression', f:'AND(ISNUMBER($E2),$E2<0)' }, DN) ] });
  /* ช่องกรอกจำนวนลูกค้า = เหลืองอ่อน */
  _cfJobs.push({ sheet:C, sqref:`${F}2:${L}${nLast}`, rules:[ { type:'expression', f:'TRUE', bg:ROI_INPUT_BG, plain:true } ] });
  return { cust, rev, wide:{ firstCol:F, lastCol:L, lastRow:nLast, months } };
}
const ROI_SH_SYS = 'รายได้ (ระบบคำนวณ)';
/* ลำดับชีต: ลูกค้ารายเดือน → รายได้รายเดือน → แพ็คเกจปัจจุบัน → เลข Non Mobile */
function roiAppendFormSheets(wb, months){
  const F = roiFormBuild(months);
  /* 2 ชีตแรก = ที่ต้องกรอกทุกเดือน (แท็บเหลือง) · ที่เหลือ = อัตโนมัติ (แท็บเขียว) */
  XLSX.utils.book_append_sheet(wb, F.cust, ROI_SH.cust);
  XLSX.utils.book_append_sheet(wb, roiNonSheet(F.wide), ROI_SH.non);
  XLSX.utils.book_append_sheet(wb, roiMixSheet(), ROI_SH.mix);
  XLSX.utils.book_append_sheet(wb, F.rev,  ROI_SH.rev);
  XLSX.utils.book_append_sheet(wb, roiHouseSyncSheet(), ROI_SH.sync);
  _tabJobs[ROI_SH.cust] = ROI_TAB_INPUT; _tabJobs[ROI_SH.non] = ROI_TAB_INPUT;
  [ROI_SH.mix, ROI_SH.rev, ROI_SH.sync].forEach(n=> _tabJobs[n] = ROI_TAB_AUTO);
  return F;
}
function roiAllMonths(){

  roiUnits().forEach(u=> Object.keys(roiUnitCust(u)).concat(Object.keys(roiUnitPacks(u))).forEach(m=>{ if(ROI_MON.test(m)) set.add(m); }));
  return [...set].sort();
}

/* ============ ปิดโครงการ (Close Project) ============
   ปิดแล้ว: ยูนิตที่ตั้งงบ → บันทึกเป็นยูนิตที่สร้าง · งบที่ตั้ง → บันทึกเป็นงบก่อสร้าง
   ตัวเลขถูกล็อก ไม่เปลี่ยนตามการแก้ภายหลัง และแก้ข้อมูลไม่ได้ */
function isClosed(v){ return !!(v && v.closed); }
function villageClosed(id){ const v = state.villages.find(x=>x.id===id); return isClosed(v); }
function jobClosed(job){
  if(!job) return false;
  const v = state.villages.find(x=>x.id===job.villageId);
  return isClosed(v);
}
/* ยอดยูนิตที่ตั้งงบไว้ (นับจากจำนวนตั้งงบทุกรายการ) */
/* ยอดปริมาณงานที่ใช้จริง — แยกตามหน่วย (M / EA / Set …) เพราะบวกรวมคละหน่วยไม่มีความหมาย */
function closeVillage(id){
  if(!requireAdmin('ปิดโครงการ')) return;
  const v = state.villages.find(x=>x.id===id); if(!v) return;
  const jobs = B.jobs.filter(j=>j.villageId===id);
  /* ตอนเปิด = สิ่งที่ตั้งไว้ · ตอนปิด = ที่ทำได้จริง */
  const openHomes  = +v.ports||0;                                  // บ้านที่ตั้งเป้าไว้ตอนเปิด
  const openBudget = jobs.reduce((a,j)=>a+jobBudget(j),0);         // งบที่ตั้งไว้ตอนเปิด
  const doneHomes  = +v.homesDone||0;                              // บ้านที่ implement จริง
  const doneBudget = jobs.reduce((a,j)=>a+jobCost(j),0);           // งบที่ใช้จริง
  /* หมู่บ้านหนึ่งอาจมีหลายผู้รับเหมา */
  const byVendor = {};
  jobs.forEach(j=>{
    const nm = (vendorById(j.vendorId)||{}).name || 'ไม่ระบุ';
    byVendor[nm] = byVendor[nm] || {budget:0, cost:0, jobs:0};
    byVendor[nm].budget += jobBudget(j);
    byVendor[nm].cost   += jobCost(j);
    byVendor[nm].jobs++;
  });
  const vNames = Object.keys(byVendor);
  ui.closeVid = id;
  ui.closeOpen = { homes:openHomes, budget:openBudget };
  const empty = (!doneHomes && !doneBudget);
  $('closeBody').innerHTML = `
    <div style="font-size:14px;margin-bottom:10px">ปิดโครงการ <b>${esc(v.name)}</b></div>
    ${empty?`<div class="notice" style="background:#FBEAEA;border-color:#F0C7C7;color:var(--red);text-align:left">
      ⚠️ <b>ยังไม่มีตัวเลขผลงานในระบบ</b> — กรอกตัวเลขจริงด้านล่างก่อนปิด</div>`:''}

    ${vNames.length>1?`<div class="notice" style="text-align:left">
      👷 โครงการนี้มี <b>${vNames.length} ผู้รับเหมา</b> — ตัวเลขด้านล่างเป็นยอดรวมทุกเจ้า</div>`:''}

    <div class="section-label" style="margin-top:4px">เทียบ ตอนเปิด · ตอนปิด</div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <table class="sum" style="margin:0">
        <tr><th></th><th class="r">ตอนเปิดโครงการ</th><th class="r">ตอนปิด (จริง)</th><th class="r">ส่วนต่าง</th></tr>
        <tr>
          <td><b>บ้าน (หลัง)</b></td>
          <td class="r num">${fmt(openHomes)}</td>
          <td class="r num"><input id="clHomes" type="number" value="${doneHomes||''}" placeholder="0"
              oninput="closeRecalc()" style="width:96px;text-align:right;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;padding:6px 8px;border:1.5px solid var(--green);border-radius:8px"></td>
          <td class="r num" id="clDiffHomes">-</td>
        </tr>
        <tr>
          <td><b>งบประมาณ (บาท)</b></td>
          <td class="r num">${fmt(openBudget)}</td>
          <td class="r num"><input id="clBudget" type="number" value="${doneBudget||''}" placeholder="0"
              oninput="closeRecalc()" style="width:118px;text-align:right;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;padding:6px 8px;border:1.5px solid var(--green);border-radius:8px"></td>
          <td class="r num" id="clDiffBudget">-</td>
        </tr>
      </table>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6">
      ส่วนต่างติดลบ = ทำได้น้อยกว่าที่ตั้งไว้ · <span style="color:var(--green-dark)">งบเหลือ = ประหยัดได้</span><br>
      Progress จะใช้ตัวเลข <b>ตอนปิด</b> เท่านั้น · แก้ได้ก่อนยืนยัน
    </div>
    ${(openBudget||openHomes)?`<div class="data-row" style="margin:8px 0 0">
      <button class="btn btn-ghost btn-sm" onclick="closeUsePlan()">↧ ใช้ตัวเลขตอนเปิด (ทำได้ครบตามแผน)</button></div>`:''}

    ${vNames.length?`
    <div class="section-label">แยกตามผู้รับเหมา</div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <table class="sum" style="margin:0">
        <tr><th>ผู้รับเหมา</th><th class="r">งานที่รับ</th><th class="r">งบที่ตั้ง</th><th class="r">ใช้จริง</th><th class="r">คงเหลือ</th></tr>
        ${vNames.map(nm=>{
          const d=byVendor[nm];
          return `<tr><td class="vname">${esc(nm)}</td><td class="r num">${d.jobs}</td>
            <td class="r num">${fmt(d.budget)}</td><td class="r num">${fmt(d.cost)}</td>
            <td class="r num ${d.budget-d.cost<0?'neg':'pos'}">${fmt(d.budget-d.cost)}</td></tr>`;
        }).join('')}
      </table>
    </div>`:''}`;
  $('closeModal').classList.add('open');
  closeRecalc();
}
function closeRecalc(){
  const o = ui.closeOpen || {homes:0,budget:0};
  const h = +($('clHomes')||{}).value||0, b = +($('clBudget')||{}).value||0;
  const dh = h - o.homes, db = b - o.budget;
  const eh = $('clDiffHomes'), eb = $('clDiffBudget');
  if(eh){ eh.innerHTML = `<b style="color:${dh<0?'var(--amber-dk)':(dh>0?'var(--green-dark)':'var(--muted)')}">${dh>0?'+':''}${fmt(dh)}</b>`; }
  if(eb){ eb.innerHTML = `<b style="color:${db>0?'var(--red)':(db<0?'var(--green-dark)':'var(--muted)')}">${db>0?'+':''}${fmt(db)}</b>${db<0?'<br><small style="color:var(--green-dark)">ประหยัด</small>':(db>0?'<br><small style="color:var(--red)">เกินงบ</small>':'')}`; }
}
function closeUsePlan(){
  const o = ui.closeOpen || {homes:0,budget:0};
  if($('clHomes'))  $('clHomes').value  = o.homes||'';
  if($('clBudget')) $('clBudget').value = o.budget||'';
  closeRecalc();
}
function closeConfirm(){
  const id = ui.closeVid;
  const v = state.villages.find(x=>x.id===id); if(!v) return;
  const homes  = +($('clHomes').value)||0;
  const budget = +($('clBudget').value)||0;
  const o = ui.closeOpen || {homes:0,budget:0};

  v.closedAt = todayISO();
  v.builtHomes  = homes;          // บ้านตอนปิด
  v.builtBudget = budget;         // งบตอนปิด

function reopenVillage(id){
  if(!requireAdmin('เปิดโครงการกลับ')) return;
  const v = state.villages.find(x=>x.id===id); if(!v) return;
  if(!confirm('เปิดโครงการ "'+v.name+'" กลับมาแก้ไข?\n\nตัวเลขที่บันทึกไว้ตอนปิดจะถูกล้าง')) return;
  delete v.closed; delete v.closedAt; delete v.builtBudget; delete v.builtHomes;
  delete v.openHomes; delete v.planBudget; delete v.builtUnits; delete v.planUnits;

}
/* ค่าที่ใช้แสดง: ปิดแล้วใช้ค่าที่ล็อกไว้ */
function villageBudget(v){
  if(isClosed(v)) return +v.builtBudget||0;   // ปิดแล้ว: งบ = ที่ใช้ implement
  return villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId).reduce((a,j)=>a+jobBudget(j),0);
}
function villageCost(v){
  if(isClosed(v)) return +v.builtBudget||0;   // ปิดแล้ว งบที่ตั้ง = งบก่อสร้างที่ใช้จริง
  return villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId).reduce((a,j)=>a+jobCost(j),0);
}

function poById(id){ return (B.pos||[]).find(p=>p.id===id); }
function poJobs(poId){ return B.jobs.filter(j=> j.poId===poId); }
function poAllocated(poId){ return poJobs(poId).reduce((s,j)=>s+jobBudget(j),0); }   // งบที่ตั้งไว้รวมทุกโครงการใน PO
function poSpent(poId){ return poJobs(poId).reduce((s,j)=>s+jobCost(j),0); }          // ค่างานที่ใช้จริงรวม
function poCeiling(po){ return +((po||{}).amount)||0; }                                // วงเงิน PO
function jobPOName(job){ const p = poById(job.poId); return p ? (p.code || p.name || '') : ''; }

function jobBudget(job){
  if(!job) return 0;
  let has=false, t=0;
  Object.keys(job.bqty||{}).forEach(k=>{
    const idx = +k.slice(1);
    if(!ITEMS[idx]) return;
    const q = +job.bqty[k]||0;
    if(q>0){ has=true; t += q * jobPrice(job, idx); }
  });
  return has ? t : (+job.budget||0);
}
function setBQty(jid, idx, val){
  const job = B.jobs.find(j=>j.id===jid); if(!job) return;
  if(jobClosed(job)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  job.bqty = job.bqty || {};
  if(val==='' || +val===0) delete job.bqty['i'+idx];
  else job.bqty['i'+idx] = +val;
  bqPersist();
  refreshJobTotals(job);
}
function refreshJobTotals(job){
  const bud = jobBudget(job), cost = jobCost(job);
  const g1=$('grandBudget'), g2=$('grandTotal'), g3=$('grandRemain');
  if(g1) g1.textContent = fmt(bud);
  if(g2) g2.textContent = fmt(cost);
  if(g3){ g3.textContent = fmt(bud-cost); g3.style.color = (bud && cost>bud)? '#FF9B9B' : ''; }
}
function jobCost(job){
  if(jobClosed(job)){
    const v = state.villages.find(x=>x.id===job.villageId);
    const jobs = B.jobs.filter(j=>j.villageId===job.villageId);
    return jobs.length===1 ? (+v.builtBudget||0) : (+v.builtBudget||0)/jobs.length;
  }
  let t = 0;
  Object.keys(job.qty||{}).forEach(k=>{
    const idx = +k.slice(1);
    if(!ITEMS[idx]) return;
    t += (+job.qty[k]||0) * jobPrice(job, idx);
  });
  return t;
}
function setJobPrice(jid, idx, val){
  const job = B.jobs.find(j=>j.id===jid); if(!job) return;
  if(jobClosed(job)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  job.prices = job.prices || {};
  if(val === '') delete job.prices['i'+idx];
  else job.prices['i'+idx] = +val;
  bqPersist();
  refreshItemList();
  refreshJobTotals(job);
}

/* ===== ข้อมูลในเครื่องเป็นของผู้ใช้คนไหน =====
   เปลี่ยนผู้ใช้บนเครื่องเดียวกัน → ล้างข้อมูลคนก่อนก่อนโหลด (ไม่ให้เห็น/ไม่เอาไปส่งแทนกัน) */
const OWNER_KEY = 'ftth-owner';
function bindCacheOwner(user){
  try{
    const id = user && user.id; if(!id) return true;
    const prev = localStorage.getItem(OWNER_KEY);
    if(prev && prev !== id){
      const pend = state.villages.some(v=> v._dirty || v._hDirty || v._roiDirty);
      if(pend && !confirm('เครื่องนี้มีข้อมูลที่ผู้ใช้คนก่อนยังไม่ได้บันทึก\n\nเข้าระบบด้วยบัญชีนี้ = ล้างข้อมูลค้างนั้นทิ้ง (ข้อมูลบนระบบไม่หาย)\n\nยืนยัน?')){
        try{ sb.auth.signOut(); }catch(e){} cloudUser = null; return false;
      }
      wipeLocalCache();
    }
    localStorage.setItem(OWNER_KEY, id);
  }catch(e){}
  return true;
}
function wipeLocalCache(){
  state = { villages:[] };
  try{ B.jobs = []; B.pos = []; B.trends = {}; B.vendors = (B.vendors||[]).map(v=> Object.assign({}, v, { pass:'' })); }catch(e){}
  try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(ROI_BAK_KEY); localStorage.setItem(LS, JSON.stringify(B)); }catch(e){}
  _idbPending = null; clearTimeout(_idbTimer); try{ kvPut(LS_KEY, undefined).catch(()=>{}); }catch(e){}
  window._roiPullOk = undefined; window._roiV2 = false; window._roiCloudSig = {}; window._nonLoaded = {}; window._nonAll = false; window._nonN = {};
}
function logout(){
  /* มีงานยังไม่ได้บันทึก → ถามก่อน (กันงานหาย) */
  let pend = false;
  try{
    pend = hasPending() || state.villages.some(v=> v._dirty || v._hDirty || v._roiDirty);
    if(cloudOn && cloudUser && pend
       && !confirm('มีข้อมูลที่ยังไม่ได้บันทึกขึ้นระบบ\n\nออกจากระบบตอนนี้ ข้อมูลยังเก็บในเครื่องนี้ (บันทึกได้เมื่อเข้าบัญชีเดิม)\nแนะนำกด ยกเลิก แล้วกด 💾 บันทึก ก่อน\n\nออกจากระบบเลย?')) return;
    /* ไม่มีงานค้าง → ล้างข้อมูลในเครื่อง (ข้อมูลลูกค้า/ราคา/ความคุ้มทุน ไม่ค้างบนเครื่องหลังออกจากระบบ) */
    if(cloudOn && cloudUser && !pend) wipeLocalCache();
  }catch(e){}
  realSession = null;
  const pb = document.getElementById('previewBar'); if(pb) pb.remove();
  if(cloudOn && sb){ try{ sb.auth.signOut(); }catch(e){} cloudUser=null; }
  session={role:null,vendorId:null};
  $('appShell').style.display='none';
  $('loginGate').style.display='';
  renderLogin();
}
/* ============================================================
   หน้าตรวจสอบสำหรับน้อง Key สมัคร  (role = 'checker')
   - น้องเข้าได้แค่หน้านี้หน้าเดียว
   - อ่านสดจาก Supabase ผ่าน check_unit() — ไม่โหลดข้อมูลโครงการลงเครื่อง

   (ฐานข้อมูลกันซ้ำอีกชั้น — บัญชีนี้อ่านตารางโครงการไม่ได้อยู่แล้ว) */

function migrateVendorIds(){
  autoFixShifted();
  let ch=false;
  B.jobs.forEach(j=>{
    if(!j.villageId){
      const m = state.villages.find(x=>x.name.trim()===String(j.name||'').trim());
      if(m){ j.villageId = m.id; ch=true; }
    }
  });
  state.villages.forEach(v=>{
    if(!B.jobs.some(j=>j.villageId===v.id)){
      B.jobs.push({id:uid(), name:v.name, villageId:v.id, vendorId:v.vendorId||'', budget:'', qty:{}, prices:{}, date:todayISO()});
      ch=true;
    }
  });
  state.villages.forEach(v=>{
    if(!v.vendorId && v.contractor){
      const m=B.vendors.find(x=>x.name.trim()===v.contractor.trim());
      if(m){ v.vendorId=m.id; ch=true; }
    }
  });
  if(ch){ persist(); bqPersist(); }
}

/* แจ้งว่าบล็อก BOQ ไหนเข้า/ไม่เข้า — เดิมเงียบไปเมื่อชื่อไม่ตรง */
/* เตือนชัดๆ ว่านำเข้าแล้วแต่ยังไม่ได้ส่งขึ้นระบบ */
/* ขั้นตอนหลังนำเข้าไฟล์ — ใช้ร่วมกันทั้ง Import Master และ Import ราย Vendor
   เดิมปุ่มราย Vendor ข้ามขั้นตอนนี้ ทำให้ข้อมูลค้างในเครื่อง ไม่ขึ้นระบบ */
function finishImport(beforeIds, extraMsg){
  autoFixShifted();
  ensureAllCodes();
  const dupN = dedupeAll();
  /* ทำเครื่องหมายให้ทุกโครงการ เพื่อให้ส่งขึ้นระบบครบตอนกดบันทึก */
  state.villages.forEach(v=>{ v._dirty = true; if((v.houses||[]).length) v._hDirty = true; });
  cloudDirty = true;
  try{ markUnsaved(); }catch(e){}
  B.srcAt = new Date().toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  persist(); bqPersist();
  if(session.role){ currentId = null; render(); }

  const created = state.villages.filter(v=>!beforeIds.has(v.id)).length;
  const updated = state.villages.length - created;
  let boqN = 0, boqNoQty = 0;
  B.jobs.forEach(j=>{
    Object.keys(j.prices||{}).forEach(k=>{
      if(!(+j.prices[k] > 0)) return;
      boqN++;
      if(!((j.qty||{})[k] > 0) && !((j.bqty||{})[k] > 0)) boqNoQty++;
    });
  });
  toast('นำเข้าสำเร็จ · อัปเดต ' + updated + ' โครงการ' + (created? ' · สร้างใหม่ ' + created + ' โครงการ':'')
        + (boqN? ' · BOQ ' + boqN + ' รายการ' : '') + (extraMsg? ' · ' + extraMsg : ''));
  if(dupN) setTimeout(()=>toast('ล้างข้อมูลรายหลังซ้ำ ' + dupN + ' แถว'), 1800);
  if(boqNoQty) setTimeout(()=>toast('หมายเหตุ: BOQ ' + boqNoQty + ' รายการมีราคาแต่ยังไม่ได้ใส่จำนวน — ยังไม่ถูกคิดเป็นงบ'), 2600);
  showMisplacedWarning();
  showBoqImportReport();
  showDupWarning();
  showSavePrompt(state.villages.length);
}

async function findMyVendorRow(user){
  const email = String((user && user.email) || '').trim().toLowerCase();
  const local = email.split('@')[0];
  let rows = null;
  /* 1) ทางหลัก: auth_uid */
  try{
    const r = await sb.from('vendors').select('*').eq('auth_uid', user.id);
    if(r && r.data && r.data.length) return r.data[0];
  }catch(e){}
  /* 2) ดึงทั้งตารางแล้วเทียบเอง — ทนต่อชื่อคอลัมน์ที่ต่างกัน */
  try{
    const r2 = await sb.from('vendors').select('*');
    rows = (r2 && r2.data) || null;
  }catch(e){}
  if(rows && email){
    const same = s => String(s==null?'':s).trim().toLowerCase();
    /* ตรงกับอีเมลเต็ม ในช่องไหนก็ได้ */
    let hit = rows.find(x=> Object.values(x).some(val=> typeof val==='string' && same(val)===email));
    /* หรือชื่อตรงกับส่วนหน้า @ (เช่น thanaphat) */
    if(!hit && local) hit = rows.find(x=> same(x.name)===local);
    if(hit){
      try{ await sb.from('vendors').update({auth_uid:user.id}).eq('id', hit.id); }catch(e){}
      return hit;
    }
  }
  return null;
}

/* ================= ซิงค์เรียลไทม์ =================

   3) ตรวจเป็นระยะเผื่อ Realtime หลุด
   กติกา: ถ้ามีข้อมูลค้างยังไม่บันทึก จะไม่ดึงทับ แต่จะเตือนแทน            */
let rtChannel = null, rtLastPull = 0, rtPollTimer = null, rtPending = false;
let rtOk = false, rtRetry = 0, rtRetryTimer = null;
/* ต่อใหม่เองแบบถอยเวลาเพิ่มขึ้น (5s → 10s → 20s → สูงสุด 60s) */
function rtReconnect(){
  if(!cloudOn || !cloudUser || !session.role) return;
  clearTimeout(rtRetryTimer);
  const wait = Math.min(60000, 5000 * Math.pow(2, Math.min(rtRetry, 4)));
  rtRetry++;
  rtRetryTimer = setTimeout(()=>{ rtStart(); }, wait);
}

function rtStamp(){
  const el = document.getElementById('syncStamp');
  if(!el) return;
  const hm = t=> new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  const m = document.getElementById('mSync');
  const set = (txt, color)=>{ el.textContent = txt; el.style.color = color || 'var(--muted)';
    if(m){                                   /* ป้ายมือถือ: ข้อความสั้น */
      const c = color==='var(--red)' ? 'bad' : (color==='#0B3D91' ? 'new' : (color==='var(--amber)' ? 'warn' : ''));
      m.className = 'msync' + (c ? ' '+c : '');
      m.textContent = txt.replace(/ · กด 🔄 ซิงค์/,' · แตะซิงค์').replace(/ — รอสักครู่ก่อนแก้/,'').replace(/ · ระบบจะรวมให้ตอนบันทึก/,'').replace(/ · บันทึกอัตโนมัติ \S+/,' ☁️').replace(/ · งานเก็บในเครื่อง/,'');
    } };
  if(!navigator.onLine) return set('⚠ ไม่มีอินเทอร์เน็ต · งานเก็บในเครื่อง', 'var(--red)');
  if(!cloudOn) return set('ทำงานแบบออฟไลน์');
  if(!rtLastPull) return set(_loading ? '⏳ กำลังโหลดข้อมูลล่าสุด — รอสักครู่ก่อนแก้' : '⏳ ยังไม่ได้โหลดจากระบบ (ข้อมูลในเครื่อง)', 'var(--amber)');
  if(rtPending) return set((hasPending() ? '🔵 มีคนอื่นแก้ข้อมูล · ระบบจะรวมให้ตอนบันทึก' : '🔵 มีข้อมูลใหม่ · กด 🔄 ซิงค์'), '#0B3D91');
  if(hasPending()) return set('✏️ ยังไม่ได้บันทึก · กด 💾', 'var(--amber)');
  /* ไม่มีการเช็กเป็นรอบ — รู้ว่ามีของใหม่จากสัญญาณเรียลไทม์ · สัญญาณหลุดนาน = อาจไม่ล่าสุด */
  if(!rtOk && Date.now() - Math.max(rtLastPull||0, _syncLast||0) > 5*60000) return set('🟡 ข้อมูลอาจไม่ล่าสุด · กด 🔄 ซิงค์', 'var(--amber)');
  set((rtOk ? '🟢 ' : '🟡 ') + 'โหลดล่าสุด ' + hm(rtLastPull));
}
/* มีสัญญาณว่ามีคนแก้ (Realtime) → ตรวจเวลาแก้ล่าสุด แล้วแจ้ง "มีข้อมูลใหม่" (ไม่โหลดเอง) */
let _rtLastCheck = 0;
function rtRefresh(reason){
  if(!cloudOn || !cloudUser || !session.role) return;
  /* สัญญาณถี่ (หรือมีคนส่งสัญญาณมั่ว) → เช็กไม่เกิน 1 ครั้ง/10 วิ */
  const wait = 10000 - (Date.now() - _rtLastCheck);
  if(wait > 0){ clearTimeout(rtQueueTimer); rtQueueTimer = setTimeout(()=>rtRefresh(reason), wait); return; }
  _rtLastCheck = Date.now();
  syncCheck(reason||'realtime');
}
/* ===== ข้อมูลล่าสุดเสมอ =====
   ตรวจ "เวลาแก้ล่าสุด" ของหมู่บ้าน/งาน (เบามาก) ทุก 1 นาที · ตอนกลับมาที่หน้าจอ · ตอนเน็ตกลับมา · ตอนมีสัญญาณ Realtime
   มีคนอื่นแก้ + เครื่องนี้ไม่มีงานค้าง → โหลดใหม่ให้เอง · มีงานค้าง → แจ้ง และตอนกดบันทึกระบบจะรวมให้ก่อน */
function stampsOf(vils, jobs){
  const v = {}, j = {};
  (vils||[]).forEach(x=>{ if(x && x.id) v[x.id] = String(x.updated_at||''); });
  (jobs||[]).forEach(x=>{ if(x && x.id) j[x.id] = String(x.updated_at||''); });
  return { v, j };
}
async function readStamps(){
  const [a, b] = await Promise.all([ fetchAll('villages', 'id,updated_at'), fetchAll('boq_jobs', 'id,updated_at').catch(()=> null) ]);
  return stampsOf(a, b || null);
}
/* หมู่บ้าน/งานที่เปลี่ยนเทียบกับตอนโหลด (เพิ่ม/ลบ/แก้) */
function stampDiff(o, n){
  if(!o || !n) return [];
  const out = [];
  const cmp = (A, Bx, tag, skipJobs)=>{
    if(skipJobs) return;
    Object.keys(Bx).forEach(id=>{ if(A[id] !== Bx[id]) out.push(tag+id); });
    Object.keys(A).forEach(id=>{ if(!(id in Bx)) out.push(tag+id); });
  };
  cmp(o.v||{}, n.v||{}, 'v:');
  cmp(o.j||{}, n.j||{}, 'j:', !n.j || !Object.keys(n.j).length && !Object.keys(o.j||{}).length);
  return out;
}
let _syncBusy = false, _syncLast = 0;
async function syncCheck(reason){
  if(!cloudOn || !cloudUser || !session || !session.role || session.role==='checker' || window._checkerMode) return;
  if(_syncBusy || _saving || _loading || !window._stamps) return;
  if(!navigator.onLine) { rtStamp(); return; }
  _syncBusy = true;
  try{
    const n = await readStamps();
    _syncLast = Date.now();
    const ch = stampDiff(window._stamps, n);
    if(!ch.length){ rtPending = false; rtStamp(); refreshSaveBtn(); return; }   /* ไม่มีใครแก้ = ของในเครื่องคือล่าสุด */
    rtPending = true; refreshSaveBtn(); rtStamp();          /* แจ้งอย่างเดียว — ผู้ใช้ตัดสินใจกด 🔄 ซิงค์ เอง */
  }catch(e){ /* เน็ตหลุด — รอรอบหน้า */ }
  finally{ _syncBusy = false; }
}

/* ผู้ใช้ยืนยันใช้ค่าของตัวเอง → ใส่กลับในเครื่อง แล้วบันทึก (ฐานเทียบเป็นค่าล่าสุดแล้ว จึงไม่ชนซ้ำ) */
function confApply(idx){
  const list = window._confShown || [];
  const pick = idx ? idx.map(i=> list[i]).filter(Boolean) : list;
  let n = 0;
  pick.forEach(c=>{ if(c && c.apply && !c.done){ try{ c.apply(); c.done = true; n++; }catch(e){} } });
  if(!n) return;
  const left = list.filter(c=> c.apply && !c.done);
  persist(); render();
  if(left.length) showSyncConflicts(left); else { const b = document.getElementById('syncConfBar'); if(b) b.remove(); }
  toast('ใส่ค่าของคุณกลับแล้ว — กด 💾 บันทึก เพื่อส่งขึ้นระบบ');
}
/* ปุ่ม 🔄 ซิงค์ — ทำครบในปุ่มเดียว:
   1) มีงานค้างในเครื่อง → บันทึกขึ้นก่อน (รวมกับที่คนอื่นแก้ รายช่อง ไม่ทับกัน)
   2) โหลดข้อมูลล่าสุดทั้งหมด  3) ต่อสัญญาณเรียลไทม์ใหม่ถ้าหลุด  4) เช็กเวอร์ชันโปรแกรม
   ไม่ต้องเลือกว่าจะ "บันทึก" หรือ "โหลด" ก่อน และงานค้างไม่ถูกทับ */
async function pullNow(){
  if(_saving || _loading){ toast('กำลังซิงค์อยู่ รอสักครู่...'); return; }
  if(!cloudOn || !cloudUser){ toast('ทำงานแบบออฟไลน์ — ไม่ได้เชื่อมต่อระบบ'); return; }
  if(!navigator.onLine){ toast('ไม่มีอินเทอร์เน็ต — งานยังอยู่ในเครื่อง'); return; }
  if(!session || !session.role || session.role==='checker' || window._checkerMode) return;
  const pd = document.getElementById('pullDot'); if(pd) pd.textContent = '⏳ ซิงค์...';
  let bak = null;
  try{
    /* 1) งานค้าง → บันทึกก่อน (ไม่ผ่าน = ไม่โหลดทับ) */
    if(hasPending()){
      await saveNow(true);
      if(hasPending()){ refreshSaveBtn(); toast('บันทึกงานในเครื่องไม่สำเร็จ — ยังไม่โหลดทับ (งานยังอยู่ในเครื่อง) ลองอีกครั้ง'); return; }
    }
    /* 2) มีโปรแกรมเวอร์ชันใหม่ → โหลดหน้าใหม่ทั้งหน้า (ไม่ใช้แคชเดิม) */
    await checkAppVersion();
    if(window._newVer){ toast('กำลังอัปเดตโปรแกรมเป็นเวอร์ชันใหม่...'); hardReload(); return; }
    /* 3) ล้างข้อมูลชุดเดิมในเครื่อง แล้วโหลดจากระบบใหม่ทั้งหมด — เห็นของล่าสุดแน่นอน ไม่มีของเก่าค้าง
          (ยกเว้นความคุ้มทุนที่ยังไม่ได้บันทึก → คงไว้ ไม่ล้าง) */
    const roiKeep = (state.villages||[]).some(v=> v._roiDirty || v._nonDirty || v._roiMerge || !v.cloudId);
    _saving = true; refreshSaveBtn();
    if(!roiKeep){
      try{ roiSnapTake('ก่อนซิงค์'); }catch(e){}
      bak = { v: state.villages, j: B.jobs, nl: window._nonLoaded, na: window._nonAll, cs: window._roiCloudSig, nn: window._nonN };
      state.villages = [];
      B.jobs = (B.jobs||[]).filter(j=> !j.cloudId);
      window._nonLoaded = {}; window._nonAll = false; window._roiCloudSig = {}; window._nonN = {};
    }
    window._lastPullOk = false;
    await cloudPull();
    if(!window._lastPullOk) throw new Error('pull failed');
    bak = null;
    rtLastPull = Date.now(); _syncLast = Date.now(); rtPending = false;
    _saving = false;
    if(!rtOk) rtStart();
    rtStamp(); render(); refreshSaveBtn();
    toast('🔄 ข้อมูลล่าสุดจากระบบแล้ว');
  }catch(e){
    /* โหลดไม่สำเร็จ → คืนข้อมูลชุดเดิมในเครื่อง (ห้ามปล่อยหน้าว่าง/ห้ามบันทึกชุดว่างทับ) */
    if(bak){ state.villages = bak.v; B.jobs = bak.j; window._nonLoaded = bak.nl; window._nonAll = bak.na; window._roiCloudSig = bak.cs; window._nonN = bak.nn;
      try{ persistLocalOnly(); render(); }catch(e2){} }
    _saving = false; _loading = false; refreshSaveBtn(); rtStamp();
    toast('ซิงค์ไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วลองใหม่ (ข้อมูลในเครื่องยังอยู่ครบ)');
  }
}

function askSaveThen(next){
  if(!cloudOn || !cloudUser || !session || !session.role || window._checkerMode || !hasPending() || _saving) return next();
  if(confirm('💾 ยังไม่ได้บันทึกงานที่แก้\n\nกด OK = บันทึกขึ้นระบบตอนนี้\nกด ยกเลิก = ยังไม่บันทึก (งานยังอยู่ในเครื่องนี้ คนอื่นยังไม่เห็น)')){

}

/* เริ่มฟังการเปลี่ยนแปลง */
function rtStart(){
  if(!cloudOn || !cloudUser) { rtStamp(); return; }
  rtStop();
  try{
    rtChannel = sb.channel('ftth-live', { config: { broadcast: { self: false } } })
      /* สัญญาณ "มีคนบันทึก" ส่งตรงระหว่างเครื่อง (ไม่มีข้อมูลในสัญญาณ) — ทำงานแม้ฐานข้อมูลไม่ได้เปิด Realtime ของตาราง */
      .on('broadcast', { event:'saved' }, ()=>rtQueue())
      .on('postgres_changes', {event:'*', schema:'public', table:'villages'}, ()=>rtQueue())
      .on('postgres_changes', {event:'*', schema:'public', table:'houses'},   ()=>rtQueue())
      .on('postgres_changes', {event:'*', schema:'public', table:'boq_jobs'}, ()=>rtQueue())
      .subscribe(st=>{
        if(st==='SUBSCRIBED'){ rtOk = true; rtRetry = 0; rtStamp(); if(window._stamps) syncCheck('subscribed'); }   /* ต่อสัญญาณได้ (ใหม่) → เช็กของที่พลาดไประหว่างหลุด */
        else if(st==='CHANNEL_ERROR' || st==='TIMED_OUT' || st==='CLOSED'){ rtOk = false; rtStamp(); rtReconnect(); }
      });
  }catch(e){ rtOk = false; rtReconnect(); }
  rtStamp();
}
function rtStop(){
  try{ if(rtChannel) sb.removeChannel(rtChannel); }catch(e){}
  rtChannel = null;
  clearInterval(rtPollTimer); rtPollTimer = null;
}

async function saveNow(auto){
  if(window._checkerMode) return;
  if(_saving) return;
  _saving = true; refreshSaveBtn();
  try{
    persistLocalOnly();
    try{ localStorage.setItem(LS, JSON.stringify(B)); }catch(e){}
    /* จำว่าอะไรเปลี่ยนบ้าง ก่อนที่ flush จะล้างธงทิ้ง */
    const dirtyIds = state.villages.filter(v => v._dirty || v._hDirty || !v.cloudId).map(v=>v.id);
    _pushOnly = dirtyIds;      /* ยึดรายชื่อที่จำไว้ก่อน flush เสมอ */
    /* ก่อนส่ง: มีคนอื่นแก้หลังเราโหลดหรือยัง (หลังบันทึกจะโหลดใหม่ให้ ให้เห็นของล่าสุดครบ) */
    let remote = rtPending;

  }catch(e){
    _saving=false; refreshSaveBtn();
    toast('บันทึกไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วลองใหม่');

async function cloudPush(){
  if(!cloudOn || !cloudUser || !cloudDirty) return { ok:true, fails:[] };
  cloudDirty = false;
  const fails = []; window._houseErrs = []; window._roiNoSql = false;
  const dot = document.getElementById('syncDot'); if(dot) dot.textContent='⏳ กำลังบันทึก';
  try{
    /* vendors (admin เท่านั้นที่มีสิทธิ์เขียนทุกราย) */
    if(isAdmin()){
      /* ส่งเฉพาะรายที่ยังไม่มีบน cloud หรือถูกแก้ — ปกติจะไม่ส่งเลย ประหยัด 1 รอบ */
      const vd = realVendors().filter(v=> !v.cloudId || v._dirty);
      await Promise.all(vd.map(v=>
        sb.from('vendors').upsert({ id:v.cloudId||undefined, name:v.name, prices:v.prices||{} }, {onConflict:'id'}).select('id').single()
          .then(r=>{ if(r.error){ fails.push('Vendor '+v.name+': '+errMsg(r.error)); return; } if(r.data) v.cloudId=r.data.id; delete v._dirty; })
      ));
    }
    /* PO (admin เท่านั้น) */
    let posTableOk = true;
    let closeColsOk = true, roiColOk = true;
    if(isAdmin() && (B.pos||[]).length){
      const pd = B.pos.filter(p=> !p.cloudId || p._dirty);
      if(pd.length){
        try{
          await Promise.all(pd.map(async p=>{
            const { data, error } = await sb.from('pos').upsert({ id:p.cloudId||undefined, code:p.code, name:p.name||'', amount:+p.amount||0 }, {onConflict:'id'}).select('id').single();
            if(error) throw error;
            if(data){ p.cloudId = data.id; delete p._dirty; }
          }));
        }catch(e){ posTableOk = false; }   /* ยังไม่ได้รัน supabase-po.sql — ข้ามไปก่อน */
      }

    /* ส่งเฉพาะรายการที่เปลี่ยนจริง — เร็วขึ้นมากเมื่อมี 28 หมู่บ้าน/2,400 หลัง */
    const allV = visibleVillages();
    let targets;
    if(Array.isArray(_pushOnly)){
      const set = new Set(_pushOnly);
      targets = allV.filter(v => set.has(v.id) || !v.cloudId);
    } else {
      const chg = allV.filter(v => v._dirty || v._hDirty || !v.cloudId);
      targets = chg.length ? chg : allV;          /* ไม่มีร่องรอย = ส่งทั้งหมด (ครั้งแรก) */
    }
    /* ส่งหลายหมู่บ้านพร้อมกันครั้งละ 4 — เร็วขึ้นมากเมื่อแก้หลายหมู่บ้าน */
    const pushOne = async (v)=>{
      /* แถวหมู่บ้าน: มีฐานเทียบ (โหลดจากระบบแล้ว) → ส่งเฉพาะช่องที่แก้ · ไม่มีฐาน (ใหม่/ข้อมูลเก่าในเครื่อง) → ส่งทั้งแถวแบบเดิม */
      const full = villageRowOf(v);
      if(!closeColsOk) V_CLOSE_KEYS.forEach(k=> delete full[k]);
      let r, sent = null;
      if(v.cloudId && v._vbase){
        const diff = {};
        Object.keys(full).forEach(k=>{ if(stableSig(full[k]) !== stableSig(v._vbase[k])) diff[k] = full[k]; });
        if(!Object.keys(diff).length) r = { data:{ id:v.cloudId } };
        else {
          /* อ่านแถวล่าสุดก่อน: ขั้นงานรวมรายขั้น · ช่องเดียวกันที่คนอื่นแก้ไปแล้ว = แจ้งให้ตรวจ (ใช้ค่าของเรา) */
          try{
            const fr = await sb.from('villages').select('*').eq('id', v.cloudId).single();
            if(fr && !fr.error && fr.data){
              const now = villageBaseOfCloud(fr.data);
              if('tasks' in diff){ const mt = mergeTasks3(v._vbase.tasks, full.tasks, now.tasks, v.name, v);
                diff.tasks = mt; full.tasks = mt; v.tasks = JSON.parse(JSON.stringify(mt)); }
              Object.keys(diff).forEach(k=>{ if(k==='tasks' || k==='homes_done' || !(k in now)) return;
                const S0 = stableSig(now[k]), Bs = stableSig(v._vbase[k]);
                if(S0 !== Bs && S0 !== stableSig(diff[k])){
                  const f = V_FIELD[k];
                  if(f && k !== 'vendor_id'){
                    /* ทั้งคู่แก้ช่องเดียวกัน → ใช้ค่าที่บันทึกก่อน (บนระบบ) · แจ้งให้เลือก "ใช้ค่าของฉัน" */
                    const mineV = JSON.parse(JSON.stringify(v[f]===undefined?null:v[f]));
                    v[f] = JSON.parse(JSON.stringify(now[k])); v._vbase[k] = JSON.parse(JSON.stringify(now[k]));
                    window._syncConflicts.push({ where: v.name, field: (V_LABEL[k]||k), theirs: now[k], mine: diff[k],
                      apply: ()=>{ v[f] = mineV; v._dirty = true; } });
                    delete diff[k];
                  } else window._syncConflicts.push({ where: v.name, field: (V_LABEL[k]||k), theirs: now[k], mine: diff[k] });
                } });
              /* ช่องที่เราไม่ได้แก้แต่คนอื่นแก้ → รับมาไว้ในเครื่อง */
              Object.keys(now).forEach(k=>{ if(k in diff || k==='homes_done') return;
                const f = V_FIELD[k]; if(!f || k==='vendor_id') return;
                if(stableSig(now[k]) !== stableSig(v._vbase[k]) && stableSig(full[k]) === stableSig(v._vbase[k])){ v[f] = JSON.parse(JSON.stringify(now[k])); v._vbase[k] = JSON.parse(JSON.stringify(now[k])); } });
            }
          }catch(e){}
          diff.updated_at = new Date().toISOString();
          r = await sb.from('villages').update(diff).eq('id', v.cloudId).select('id').single();
          if(r.error && isColErr(r.error) && closeColsOk){
            closeColsOk = false; V_CLOSE_KEYS.forEach(k=>{ delete diff[k]; delete full[k]; });
            r = Object.keys(diff).length > 1 ? await sb.from('villages').update(diff).eq('id', v.cloudId).select('id').single() : { data:{ id:v.cloudId } };

          }

        ['last_move','code','cust_until'].forEach(k=>{ if(!vrow[k]) delete vrow[k]; });
        r = await sb.from('villages').upsert(vrow, {onConflict:'id'}).select('id').single();
        if(r.error && isColErr(r.error) && closeColsOk){
          /* คอลัมน์ปิดโครงการยังไม่มีใน cloud -> ส่งใหม่แบบไม่มีฟิลด์นั้น (เฉพาะ error เรื่องคอลัมน์เท่านั้น) */
          closeColsOk = false;
          V_CLOSE_KEYS.forEach(k=>{ delete vrow[k]; delete full[k]; });
          r = await sb.from('villages').upsert(vrow, {onConflict:'id'}).select('id').single();
          showCloudSchemaWarning('ปิดโครงการ', 'supabase-close-project.sql');
        }
        sent = vrow;
      }
      if(r.error || !r.data){ fails.push(v.name+': '+errMsg(r.error||'ไม่ได้รับการยืนยัน')); return; }   /* คง _dirty ไว้ ส่งใหม่รอบหน้า */
      v.cloudId = r.data.id;
      /* ฐานใหม่ = ค่าที่ส่งสำเร็จ (ช่องที่ไม่ได้ส่ง = เท่าเดิม) */
      /* มีฐาน → ฐานใหม่ = ฐานเดิม + ช่องที่ส่งสำเร็จ · ไม่มีฐาน (ส่งทั้งแถว) → ยังไม่ตั้งฐาน รอโหลดจากระบบรอบหน้า */
      if(sent && v._vbase){ const nb = Object.assign({}, v._vbase); Object.keys(sent).forEach(k=>{ if(k!=='updated_at' && k!=='id') nb[k] = JSON.parse(JSON.stringify(sent[k]===undefined?null:sent[k])); }); v._vbase = nb; }
      const roiRes = window._roiNoSql ? 'nosql' : await pushRoi(v);
      const roiOk = roiRes === true || roiRes === 'nosql';
      if(roiRes === 'nosql'){ if(roiHasData(v.roi)) v._roiDirty = true; window._roiGen = (window._roiGen||0) + 1; }   /* เก็บไว้ส่งหลังรัน SQL */
      else if(!roiOk) fails.push(v.name+' (ความคุ้มทุน)');
      let jobOk = true;
      /* houses (Unit) — ส่งขึ้นเมื่อมีการเปลี่ยนแปลง */
      if(v.cloudId && v._hDirty) await pushHouses(v);          /* พลาด = บันทึกใน _houseErrs · คงธงไว้ */
      const jb = B.jobs.find(j=>j.villageId===v.id);
      if(jb && v.cloudId){
        const jfull = jobRowOf(jb, v, posTableOk);
        let rj, jsent = null;
        if(jb.cloudId && jb._jbase){
          /* ส่งเฉพาะช่องที่แก้ — ผรม.บันทึกจำนวนที่ใช้ / ผู้ดูแลแก้ราคา พร้อมกันได้ไม่ทับกัน */
          const diff = {};
          Object.keys(jfull).forEach(k=>{ if(stableSig(jfull[k]) !== stableSig(jb._jbase[k])) diff[k] = jfull[k]; });
          if(!Object.keys(diff).length) rj = { data:{ id:jb.cloudId } };
          else {
            diff.updated_at = new Date().toISOString();
            rj = await sb.from('boq_jobs').update(diff).eq('id', jb.cloudId).select('id').single();
            if(rj.error && isColErr(rj.error) && 'po_id' in diff){ delete diff.po_id; delete jfull.po_id;
              rj = await sb.from('boq_jobs').update(diff).eq('id', jb.cloudId).select('id').single(); }
            jsent = diff;
          }
        } else {
          const jrow = Object.assign({ id:jb.cloudId||undefined }, jfull, { updated_at:new Date().toISOString() });
          rj = await sb.from('boq_jobs').upsert(jrow, {onConflict:'id'}).select('id').single();
          if(rj.error && isColErr(rj.error) && 'po_id' in jrow){
            delete jrow.po_id; delete jfull.po_id;   /* คอลัมน์ po_id ยังไม่มี -> ส่งใหม่โดยไม่มี po_id */
            rj = await sb.from('boq_jobs').upsert(jrow, {onConflict:'id'}).select('id').single();
          }
          jsent = jrow;
        }
        if(rj.error || !rj.data){ jobOk = false; fails.push(v.name+' (BOQ): '+errMsg(rj.error)); }
        else {
          jb.cloudId = rj.data.id;
          if(jsent && jb._jbase){ const nb = Object.assign({}, jb._jbase); Object.keys(jsent).forEach(k=>{ if(k!=='updated_at' && k!=='id') nb[k] = JSON.parse(JSON.stringify(jsent[k]===undefined?null:jsent[k])); }); jb._jbase = nb; }
        }
      }
      if(roiOk && jobOk) delete v._dirty;          /* ส่งไม่ครบ = คงไว้ ส่งใหม่รอบหน้า */
    };
    for(let i=0;i<targets.length;i+=4){
      await Promise.all(targets.slice(i,i+4).map(v=>pushOne(v).catch(e=>{ fails.push(v.name+': '+errMsg(e)); })));
      if(dot && targets.length>4) dot.textContent = '⏳ '+Math.min(i+4,targets.length)+'/'+targets.length;
    }
    /* ความคุ้มทุนแบบใหม่: ส่งทุกส่วนที่เปลี่ยนในรายการเดียว (ต้องหลังสร้างหมู่บ้านใหม่บนระบบแล้ว) */
    if(window._roiV2 && isAdmin()){
      let rr;
      try{ rr = await pushRoiV2(); }catch(e){ rr = { ok:false, err:errMsg(e) }; }
      if(!rr.ok){
        fails.push('ความคุ้มทุน: '+rr.err);
        state.villages.forEach(v=>{ if(v._roiDirty) v._dirty = true; });   /* คงสถานะรอบันทึก */
      }
    }
    persistLocalOnly();
    showRoiSetupNote(!!window._roiNoSql);
    window._houseErrs.forEach(x=>{ if(fails.indexOf(x)<0) fails.push(x); });
    if(fails.length){
      cloudDirty = true;
      if(dot){ dot.textContent='⚠️ บันทึกไม่ครบ'; dot.title = fails.join('\n'); }
      return { ok:false, fails };
    }
    if(dot){ dot.textContent='✅ บันทึกแล้ว'; setTimeout(refreshSaveBtn, 1200); }
    return { ok:true, fails:[] };
  }catch(e){
    if(dot){ dot.textContent='⚠️'; dot.title='ซิงค์ไม่สำเร็จ: '+e.message; }
    cloudDirty = true;
    return { ok:false, fails: fails.concat([errMsg(e)]) };
  }

/* Supabase ส่งกลับสูงสุด 1000 แถว/ครั้ง — ต้องดึงเป็นชุดจนครบ
   (ข้อมูลจริง 2,400+ หลัง ถ้าไม่ทำจะได้ไม่ครบ หมู่บ้านท้ายๆ จะขึ้น 0) */
/* โหลดทั้งตาราง — แบบ "ต่อจาก id ล่าสุด" (keyset) ทีละ 1,000 แถว
   · เดิมใช้ข้ามแถว (offset) + นับทั้งหมด: ยิ่งบ้านเยอะ ฐานข้อมูลยิ่งต้องตรวจสิทธิ์ซ้ำทุกแถวที่ข้าม → statement timeout
   · แบบนี้แต่ละหน้าตรวจแค่ 1,000 แถวของหน้านั้น · houses แบ่ง 4 ช่วง id โหลดพร้อมกัน (เร็วเท่าเดิม)
   · หน้าไหนพลาด ลองใหม่ (หมดเวลา → ลดขนาดหน้า) ยังพลาด = ล้มทั้งชุด (ห้ามได้ข้อมูลไม่ครบโดยไม่รู้ตัว) */
async function fetchAll(table, cols){
  const SZ = 1000;
  cols = cols || '*';
  let keyset = false;
  try{ const q = sb.from(table).select(cols); keyset = !!q && ['gt','gte','lt','limit','order'].every(f=> typeof q[f]==='function'); }catch(e){}
  if(!keyset) return fetchAllOffset(table, cols);
  const U = h => h + '0000000-0000-0000-0000-000000000000';
  const cuts = table==='houses' ? ['', '4', '8', 'c', null] : ['', null];
  const shard = async (lo, hi)=>{
    let last = null, size = SZ, out = [];
    for(let guard = 0; guard < 2000; guard++){
      let r = null;
      for(let t = 0; t < 3; t++){
        let q = sb.from(table).select(cols).order('id', {ascending:true}).limit(size);
        if(lo) q = q.gte('id', U(lo));
        if(hi) q = q.lt('id', U(hi));
        if(last != null) q = q.gt('id', last);
        try{ r = await q; }catch(e){ r = { error:e }; }
        if(r && !r.error) break;
        if(r && r.error && (isPermErr(r.error) || isColErr(r.error))) throw r.error;     /* ไม่มีสิทธิ์/ไม่มีคอลัมน์ — ลองซ้ำไม่ช่วย */
        if(/timeout|canceling/i.test(errMsg(r && r.error))) size = Math.max(100, Math.floor(size/4));
        if(t === 2) throw (r && r.error) || new Error('โหลด '+table+' ไม่สำเร็จ');
        await new Promise(res=> setTimeout(res, 400*(t+1)));
      }
      const rows = r.data || [];
      out = out.concat(rows);
      if(rows.length < size) break;
      last = rows[rows.length-1].id;
    }
    return out;
  };
  const parts = [];
  for(let i = 0; i < cuts.length-1; i++) parts.push(shard(cuts[i], cuts[i+1]));
  let out = []; (await Promise.all(parts)).forEach(rows=>{ out = out.concat(rows); });
  /* กันแถวซ้ำ (มีคนบันทึกระหว่างโหลด) */
  const seen = new Set();
  return out.filter(x=>{ if(!x || x.id==null) return true; if(seen.has(x.id)) return false; seen.add(x.id); return true; });
}
/* แบบเดิม (สำรอง — ใช้เมื่อตัวเชื่อมต่อไม่รองรับ keyset) */
async function fetchAllOffset(table, cols){
  const SZ = 1000;
  const page = async (from)=>{
    for(let t=0; t<2; t++){
      const r = await sb.from(table).select(cols||'*').order('id', {ascending:true}).range(from, from+SZ-1);
      if(r && !r.error) return r;
      if(t===1) throw (r && r.error) || new Error('โหลด '+table+' ไม่สำเร็จ');
    }
  };
  let out = [];
  for(let from = 0, guard = 0; guard < 500; guard++, from += SZ){
    const rows = (await page(from)).data || [];
    out = out.concat(rows);
    if(rows.length < SZ) break;
  }
  const seen = new Set();
  return out.filter(x=>{ if(!x || x.id==null) return true; if(seen.has(x.id)) return false; seen.add(x.id); return true; });
}
/* ===== รายหลัง + ข้อมูลส่วนบุคคลลูกค้า =====
   หลังรัน ปิดช่องโหว่สิทธิ์และข้อมูลส่วนบุคคล.sql: อ่านตารางได้ทุกช่องยกเว้นชื่อ/เบอร์/ที่อยู่
   → ข้อมูลลูกค้าอ่านผ่าน ftth_house_pii() ซึ่งระบบตรวจสิทธิ์ (ผู้ดูแล/Planning · ผรม.เฉพาะช่วงเปิดดวงตา)
   ก่อนรัน: อ่านแบบเดิม (ทุกช่อง) */
const HOUSE_COLS = 'id,village_id,no,status,lat,lng,solution,estimate,detail,vlc,olt,interest,sub_contract';
const PII_MODE_KEY = 'ftth-pii-mode';
function piiMode(){ try{ return localStorage.getItem(PII_MODE_KEY) || ''; }catch(e){ return ''; } }
function setPiiMode(m){ window._piiMode = m; try{ localStorage.setItem(PII_MODE_KEY, m); }catch(e){} }
const isPermErr = e => !!e && (e.code==='42501' || /permission denied/i.test(e.message||''));
async function fetchPii(){
  const out = {}; let after = null;
  for(let g=0; g<500; g++){
    let r; try{ r = await sb.rpc('ftth_house_pii', after ? { after_id: after, lim: 1000 } : { lim: 1000 }); }catch(e){ r = { error:e }; }
    if(!r || r.error) throw (r && r.error) || new Error('โหลดข้อมูลลูกค้าไม่สำเร็จ');
    const rows = r.data || [];
    rows.forEach(x=>{ out[x.id] = x; });
    if(rows.length < 1000) break;
    after = rows[rows.length-1].id;
  }
  return out;
}
async function fetchHousesSmart(){
  window._piiMode = window._piiMode || piiMode();
  if(window._piiMode !== 'rpc'){
    try{ const rows = await fetchAll('houses'); window._piiMode = 'cols'; rows.forEach(h=>{ h._pii = true; }); return rows; }
    catch(e){ if(!isPermErr(e)) throw e; setPiiMode('rpc'); }
  }
  let rows;
  try{ rows = await fetchAll('houses', HOUSE_COLS); }
  catch(e){
    if(isPermErr(e) || !isColErr(e)) throw e;
    rows = await fetchAll('houses', HOUSE_COLS.replace(',sub_contract',''));
  }
  let pii = null;
  try{ pii = await fetchPii(); }catch(e){ pii = null; try{ console.error('[pii]', e); }catch(_){} }
  rows.forEach(h=>{
    const p = pii && pii[h.id];

  });
  return rows;
}
