          if(!('_roiFull' in prev)){
            const ks = nv._nonDirty = nv._nonDirty || [];
            const nm = prev.roi.nonVlc || {};
            Object.keys(nm).forEach(c=>{ if(nm[c] && Array.isArray(nm[c].list) && nm[c].list.length && ks.indexOf('vlc:'+c)<0) ks.push('vlc:'+c); });
            if(prev.roi.non && Array.isArray(prev.roi.non.list) && prev.roi.non.list.length && ks.indexOf('vil:'+nv.cloudId)<0) ks.push('vil:'+nv.cloudId);
            if(!ks.length) delete nv._nonDirty;
          }
        } else {
          nv.roi = roiV2Build(nv, roiAct, false); nv._roiFull = false;
          if(!isAdmin()) nv.roi = roiStripForPlanning(nv.roi);
        }
      }
      else if(isAdmin()){
        const loc = prev && prev.roi;
        if(cr && roiHasData(cr)) roiCloudN++;
        if(cr && prev && (prev._dirty || prev._roiDirty) && roiHasData(loc)){
          /* ในเครื่องมีการแก้ที่ยังไม่บันทึก (เช่น เพิ่งนำเข้า Excel) → ของในเครื่องชนะ · หัวข้อที่ในเครื่องไม่มีเติมจากระบบ */
          nv.roi = Object.assign({}, cr, loc);
          nv._dirty = true; if(prev._roiDirty) nv._roiDirty = true; roiRescued = true; roiRescueN++;
        }
        else if(cr){
          nv.roi = cr;
          if(window._roiLocked) nv._roiSig = stableSig(cr);
          /* หัวข้อที่มีในเครื่องแต่ระบบยังไม่มี (เคยส่งไม่สำเร็จ) → เติมจากเครื่อง แล้วรอส่งขึ้นระบบ */
          if(roiHasData(loc)){
            const miss = ROI_KEYS.filter(k=> roiKeyHas(loc[k]) && !roiKeyHas(cr[k]));
            if(miss.length){
              nv.roi = Object.assign({}, cr); miss.forEach(k=> nv.roi[k] = loc[k]);
              /* เลข Non ก่อนปิดตารางลับ อยู่ในเครื่องเท่านั้น (ไม่ใช่ข้อมูลค้างส่ง) */
              const real = miss.filter(k=> window._roiLocked || (k!=='nonVlc' && k!=='non'));
              if(real.length){ nv._dirty = true; roiRescued = true; roiRescueN++; }
            }
          }
        }
        else if(roiHasData(loc)){ nv.roi = loc; nv._dirty = true; if(prev._roiDirty) nv._roiDirty = true; roiRescued = true; roiRescueN++; }
        else if(loc) nv.roi = loc;
      } else if(canViewAll()){
        nv.roi = cr ? roiStripForPlanning(cr) : null;
      } else {
        nv.roi = null;
      }
      if(dirty){
        nv._hDirty = true;
        if(!canViewAll()) (nv.houses||[]).forEach(h=>{ if(!piiRowAllowed(nv)){ delete h.name; delete h.addr; delete h.phone; } });
        nv.homesDone = houses.filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
      }
      return nv;
    });
    if(rescued || closeRescued || roiRescued){
      cloudDirty = true;                        /* รอผู้ใช้กด 💾 บันทึก — ไม่ส่งเอง */
      try{ markUnsaved(); }catch(e){}
    }
    if(isAdmin()){
      window._roiCloudN = roiCloudN; window._roiPendingN = roiRescueN;
      if(roiRescueN) setTimeout(()=> toast('ข้อมูลความคุ้มทุน ' + roiRescueN + ' หมู่บ้านยังไม่อยู่บนระบบ — กด 💾 บันทึก แล้ว Planning/มือถือจะเห็นลูกค้า Active'), 900);
    }
    autoFixShifted();
    /* PO: ใช้ของ cloud เมื่อดึงได้จริงและมีข้อมูล มิฉะนั้นคง PO ในเครื่องไว้ (กันหาย) */
    const localPos = (B.pos||[]).slice();
    let poRescued = false;
    if(!canViewAll()){
      B.pos = (posOk && posRows) ? posRows.map(p=>({ id:p.id, cloudId:p.id, code:p.code, name:p.name||'', amount:+p.amount||0 })) : [];
    } else if(posOk && posRows && posRows.length){
      B.pos = posRows.map(p=>({ id:p.id, cloudId:p.id, code:p.code, name:p.name||'', amount:+p.amount||0 }));
    } else if(localPos.length){
      B.pos = localPos; poRescued = true;      // cloud ยังไม่มี -> เก็บของเดิมไว้แล้วส่งขึ้นรอบหน้า
    } else {
      B.pos = [];
    }
    /* จับคู่ poId เดิมไว้ เผื่อ cloud ยังไม่มีคอลัมน์ po_id */
    const prevJobPO = {};
    (B.jobs||[]).forEach(j=>{ if(j.cloudId && j.poId) prevJobPO[j.cloudId] = j.poId; });
    const poCloudToLocal = {};
    (B.pos||[]).forEach(p=>{ if(p.cloudId) poCloudToLocal[p.cloudId] = p.id; });
    const prevJobs = {}; (B.jobs||[]).forEach(j=>{ if(j.cloudId) prevJobs[j.cloudId] = j; });
    let jobRescued = false;
    B.jobs = (jobs||[]).map(j=>{
      let poId = '';
      if(j.po_id) poId = poCloudToLocal[j.po_id] || j.po_id;
      else if(prevJobPO[j.id]) poId = prevJobPO[j.id];      // cloud ไม่มีข้อมูล -> คงของเดิม
      const nj = { id:j.id, cloudId:j.id, villageId:j.village_id, vendorId:j.vendor_id, poId:poId, prices:j.prices||{}, bqty:j.bqty||{}, qty:j.qty||{} };
      /* ฐานเทียบ = ค่าบนระบบ · ช่องที่เครื่องนี้แก้ค้าง (ต่างจากฐานเดิม) → คงของในเครื่อง แล้วส่งรอบหน้า */
      const base = { village_id:j.village_id, vendor_id:j.vendor_id||null, prices:j.prices||{}, bqty:j.bqty||{}, qty:j.qty||{} };
      if(Object.prototype.hasOwnProperty.call(j, 'po_id')) base.po_id = j.po_id || null;
      const pj = prevJobs[j.id];
      if(pj && pj._jbase){
        const map = { prices:'prices', bqty:'bqty', qty:'qty' };
        Object.keys(map).forEach(k=>{ if(stableSig(pj[map[k]]||{}) !== stableSig(pj._jbase[k]||{})){ nj[map[k]] = pj[map[k]]; jobRescued = true;
          const vv = state.villages.find(x=> x.id===j.village_id || x.cloudId===j.village_id); if(vv) vv._dirty = true; } });
      }
      nj._jbase = JSON.parse(JSON.stringify(base));
      return nj;
    });
    if(jobRescued){ cloudDirty = true; try{ markUnsaved(); }catch(e){} }
    if(poRescued && isAdmin()){
      cloudDirty = true;                        /* รอผู้ใช้กด 💾 บันทึก — ไม่ส่งเอง */
      try{ markUnsaved(); }catch(e){}
    }
    try{ normalizeData(); }catch(e){}
    const dupN = dedupeAll();
    if(dupN){
      cloudDirty = true;
      toast('พบข้อมูลรายหลังซ้ำ '+dupN+' แถว — ล้างให้แล้ว กด 💾 บันทึก เพื่ออัปเดตระบบ');
    }
    persistLocalOnly();
    window._roiPullOk = window._roiPullOk===true || !roiNetFail;   /* เคยโหลดสำเร็จแล้ว = ของในเครื่องถูกต้อง */
    if(session.role){
      render();
      /* หน้าที่เปิดอยู่ (เช่น กลับมาหน้าเดิมหลังโหลดใหม่) → แสดงข้อมูลล่าสุดด้วย */
      try{ const m = ui.mode;
        if(m==='dash') renderDash(); else if(m==='roi') renderRoiMode(); else if(m==='unit') renderUnitMode();
        else if(m==='boq') bqRender(); else if(m==='vendor') renderVendorMode(); }catch(e){}
    }
    _loading = false;
    if(!hasPending()) _unsaved = false;
    rtLastPull = Date.now(); rtPending = false;          /* เพิ่งโหลดทั้งหมด = ล่าสุดแล้ว */
    window._lastPullOk = true;
    try{ trendCloudApply(window._trendRes); window._trendRes = null; }catch(e){ try{ console.error('[trend]', e); }catch(_){} }
    try{ if(trendAutoRecord() && ui.mode==='dash') renderDash(); }catch(e){}
    /* รายการ "แก้ชนกัน" เดิมผูกกับข้อมูลชุดก่อนโหลด → ปุ่ม "ใช้ค่าของฉัน" ใช้ไม่ได้แล้ว ปิดทิ้ง */
    try{ window._confShown = []; const cb = document.getElementById('syncConfBar'); if(cb) cb.remove(); }catch(e){}
    try{ rtStamp(); refreshSaveBtn(); }catch(e){}
    if(dot && !dupN){ dot.textContent='✅ ข้อมูลล่าสุด'; setTimeout(refreshSaveBtn, 1200); }
  }catch(e){
    _loading = false;
    try{ refreshSaveBtn(); }catch(e2){}
    if(dot) dot.textContent='⚠️ โหลดไม่สำเร็จ';
    window._roiPullErr = 'โหลดข้อมูลหลักไม่สำเร็จ · '+errMsg(e);
    try{ console.error('[cloudPull]', e); }catch(e4){}
    if(window._roiPullOk !== true){ window._roiPullOk = false; try{ if(ui.mode==='roi') renderRoiMode(); }catch(e3){} }
  }
}
/* อัปโหลดข้อมูลในเครื่องขึ้น cloud ครั้งแรก (รวม houses) */
async function cloudSeedFromLocal(){
  if(!requireAdmin('อัปโหลดข้อมูลขึ้น cloud')) return;
  if(!cloudOn || !cloudUser){ toast('ยังไม่ได้ตั้งค่า cloud'); return; }
  if(!confirm('อัปโหลดข้อมูลในเครื่องทั้งหมดขึ้น cloud? (ใช้ครั้งแรกครั้งเดียว)')) return;
  toast('กำลังอัปโหลดขึ้น cloud...');
  try{
    for(const p of (B.pos||[])){
      const { data } = await sb.from('pos').upsert({ id:p.cloudId||undefined, code:p.code, name:p.name||'', amount:+p.amount||0 }, {onConflict:'id'}).select('id').single();
      if(data) p.cloudId = data.id;
    }
    for(const vd of B.vendors){
      const { data } = await sb.from('vendors').upsert({ id:vd.cloudId||undefined, name:vd.name, prices:vd.prices||{} }, {onConflict:'id'}).select('id').single();
      if(data) vd.cloudId = data.id;
    }
    for(const v of state.villages){
      const seedRow = { id:v.cloudId||undefined, name:v.name, contractor:v.contractor||'', vendor_id:vendorCloudId(v.vendorId), ports:String(v.ports||''), homes_done:+v.homesDone||0, start_date:v.start||'', end_date:v.end||'', issue:v.issue||'', tasks:v.tasks||[],
        closed:!!v.closed, closed_at:v.closedAt||'', built_homes:+v.builtHomes||0, built_budget:+v.builtBudget||0, open_homes:+v.openHomes||0, plan_budget:+v.planBudget||0, plan_units:+v.planUnits||0 };
      let data = null;
      try{
        const r = await sb.from('villages').upsert(seedRow, {onConflict:'id'}).select('id').single();
        if(r.error) throw r.error;
        data = r.data;
      }catch(e){
        ['closed','closed_at','built_homes','built_budget','open_homes','plan_budget','plan_units','last_move','code','cust_until'].forEach(k=>delete seedRow[k]);
        const r2 = await sb.from('villages').upsert(seedRow, {onConflict:'id'}).select('id').single();
        data = r2.data;
      }
      if(data){
        v.cloudId = data.id;
        if((v.houses||[]).length){ const rh = await replaceHouses(v); if(!rh.ok) throw new Error(v.name+': '+rh.err); }
        const jb = B.jobs.find(j=>j.villageId===v.id);
        if(jb){
          const pRow = (B.pos||[]).find(p=>p.id===jb.poId);
          const { data:jd } = await sb.from('boq_jobs').upsert({ id:jb.cloudId||undefined, village_id:v.cloudId, vendor_id:vendorCloudId(jb.vendorId), po_id: pRow&&pRow.cloudId ? pRow.cloudId : null, prices:jb.prices||{}, bqty:jb.bqty||{}, qty:jb.qty||{} }, {onConflict:'id'}).select('id').single();
          if(jd) jb.cloudId=jd.id;
        }
      }
    }
    persistLocalOnly();
    toast('อัปโหลดขึ้น cloud สำเร็จ');
  }catch(e){ toast('อัปโหลดไม่สำเร็จ: '+e.message); }
}

async function doLogin(){
  let u = $('loginUser').value.trim();
  const p = $('loginPass').value;
  const lm = document.getElementById('loginMsg'); if(lm) lm.innerHTML = '';
  if(cloudOn && u && u.indexOf('@') < 0){
    /* ผู้ใช้พิมพ์ "ชื่อ" แทนอีเมล — ลองหาอีเมลจากรายชื่อในเครื่องให้ */
    const guess = (B.vendors||[]).find(v=> normName(v.name)===normName(u) && v.user && v.user.indexOf('@')>=0);
    if(guess){ u = guess.user; $('loginUser').value = u; }
    else{
      showLoginHint('ช่องนี้ต้องใส่ <b>อีเมล</b> ไม่ใช่ชื่อ',
        'เช่น <b>innovation@ais.local</b> — ถ้าจำไม่ได้ สอบถามผู้ดูแลระบบ');
      return;
    }
  }
  if(cloudOn){
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email:u, password:p });
      if(error) throw error;
      cloudUser = data.user;
      const me = await findMyVendorRow(cloudUser);
      const r = me ? vendorRoleOf(Object.assign({}, me, {user: me.user || (cloudUser&&cloudUser.email) || ''}))
                   : roleFromEmail((cloudUser && cloudUser.email) || u);
      /* เข้าใช้งานทันทีด้วยข้อมูลในเครื่อง แล้วดึงของใหม่เบื้องหลัง
         — ไม่ต้องรอโหลด 2,400 หลังก่อนเห็นหน้าจอ */
      const pullLater = ()=>{
        const dot = document.getElementById('syncDot');
        /* เพิ่ง login = ยังไม่ได้แก้อะไรในรอบนี้ → โหลดได้เลย
           (cloudPull มีการ์ดกันข้อมูลหายอยู่แล้ว: cloud ว่าง = ไม่ทับของในเครื่อง) */
        if(dot) dot.textContent = '⏳ กำลังโหลด...';
        cloudPull()
          .then(()=>{ if(dot) setTimeout(refreshSaveBtn, 800); })
          .catch(()=>{ if(dot) dot.textContent = '⚠️ โหลดไม่สำเร็จ'; });
      };
      if(r === 'checker'){ enterChecker(); return; }   /* น้อง Key สมัคร — ส่งไปหน้าตรวจสอบหน้าเดียว */
      if(!bindCacheOwner(cloudUser)) return;
      if(r === 'admin'){ enterApp('admin', null); pullLater(); }
      else if(r === 'planning'){
        enterApp('planning', null);
        checkPlanningAccess(me);
        pullLater();
      }
      else if(me){
        let lv = B.vendors.find(x=>x.cloudId===me.id);
        if(!lv){ lv={id:me.id, cloudId:me.id, name:me.name, prices:me.prices||{}}; B.vendors.push(lv); }
        enterApp('vendor', lv.id);
        pullLater();
      } else { showNoVendorRow(cloudUser, u, p); }
      return;
    }catch(e){
      const msg = String((e && e.message) || '');
      /* แยกให้ชัด: รหัสผิด (ผู้ใช้แก้เองได้) กับ ระบบมีปัญหา (ต้องให้ผู้ดูแลแก้) */
      const badCred = /invalid login|invalid credentials|email not confirmed/i.test(msg);
      if(badCred){ toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง'); return; }
      showLoginTrouble(msg, u, p);
      return;
    }
  }
  if(offlineAdminOk(u, p)){ enterApp('admin', null); return; }
  const v = B.vendors.find(v=> v.user === u && v.pass === p);
  if(v){ enterApp('vendor', v.id); }
  else toast('Username หรือ Password ไม่ถูกต้อง');
}

async function addVendor(){
  if(!requireAdmin('สร้างบัญชี')) return;
  const name = $('nvName').value.trim(), user = $('nvUser').value.trim(), pass = $('nvPass').value.trim();
  const role = $('nvRole') ? $('nvRole').value : 'vendor';
  if(!name || !user || !pass){ toast('กรอกชื่อ, '+(cloudOn?'อีเมล':'Username')+' และ Password ให้ครบ'); return; }
  if(cloudOn){
    if(pass.length < 6){ toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัว'); return; }
    const email = user.includes('@') ? user : user+'@ais.local';
    try{
      if(role === 'checker'){
        const { error } = await sb.rpc('admin_create_checker', { new_email: email, new_password: pass, disp_name: name });
        if(error){
          if(/could not find|does not exist|schema cache|PGRST202/i.test(error.message||''))
            throw new Error('ยังไม่ได้รัน supabase-checker.sql รุ่นใหม่');
          throw error;
        }
        $('nvName').value=''; $('nvUser').value=''; $('nvPass').value='';
        toast('สร้างบัญชี Key สมัคร '+name+' แล้ว — ส่งลิงก์ '+location.origin+'/'+CHECK_PAGE+' + '+email+' ให้น้อง');
        renderAccounts();
        return;
      }
      const { data, error } = await sb.rpc('admin_create_account', {
        new_email: email, new_password: pass, disp_name: name, make_admin: (role==='admin')
      });
      if(error) throw error;
      if(role !== 'admin'){
        B.vendors.push({id:data, cloudId:data, name, user:email, pass:'', prices:{}});
        bqPersist();
      }
      $('nvName').value=''; $('nvUser').value=''; $('nvPass').value='';
      toast('สร้างบัญชี '+name+' แล้ว — login ด้วย '+email);
      renderAccounts();
    }catch(e){
      toast('สร้างไม่สำเร็จ: '+(e.message||'')+' (ถ้าเป็นครั้งแรก ต้องรัน supabase-admin-users.sql ก่อน)');
    }
    return;
  }
  if(user === B.adminUser || B.vendors.some(v=>v.user===user)){ toast('Username นี้ถูกใช้แล้ว'); return; }
  B.vendors.push({id:uid(), name, user, pass, prices:{}});
  bqPersist(); renderVendorMode(); toast('เพิ่ม '+name+' แล้ว');
}
function setVendorCred(id, key, val){
  const v = vendorById(id); if(!v) return;

  v[key] = val; bqPersist(); toast('บันทึกแล้ว');
}
async function delVendor(id){
  const vd = B.vendors.find(v=>v.id===id);
  if(!confirm('ลบ Vendor นี้? งานที่ผูกอยู่จะไม่ถูกลบแต่จะไม่มีราคา')) return;

function saveAdminCred(){

function itemsInUse(job){
  const set = new Set();
  ['prices','bqty','qty'].forEach(k=>Object.keys(job[k]||{}).forEach(x=>{ if(job[k][x]!=='' && job[k][x]!=null) set.add(x); }));

  const q = (ui.addItemQ||'').trim().toLowerCase();

function jobRowCells(job, v, idx){
  if(jobClosed(job)){
    const bq0 = (job.bqty||{})['i'+idx] || '';
    const p0 = jobPrice(job, idx);
    return `<div class="line-total" style="width:88px;font-weight:500;color:var(--muted)">${fmt(p0)}</div>
      <div class="line-total" style="width:74px;color:var(--green-dark)"><b>${bq0||''}</b></div>
      <div class="line-total" style="width:74px;color:var(--muted)">—</div>
      <div class="line-total" style="width:92px;color:var(--green-dark)">${bq0? fmt(bq0*p0)+' ฿':''}</div>`;
  }
  const bq = (job.bqty||{})['i'+idx] || '';
  const uq = (job.qty||{})['i'+idx] || '';
  const p = jobPrice(job, idx);
  const pv = (job.prices||{})['i'+idx];
  const remain = ((+bq||0) - (+uq||0)) * p;
  const priceCell = isAdmin()
    ? `<input type="number" class="bq-in" style="width:88px" title="ราคา/หน่วย โครงการนี้" value="${pv!=null?pv:''}" placeholder="ราคา" onchange="setJobPrice('${job.id}',${idx},this.value)">`
    : `<div class="line-total" style="width:88px;font-weight:500;color:var(--muted)">${fmt(p)}</div>`;
  return `${priceCell}
    <input type="number" class="bq-in" style="width:74px" title="จำนวนตั้งงบ" placeholder="ตั้งงบ" value="${bq}" onchange="setBQty('${job.id}',${idx},this.value)">

    <div class="line-total" style="width:92px;color:${bq&&remain<0?'var(--red)':''}">${bq? fmt(remain)+' ฿':''}</div>`;
}

  const secs = [];
  ITEMS.forEach((it, idx)=>{
    if(q && !(it.n.toLowerCase().includes(q) || it.s.toLowerCase().includes(q))) return;
    /* แสดงถ้ามีข้อมูลอะไรก็ตาม: ราคา หรือ ตั้งงบ หรือ ใช้แล้ว */
    if(job && ui.qtyOnly
       && !((job.qty||{})['i'+idx] > 0)
       && !((job.bqty||{})['i'+idx] > 0)
       && !((job.prices||{})['i'+idx] > 0)) return;
    if(!secs.length || secs[secs.length-1].name !== it.s) secs.push({name:it.s, idxs:[]});
    secs[secs.length-1].idxs.push(idx);
  });
  if(!secs.length) return '<div style="color:var(--muted);font-size:13px;padding:10px">ไม่พบรายการ</div>';
  let html = '';
  secs.forEach((sec, si)=>{
    const qtyN = job ? sec.idxs.filter(i=>(job.qty||{})['i'+i] > 0 || (job.bqty||{})['i'+i] > 0 || (job.prices||{})['i'+i] > 0).length : 0;
    const key = sec.name.replace(/'/g,''); const open = !!ui.openSecs[key] || !!q || (job && ui.qtyOnly);
    html += `<div class="sec-head" style="cursor:pointer;user-select:none" onclick="toggleSec('${sec.name.replace(/'/g,'')}')">
      ${open?'▾':'▸'} ${esc(sec.name)} <span style="font-weight:500;opacity:.75">· ${sec.idxs.length} รายการ${qtyN?' · กรอกแล้ว '+qtyN:''}</span></div>`;
    if(!open) return;
    sec.idxs.forEach(idx=>{
      const it = ITEMS[idx];
      const has = job && (job.qty||{})['i'+idx] > 0;
      const priceOnly = job && !has && !((job.bqty||{})['i'+idx] > 0) && (job.prices||{})['i'+idx] > 0;
      html += `<div class="irow ${has?'hasqty':''} ${priceOnly?'priceonly':''}">
        <div class="nm">${esc(it.n)}${priceOnly?' <span class="need-qty" title="มีราคาแล้ว แต่ยังไม่ได้ใส่จำนวน จึงยังไม่คิดเป็นงบ">ยังไม่ใส่จำนวน</span>':''}<br><small>${esc(it.u)}</small></div>
        ${rightCellFn(idx)}
      </div>`;
    });
  });
  return html;
}
function refreshItemList(){
  const el = $('itemList'); if(!el) return;
  if(ui.tab==='prices'){
    const v = vendorById(session.role==='admin'? ui.vendorSel : session.vendorId);
    el.innerHTML = itemRows((idx)=>{
      const custom = v.prices && v.prices['i'+idx] != null && v.prices['i'+idx] !== '';
      return session.role==='admin'
        ? `<input type="number" placeholder="ราคา" value="${custom? v.prices['i'+idx]:''}" onchange="setPrice('${v.id}',${idx},this.value)">`
        : `<div class="line-total">${fmt(priceOf(v,idx))}</div>`;
    }, null);
  } else if(ui.jobSel){
    const job = B.jobs.find(j=>j.id===ui.jobSel);
    const v = vendorById(job.vendorId);
    el.innerHTML = itemRows((idx)=> jobRowCells(job, v, idx), job);
  }
}

    📄 <b>${esc(p.code||p.name)}</b> · วงเงิน ${fmt(ceil)} ฿ · ตั้งงบไปแล้วรวม ${fmt(alloc)} ฿
    <br><b>${free>=0?'โยกเพิ่มเข้างานนี้ได้อีก '+fmt(free)+' ฿':'ตั้งงบเกินวงเงิน PO อยู่ '+fmt(-free)+' ฿ ต้องลดงานใดงานหนึ่ง'}</b>
    ${others.length?`<br><small>งานอื่นใน PO นี้: ${others.map(j=>esc(jobName(j))+' ('+fmt(jobBudget(j))+')').join(' · ')}</small>`:''}

function poCardHTML(p, isAdmin){
  const viewAll = canViewAll();
  const allJobs = poJobs(p.id);
  const jobs = allJobs.filter(j=> viewAll || j.vendorId===session.vendorId);
  const soleVendor = !viewAll && allJobs.length && allJobs.every(j=> j.vendorId===session.vendorId);
  const ceil = (viewAll || soleVendor) ? poCeiling(p) : 0;
  const alloc = viewAll ? poAllocated(p.id) : jobs.reduce((s,j)=>s+jobBudget(j),0);
  const spent = viewAll ? poSpent(p.id)     : jobs.reduce((s,j)=>s+jobCost(j),0);
  const free = ceil - alloc;
  const overAlloc = ceil && alloc > ceil;
  const overSpent = ceil && spent > ceil;
  const shared = !viewAll && !soleVendor && allJobs.length > jobs.length;
  return `
  <div class="panel po-card" style="border:1.5px solid ${overAlloc?'var(--red)':'var(--line)'}${ui.poQ && !jobs.some(j=> jobQMatch(j, ui.poQ)) ? ';display:none' : ''}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div>
        <h3 style="font-size:16px;color:var(--forest)">📄 ${esc(p.code||'(ไม่มีเลข PO)')}</h3>
        ${p.name?`<div class="sub" style="font-size:12px;color:var(--muted)">${esc(p.name)}</div>`:''}
        <div class="sub" style="font-size:12px;color:var(--muted)">${jobs.length} โครงการ${shared?' ของคุณ (PO นี้มีผู้รับเหมารายอื่นร่วมด้วย)':''}</div>
      </div>
      ${isAdmin?`<div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="editPO('${p.id}')">แก้ไข</button>
        <button class="btn btn-red btn-sm" onclick="delPO('${p.id}')">ลบ</button>
      </div>`:''}
    </div>

    <table class="sum" style="margin-top:10px">
      ${(viewAll||soleVendor)?`<tr><td>วงเงินตาม PO</td><td class="r money">${ceil?fmt(ceil):'— ยังไม่ระบุ —'}</td></tr>`:''}
      <tr><td>${viewAll?'จัดสรรให้โครงการแล้ว (ตั้งงบ)':'งบที่ตั้งไว้ของงานคุณ'}</td><td class="r money ${overAlloc?'neg':''}">${fmt(alloc)}</td></tr>
      <tr><td>ค่างานที่ใช้จริง</td><td class="r money">${fmt(spent)}</td></tr>
      ${ceil?`<tr><td><b>${free>=0?'วงเงินคงเหลือให้จัดสรร':'จัดสรรเกินวงเงิน'}</b></td><td class="r money ${free<0?'neg':'pos'}"><b>${fmt(Math.abs(free))}</b></td></tr>`:''}
      ${ceil?`<tr><td>คงเหลือจริง (วงเงิน − ใช้จริง)</td><td class="r money ${overSpent?'neg':'pos'}">${fmt(ceil-spent)}</td></tr>`:''}
    </table>
    ${ceil?`<div class="budget-bar" style="margin-top:8px"><i class="${overSpent?'over':''}" style="width:${Math.min(100,spent/ceil*100)}%"></i></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:4px">ใช้ไป ${Math.round(spent/ceil*100)}% ของวงเงิน PO</div>`:''}
    ${overAlloc?`<div class="notice" style="background:#FBEAEA;border-color:#F0C7C7;color:var(--red);margin-top:8px">⚠️ ตั้งงบรวมเกินวงเงิน PO อยู่ ${fmt(alloc-ceil)} ฿ — ต้องโยกงบออกจากบางโครงการ</div>`:''}

    ${jobs.length?`
    <div class="section-label" style="margin-top:12px">โครงการใน PO นี้ · แตะเพื่อเข้าไปโยกงบ</div>
    <table class="sum">
      <tr><th>โครงการ</th><th class="r">ตั้งงบ</th><th class="r">ใช้แล้ว</th><th class="r">คงเหลือ</th>${isAdmin?'<th></th>':''}</tr>
      ${jobs.map(j=>{
        const b=jobBudget(j), c=jobCost(j), d=b-c;
        return `<tr data-vq="${esc(jobQText(j))}"${jobQMatch(j, ui.poQ)?'':' style="display:none"'}>
          <td style="cursor:pointer" onclick="ui.jobSel='${j.id}';ui.tab='jobs';bqRender()">${esc(jobName(j))}<br><small style="color:var(--muted)">${esc((vendorById(j.vendorId)||{}).name||'-')}${jobVLC(j)?' · VLC '+esc(jobVLC(j)):''}</small></td>
          <td class="r money">${fmt(b)}</td>
          <td class="r">${fmt(c)}</td>
          <td class="r money ${d<0?'neg':'pos'}">${fmt(d)}</td>
          ${isAdmin?`<td class="r"><button class="btn btn-ghost btn-sm" onclick="setJobPO('${j.id}','')" title="เอาออกจาก PO นี้">✕</button></td>`:''}
        </tr>`;
      }).join('')}
      <tr style="border-top:2px solid var(--forest)"><td><b>รวม</b></td><td class="r money"><b>${fmt(alloc)}</b></td><td class="r"><b>${fmt(spent)}</b></td><td class="r money"><b>${fmt(alloc-spent)}</b></td>${isAdmin?'<td></td>':''}</tr>
    </table>`:'<div style="font-size:13px;color:var(--muted);margin-top:8px">ยังไม่มีโครงการใน PO นี้</div>'}
  </div>`;
}

function addPO(){
  if(!requireAdmin('สร้าง PO')) return;
  const code=$('npoCode').value.trim(), amt=$('npoAmt').value, name=$('npoName').value.trim();
  if(!code){ toast('ใส่เลขที่ PO ก่อนครับ'); return; }
  if((B.pos||[]).some(p=>p.code.trim()===code)){ toast('เลขที่ PO นี้มีอยู่แล้ว'); return; }
  B.pos = B.pos || [];
  B.pos.push({id:uid(), code, name, amount:+amt||0});
  bqPersist(); bqRender(); toast('สร้าง PO '+code+' แล้ว');
}
function editPO(id){
  if(!requireAdmin('แก้ PO')) return;
  const p=poById(id); if(!p) return;
  const code=prompt('เลขที่ PO', p.code); if(code===null) return;
  const amt=prompt('วงเงินตาม PO (บาท)', p.amount||0); if(amt===null) return;
  const name=prompt('รายละเอียด', p.name||''); if(name===null) return;
  p.code=code.trim(); p.amount=+amt||0; p.name=name.trim();
  bqPersist(); bqRender(); toast('บันทึกแล้ว');
}
function delPO(id){
  if(!requireAdmin('ลบ PO')) return;
  const p=poById(id); if(!p) return;
  const n=poJobs(id).length;
  if(!confirm('ลบ PO '+(p.code||'')+' ?'+(n?'\n\nโครงการ '+n+' รายการจะกลับไปเป็น "ยังไม่ผูก PO" (ข้อมูลงบไม่หาย)':''))) return;
  B.jobs.forEach(j=>{ if(j.poId===id) j.poId=''; });
  B.pos = B.pos.filter(x=>x.id!==id);
  bqPersist(); bqRender(); toast('ลบ PO แล้ว');
}
function setJobPO(jid, poId){
  if(!requireAdmin('ผูก PO')) return;
  const j=B.jobs.find(x=>x.id===jid); if(!j) return;
  j.poId = poId || '';
  bqPersist(); bqRender();
}

function exportJobBOQ(jid){
  if(!needLib('XLSX')) return;
  /* ผรม.ต้องเป็นเจ้าของงานนี้เท่านั้น */
  (function(){ const _j = B.jobs.find(x=>x.id===jid);
    if(!_j) return;
    if(!canViewAll() && _j.vendorId !== session.vendorId){ toast('ไม่มีสิทธิ์ดูงานนี้'); throw new Error('denied'); }
  })();
  const job = B.jobs.find(j=>j.id===jid); if(!job) return;
  const v = vendorById(job.vendorId);
  const aoa = [
    ['BOQ งาน', jobName(job)],
    ['Vendor', (v||{}).name||'-'],
    ['กรอบงบประมาณ (บาท)', jobBudget(job)||''],
    ['วันที่', todayISO()],
    [],
    ['ลำดับ','หมวด','รายการ','หน่วย','จำนวน','ราคา/หน่วย','รวม (บาท)']
  ];
  let n=0, total=0;
  ITEMS.forEach((it,idx)=>{
    const q = +(job.qty||{})['i'+idx]||0;
    if(!q) return;
    const p = jobPrice(job,idx), line = q*p; total+=line; n++;
    aoa.push([n, it.s, (it.on||it.n), it.u, q, p, line]);
  });
  aoa.push([]);
  aoa.push(['','','','','','รวมทั้งงาน', total]);
  const jbud = jobBudget(job);
  if(jbud) aoa.push(['','','','','', jbud-total>=0?'คงเหลือจากงบ':'เกินงบ', Math.abs(jbud-total)]);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:6},{wch:22},{wch:52},{wch:8},{wch:9},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws, 'BOQ');
  XLSX.writeFile(wb, 'BOQ-'+jobName(job).replace(/\s+/g,'-')+'-'+todayISO()+'.xlsx');
  toast('Export BOQ แล้ว');
}

$('boqXlsxIn').addEventListener('change', function(ev){

  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
      const nameIdx = {}; ITEMS.forEach((it,i)=> nameIdx[it.n.trim()] = i);
      let hit = 0;
      if(importFor.startsWith('prices:')){
        const v = vendorById(importFor.slice(7));
        // รับทั้งไฟล์ราคาจากแอปนี้ (คอลัมน์ รายการ/ราคา) และไฟล์มาตรฐาน (Description/Unit Price)
        const hi = aoa.findIndex(r=> r && (String(r[2]).trim()==='รายการ' || String(r[1]).trim().toLowerCase()==='description'));
        if(hi>=0){
          const isApp = String(aoa[hi][2]).trim()==='รายการ';
          for(let i=hi+1;i<aoa.length;i++){
            const r = aoa[i]; if(!r) continue;
            const nm = String(isApp? r[2] : r[1]).trim();
            const pr = +(isApp? r[4] : r[5]);
            if(nm && nameIdx[nm]!=null && !isNaN(pr)){ v.prices['i'+nameIdx[nm]] = pr; hit++; }
          }
        }
        bqPersist(); refreshAdminUI(); toast('อัปเดตราคา '+hit+' รายการ');
      } else if(importFor.startsWith('job:')){
        const job = B.jobs.find(j=>j.id===importFor.slice(4));
        const hi = aoa.findIndex(r=> r && String(r[2]).trim()==='รายการ' && String(r[4]).trim()==='จำนวน');
        if(hi>=0){
          for(let i=hi+1;i<aoa.length;i++){
            const r = aoa[i]; if(!r) continue;
            const nm = String(r[2]).trim(); const q = +r[4];
            if(nm && nameIdx[nm]!=null && q>0){ job.qty['i'+nameIdx[nm]] = q; hit++; }
          }
        }
        bqPersist(); bqRender(); toast('อัปเดตจำนวน '+hit+' รายการ');
      }
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ'); }
    importFor = null; ev.target.value='';
  };
  rd.readAsArrayBuffer(f);
});

/* ================= Mode switch (Progress <-> BOQ) ================= */
/* จำหน้าที่เปิดอยู่ (ในแท็บนี้) — โหลดใหม่/อัปเดตเวอร์ชันแล้วกลับมาหน้าเดิม ไม่เด้งไปหน้าแรก */
const MODE_KEY = 'ftth-mode';
function modeAllowed(m){
  if(!m) return false;
  if(m==='roi' || m==='vendor') return isAdmin();
  return ['dash','progress','boq','unit','plan'].indexOf(m) >= 0;
}
function restoreMode(){
  let st = null; try{ st = JSON.parse(sessionStorage.getItem(MODE_KEY)||'null'); }catch(e){}
  if(st && st.role === (session && session.role) && modeAllowed(st.mode)){
    if(st.roiView) ui.roiView = st.roiView;
    return st.mode;
  }
  return 'dash';
}
function switchMode(m){
  ui.mode = m;
  try{ sessionStorage.setItem(MODE_KEY, JSON.stringify({ mode:m, role: session && session.role, roiView: ui.roiView||'' })); }catch(e){}
  const map = {dash:'modeDash', progress:'modeProgress', boq:'modeBoq', vendor:'modeVendor', unit:'modeUnit', roi:'modeRoi', plan:'modePlan'};
  const btn = {dash:'mbDash', progress:'mbProgress', boq:'mbBoq', vendor:'mbVendor', unit:'mbUnit', roi:'mbRoi', plan:'mbPlan'};
  Object.keys(map).forEach(k=>{
    $(map[k]).style.display = (k===m) ? '' : 'none';
    $(btn[k]).classList.toggle('on', k===m);
  });
  if(m==='progress'){ render(); }
  else {
    $('fabAdd').style.display='none';
    if(m==='boq') bqRender();
    else if(m==='vendor') renderVendorMode();
    else if(m==='unit') renderUnitMode();
    else if(m==='roi') renderRoiMode();
    else if(m==='plan'){
      renderPlanPicker();
      const cat = visibleVillages().map(v=>{
        const jb = B.jobs.find(j=>j.villageId===v.id);
        const p  = jb && jb.poId ? poById(jb.poId) : null;
        return {
          name: v.name,
          contractor: v.contractor||'',
          vendor: v.contractor||'',
          po: p ? (p.code||p.name||'') : '',
          closed: !!v.closed,
          houses: (v.houses||[]).map(h=>({addr:h.no, status:h.st||''}))
        };
      });
      try{ localStorage.setItem('plan-status-catalog', JSON.stringify(cat)); }catch(e){}
      const fr = $('planFrame');
      if(!fr.getAttribute('src')) fr.src = 'plan-status.html';
      else { try{ fr.contentWindow.postMessage({type:'ftth-catalog', data:cat}, '*'); }catch(e){} }
    }
    else renderDash();
  }
  window.scrollTo(0,0);
}

function uRange(){
  if(!uSel) return null;
  return { r1:Math.min(uSel.ar,uSel.fr), r2:Math.max(uSel.ar,uSel.fr),
           c1:Math.min(uSel.ac,uSel.fc), c2:Math.max(uSel.ac,uSel.fc) };
}
function uPaint(){
  const g = document.getElementById('ugridBody'); if(!g) return;
  g.querySelectorAll('td.ucell').forEach(td=>td.classList.remove('sel','anchor'));
  const R = uRange(); if(!R) return;
  for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++){
    const td = g.querySelector('td.ucell[data-r="'+r+'"][data-c="'+c+'"]');
    if(td) td.classList.add('sel');
  }
  const a = g.querySelector('td.ucell[data-r="'+uSel.ar+'"][data-c="'+uSel.ac+'"]');
  if(a) a.classList.add('anchor');
  const n = (R.r2-R.r1+1)*(R.c2-R.c1+1);
  const lab = document.getElementById('uSelInfo');
  if(lab) lab.textContent = n>1 ? ('เลือก '+n+' ช่อง · Delete=ล้าง · Ctrl+C=คัดลอก') : '';
}
function uCellDown(ev, r, c){
  if(ev.shiftKey && uSel){ uSel.fr=r; uSel.fc=c; }
  else { uSel = {ar:r, ac:c, fr:r, fc:c}; uDragging = true; }
  uPaint();
}
function uCellEnter(r, c){ if(!uDragging || !uSel) return; uSel.fr=r; uSel.fc=c; uPaint(); }
document.addEventListener('mouseup', ()=>{ uDragging=false; });

function unitFilterVillages(q){
  ui.unitQ = q;
  const vil = visibleVillages();
  const sel = $('unitSelect'); if(!sel) return;
  sel.innerHTML = unitOptsHTML(vil);
  const qq = (q||'').trim().toLowerCase();
  const pool = vil.filter(x=> matchVendor(x, ui.unitVendor) && matchPO(x, ui.unitPO));
  const matched = qq ? pool.filter(x=> String(x.name||'').toLowerCase().includes(qq) || String(x.contractor||'').toLowerCase().includes(qq)) : pool;
  const lab = $('unitMatch');
  if(lab) lab.textContent = qq ? ('พบ '+matched.length+' หมู่บ้าน · Enter เพื่อเลือกอันแรก') : '';
  if(qq && matched.length && !matched.some(x=>x.id===ui.unitVil)){
    ui.unitVil = matched[0].id; uSel = null;
    sel.value = ui.unitVil;
    unitRefreshGrid();          // อัปเดตเฉพาะตาราง ไม่แตะช่องค้นหา -> ไม่เด้ง
  }
}
/* วาดใหม่เฉพาะตารางกริด (ไม่แตะ toolbar/ช่องค้นหา) */
function unitRefreshGrid(){
  const v = unitVillage(); if(!v) return;
  const body = $('ugridBody');
  if(body) body.innerHTML = (v.houses||[]).map((h,i)=>unitRow(v,h,i)).join('');
  const c = $('uCount');
  if(c) c.textContent = 'รวม '+(v.houses||[]).length+' หลัง · พร้อม ONU '+((v.houses||[]).filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length);
  uPaint();
}
function unitPickFirst(){
  const sel = $('unitSelect'); if(!sel || !sel.options.length) return;
  ui.unitVil = sel.options[0].value; uSel = null; renderUnitMode();
}

function renderUnitMode(){
  const vil = visibleVillages();
  if(!ui.unitVil || !vil.some(v=>v.id===ui.unitVil)) ui.unitVil = vil[0] ? vil[0].id : null;
  const v = vil.find(x=>x.id===ui.unitVil);
  window._uDupSet = dupRowSet(v);
  window._uCustOK = custVisibleFor(v);
  /* เตรียมตัวเลือก dropdown ไว้ล่วงหน้า (สร้างครั้งเดียวต่อการวาด) */
  window._stOptsCache = UNIT_STATUSES.map(o=>`<option value="${esc(o)}">${esc(o)||'—'}</option>`).join('');
  const _subList = canViewAll() ? realVendors()
    : realVendors().filter(x=> x.id===session.vendorId || x.name===(vendorById(session.vendorId)||{}).name);
  const _subAuto = v ? houseSub(v, {}) : '';
  window._subNamesCache = _subList.map(x=>x.name);
  window._subOptsCache = `<option value="">${_subAuto? '(ตามหมู่บ้าน: '+esc(_subAuto)+')' : '—'}</option>`
    + _subList.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');
  const opts = unitOptsHTML(vil);
  let body;
  if(!v){
    body = `<div class="panel" style="color:var(--muted);font-size:13px">ยังไม่มีหมู่บ้าน — สร้างที่แท็บ Progress ก่อน</div>`;
  } else {
    const hs = v.houses || [];
    const doneN = hs.filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
    const uClosed = isClosed(v);
    body = `
    ${uClosed?`<div class="closed-banner">✔ <b>${esc(v.name)} ปิดโครงการแล้ว</b> · ${esc(v.closedAt||'')} — ข้อมูลรายหลังถูกล็อกเพื่อเก็บบันทึก (${hs.length} หลัง · สำเร็จ ${doneN})</div>`:''}
    <div class="unit-toolbar">
      ${vendorFilterHTML('unitVendor','setUnitVendorFilter')}
      ${poFilterHTML('unitPO','setUnitPOFilter', ui.unitVendor)}
      <input id="unitSearch" placeholder="🔍 พิมพ์ชื่อหมู่บ้าน" value="${esc(ui.unitQ||'')}"
        oninput="unitFilterVillages(this.value)" onkeydown="if(event.key==='Enter')unitPickFirst()"
        style="font-family:'Sarabun',sans-serif;font-size:14px;padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;width:170px">
      <select id="unitSelect" onchange="ui.unitVil=this.value;uSel=null;renderUnitMode()" style="font-family:'Sarabun',sans-serif;font-size:14px;padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;min-width:230px;max-width:340px">${opts}</select>
      <span class="unit-count" id="unitMatch"></span>
      ${uClosed?'':`<button class="btn btn-green btn-sm" onclick="unitAddRows(1)">＋ เพิ่มหลัง</button>
      <button class="btn btn-dark btn-sm" onclick="unitAddRows(10)">＋ 10 แถว</button>
      <button class="btn btn-dark btn-sm" onclick="$('unitXlsx').click()" title="${isAdmin()?'นำเข้าข้อมูลรายหลัง':'นำเข้าได้เฉพาะหมู่บ้านของคุณ'}">📥 Import รายหลัง</button>`}
      ${uClosed?'':`<button class="btn btn-ghost btn-sm" onclick="sortUnitRows()" title="เรียงบ้านเลขที่ใหม่ · 9/9 → 9/10 → 9/100 · ป้ายอาคารท้ายสุด">🔢 เรียงบ้านเลขที่</button>`}
      ${uClosed || !canViewAll() ? '' : `<button class="btn btn-ghost btn-sm" onclick="openMoveVendor()" title="ย้ายงานให้ผรม.รายอื่น — ทั้งหมู่บ้านหรือเฉพาะแถวที่เลือก">🔁 ย้าย Vendor</button>`}
      ${uClosed?'':`<button class="btn btn-ghost btn-sm" onclick="fillSubFromVendor()" title="เติม Sub-Contract ทุกหลังจาก Vendor ของหมู่บ้าน">👷 เติม Sub-Contract</button>`}
      <button class="btn btn-ghost btn-sm" onclick="openPlanWith('${v.id}')">📐 ลง PDF</button>
      <span class="unit-count" id="uCount">รวม ${hs.length} หลัง · พร้อม ONU ${doneN}</span>
      ${(()=>{ const d=dupNumbers(v); return d.length
        ? `<span class="dup-warn" title="${esc(d.slice(0,20).join(', '))}">⚠ เลขที่ซ้ำ ${d.length} รายการ
             <button class="btn btn-sm" style="background:#8A1F1F;color:#fff;margin-left:6px" onclick="fixDupHere()">ล้างซ้ำ</button></span>`
        : ''; })()}
      <span class="unit-count" id="uSelInfo" style="color:var(--green-dark)"></span>
    </div>
    ${custBarHTML(v)}
    ${sourceBar()}
    ${stLegendHTML(v)}
    <div class="notice" style="text-align:left">ใช้เหมือน Excel: ลากเลือกหลายช่อง · <b>Delete</b> ล้างช่องที่เลือก · <b>Ctrl+C</b> คัดลอก · <b>Ctrl+V</b> วางจาก Excel (ขยายแถวให้เอง) · ลูกศร/Tab/Enter เลื่อนช่อง</div>
    <div class="ugrid-wrap">
      <table class="ugrid">
        <thead><tr><th>#</th><th title="รหัสอัตโนมัติ ตรงกับคอลัมน์ A ในไฟล์ที่ส่งออก">รหัส</th>${UNIT_HEADS.map(h=>`<th>${esc(h)}</th>`).join('')}<th></th></tr></thead>
        <tbody id="ugridBody">${hs.map((h,i)=>unitRow(v,h,i)).join('')}</tbody>
      </table>
    </div>
    ${hs.length===0?'<div class="panel" style="color:var(--muted);font-size:13px;margin-top:10px">ยังไม่มีข้อมูล — กด "＋ เพิ่มหลัง" หรือ "📥 Import Excel"</div>':''}`;
  }
  $('modeUnit').innerHTML = `<div class="section-label">📋 Unit · ตารางกรอกข้อมูลรายหลัง${cloudOn?' · บันทึกลง Database อัตโนมัติ':''}</div>` + body;
  uPaint();
}

function unitRow(v, h, i){
  const done = h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'');
  const cell = (c, inner, extraCls)=>
    `<td class="ucell ${extraCls||''}" data-r="${i}" data-c="${c}" onmousedown="uCellDown(event,${i},${c})" onmouseenter="uCellEnter(${i},${c})">${inner}</td>`;
  const inp = (c, val, w)=> cell(c, `<input value="${esc(val==null?'':val)}" ${w?`style="width:${w}px"`:''} onchange="unitSet(${i},'${UNIT_FIELDS[c]}',this.value)" onkeydown="uKeyNav(event,${i},${c})">`);
  const isDup = (window._uDupSet && window._uDupSet.has(i));
  const _custOK = (window._uCustOK !== false);
  /* ใช้ตัวเลือกที่สร้างไว้แล้ว แค่ย้ายเครื่องหมาย selected — เร็วกว่าสร้างใหม่ทุกแถวมาก */
  const curSt = h.st || '';
  const stOpts = (window._stOptsCache || '').replace('value="'+curSt.replace(/"/g,'&quot;')+'"',
                                                     'value="'+curSt.replace(/"/g,'&quot;')+'" selected');
  const subCur = h.sub||'';
  const subOpts = (window._subOptsCache || '') +
    (subCur ? ((window._subNamesCache||[]).indexOf(subCur)>=0
        ? '' : `<option value="${esc(subCur)}" selected>${esc(subCur)}</option>`) : '');
  return `<tr class="${isDup?'dup-row':''}">
    <td class="rownum">${i+1}${isDup?'<span class="dup-flag" title="บ้านเลขที่ซ้ำกับแถวอื่น">!</span>':''}</td>
    <td class="ucode" title="รหัสอัตโนมัติ · ใช้จับคู่ข้อมูลกับไฟล์กลาง">${esc(rowCode(v, h))}</td>
    ${inp(0, h.no)}
    ${cell(1, (()=>{ const bg = stColor(curSt);
        const sty = bg ? ` style="background:${bg};color:${stInk(bg)};font-weight:700;border-color:${bg}"` : '';
        return `<select class="st-cell"${sty} onchange="unitSet(${i},'st',this.value)">${stOpts}</select>`;
      })(), done?'ustat-done':'')}
    ${cell(2, `<select onchange="unitSet(${i},'sub',this.value)" title="ผู้รับเหมาที่ทำงานหลังนี้ · เว้นว่าง = ใช้ Vendor ของหมู่บ้าน" ${subCur?'':'style="color:var(--muted)"'}>${subCur? subOpts.replace('value="'+subCur.replace(/"/g,'&quot;')+'"','value="'+subCur.replace(/"/g,'&quot;')+'" selected') : subOpts}</select>`)}
    ${inp(3, h.sol)}
    ${inp(4, h.est)}
    ${inp(5, h.lat, 74)}
    ${inp(6, h.lng, 74)}
    ${_custOK ? inp(7, h.name)  : cell(7, `<input value="${esc(maskCust(v,h.name))}" readonly title="ข้อมูลลูกค้าถูกปิดไว้" style="color:var(--muted);letter-spacing:1px">`)}
    ${_custOK ? inp(8, h.phone) : cell(8, `<input value="${esc(maskCust(v,h.phone))}" readonly title="ข้อมูลลูกค้าถูกปิดไว้" style="color:var(--muted);letter-spacing:1px">`)}
    ${inp(9, h.interest)}
    ${inp(10, h.detail)}
    <td class="del"><button onclick="unitDel(${i})" title="ลบแถวนี้">✕</button></td>
  </tr>`;
}

/* เติม Sub-Contract ทุกหลังในหมู่บ้านนี้จาก Vendor ที่ทำงานจริง */
/* เรียงบ้านเลขที่ใหม่ตามลำดับธรรมชาติ */
function sortUnitRows(){
  const v = unitVillage(); if(!v) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  const before = (v.houses||[]).map(h=>h.no).join('|');
  v.houses = sortHouses(v.houses);
  if(before === (v.houses||[]).map(h=>h.no).join('|')){ toast('เรียงถูกลำดับอยู่แล้ว'); return; }
  uSel = null;
  v._hDirty = true; v._dirty = true;
  persist(); renderUnitMode();
  toast('เรียงบ้านเลขที่ใหม่แล้ว ' + (v.houses||[]).length + ' แถว · กด 💾 บันทึก เพื่อส่งขึ้นระบบ');
}
/* ===== ย้ายงานให้ผรม.รายอื่น =====
   รองรับกรณีผรม.เดิมหยุดทำงาน ต้องตัดจ้างทีมอื่นมาทำแทน
   ย้ายได้ทั้งหมู่บ้าน หรือเฉพาะแถวที่ลากเลือกไว้                        */
function openMoveVendor(){
  const v = unitVillage(); if(!v) return;
  if(!requirePlanner('ย้าย Vendor')) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว ย้ายไม่ได้'); return; }
  const rg = uRange();
  const nSel = rg ? (rg.r2 - rg.r1 + 1) : 0;
  const total = (v.houses||[]).length;
  if(!total){ toast('ยังไม่มีข้อมูลรายหลัง'); return; }
  /* สรุปว่าตอนนี้ใครทำอยู่กี่หลัง */
  const cnt = {};
  (v.houses||[]).forEach(h=>{ const k = houseSub(v,h) || '(ยังไม่ระบุ)'; cnt[k] = (cnt[k]||0)+1; });
  const rows = Object.entries(cnt).sort((a,b)=>b[1]-a[1])
    .map(([k,n])=>`<li>${esc(k)} <b>${n}</b> หลัง</li>`).join('');
  const opts = realVendors().map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');
  $('mvBody').innerHTML = `
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">${esc(v.name)} · ${fmt(total)} หลัง</div>
    <div class="sync-sec" style="margin-top:0">
      <div class="sync-h">ตอนนี้ใครทำอยู่</div>
      <ul style="margin:5px 0 0 18px;padding:0;font-size:12.5px;line-height:1.7">${rows}</ul>
    </div>
    <div class="sync-steps" style="margin-top:10px">
      <div class="sync-h" style="margin-top:0">ย้ายไปให้</div>
      <select id="mvTo" style="width:100%;font-family:inherit;font-size:14px;font-weight:600;padding:10px 12px;
        border:1.5px solid var(--line);border-radius:9px;background:#fff;margin-top:6px">${opts}</select>
      <div class="sync-h" style="margin-top:10px">ย้ายส่วนไหน</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:5px;font-size:13px">
        <label style="display:flex;gap:7px;align-items:flex-start">
          <input type="radio" name="mvScope" value="all" checked style="margin-top:3px">
          <span><b>ทั้งหมู่บ้าน</b> (${fmt(total)} หลัง)<br>
          <small style="color:var(--muted)">เปลี่ยน Vendor ของหมู่บ้านด้วย — ใช้เมื่อเปลี่ยนผู้รับเหมาถาวร</small></span></label>
        <label style="display:flex;gap:7px;align-items:flex-start;${nSel?'':'opacity:.45'}">
          <input type="radio" name="mvScope" value="sel" ${nSel?'':'disabled'} style="margin-top:3px">
          <span><b>เฉพาะแถวที่เลือก</b> ${nSel?'('+nSel+' หลัง · แถว '+(rg.r1+1)+'-'+(rg.r2+1)+')':'— ยังไม่ได้เลือก'}<br>
          <small style="color:var(--muted)">${nSel?'หมู่บ้านยังเป็นของเจ้าเดิม เฉพาะหลังที่เลือกเปลี่ยนมือ':'ลากเลือกแถวในตารางก่อน'}</small></span></label>
        <label style="display:flex;gap:7px;align-items:flex-start">
          <input type="radio" name="mvScope" value="rest" style="margin-top:3px">
          <span><b>เฉพาะที่ยังไม่เสร็จ</b> (${fmt((v.houses||[]).filter(h=>!unitDone(h)).length)} หลัง)<br>
          <small style="color:var(--muted)">หลังที่พร้อม ONU แล้วคงไว้กับเจ้าเดิม — ใช้เมื่อรับช่วงงานค้าง</small></span></label>
      </div>
    </div>
    <div class="sync-note" style="margin-top:10px">
      ผรม.ที่รับงานจะเห็นหมู่บ้านนี้ทันที และเห็นเฉพาะหลังที่เป็นของตัวเอง
    </div>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn btn-ghost" onclick="$('mvModal').classList.remove('open')">ยกเลิก</button>
      <button class="btn btn-green" onclick="doMoveVendor()">🔁 ย้ายงาน</button>
    </div>`;
  $('mvModal').classList.add('open');
}
function doMoveVendor(){
  const v = unitVillage(); if(!v) return;
  if(!requirePlanner('ย้าย Vendor')) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว ย้ายไม่ได้'); return; }
  const to = ($('mvTo')||{}).value || '';
  if(!to){ toast('เลือกผรม.ปลายทางก่อน'); return; }
  const scopeEl = document.querySelector('input[name="mvScope"]:checked');
  const scope = scopeEl ? scopeEl.value : 'all';
  const hs = v.houses||[];
  let target = [];
  if(scope === 'all') target = hs;
  else if(scope === 'sel'){
    const rg = uRange();
    if(!rg){ toast('ยังไม่ได้เลือกแถว'); return; }
    target = hs.slice(rg.r1, rg.r2+1);
  } else target = hs.filter(h=>!unitDone(h));
  if(!target.length){ toast('ไม่มีหลังที่จะย้าย'); return; }

  const label = scope==='all' ? 'ทั้งหมู่บ้าน' : (scope==='sel' ? 'แถวที่เลือก' : 'เฉพาะที่ยังไม่เสร็จ');
  if(!confirm('ย้ายงานให้ "'+to+'"\n\nขอบเขต: '+label+' ('+target.length+' หลัง)\n\nยืนยัน?')) return;

  target.forEach(h=>{ h.sub = to; });
  if(scope === 'all'){
    /* เปลี่ยนเจ้าของหมู่บ้านด้วย */
    const vd = realVendors().find(x=> normName(x.name)===normName(to));
    v.contractor = to;
    if(vd) v.vendorId = vd.id;
    villageJobs(v).forEach(j=>{ if(vd) j.vendorId = vd.id; j._dirty = true; });
  }
  markMoved(v);
  v._hDirty = true; v._dirty = true;
  uSel = null;
  persist(); bqPersist();
  $('mvModal').classList.remove('open');
  renderUnitMode();
  toast('ย้าย ' + target.length + ' หลัง ให้ ' + to + ' แล้ว · กด 💾 บันทึก เพื่อส่งขึ้นระบบ');
}
function fillSubFromVendor(){
  const v = unitVillage(); if(!v) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  const auto = houseSub(v, {});
  if(!auto){ toast('หมู่บ้านนี้ยังไม่ได้ระบุ Vendor'); return; }
  const blank = (v.houses||[]).filter(h=>!String(h.sub||'').trim()).length;
  if(!blank){ toast('ทุกหลังระบุ Sub-Contract แล้ว'); return; }
  if(!confirm('เติม "'+auto+'" ให้ '+blank+' หลังที่ยังไม่ได้ระบุ?\n\n(หลังที่ระบุไว้แล้วจะไม่ถูกทับ)')) return;
  (v.houses||[]).forEach(h=>{ if(!String(h.sub||'').trim()) h.sub = auto; });
  v._hDirty = true; persist(); if(cloudOn) cloudSaveHouses(v);
  renderUnitMode();
  toast('เติม '+auto+' ให้ '+blank+' หลังแล้ว');
}
/* ล้างเลขที่ซ้ำในหมู่บ้านที่เปิดอยู่ */
function fixDupHere(){
  const v = unitVillage(); if(!v) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  const d = dupNumbers(v);
  if(!d.length){ toast('ไม่มีเลขที่ซ้ำ'); return; }
  if(!confirm('พบบ้านเลขที่ซ้ำ ' + d.length + ' รายการ\n' + d.slice(0,10).join(', ') + (d.length>10?' …':'') +
              '\n\nระบบจะเก็บแถวที่ข้อมูลครบกว่าไว้ แล้วลบแถวซ้ำออก — ดำเนินการ?')) return;
  const n = dedupeVillage(v);
  persist(); if(cloudOn) cloudSaveHouses(v);
  renderUnitMode();
  toast('ล้างแถวซ้ำแล้ว ' + n + ' แถว · กด 💾 บันทึก เพื่ออัปเดตระบบ');
}
function unitRecount(v){
  v.homesDone = (v.houses||[]).filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
  touchProgress(v);
  const c = document.getElementById('uCount');
  if(c) c.textContent = 'รวม '+v.houses.length+' หลัง · พร้อม ONU '+v.homesDone;
}
function unitSave(v){
  v._hDirty = true;
  markMoved(v);                 /* ลงข้อมูลในหน้า Unit = มีความเคลื่อนไหว */
  persist();
  if(cloudOn) cloudSaveHouses(v);
}
/* เปลี่ยนสีช่องสถานะทันทีโดยไม่ต้องวาดตารางใหม่ (กันเคอร์เซอร์กระโดด) */
function paintStCell(i, st){
  const row = document.querySelectorAll('#ugridBody tr')[i];
  if(!row) return;
  const el = row.querySelector('select.st-cell');
  if(!el) return;
  const bg = stColor(st);
  if(bg){ el.style.background = bg; el.style.color = stInk(bg); el.style.fontWeight = '700'; el.style.borderColor = bg; }
  else { el.style.background = ''; el.style.color = ''; el.style.fontWeight = ''; el.style.borderColor = ''; }
  const lg = document.querySelector('#modeUnit .st-legend');
  if(lg){ const v = unitVillage(); if(v) lg.outerHTML = stLegendHTML(v) || '<div class="st-legend"></div>'; }
}
function unitSet(i, key, val){
  const v = unitVillage(); if(!v || !v.houses || !v.houses[i]) return;
  if((key==='name' || key==='phone') && !custVisibleFor(v)){
    toast('ข้อมูลลูกค้าถูกปิดไว้ — แก้ไขไม่ได้'); renderUnitMode(); return;
  }
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); renderUnitMode(); return; }
  if(key === 'no'){
    const d = dupRowIndex(v, val, i);
    if(d >= 0){
      toast('⚠ บ้านเลขที่ ' + String(val).trim() + ' มีอยู่แล้วในแถวที่ ' + (d+1) + ' — ห้ามซ้ำ');
      renderUnitMode();
      setTimeout(()=>{ const el=document.querySelector('#ugridBody tr:nth-child('+(d+1)+')'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'center'}); }, 60);
      return;
    }
  }
  v.houses[i][key] = val;
  unitRecount(v); if(key==='st') paintStCell(i, val);
  unitSave(v);
  if(key==='st'){
    const td = document.querySelector('#ugridBody td.ucell[data-r="'+i+'"][data-c="1"]');
    if(td) td.classList.toggle('ustat-done', val==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(val||''));
  }
}
function unitAddRows(n){
  const v = unitVillage(); if(!v) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  v.houses = v.houses || [];
  for(let k=0;k<n;k++) v.houses.push({no:'',st:'',sol:'',est:'',lat:'',lng:'',name:'',phone:'',interest:'',detail:''});
  v._hDirty = true; persist(); renderUnitMode();
}
function unitDel(i){
  const v = unitVillage(); if(!v) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  v.houses.splice(i,1);
  unitRecount(v); unitSave(v); uSel=null; renderUnitMode();
}

function uKeyNav(ev, r, c){
  const k = ev.key;
  let nr=r, nc=c;
  if(k==='ArrowDown' || k==='Enter') nr=r+1;
  else if(k==='ArrowUp') nr=r-1;
  else if(k==='Tab'){ nc = ev.shiftKey ? c-1 : c+1; }
  else return;
  ev.preventDefault();
  const v = unitVillage(); if(!v) return;
  if(nc<0){ nc=UNIT_FIELDS.length-1; nr--; }
  if(nc>=UNIT_FIELDS.length){ nc=0; nr++; }
  if(nr<0) nr=0;
  if(nr>=v.houses.length){ if(k==='Enter'||k==='ArrowDown'||k==='Tab'){ unitAddRows(1); } else nr=v.houses.length-1; }
  uSel={ar:nr,ac:nc,fr:nr,fc:nc}; uPaint();
  const td = document.querySelector('#ugridBody td.ucell[data-r="'+nr+'"][data-c="'+nc+'"]');
  const fEl = td && td.querySelector('input,select'); if(fEl){ fEl.focus(); if(fEl.select) fEl.select(); }
}
function uClearSelected(){
  const v = unitVillage(); const R = uRange(); if(!v || !R) return 0;
  let n=0;
  for(let r=R.r1;r<=R.r2;r++){
    if(!v.houses[r]) continue;
    for(let c=R.c1;c<=R.c2;c++){ v.houses[r][UNIT_FIELDS[c]] = ''; n++; }
  }
  unitRecount(v); unitSave(v); renderUnitMode();
  return n;
}
function uCopySelected(){
  const v = unitVillage(); const R = uRange(); if(!v || !R) return '';
  const out=[];
  for(let r=R.r1;r<=R.r2;r++){
    const row=[];
    for(let c=R.c1;c<=R.c2;c++) row.push(v.houses[r] ? (v.houses[r][UNIT_FIELDS[c]]||'') : '');
    out.push(row.join(String.fromCharCode(9)));
  }
  return out.join(String.fromCharCode(10));
}
function normStatus(str){
  str = String(str||'').trim();
  if(!str) return '';
  const exact = UNIT_STATUSES.find(x=> x && x===str);
  if(exact) return exact;
  const loose = UNIT_STATUSES.find(x=> x && (x.indexOf(str)>=0 || str.indexOf(x)>=0));
  return loose || str;
}
function uPasteText(txt, r0, c0){
  window._pasteDupWarn = null;
  const v = unitVillage(); if(!v || !txt) return 0;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return 0; }
  v.houses = v.houses || [];
  const NL = String.fromCharCode(10), TAB = String.fromCharCode(9);
  let rows = txt.split(NL).map(function(x){ return x.replace(String.fromCharCode(13),''); });
  while(rows.length && rows[rows.length-1].trim()==='') rows.pop();
  if(!rows.length) return 0;
  const skipped = [];
  let applied = 0;
  rows.forEach(function(line, ri){
    const cells = line.split(TAB);
    const R = r0 + ri;
    /* ถ้าคอลัมน์ที่วางครอบคลุม "บ้านเลขที่" ให้ตรวจซ้ำก่อน */
    if(c0 === 0){
      const noVal = String(cells[0]==null?'':cells[0]).trim();
      if(noVal && /\d/.test(noVal) && dupRowIndex(v, noVal, R) >= 0){
        skipped.push(noVal);
        return;                       /* ข้ามแถวนี้ ไม่เขียนทับ */
      }
    }
    while(v.houses.length <= R) v.houses.push({no:'',st:'',sol:'',est:'',lat:'',lng:'',name:'',phone:'',interest:'',detail:''});
    cells.forEach(function(val, ci){
      const C = c0 + ci;
      if(C >= UNIT_FIELDS.length) return;
      const key = UNIT_FIELDS[C];
      val = String(val).trim();
      v.houses[R][key] = (key==='st') ? normStatus(val) : val;
    });
    applied++;
  });
  unitRecount(v); unitSave(v); renderUnitMode();
  if(skipped.length){
    const ex = skipped.slice(0,5).join(', ') + (skipped.length>5 ? ' …' : '');
    toast('⚠ ข้าม ' + skipped.length + ' แถวที่บ้านเลขที่ซ้ำ (' + ex + ') · วางสำเร็จ ' + applied + ' แถว');
  }
  return applied;
}
document.addEventListener('keydown', function(ev){
  const md = document.getElementById('modeUnit');
  if(!md || md.style.display==='none' || !uSel) return;
  const R = uRange(); if(!R) return;
  const multi = (R.r2-R.r1)>0 || (R.c2-R.c1)>0;
  const tag = (ev.target.tagName||'').toLowerCase();
  if(ev.key==='Delete' || ev.key==='Backspace'){
    if(multi || tag==='td' || tag==='select'){
      ev.preventDefault();
      const n = uClearSelected();
      toast('ล้าง '+n+' ช่องแล้ว');
    }
    return;
  }
  if((ev.ctrlKey||ev.metaKey) && (ev.key==='c'||ev.key==='C') && multi){
    const txt = uCopySelected();
    if(txt && navigator.clipboard) navigator.clipboard.writeText(txt);
    toast('คัดลอกแล้ว วางใน Excel ได้เลย');
    ev.preventDefault();
  }
});
document.addEventListener('paste', function(ev){
  const md = document.getElementById('modeUnit');
  if(!md || md.style.display==='none' || !uSel) return;
  const txt = (ev.clipboardData || window.clipboardData).getData('text');
  const TAB = String.fromCharCode(9), NL = String.fromCharCode(10);
  if(!txt || (txt.indexOf(TAB)<0 && txt.indexOf(NL)<0)) return;
  ev.preventDefault();
  const R = uRange();
  const n = uPasteText(txt, R.r1, R.c1);
  toast('วาง '+n+' แถวลงตารางแล้ว');
});

function unitImportExcel(ev){
  const f = ev.target.files[0]; if(!f) return;
  const v = unitVillage();
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sn = wb.SheetNames.find(x=>x==='Unit') || wb.SheetNames[0];
      const ua = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
      if(!ua.length){ toast('ไม่พบข้อมูลในไฟล์'); return; }
      const uh = (ua[0]||[]).map(x=>String(x).toLowerCase());
      /* "รหัสโครงการ" / "คีย์รายหลัง" มีคำว่า โครงการ/บ้านเลขที่ ซ้อนอยู่ — ห้ามจับเป็นคอลัมน์ชื่อ */
      const col = (...keys)=>{ for(const key of keys){ const i=uh.findIndex(h=>h.includes(key) && h.trim()!=='รหัสโครงการ' && h.trim()!=='คีย์รายหลัง'); if(i>=0) return i; } return -1; };
      const cCode = uh.findIndex(h=> h.trim()==='รหัสโครงการ');
      const cVil=col('โครงการ'), cNo=col('บ้านเลขที่','address'), cLat=col('lat'), cLng=col('lot','lng','long'),
            cSt=col('status','สถานะ'), cSol=col('solution'), cEst=col('estimate'), cDet=col('detail'),
            cName=col('name','ชื่อ'), cPhone=col('phone','เบอร์'), cInt=col('สนใจ','interest'), cSub=col('sub-contract','subcontract','ผู้รับเหมาย่อย'),
            cVlc=col('vlc'), cOlt=col('olt');
      const cAddr2 = uh.findIndex((h,ix)=> ix!==cNo && h.includes('address'));
      const grouped = {}, gCode = {};
      for(let r=1;r<ua.length;r++){
        const row = ua[r];
        const vname = cVil>=0 ? String(row[cVil]||'').trim() : (v? v.name : '');
        if(!vname) continue;
        const vcode = cCode>=0 ? String(row[cCode]||'').trim() : '';
        if(vcode && !gCode[vname]) gCode[vname] = vcode;
        (grouped[vname]=grouped[vname]||[]).push({
          no: cNo>=0?String(row[cNo]||'').trim():'', st: cSt>=0?normStatus(String(row[cSt]||'')):'',
          lat: cLat>=0?(row[cLat]||''):'', lng: cLng>=0?(row[cLng]||''):'',
          sol: cSol>=0?String(row[cSol]||''):'', est: cEst>=0?String(row[cEst]||''):'',
          detail: cDet>=0?String(row[cDet]||''):'',
          vlc: cVlc>=0?String(row[cVlc]||''):'', olt: cOlt>=0?String(row[cOlt]||''):'',
          name: (cName>=0 && !isMasked(row[cName]))?String(row[cName]||''):'',
          addr: (cAddr2>=0 && !isMasked(row[cAddr2]))?String(row[cAddr2]||''):'',
          phone: (cPhone>=0 && !isMasked(row[cPhone]))?String(row[cPhone]||''):'',
          interest: cInt>=0?String(row[cInt]||''):'', sub: cSub>=0?String(row[cSub]||''):''
        });
      }
      let updated=0, created=0, skipped=0, uDup=0;
      const mine = new Set(visibleVillages());
      Object.keys(grouped).forEach(vn=>{
        /* หาด้วยรหัสโครงการก่อน (คงที่ แม้เปลี่ยนชื่อ) → ไม่เจอค่อยใช้ชื่อ */
        const vc = gCode[vn];
        let tv = (vc && state.villages.find(x=> String(x.code||'').trim()===vc)) || findVillageByName(vn);
        if(tv) markMoved(tv);
        if(!isAdmin()){
          // ผรม.: อัปเดตได้เฉพาะหมู่บ้านของตัวเอง และสร้างหมู่บ้านใหม่ไม่ได้
          if(!tv || !mine.has(tv)){ skipped++; return; }
          updated++;
        } else if(!tv){
          tv = {id:uid(), name:vn, contractor:'', vendorId:null, ports:'', homesDone:0, start:'', end:'', issue:'',
                tasks:TEMPLATE.map(t=>({id:uid(),name:t.name,w:t.w,p:0,note:''})), houses:[]};
          state.villages.push(tv);
          B.jobs.push({id:uid(), name:vn, villageId:tv.id, vendorId:'', budget:'', qty:{}, bqty:{}, prices:{}, date:todayISO()});
          created++;
        } else updated++;
        const _rawU = grouped[vn];
        keepCustData(tv, _rawU);
        tv.houses = sortHouses(dedupeHouses(_rawU));
        if(_rawU.length !== tv.houses.length) uDup += (_rawU.length - tv.houses.length);
        tv._hDirty = true;
        tv.homesDone = tv.houses.filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
        if(cloudOn) cloudSaveHouses(tv);
      });
      persist(); bqPersist();
      renderUnitMode();
      toast('นำเข้าสำเร็จ: อัปเดต '+updated+(isAdmin()? ' · ใหม่ '+created : '')+' โครงการ'
            + (skipped? ' · ข้าม '+skipped+' โครงการที่ไม่ใช่ของคุณ' : '')
            + (uDup? ' · ตัดเลขที่ซ้ำ '+uDup+' แถว' : ''));
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ'); }
  };
  rd.readAsArrayBuffer(f);
  ev.target.value = '';
}

const unitSaveTimers = {};
function cloudSaveHouses(v){
  if(!v) return;
  v._hDirty = true;               /* ทำเครื่องหมายไว้ · ส่งขึ้นระบบเมื่อกดปุ่มบันทึก */

/* ส่งข้อมูลรายหลังของหมู่บ้านเดียวขึ้น cloud */
/* แปลงข้อมูลรายหลัง → แถวสำหรับส่งขึ้นระบบ
   ใช้ที่เดียวทั้งระบบ กันลืมส่งบางช่อง (เคยลืม vlc/olt/cust_addr มาแล้ว) */
function houseRow(v, h){
  /* ข้อมูลลูกค้า: แบบใหม่ (ระบบแยกสิทธิ์) — ไม่รู้ค่า = ส่ง null ให้ระบบคงของเดิม · แบบเดิม = ค่าว่าง */
  const rpc = (window._piiMode === 'rpc');
  const pv = x => (x === undefined || x === null) ? (rpc ? null : '') : String(x);
  return {
    village_id: v.cloudId,
    no: h.no||'', status: h.st||'',
    lat: (+h.lat||null), lng: (+h.lng||null),
    solution: h.sol||'', estimate: h.est||'', detail: h.detail||'',
    vlc: h.vlc||'', olt: h.olt||'',
    cust_name: pv(h.name), cust_addr: pv(h.addr), cust_phone: pv(h.phone),
    interest: h.interest||'', sub_contract: h.sub||''
  };
}
/* ค่าของบ้าน 1 หลังในรูปแถวบนระบบ (ไม่รวม village_id) — ใช้เทียบช่องที่แก้ */
function houseCore(h){ const r = houseRow({ cloudId:null }, h); delete r.village_id; return r; }
/* ช่องบนระบบ → ช่องในเครื่อง (ไม่รวมข้อมูลลูกค้า) */
const H_FIELD = { no:'no', status:'st', lat:'lat', lng:'lng', solution:'sol', estimate:'est', detail:'detail', vlc:'vlc', olt:'olt', interest:'interest', sub_contract:'sub' };
const H_LABEL = { no:'บ้านเลขที่', status:'สถานะ', lat:'พิกัด', lng:'พิกัด', solution:'Solution', estimate:'ประเมิน', detail:'รายละเอียด', vlc:'VLC', olt:'OLT', interest:'ความสนใจ', sub_contract:'ผู้รับเหมาช่วง',
  cust_name:'ชื่อลูกค้า', cust_addr:'ที่อยู่', cust_phone:'เบอร์โทร' };

function houseFromDb(h){
  return { cid:h.id, no:h.no, st:h.status, lat:h.lat||'', lng:h.lng||'', sol:h.solution, est:h.estimate, detail:h.detail, vlc:h.vlc, olt:h.olt, interest:h.interest, sub:h.sub_contract||'' };
}
/* ลายเซ็นของบ้าน 1 หลัง (ไว้ดูว่าแก้หรือยัง → ส่งเฉพาะหลังที่แก้) */
function houseSig(h){
  const n = x => (x === undefined || x === null) ? null : String(x);
  return hash36(stableSig([h.no||'', h.st||'', +h.lat||null, +h.lng||null, h.sol||'', h.est||'', h.detail||'', h.vlc||'', h.olt||'',
                    n(h.name), n(h.addr), n(h.phone), h.interest||'', h.sub||'']));
}
/* แฮชสั้น (เก็บแทนข้อความยาวทุกหลัง → ข้อมูลในเครื่องเล็กลง) */
function hash36(str){
  let h1 = 0x811c9dc5, h2 = 0x01000193 ^ str.length;
  for(let i=0;i<str.length;i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
  return (h1>>>0).toString(36) + (h2>>>0).toString(36);
}
/* ผรม.ดูข้อมูลลูกค้าของหมู่บ้านนี้ได้ไหม (ใช้ได้ทั้งแถวจากระบบ และหมู่บ้านในเครื่อง) */
function piiRowAllowed(x){
  if(canViewAll()) return true;
  if(!x) return false;
  if(x.closed) return false;
  const u = x.cust_until != null ? x.cust_until : x.custUntil;
  return !!u && todayISO() <= String(u).slice(0,10);
}

function villageBaseOfCloud(r){
  const has = k => Object.prototype.hasOwnProperty.call(r, k);
  const b = { name:r.name, contractor:r.contractor||'', vendor_id:r.vendor_id||null, ports:String(r.ports||''), homes_done:+r.homes_done||0,
    start_date:r.start_date||'', end_date:r.end_date||'', issue:r.issue||'', tasks:r.tasks||[] };
  if(has('last_move')) b.last_move = r.last_move ? String(r.last_move).slice(0,10) : '';
  if(has('code')) b.code = r.code ? String(r.code).trim() : '';
  if(has('cust_until')) b.cust_until = r.cust_until ? String(r.cust_until).slice(0,10) : '';
  if(has('closed')){ b.closed = !!r.closed; b.closed_at = r.closed_at||''; b.built_homes = +r.built_homes||0; b.built_budget = +r.built_budget||0;
    b.open_homes = +r.open_homes||0; b.plan_budget = +r.plan_budget||0; b.plan_units = +r.plan_units||0; }
  return JSON.parse(JSON.stringify(b));          /* สำเนาแยก — แก้ในเครื่องต้องไม่ไปแก้ฐานเทียบด้วย */
}

/* ===== งาน BOQ: ส่งเฉพาะช่องที่แก้ ===== */

/* แทนที่ Unit ของหมู่บ้านบนระบบอย่างปลอดภัย
   1) จำ id ของแถวเดิม  2) เพิ่มแถวใหม่ (เช็ก error ทุกชุด)  3) สำเร็จครบแล้วค่อยลบแถวเดิม
   พลาดตรงไหน = ของเดิมบนระบบยังอยู่ครบ (เดิม: ลบก่อน แล้วเพิ่มไม่สำเร็จ → Unit บนระบบหายทั้งหมู่บ้าน) */
let _houseSubColOk = true;
const errMsg = e => (e && (e.message || e.details || e.code)) || 'error';
const isColErr = e => !!e && (e.code==='42703' || e.code==='PGRST204' || /column|schema cache/i.test(e.message||''));
/* บันทึกรายหลังของหมู่บ้าน — ส่งเฉพาะหลังที่ "แก้จริง" (เทียบลายเซ็นตอนโหลด)
   · บ้านที่มีบนระบบแล้ว → แก้ทับแถวเดิม (id เดิม) · บ้านใหม่ → เพิ่ม
   · ลบเฉพาะแถวที่เครื่องนี้เคยเห็นแล้วผู้ใช้ลบออกจริง — แถวที่เครื่องอื่นเพิ่งเพิ่ม ไม่ลบ
   · ไม่มีการลบทั้งหมู่บ้านแล้วเพิ่มใหม่อีกต่อไป (เดิม: เครื่องที่ข้อมูลเก่ากว่าทับงานของเครื่องอื่นทั้งหมู่บ้าน) */
/* ===== กันแก้ทับกัน (หลายคน/หลายเครื่องแก้พร้อมกัน) ===== */
window._syncConflicts = [];
/* อ่านค่าล่าสุดของบ้านที่จะบันทึก แล้วรวมแบบรายช่อง:
   คนอื่นแก้ช่องที่เราไม่ได้แก้ → รับค่าใหม่มาไว้ในเครื่อง · แก้ช่องเดียวกันคนละค่า → ใช้ค่าของเรา และจดไว้แจ้งให้ตรวจ */
async function houseMergeScan(v, list){
  const hs = list.filter(h=> h._b && h._t && h._t === h.cid);
  if(!hs.length) return;
  const cols = _houseSubColOk ? HOUSE_COLS : HOUSE_COLS.replace(',sub_contract','');
  const by = {};
  for(let i=0;i<hs.length;i+=150){
    let r; try{ r = await sb.from('houses').select(cols).in('id', hs.slice(i,i+150).map(h=> h._t)); }catch(e){ r = { error:e }; }
    if(!r || r.error || !Array.isArray(r.data)) return;          /* อ่านไม่ได้ → ส่งแบบรายช่องตามเดิม (ยังไม่ทับช่องที่ไม่ได้แก้) */
    r.data.forEach(x=>{ by[x.id] = x; });
  }
  hs.forEach(h=>{
    const x = by[h._t]; if(!x) return;
    const srvH = houseFromDb(x), srv = houseCore(srvH), mine = houseCore(h);
    Object.keys(H_FIELD).forEach(k=>{
      if(!(k in srv) || !(k in h._b)) return;
      const S = stableSig(srv[k]), Bs = stableSig(h._b[k]), M = stableSig(mine[k]);
      if(S === Bs) return;                                         /* ไม่มีใครแก้บนระบบ */
      if(M === Bs){ h[H_FIELD[k]] = srvH[H_FIELD[k]]; h._b[k] = srv[k]; return; }   /* เราไม่ได้แก้ → รับของคนอื่น */
      if(M !== S){
        /* แก้ช่องเดียวกันทั้งคู่ (เครื่องนี้แก้จากข้อมูลที่ยังไม่ล่าสุด) → ใช้ค่าที่บันทึกก่อน (บนระบบ) ไม่ทับ
           แล้วแจ้งให้ตัดสินใจ — กด "ใช้ค่าของฉัน" = ตั้งใจทับจริง */
        const prop = H_FIELD[k], mineV = JSON.parse(JSON.stringify(h[prop]===undefined?null:h[prop]));
        h[prop] = srvH[prop];
        window._syncConflicts.push({ where: v.name+' · บ้าน '+(h.no||'-'), field: H_LABEL[k]||k, theirs: srv[k], mine: mine[k],
          apply: ()=>{ h[prop] = mineV; v._hDirty = true; } });
      }
      h._b[k] = srv[k];
    });
  });
}
/* นับหลังที่เสร็จจากระบบ (ไม่ใช่จากเครื่อง — ในเครื่องอาจยังไม่มีของที่คนอื่นเพิ่งแก้) */
async function cloudDoneCount(cid){
  let n = 0;
  for(let from=0, g=0; g<50; g++, from+=1000){
    let r; try{ r = await sb.from('houses').select('status').eq('village_id', cid).order('id').range(from, from+999); }catch(e){ return null; }
    if(!r || r.error || !Array.isArray(r.data)) return null;
    r.data.forEach(x=>{ if(x.status==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(x.status||'')) n++; });
    if(r.data.length < 1000) break;
  }
  return n;
}
/* 3 ทาง (ฐาน / ของเรา / บนระบบ) สำหรับขั้นตอนงาน (tasks) — รวมรายขั้น รายช่อง */
const TASK_LABEL = { p:'ความคืบหน้า %', w:'น้ำหนัก', name:'ชื่อขั้นงาน', note:'หมายเหตุ' };
function mergeTasks3(base, mine, theirs, where, vRef){
  const S = x=> stableSig(x===undefined?null:x);
  const key = t=> t && t.id!=null && t.id!=='' ? 'i:'+t.id : 'n:'+String((t&&t.name)||'');
  const Bm = new Map((base||[]).map(t=>[key(t),t])), Mm = new Map((mine||[]).map(t=>[key(t),t]));
  const out = [], seen = new Set();
  (theirs||[]).forEach(t=>{
    const k = key(t); seen.add(k);
    const b = Bm.get(k), m = Mm.get(k);
    if(!b){ out.push(m || t); return; }                            /* คนอื่นเพิ่ม (หรือเพิ่มพร้อมกัน → ของเรา) */
    if(!m){ if(S(t) !== S(b)) out.push(t); return; }               /* เราลบ: คนอื่นแก้ระหว่างนั้น → คงไว้ */
    if(S(m) === S(b)){ out.push(t); return; }                       /* เราไม่ได้แก้ → ของคนอื่น */
    if(S(t) === S(b)){ out.push(m); return; }                       /* คนอื่นไม่ได้แก้ → ของเรา */
    const r = Object.assign({}, t);                                 /* ทั้งคู่แก้ → รวมรายช่อง */
    new Set(Object.keys(m).concat(Object.keys(b))).forEach(f=>{
      if(S(m[f]) === S(b[f])) return;
      if(S(t[f]) !== S(b[f]) && S(t[f]) !== S(m[f])){
        /* ทั้งคู่แก้ช่องเดียวกัน → ใช้ค่าที่บันทึกก่อน · แจ้งให้เลือก "ใช้ค่าของฉัน" */
        const mv = m[f]===undefined ? undefined : JSON.parse(JSON.stringify(m[f]));
        window._syncConflicts.push({ where: where+' · ขั้นงาน '+(m.name||t.name||''), field: TASK_LABEL[f]||f, theirs:t[f], mine:m[f],
          apply: vRef ? ()=>{ const tk = (vRef.tasks||[]).find(x=> key(x)===k); if(!tk) return; if(mv===undefined) delete tk[f]; else tk[f] = mv; vRef._dirty = true; } : null });
        return;
      }
      if(m[f] === undefined) delete r[f]; else r[f] = m[f];
    });
    out.push(r);
  });
  (mine||[]).forEach(m=>{ const k = key(m); if(seen.has(k)) return;
    const b = Bm.get(k);
    if(!b){ out.push(m); return; }                                  /* เราเพิ่มใหม่ */
    if(S(m) !== S(b)) out.push(m);                                  /* คนอื่นลบ แต่เราแก้ → คงของเรา */
  });
  return out;
}
async function replaceHouses(v){
  const cid = v.cloudId;
  /* 1) แถวบนระบบตอนนี้ (id + บ้านเลขที่) */
  const cloud = [];
  for(let from=0, g=0; g<50; g++, from+=1000){
    const r = await sb.from('houses').select('id,no').eq('village_id', cid).order('id').range(from, from+999);
    if(r.error) return { ok:false, err:'อ่าน Unit เดิมไม่ได้: '+errMsg(r.error) };
    (r.data||[]).forEach(x=> cloud.push(x));
    if((r.data||[]).length < 1000) break;
  }
  const cloudIds = new Set(cloud.map(x=> x.id));
  const freeByNo = {};
  cloud.forEach(x=>{ const k = normName(x.no||''); (freeByNo[k] = freeByNo[k] || []).push(x.id); });
  const local = dedupeHouses(v.houses||[]).filter(h=>h.no||h.st||h.name);
  const claimed = new Set();
  /* 2) จับคู่บ้านในเครื่อง ↔ แถวบนระบบ: id เดิมก่อน แล้วค่อยบ้านเลขที่ */
  local.forEach(h=>{ if(h.cid && cloudIds.has(h.cid) && !claimed.has(h.cid)){ h._t = h.cid; claimed.add(h.cid); } else h._t = null; });
  local.forEach(h=>{
    if(h._t) return;
    const list = freeByNo[normName(h.no||'')] || [];
    const id = list.find(x=> !claimed.has(x));
    if(id){ h._t = id; claimed.add(id); }
  });
  const ups = local.filter(h=> h._t && (h._t !== h.cid || h._s !== houseSig(h)));
  let ins = local.filter(h=> !h._t);
  const known = new Set(v._hcids || []);
  const dels = cloud.filter(x=> !claimed.has(x.id) && known.has(x.id)).map(x=> x.id);
  const rowOf = h=>{ const r = houseRow(v, h); if(!_houseSubColOk) delete r.sub_contract; return r; };
  const batch = (arr, n)=> Array.from({length:Math.ceil(arr.length/n)}, (_,i)=> arr.slice(i*n, i*n+n));
  /* 3) แก้แถวเดิม — ระบบแยกสิทธิ์ข้อมูลลูกค้าแล้ว: ผ่านฟังก์ชัน ftth_houses_update (upsert ตารางต้องอ่านช่องข้อมูลลูกค้าได้) */
  if(window._piiMode === 'rpc' && window._houseUpdRpc !== false){
    /* ส่งเฉพาะช่องที่เครื่องนี้แก้ (เทียบฐานตอนโหลด) — ช่องอื่นของหลังเดียวกันที่คนอื่นแก้ ระบบคงไว้
       ก่อนส่ง: อ่านค่าล่าสุดของหลังที่จะแก้ → ช่องที่คนอื่นแก้ (เราไม่ได้แก้) รับมาไว้ในเครื่อง · แก้ช่องเดียวกัน = แจ้งให้ตรวจ */
    await houseMergeScan(v, ups);
    const partOf = h=>{
      if(!h._b || h._t !== h.cid) return Object.assign({ id:h._t }, rowOf(h));      /* ไม่มีฐาน (ข้อมูลเก่า/จับคู่ด้วยบ้านเลขที่) → ทั้งแถวแบบเดิม */
      const core = houseCore(h), r = { id:h._t };
      Object.keys(core).forEach(k=>{ if(stableSig(core[k]) !== stableSig(h._b[k])) r[k] = core[k]; });
      if(!_houseSubColOk) delete r.sub_contract;
      return r;
    };
    for(const part0 of batch(ups, 300)){
      const rows = part0.map(partOf), part = part0.filter((h,i)=> Object.keys(rows[i]).length > 1);
      part0.forEach((h,i)=>{ if(Object.keys(rows[i]).length <= 1){ h.cid = h._t; h._s = houseSig(h); h._b = houseCore(h); } });   /* ไม่เหลือช่องที่ต้องส่ง */
      if(!part.length) continue;
      let r; try{ r = await sb.rpc('ftth_houses_update', { rows: rows.filter(x=> Object.keys(x).length > 1) }); }catch(e){ r = { error:e }; }
      if(r && r.error && (r.error.code==='PGRST202' || r.error.code==='42883' || /could not find the function|does not exist/i.test(r.error.message||''))){ window._houseUpdRpc = false; break; }
      if(!r || r.error) return { ok:false, err:'บันทึก Unit ไม่สำเร็จ: '+errMsg(r && r.error) };
      const miss = new Set(((r.data||{}).missing)||[]);
      part.forEach(h=>{ if(miss.has(h._t)){ claimed.delete(h._t); h._t = null; ins.push(h); } else { h.cid = h._t; h._s = houseSig(h); h._b = houseCore(h); } });
    }
    if(window._houseUpdRpc !== false) ups.length = 0;
  }
  for(const part of batch(ups, 500)){
    let r = await sb.from('houses').upsert(part.map(h=> Object.assign({ id:h._t }, rowOf(h))), {onConflict:'id'}).select('id');
    if(r.error && isColErr(r.error) && /sub_contract/.test(r.error.message||'') && _houseSubColOk){
      _houseSubColOk = false;
      r = await sb.from('houses').upsert(part.map(h=> Object.assign({ id:h._t }, rowOf(h))), {onConflict:'id'}).select('id');
    }
    if(r.error) return { ok:false, err:'บันทึก Unit ไม่สำเร็จ: '+errMsg(r.error)+(isColErr(r.error)?' — ให้ผู้ดูแลรัน ตรวจคอลัมน์-houses.sql':'') };
    part.forEach(h=>{ h.cid = h._t; h._s = houseSig(h); h._b = houseCore(h); });
  }
  /* 4) เพิ่มบ้านใหม่ */
  for(const part of batch(ins, 500)){
    let r = await sb.from('houses').insert(part.map(rowOf)).select('id,no');
    if(r.error && isColErr(r.error) && /sub_contract/.test(r.error.message||'') && _houseSubColOk){
      _houseSubColOk = false;
      r = await sb.from('houses').insert(part.map(rowOf)).select('id,no');
    }
    if(r.error) return { ok:false, err:'บันทึก Unit ไม่สำเร็จ: '+errMsg(r.error)+(isColErr(r.error)?' — ให้ผู้ดูแลรัน ตรวจคอลัมน์-houses.sql':'') };
    const got = r.data || [];
    if(got.length !== part.length) return { ok:false, err:'บันทึก Unit ได้ '+got.length+'/'+part.length+' แถว (จะลองใหม่รอบหน้า)' };
    /* ปกติได้ id กลับมาตามลำดับ · ถ้าลำดับไม่ตรง จับคู่ด้วยบ้านเลขที่ */
    const inOrder = got.every((x,i)=> x.no === undefined || String(x.no||'') === String(part[i].no||''));
    const pool = {}; if(!inOrder) got.forEach(x=>{ (pool[String(x.no||'')] = pool[String(x.no||'')] || []).push(x.id); });
    part.forEach((h,i)=>{ const id = inOrder ? got[i].id : (pool[String(h.no||'')]||[]).shift(); if(id){ h.cid = id; claimed.add(id); } h._s = houseSig(h); h._b = houseCore(h); });
  }
  /* 5) ลบแถวที่ผู้ใช้ลบออกจริง */
  const delErr = await delIds(dels);
  if(delErr) return { ok:false, err:'ลบ Unit ที่ถูกลบออกไม่ครบ (จะลองใหม่รอบหน้า): '+errMsg(delErr) };
  local.forEach(h=>{ delete h._t; });
  /* แถวบนระบบที่เครื่องนี้รู้จัก = ที่จับคู่/เพิ่มแล้ว + แถวของเครื่องอื่นที่ยังไม่ได้โหลด (ไม่ลบ) */
  v._hcids = [...claimed];
  return { ok:true, n:local.length, up:ups.length, add:ins.length, del:dels.length };
}
async function delIds(ids){
  if(!ids || !ids.length) return null;
  const res = await Promise.all(Array.from({length:Math.ceil(ids.length/150)}, (_,i)=>
    sb.from('houses').delete().in('id', ids.slice(i*150, i*150+150))));
  const b = res.find(r=> r && r.error);
  return b ? b.error : null;
}
/* สร้างแถวหมู่บ้านบนระบบ (ยังไม่เคยขึ้น) */
