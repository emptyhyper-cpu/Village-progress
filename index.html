function cellDate(val){
  if(val instanceof Date){
    const d = new Date(val.getTime() - val.getTimezoneOffset()*60000);
    return d.toISOString().slice(0,10);
  }
  if(typeof val === 'number' && val > 20000){
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    return d.toISOString().slice(0,10);
  }
  if(typeof val === 'string'){
    const s = val.trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  }
  return '';
}
function importExcel(ev){
  const f = ev.target.files[0]; if(!f) return;
  if(!requireAdmin('นำเข้าไฟล์ Master')){ ev.target.value=''; return; }
  const rd = new FileReader();
  rd.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      // บัญชี Vendor: จากไฟล์ package ('บัญชี') หรือ Master ('บัญชีทั้งหมด')
      let accVendor = null, touchedB = false;
      const acc = parseAccountSheet(wb);
      if(acc){
        let vd = B.vendors.find(x=>x.user===acc.user);
        if(!vd){ vd = {id:uid(), name:acc.name, user:acc.user, pass:acc.pass, prices:{}}; B.vendors.push(vd); }
        else { vd.pass = acc.pass; vd.name = acc.name; }
        accVendor = vd; touchedB = true;
      }
      const snAll = wb.SheetNames.find(x=>x==='บัญชีทั้งหมด');
      if(snAll){
        const aa = XLSX.utils.sheet_to_json(wb.Sheets[snAll], {header:1, defval:''});
        aa.slice(1).forEach(r=>{
          if(!r || !r[1]) return;
          const name=String(r[0]||r[1]), user=String(r[1]), pass=String(r[2]||'');
          let vd = B.vendors.find(x=>x.user===user);
          if(!vd){ B.vendors.push({id:uid(), name, user, pass, prices:{}}); }
          else { vd.name = name; if(pass) vd.pass = pass; }
          touchedB = true;
        });
      }
      // ราคา: ทุก sheet ที่ขึ้นต้นด้วย 'ราคา' — จับคู่ Vendor จากแถว meta หรือจากบัญชีใน package
      wb.SheetNames.filter(x=>x.startsWith('ราคา')).forEach(psn=>{
        const pa = XLSX.utils.sheet_to_json(wb.Sheets[psn], {header:1, defval:''});
        let vd = accVendor;
        const metaRow = pa.find(r=> r && String(r[0]).trim()==='Vendor');
        if(metaRow){
          const nm = String(metaRow[1]||'').trim();
          vd = B.vendors.find(x=>x.name.trim()===nm) || vd;
        }
        if(!vd) return;
        const hi = pa.findIndex(r=> r && String(r[2]).trim()==='รายการ');
        if(hi<0) return;
        const nameIdx = {}; ITEMS.forEach((it,i)=> nameIdx[it.n.trim()] = i);
        for(let i=hi+1;i<pa.length;i++){
          const r = pa[i]; if(!r) continue;
          const nm = String(r[2]||'').trim(); const pr = +r[4];
          if(nm && nameIdx[nm]!=null && !isNaN(pr)) vd.prices['i'+nameIdx[nm]] = pr;
        }
        touchedB = true;
      });
      if(touchedB) bqPersist();
      // ไฟล์ Master รูปแบบ 3 sheet (Progress / BOQ / Unit)
      const beforeIds = new Set(state.villages.map(v=>v.id));
      if(importMaster3(wb, {authoritative:isAdmin()})){
        finishImport(beforeIds);
        return;
      }
      let added = 0, updated = 0, teamFmt = 0;
      wb.SheetNames.forEach(sn=>{
        if(sn === 'สรุปรวม' || sn === 'สรุปราย Vendor' || sn.startsWith('บัญชี') || sn.startsWith('ราคา') || sn === 'วิธีกรอก' || /ลูกบ้าน/.test(sn)) return;
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
        let v = parseAppFormat(aoa);
        if(!v){ v = parseTeamFormat(aoa, sn); if(v) teamFmt++; }
        if(v){ state.villages.push(v); added++; }
      });
      if(added || updated || acc){
        persist(); bqPersist();
        if(session.role){ currentId = null; render(); }
        toast('นำเข้าสำเร็จ: ใหม่ ' + added + ' · อัปเดต ' + updated + (acc?' · บัญชี Vendor 1':'') + (teamFmt ? ' (กด ⚡ Gen เพื่อใส่วันที่)' : ''));
      } else toast('ไม่พบรูปแบบที่รู้จักในไฟล์');
    }catch(err){ toast('อ่านไฟล์ Excel ไม่สำเร็จ'); }
  };
  rd.readAsArrayBuffer(f);
  ev.target.value = '';
}

/* รูปแบบที่ export จากแอปนี้ — อ่านกลับได้ครบทุกช่อง */
function parseAppFormat(aoa){
  const hi = aoa.findIndex(r => r && r[1] === 'ขั้นตอนงาน');
  if(hi < 0) return null;
  const meta = {};
  for(let i=0;i<hi;i++){ if(aoa[i] && aoa[i][0] !== '') meta[String(aoa[i][0])] = aoa[i][1]; }
  const tasks = [];
  for(let i=hi+1;i<aoa.length;i++){
    const r = aoa[i];
    if(!r || r[1] === '' || r[1] == null) continue;
    tasks.push({id:uid(), name:String(r[1]), w:+r[2]||0, p:+r[3]||0, s:cellDate(r[4]), e:cellDate(r[5]), note:String(r[6]||'')});
  }
  if(!tasks.length) return null;
  return {
    id: uid(),
    name: String(meta['โครงการ']||'โครงการนำเข้า'),
    contractor: String(meta['ผู้รับเหมา']||''),
    ports: String(meta['พอร์ต / หลังคาเรือน']||''),
    start: cellDate(meta['วันเริ่มงาน']),
    end: cellDate(meta['กำหนดส่งมอบ']),
    issue: String(meta['ปัญหา / อุปสรรค']||''),
    tasks
  };
}
/* รูปแบบแผนทีม (no / description / ผู้รับผิดชอบ) — อ่านชื่องานได้ แต่ช่องสีที่ระบายวันไม่สามารถอ่านได้ */
function parseTeamFormat(aoa, sn){
  const hi = aoa.findIndex(r => r && String(r[0]).trim().toLowerCase() === 'no' && String(r[1]).trim().toLowerCase() === 'description');
  if(hi < 0) return null;
  const name = (aoa[0] && aoa[0][0]) ? String(aoa[0][0]) : sn;
  const tasks = [];
  for(let i=hi+1;i<aoa.length;i++){
    const r = aoa[i];
    if(!r || r[1] === '' || r[1] == null) continue;
    tasks.push({id:uid(), name:String(r[1]), w:0, p:0, s:'', e:'', note:String(r[2]||'')});
  }
  if(!tasks.length) return null;
  const w = Math.floor(100/tasks.length);
  tasks.forEach((t,i)=> t.w = (i === tasks.length-1) ? 100 - w*(tasks.length-1) : w);
  return {id:uid(), name, contractor:'', ports:'', start:'', end:'', issue:'', tasks};
}

  toast('Export สรุปผู้บริหารแล้ว (ไฟล์ภายใน มีข้อมูลงบ)');
}

/* ตรวจคอลัมน์ส่วนสถานะรายหลังแบบยืดหยุ่น: รองรับทั้ง (ลำดับ,บ้านเลขที่,สถานะ,หมายเหตุ[,Lat,Long])
   และไฟล์ทีม (ลำดับ,โครงการ,บ้านเลขที่,Lat,Long,สถานะ,ผู้รับผิดชอบ) */
function exportMasterExcel(){
  if(!needLib('XLSX')) return;
  const vil = sortForExport(visibleVillages());
  if(!vil.length){ toast('ยังไม่มีข้อมูล'); return; }
  const wb = XLSX.utils.book_new();

  /* ---------- SHEET 1: Progress (บรรทัดละหมู่บ้าน) ---------- */
  const maxSteps = Math.max.apply(null, vil.map(v=>(v.tasks||[]).length).concat([9]));
  const ph = ['โครงการ','Vendor','เลขที่ PO','พอร์ต','เดินสายสำเร็จ (หลัง)','วันเริ่มงาน','กำหนดส่งมอบ','ความคืบหน้ารวม (%)','ปัญหา / อุปสรรค','สถานะโครงการ','วันที่ปิด','บ้านตอนเปิด','บ้านตอนปิด','ส่วนต่างบ้าน','งบตอนเปิด','งบตอนปิด','ส่วนต่างงบ','เดินสายเพิ่มล่าสุด','รหัสโครงการ','VLC'];
  for(let i=0;i<maxSteps;i++) ph.push('งาน'+(i+1)+' %');
  const pAoa = [ph];
  vil.forEach(v=>{
    const jb0 = villageJobs(v)[0];
    const cl = isClosed(v);
    const row = [v.name, v.contractor||'', jb0?jobPOName(jb0):'', v.ports||'', v.homesDone||'', v.start||'', v.end||'', overall(v), v.issue||'',
                 cl?'ปิดโครงการ':'ดำเนินการ', cl?(v.closedAt||''):'',
                 cl?(+v.openHomes||0):'', cl?(+v.builtHomes||0):'', cl?((+v.builtHomes||0)-(+v.openHomes||0)):'',
                 cl?(+v.planBudget||0):'', cl?(+v.builtBudget||0):'', cl?((+v.builtBudget||0)-(+v.planBudget||0)):'',
                 v.lastMove||'', ensureCode(v), vlcText(v)];
    for(let i=0;i<maxSteps;i++){ const t=(v.tasks||[])[i]; row.push(t? (+t.p||0):''); }
    pAoa.push(row);
  });
  const wsP = XLSX.utils.aoa_to_sheet(pAoa);
  wsP['!cols'] = [{wch:30},{wch:14},{wch:16},{wch:8},{wch:14},{wch:12},{wch:13},{wch:14},{wch:26},{wch:14},{wch:12},{wch:12},{wch:12},{wch:13},{wch:14},{wch:14},{wch:13},{wch:18},{wch:12},{wch:18}].concat(Array(maxSteps).fill({wch:8}));
  wsP['!freeze'] = {xSplit:1, ySplit:1};
  XLSX.utils.book_append_sheet(wb, wsP, 'Progress');
  /* step-name legend below the table */
  if(vil[0] && vil[0].tasks){
    const lr = pAoa.length + 2;
    XLSX.utils.sheet_add_aoa(wsP, [['ชื่อขั้นตอนงาน (อ้างอิงคอลัมน์ งานN %)']], {origin:'A'+lr});
    vil[0].tasks.forEach((t,i)=> XLSX.utils.sheet_add_aoa(wsP, [['งาน'+(i+1), t.name]], {origin:'A'+(lr+1+i)}));
  }

  /* ---------- SHEET 2: BOQ (item ซ้าย · โครงการต่อขวาเป็นบล็อก 6 คอลัมน์) ---------- */
  boqSheet(wb, vil);

  /* ---------- SHEET: PO (วงเงินรายใบสั่งจ้าง) ---------- */
  /* sheet PO — กรองตามสิทธิ์ผู้ที่กด export (ผรม.เห็นเฉพาะของตัวเอง) */
  const viewAllPO = canViewAll();
  const posForFile = (B.pos||[]).filter(p=> viewAllPO || poJobs(p.id).some(j=> j.vendorId===session.vendorId));
  if(posForFile.length){
    const poA = [['เลขที่ PO','รายละเอียด','วงเงินตาม PO (บาท)','ตั้งงบรวม (บาท)','ใช้จริงรวม (บาท)','คงเหลือให้จัดสรร','คงเหลือจริง','จำนวนโครงการ','โครงการในสังกัด','หมายเหตุ']];
    posForFile.forEach(p=>{
      const all = poJobs(p.id);
      const mine = viewAllPO ? all : all.filter(j=> j.vendorId===session.vendorId);
      const sole = viewAllPO || (all.length && all.every(j=> j.vendorId===session.vendorId));
      const alloc = mine.reduce((a,j)=>a+jobBudget(j),0);
      const spent = mine.reduce((a,j)=>a+jobCost(j),0);
      const ceil = sole ? (+p.amount||0) : '';
      poA.push([p.code||'', p.name||'', ceil, alloc, spent,
                sole ? (+p.amount||0)-alloc : '', sole ? (+p.amount||0)-spent : alloc-spent,
                mine.length, mine.map(j=>jobName(j)).join(' | '),
                sole ? '' : 'PO นี้มีผู้รับเหมารายอื่นร่วมด้วย']);
    });
    const wsPO = XLSX.utils.aoa_to_sheet(poA);
    wsPO['!cols'] = [{wch:18},{wch:28},{wch:18},{wch:16},{wch:16},{wch:16},{wch:14},{wch:12},{wch:60},{wch:32}];
    XLSX.utils.book_append_sheet(wb, wsPO, 'PO');
  }

  /* ---------- SHEET 3: Unit (รายหลัง ทุกหมู่บ้านรวมกัน) ---------- */
  /* A = รหัสโครงการ (คงที่) · Q = คีย์รายหลัง (VLOOKUP ได้) */
  const uHdr = ['รหัสโครงการ','โครงการ','บ้านเลขที่','Lat','Lot','status','Solution','Estimate price','Detail','VLC','OLT','ชื่อ Name','บ้านเลขที่ Address','เบอร์โทร Phone number','สนใจ/ไม่สนใจ','Sub-Contract Underground','คีย์รายหลัง'];
  const uAoa = [uHdr];
  vil.forEach(v=>{ const cd = ensureCode(v); (v.houses||[]).forEach(h=>{
    uAoa.push([cd, v.name, h.no||'', h.lat||'', h.lng||'', h.st||'', h.sol||'', h.est||'', h.detail||'', h.vlc||'', h.olt||'', maskCust(v,h.name), maskCust(v,h.addr), maskCust(v,h.phone), h.interest||'', houseSub(v,h), rowCode(v,h)]);
  }); });
  const wsU = XLSX.utils.aoa_to_sheet(uAoa);
  wsU['!cols'] = [{wch:12},{wch:30},{wch:12},{wch:11},{wch:11},{wch:26},{wch:12},{wch:14},{wch:30},{wch:8},{wch:8},{wch:16},{wch:16},{wch:16},{wch:14},{wch:24},{wch:18}];
  wsU['!freeze'] = {xSplit:0, ySplit:1};
  XLSX.utils.book_append_sheet(wb, wsU, 'Unit');
  paintStatusColumn(wsU, uAoa, 'status', 'Unit');

  /* ---------- backup sheets (admin): accounts + vendor prices ---------- */
  if(isAdmin() && B.vendors.length){
    const used = new Set(['Progress','BOQ','Unit']);
    const accAoa = [['Vendor','Username','Password']];
    B.vendors.forEach(vd=> accAoa.push([vd.name, vd.user, vd.pass]));
    const wsAcc = XLSX.utils.aoa_to_sheet(accAoa);
    wsAcc['!cols'] = [{wch:22},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsAcc, 'บัญชีทั้งหมด');
  }
  writeBookColored(wb, 'master-projects-' + todayISO() + '.xlsx');
  toast('Export Master (3 sheet: Progress · BOQ · Unit) แล้ว');
}

/* สร้าง sheet BOQ: fix 4 คอลัมน์ซ้าย + บล็อก 6 คอลัมน์ต่อโครงการ พร้อมสูตร + เส้นแบ่ง */
function boqSheet(wb, vil){
  const jobsFor = v => villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId);
  const projs = vil.map(v=>({v, jb: jobsFor(v)[0]||null}));
  const nItem = ITEMS.length;
  const H1 = ['','','','FIX'];        // row 1: project name banner
  const H2 = ['ลำดับ','หมวด','รายการ','หน่วย'];  // row 2: column labels
  const blockCols = ['ราคา/หน่วย (โครงการนี้)','จำนวนตั้งงบ','งบประมาณ (บาท)','จำนวนที่ใช้แล้ว','ค่างานที่ใช้แล้ว (บาท)','งบคงเหลือ (บาท)'];
  projs.forEach(pr=>{
    H1.push(pr.v.name, '', '', '', '', '');
    blockCols.forEach(c=>H2.push(c));
  });
  const aoa = [H1, H2];
  ITEMS.forEach((it,idx)=>{
    const row = [idx+1, it.s, (it.on||it.n), it.u];
    projs.forEach(pr=>{
      const jb = pr.jb;
      const p  = (jb && jb.prices) ? jb.prices['i'+idx] : '';
      const bq = (jb && jb.bqty) ? jb.bqty['i'+idx] : '';
      const uq = (jb && jb.qty) ? jb.qty['i'+idx] : '';
      row.push(p===undefined?'':p, bq===undefined?'':bq, '', uq===undefined?'':uq, '', '');
    });
    aoa.push(row);
  });
  const totalRow = ['','','รวมทั้งโครงการ',''];
  projs.forEach(()=> totalRow.push('','','','','',''));
  aoa.push(totalRow);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const colName = c => { let s=''; c++; while(c>0){ s=String.fromCharCode(65+(c-1)%26)+s; c=Math.floor((c-1)/26);} return s; };
  const first = 3, last = 2 + nItem, trow = last + 1;
  const cols = [{wch:6},{wch:22},{wch:48},{wch:7}];
  const merges = [];
  projs.forEach((pr,pi)=>{
    const base = 4 + pi*6;                    // 0-indexed first col of this block
    const cP=colName(base), cB=colName(base+1), cBud=colName(base+2), cU=colName(base+3), cUse=colName(base+4), cR=colName(base+5);
    merges.push({s:{r:0,c:base}, e:{r:0,c:base+5}});   // merge project-name banner
    for(let n=first;n<=last;n++){
      ws[cBud+n] = {t:'n', f:'IF(OR('+cP+n+'="",'+cB+n+'=""),"",'+cP+n+'*'+cB+n+')'};
      ws[cUse+n] = {t:'n', f:'IF(OR('+cP+n+'="",'+cU+n+'=""),"",'+cP+n+'*'+cU+n+')'};
      ws[cR+n]   = {t:'n', f:'IF('+cBud+n+'="","",'+cBud+n+'-IF('+cUse+n+'="",0,'+cUse+n+'))'};
    }
    ws[cBud+trow] = {t:'n', f:'SUM('+cBud+first+':'+cBud+last+')'};
    ws[cUse+trow] = {t:'n', f:'SUM('+cUse+first+':'+cUse+last+')'};
    ws[cR+trow]   = {t:'n', f:'SUM('+cR+first+':'+cR+last+')'};
    cols.push({wch:13},{wch:11},{wch:14},{wch:12},{wch:16},{wch:14});
    // thick left border to separate projects
    for(let n=1;n<=trow;n++){
      const cell = ws[cP+n]; if(cell){ cell.s = cell.s||{}; cell.s.border = {left:{style:'medium',color:{rgb:'0F3D24'}}}; }
    }
  });
  ws['!cols'] = cols;
  ws['!merges'] = merges;
  ws['!freeze'] = {xSplit:4, ySplit:2};
  XLSX.utils.book_append_sheet(wb, ws, 'BOQ');
}

/* ============ อ่านไฟล์ Master 3-sheet กลับเข้าโปรแกรม ============ */
function importMaster3(wb, opts){
  const authoritative = !!(opts && opts.authoritative);
  const hasP = wb.SheetNames.includes('Progress');
  const hasB = wb.SheetNames.includes('BOQ');
  const hasU = wb.SheetNames.includes('Unit');
  if(!hasP && !hasB && !hasU) return false;
  const nameIdx = {}; ITEMS.forEach((it,i)=> nameIdx[it.n.trim()] = i);

  /* Progress sheet */
  const pa = hasP ? XLSX.utils.sheet_to_json(wb.Sheets['Progress'], {header:1, defval:''}) : [];
  const ph = (pa[0]||[]).map(String);
  const stepCols = [];
  ph.forEach((h,i)=>{ const m=/^งาน(\d+)/.exec(h); if(m) stepCols.push({i, n:+m[1]}); });
  if(wb.SheetNames.includes('PO')){
    const poa = XLSX.utils.sheet_to_json(wb.Sheets['PO'], {header:1, defval:''});
    B.pos = B.pos || [];
    for(let r=1;r<poa.length;r++){
      const code = String(poa[r][0]||'').trim(); if(!code) continue;
      let p = B.pos.find(x=>String(x.code).trim()===code);
      if(!p){ p={id:uid(), code, name:'', amount:0}; B.pos.push(p); }
      p.name = String(poa[r][1]||'');
      p.amount = +poa[r][2]||0;
    }
  }
  const poCol = ph.findIndex(h=>String(h).includes('PO'));
  /* หาคอลัมน์จากชื่อหัวตาราง (กันพังเมื่อมีการเพิ่ม/สลับคอลัมน์) */
  const H = (...keys)=>{ for(const k of keys){ const i=ph.findIndex(h=>String(h).includes(k)); if(i>=0) return i; } return -1; };
  const cName  = (()=>{ const i=H('โครงการ','หมู่บ้าน'); return i>=0?i:0; })();
  const cVend  = H('Vendor','ผู้รับเหมา');
  const cPorts = H('พอร์ต','หลังคาเรือน');
  const cDone  = H('เดินสายสำเร็จ','เดินสายแล้ว');
  const cStart = H('วันเริ่ม');
  const cEnd   = H('กำหนดส่ง','วันเสร็จ');
  const cIssue = H('ปัญหา');
  const cStat  = H('สถานะโครงการ');
  const cCAt   = H('วันที่ปิด');
  const cCB    = H('งบตอนปิด','งบที่ใช้ implement','งบก่อสร้าง');
  const cOH    = H('บ้านตอนเปิด');
  const cCH    = H('บ้านตอนปิด');
  const cOB    = H('งบตอนเปิด');
  const cLM    = H('เดินสายเพิ่มล่าสุด','วันอัปเดตล่าสุด');
  const cCode  = H('รหัสโครงการ','project code');
  const byName = {};
  for(let r=1;r<pa.length;r++){
    const row = pa[r];
    const nm = String(row[cName]||'').trim();
    if(!nm || nm.startsWith('ชื่อขั้นตอน') || /^งาน\d+$/.test(nm)) continue;
    /* จับคู่ด้วยรหัสโครงการก่อน — เปลี่ยนชื่อหมู่บ้านแล้วยังหาเจอ ไม่สร้างซ้ำ */
    const codeIn = cCode>=0 ? String(row[cCode]||'').trim() : '';
    let v = codeIn ? state.villages.find(x=> String(x.code||'').trim() === codeIn) : null;
    if(!v) v = findVillageByName(nm);
    if(v && codeIn && !v.code) v.code = codeIn;
    if(v && codeIn && v.code === codeIn && nm && v.name !== nm) v.name = nm;   /* รหัสเดิม = เปลี่ยนชื่อได้ */
    const contractor = cVend>=0 ? String(row[cVend]||'') : '';
    const mv = B.vendors.find(x=>x.name.trim()===contractor.trim());
    if(!v){ v = {id:uid(), name:nm, code:codeIn||'', contractor, vendorId:mv?mv.id:null, ports:'', homesDone:'', start:'', end:'', issue:'', tasks:TEMPLATE.map(t=>({id:uid(),name:t.name,w:t.w,p:0,note:''})), houses:[]}; state.villages.push(v); ensureCode(v); }
    v.contractor = contractor; if(mv) v.vendorId = mv.id;
    if(cPorts>=0) v.ports = row[cPorts]||'';
    if(cDone>=0)  v.homesDone = row[cDone]||'';
    if(cStart>=0) v.start = cellDate(row[cStart]);
    if(cEnd>=0)   v.end = cellDate(row[cEnd]);
    if(cIssue>=0) v.issue = String(row[cIssue]||'');
    if(cStat>=0){
      if(String(row[cStat]||'').indexOf('ปิด')>=0){
        v.closed = true;
        v.closedAt = cCAt>=0 ? (cellDate(row[cCAt]) || String(row[cCAt]||'')) : todayISO();
        v.builtBudget = cCB>=0 ? (+row[cCB]||0) : 0;
        v.builtHomes  = cCH>=0 ? (+row[cCH]||0) : (+v.homesDone||0);
        v.openHomes   = cOH>=0 ? (+row[cOH]||0) : (+v.ports||0);
        v.planBudget  = cOB>=0 ? (+row[cOB]||0) : 0;
      } else {
        delete v.closed; delete v.closedAt; delete v.builtBudget; delete v.builtHomes;
        delete v.openHomes; delete v.planBudget; delete v.builtUnits; delete v.planUnits;
      }
    }
    if(cLM>=0 && row[cLM]!=='' && row[cLM]!=null){
      const d = parseAnyDate(row[cLM]);
      if(d) v.lastMove = d;
      else if(authoritative) delete v.lastMove;     /* ล้างค่าถ้า admin ลบช่องนั้น */
    } else if(authoritative && cLM>=0){
      delete v.lastMove;
    }
    touchProgress(v);
    stepCols.forEach(sc=>{
      if(!v.tasks[sc.n-1]) return;
      const raw = row[sc.i];
      if(raw!=='' && raw!=null) v.tasks[sc.n-1].p = Math.max(0,Math.min(100,+raw||0));
      else if(authoritative) v.tasks[sc.n-1].p = 0;
    });
    byName[normName(nm)] = v;
    if(!B.jobs.some(j=>j.villageId===v.id)) B.jobs.push({id:uid(), name:nm, villageId:v.id, vendorId:v.vendorId||'', budget:'', qty:{}, bqty:{}, prices:{}, date:todayISO()});
    if(poCol >= 0){
      const pcode = String(row[poCol]||'').trim();
      const jb = B.jobs.find(j=>j.villageId===v.id);
      if(jb && pcode){
        let p = (B.pos||[]).find(x=>String(x.code).trim()===pcode);
        if(!p){ B.pos = B.pos||[]; p={id:uid(), code:pcode, name:'', amount:0}; B.pos.push(p); }
        jb.poId = p.id;
      }
    }
  }

  const misplaced = [];
  const dupReport = [];
  /* BOQ sheet: read project blocks by banner row */
  const ba = hasB ? XLSX.utils.sheet_to_json(wb.Sheets['BOQ'], {header:1, defval:''}) : [];
  const banner = ba[0]||[]; const labels = ba[1]||[];
  const blocks = [];
  for(let c=4;c<banner.length;c++){
    if(String(banner[c]).trim()){ blocks.push({name:String(banner[c]).trim(), c}); }
  }
  const boqNoMatch = [], boqEmpty = [], boqOk = [];
  const badItems = new Set();
  blocks.forEach(bl=>{
    const v = byName[normName(bl.name)] || findVillageByName(bl.name);
    if(!v){ boqNoMatch.push(bl.name); return; }
    let anyPrice = false;
    for(let r=2;r<ba.length;r++){ if(+ba[r][bl.c] > 0){ anyPrice = true; break; } }
    if(anyPrice) boqOk.push(bl.name); else boqEmpty.push(bl.name);
    let jb = B.jobs.find(j=>j.villageId===v.id);
    if(!jb){ jb={id:uid(),name:v.name,villageId:v.id,vendorId:v.vendorId||'',budget:'',qty:{},bqty:{},prices:{},date:todayISO()}; B.jobs.push(jb); }
    jb.prices=jb.prices||{}; jb.bqty=jb.bqty||{}; jb.qty=jb.qty||{};
    for(let r=2;r<ba.length;r++){
      const row = ba[r];
      const nm = String(row[2]||'').trim();
      if(!nm) continue;
      if(nameIdx[nm]==null){
        /* ชื่อรายการไม่ตรงกับรายการมาตรฐาน — ถ้ามีตัวเลขกรอกไว้ ถือว่าข้อมูลหาย */
        if(+row[bl.c]>0 || +row[bl.c+1]>0 || +row[bl.c+3]>0) badItems.add(nm);
        continue;
      }
      const k='i'+nameIdx[nm];
      const p  = +row[bl.c];
      const bq = +row[bl.c+1];
      const uq = +row[bl.c+3];
      const price = (!isNaN(p) && row[bl.c]!=='' && p>0) ? p : 0;
      /* ตรวจจับ: มีตัวเลขในช่องสูตร (งบประมาณ/ค่างาน) แต่ช่องจำนวนว่าง = กรอกผิดช่อง */
      if(price>0 && !(bq>0) && +row[bl.c+2]>0)
        misplaced.push({v:bl.name, item:ITEMS[nameIdx[nm]].n, col:'งบประมาณ', want:'จำนวนตั้งงบ', val:row[bl.c+2]});
      if(price>0 && !(uq>0) && +row[bl.c+4]>0)
        misplaced.push({v:bl.name, item:ITEMS[nameIdx[nm]].n, col:'ค่างานที่ใช้แล้ว', want:'จำนวนที่ใช้แล้ว', val:row[bl.c+4]});
      if(!isNaN(p) && row[bl.c]!=='' && p>=0) jb.prices[k]=p; else delete jb.prices[k];
      if(bq>0) jb.bqty[k]=bq; else delete jb.bqty[k];
      if(uq>0) jb.qty[k]=uq; else delete jb.qty[k];
    }
  });

  /* Unit sheet → houses per village (แหล่งหลักของสถานะรายหลัง) */
  if(wb.SheetNames.includes('Unit')){
    const ua = XLSX.utils.sheet_to_json(wb.Sheets['Unit'], {header:1, defval:''});
    const uh = (ua[0]||[]).map(x=>String(x).toLowerCase());
    /* หาคอลัมน์: ตรงเป๊ะก่อน แล้วค่อยหาแบบมีคำนี้อยู่
       สำคัญ — 'โครงการ' ต้องไม่ไปจับ 'รหัสโครงการ' (คอลัมน์ A) */
    const col = (...keys)=>{
      for(const key of keys){
        const i = uh.findIndex(h=> h.trim() === key.toLowerCase());
        if(i>=0) return i;
      }
      for(const key of keys){
        const i = uh.findIndex(h=> h.includes(key.toLowerCase()) && h.trim() !== 'รหัสโครงการ' && h.trim() !== 'คีย์รายหลัง');
        if(i>=0) return i;
      }
      return -1;
    };
    const cVil=col('โครงการ'), cNo=col('บ้านเลขที่','address'), cLat=col('lat'), cLng=col('lot','lng','long'),
          cSt=col('status','สถานะ'), cSol=col('solution'), cEst=col('estimate'), cDet=col('detail'),
          cVlc=col('vlc'), cOlt=col('olt'), cName=col('name','ชื่อ'), cPhone=col('phone','เบอร์'), cInt=col('สนใจ','interest'), cSub=col('sub-contract','subcontract','ผู้รับเหมาย่อย');
    /* ที่อยู่ลูกค้า = "บ้านเลขที่ Address" (คอลัมน์ M) — ต้องไม่ชนกับ "บ้านเลขที่" (คอลัมน์ C) */
    const cAddr = (()=>{ const i = uh.findIndex((h,ix)=> ix!==cNo && h.includes('address')); return i; })();
    const grouped = {};
    for(let r=1;r<ua.length;r++){
      const row = ua[r];
      const vil = String(row[cVil]||'').trim(); if(!vil) continue;
      (grouped[vil]=grouped[vil]||[]).push({
        no:String(row[cNo]||'').trim(), lat:cLat>=0?(+row[cLat]||''):'', lng:cLng>=0?(+row[cLng]||''):'',
        st:cSt>=0?String(row[cSt]||'').trim():'', sol:cSol>=0?String(row[cSol]||''):'', est:cEst>=0?String(row[cEst]||''):'',
        detail:cDet>=0?String(row[cDet]||''):'', vlc:cVlc>=0?String(row[cVlc]||''):'', olt:cOlt>=0?String(row[cOlt]||''):'',
        addr:(cAddr>=0 && !isMasked(row[cAddr]))?String(row[cAddr]||''):'',
        name:(cName>=0 && !isMasked(row[cName]))?String(row[cName]||''):'',
        phone:(cPhone>=0 && !isMasked(row[cPhone]))?String(row[cPhone]||''):'',
        interest:cInt>=0?String(row[cInt]||''):'', sub:cSub>=0?String(row[cSub]||''):''
      });
    }
    Object.keys(grouped).forEach(vil=>{
      let v = findVillageByName(vil) || byName[normName(vil)];
      if(!v){ v={id:uid(),name:vil,contractor:'',vendorId:null,ports:'',homesDone:'',start:'',end:'',issue:'',tasks:TEMPLATE.map(t=>({id:uid(),name:t.name,w:t.w,p:0,note:''})),houses:[]}; state.villages.push(v); if(!B.jobs.some(j=>j.villageId===v.id)) B.jobs.push({id:uid(),name:vil,villageId:v.id,vendorId:'',budget:'',qty:{},bqty:{},prices:{},date:todayISO()}); }
      const _raw = grouped[vil];
      keepCustData(v, _raw);          /* ไฟล์ไม่มีข้อมูลลูกค้า = คงของเดิมไว้ ไม่ลบทิ้ง */
      v.houses = sortHouses(dedupeHouses(_raw));
      if(_raw.length !== v.houses.length) dupReport.push({v:vil, n:_raw.length - v.houses.length});
      v._hDirty = true;
      v.homesDone = v.houses.filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
    });
  }
  if(misplaced.length) window._importMisplaced = misplaced;
  else delete window._importMisplaced;
  window._importBoq = {noMatch:boqNoMatch, empty:boqEmpty, ok:boqOk.length, blocks:blocks.length,
                       badItems:[...badItems], sysNames: state.villages.map(v=>v.name)};
  window._importDup = dupReport.length ? dupReport : null;
  return true;
}

function parseAccountSheet(wb){
  const sn = wb.SheetNames.find(x=>x==='บัญชี');
  if(!sn) return null;
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
  const m = {}; aoa.forEach(r=>{ if(r && r[0]!=='') m[String(r[0])] = String(r[1]||''); });
  if(!m['Username'] || !m['Password']) return null;
  return {user:m['Username'], pass:m['Password'], name:m['Vendor']||m['Username']};
}

function lineText(v){
  const p = overall(v);
  const L = [];
  L.push('📡 รายงานความคืบหน้า AIS Fibre');
  L.push('🏘️ ' + v.name);
  if(v.contractor) L.push('👷 ผู้รับเหมา: ' + v.contractor + (v.ports? ' ('+v.ports+' พอร์ต)':''));
  L.push('📅 อัปเดต: ' + thDate(todayISO()));
  L.push('');
  L.push('ภาพรวม ' + p + '%');
  L.push(emojiBar(p));
  if(+v.homesDone || +v.ports) L.push('🏠 เดินสายเข้าบ้านสำเร็จ ' + (+v.homesDone||0) + (+v.ports?'/'+v.ports:'') + ' หลัง');
  L.push('');
  v.tasks.forEach(t=>{
    L.push(taskIcon(+t.p) + ' ' + t.name + ' — ' + t.p + '%' + (t.note? ' ('+t.note+')':''));
  });
  if(v.issue){ L.push(''); L.push('⚠️ ปัญหา: ' + v.issue); }
  if(v.end){ L.push('🎯 กำหนดส่งมอบ: ' + thDate(v.end)); }
  return L.join('\n');
}
function copyLine(vid){
  const v = state.villages.find(v=>v.id===vid);
  const txt = lineText(v);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกแล้ว วางในกลุ่ม LINE ได้เลย'))
      .catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
  toast('คัดลอกแล้ว วางในกลุ่ม LINE ได้เลย');
}

/* ============ 💰 ความคุ้มทุนรายหมู่บ้าน (ADMIN เท่านั้น · ความลับสูงสุด) ============
   v.roi = { arpu: ค่าแพ็คเกจเฉลี่ย/เดือน, cust: { 'YYYY-MM': จำนวนลูกค้า } }        */
/* ===== VLC ของหมู่บ้าน — รวมจากรายหลัง (Unit) ไม่ซ้ำ + VLC ที่ผู้ดูแลเพิ่มเองในหน้าความคุ้มทุน =====
   ใช้จับคู่ข้อมูลจากระบบอื่น (เช่น จำนวนลูกค้า) ที่อ้างอิงด้วย VLC */
function vlcClean(x){
  const t = String(x==null?'':x).trim().toUpperCase();
  return (!t || t==='0' || t==='-' || t==='N/A' || t==='NA') ? '' : t;
}
function villageVLCs(v){
  if(!v) return [];
  const seen = new Set(), out = [];
  const add = x=>{ const t = vlcClean(x); if(t && !seen.has(t)){ seen.add(t); out.push(t); } };
  (v.houses||[]).forEach(h=> add(h.vlc));
  if(v.roi && v.roi.vlcExtra) String(v.roi.vlcExtra).split(/[,;\s]+/).forEach(add);
  return out;
}
function vlcText(v){ return villageVLCs(v).join(', '); }
/* แสดงในตาราง: ไม่เกิน 3 ตัว ที่เหลือบอกจำนวน */
function vlcShort(v){
  const a = villageVLCs(v);
  if(!a.length) return '';
  return a.slice(0,3).join(', ') + (a.length>3 ? ' +' + (a.length-3) : '');
}
function vlcTag(v){
  const t = vlcShort(v);
  return t ? `<span class="vlc-tag" title="VLC: ${esc(vlcText(v))}">VLC ${esc(t)}</span>` : '';
}
/* หา หมู่บ้านจาก VLC (ใช้ตอนนำเข้า) */
function villageByVLC(code){
  const t = vlcClean(code); if(!t) return [];
  return state.villages.filter(v=> villageVLCs(v).indexOf(t) >= 0);
}
function roiOf(v){
  if(!v) return {arpu:0, cust:{}};
  if(!v.roi || typeof v.roi !== 'object' || Array.isArray(v.roi)) v.roi = {};
  v.roi.arpu = +v.roi.arpu || 0;
  if(!v.roi.cust || typeof v.roi.cust !== 'object' || Array.isArray(v.roi.cust)) v.roi.cust = {};
  return v.roi;
}
const ROI_MON = /^\d{4}-\d{2}$/;
/* เริ่มมีลูกค้าเดือนแรก ม.ค. 2018 — ข้อมูลก่อนหน้านี้ไม่ใช้ (ไม่รับเข้า · ลบของเดิมออก) */
const ROI_START = '2018-01';
/* ลบข้อมูลรายเดือนก่อน ROI_START ออกจากทุกหมู่บ้าน (ลูกค้า · ลูกค้าราย VLC · แพ็คเกจรายเดือน) → จำนวนช่องที่ลบ */
function roiPurgeBefore(min){
  let n = 0;
  const cut = obj=>{ if(!obj || typeof obj!=='object') return 0; let c = 0;
    Object.keys(obj).forEach(k=>{ if(ROI_MON.test(k) && k < min){ delete obj[k]; c++; } }); return c; };
  (state.villages||[]).forEach(v=>{
    if(!v || !v.roi || typeof v.roi!=='object') return;
    if(window._roiV2 && !v._roiFull) return;          /* ยังไม่ได้โหลดข้อมูลครบ — ไม่แตะ */
    const r = v.roi; let c = 0;
    c += cut(r.cust); c += cut(r.pack);
    ['custVlc','packVlc'].forEach(k=> Object.keys(r[k]||{}).forEach(code=>{ c += cut(r[k][code]); }));
    if(c){ n += c; v._dirty = true; v._roiDirty = true; window._roiGen = (window._roiGen||0) + 1; }
  });
  return n;
}
function roiMonths(v){ return Object.keys(roiOf(v).cust).filter(k=>ROI_MON.test(k)).sort(); }
/* เงินลงทุน = งบที่ตั้งไว้ (BOQ ตั้งงบ) · ปิดโครงการแล้ว = เงินลงทุนใช้จริง (ล็อกตอนปิด) */
function roiInvest(v){
  if(isClosed(v)) return +v.builtBudget||0;
  return B.jobs.filter(j=>j.villageId===v.id).reduce((a,j)=>a+jobBudget(j),0);
}
function roiInvestSrc(v){ return isClosed(v) ? 'ใช้จริง' : 'ตั้งงบ'; }
/* สรุปผลตอบแทนระดับหมู่บ้าน (คงไว้ให้ส่วนอื่นเรียกใช้ได้) */
function roiCalc(v){
  const r = roiOf(v);
  return roiCalcCore(r.cust, roiInvest(v), +r.arpu||0, +v.ports||0);
}
/* คำนวณรายได้รายเดือน
   · เดือนที่มีข้อมูลแพ็คเกจ (packs[m] = [{k ชื่อ, p ราคา, n คน}]) → รายได้ = Σ ราคา × จำนวนคน (ข้อมูลจริง)
   · เดือนที่มีแค่จำนวนลูกค้า (ข้อมูลเก่า) → รายได้ = จำนวนลูกค้า × ค่าแพ็คเกจเฉลี่ย (arpu)            */
function roiCalcCore(cust, invest, arpu, ports, packs){
  cust = cust || {}; packs = packs || {};
  const ms = [...new Set(Object.keys(cust).concat(Object.keys(packs)))].filter(k=>ROI_MON.test(k)).sort();
  /* รายได้เก็บย้อนหลัง 1 เดือน: ลูกค้าเดือนนี้ → เป็นรายได้เดือนถัดไป (เดือนแรกยังไม่มีรายได้)
     row.own = รายได้ที่ลูกค้าเดือนนี้จะสร้าง · row.rev = รายได้ที่เข้าจริงเดือนนี้ (จากลูกค้าเดือนก่อน) */
  let cum = 0, paybackMonth = null, rows = [], estN = 0, prevOwn = null, prevM = null;
  ms.forEach(m=>{
    const ls = Array.isArray(packs[m]) ? packs[m] : null;
    let n, rev, est;
    if(ls && ls.length){
      n = ls.reduce((t,l)=>t+(+l.n||0),0);
      rev = ls.reduce((t,l)=>t+(+l.p||0)*(+l.n||0),0);
      est = false;
    } else {
      n = +cust[m]||0; rev = n * arpu; est = true; if(n) estN++;
    }
    const own = rev, billed = prevOwn==null ? 0 : prevOwn;
    cum += billed;
    if(paybackMonth===null && invest>0 && cum>=invest) paybackMonth = m;
    rows.push({m, n, rev: billed, own, from: prevM, cum, est, avgP: n ? own/n : arpu, lines: ls});
    prevOwn = own; prevM = m;
  });
  const last = rows.length ? rows[rows.length-1] : null;
  const cur = last ? last.n : 0;
  const monthly = last ? last.own : 0;              /* รายได้ต่อเดือนจากลูกค้าล่าสุด (เข้าเดือนถัดไป) */
  const remain = Math.max(0, invest - cum);
  const monthsLeft = (monthly>0 && remain>0) ? Math.ceil(remain/monthly) : (remain>0? null : 0);
  const roiPct = invest>0 ? Math.round((cum-invest)/invest*100) : null;
  return { invest, arpu, rows, cum, cur, monthly, remain, monthsLeft, paybackMonth, roiPct, estN,
           penetration: ports? Math.round(cur/ports*100) : null,
           firstMonth: ms[0]||null, lastMonth: last? last.m : null };
}
function thMonth(m){
  if(!m) return '-';
  const [y,mo] = String(m).split('-');
  const names=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return (names[+mo-1]||mo)+' '+(+y+543-2500>=0? String(+y+543).slice(-2) : y);
}
function monthKey(d){
  const x = d instanceof Date ? d : new Date();
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
}

/* ================= ติดตามความคุ้มทุนตาม VLC =================
   1 VLC = 1 แถว (หน่วยติดตาม)
   · หลายหมู่บ้าน/หลายเฟส ใช้ VLC เดียวกัน → รวมเป็นแถวเดียว · เงินลงทุนรวมกัน · ลูกค้านับครั้งเดียว
   · หมู่บ้านเดียวมีหลาย VLC → แยกแถวตาม VLC ชื่อโครงการเดียวกัน · เงินลงทุนแบ่งตามจำนวนหลังของแต่ละ VLC
   · หมู่บ้านที่ยังไม่มี VLC → แถวตามหมู่บ้าน
   · หมู่บ้านหลาย VLC ที่มีข้อมูลรวมเดิม (ก่อนแยก VLC) → แถว "ไม่ระบุ VLC"
   ที่เก็บ (ใน v.roi เดิม ไม่ต้องเพิ่มคอลัมน์):
     v.roi.custVlc = { VLC: { 'YYYY-MM': n } }   — VLC ที่ใช้ร่วมหลายหมู่บ้าน เก็บค่าเดียวกันทุกหมู่บ้าน
     v.roi.arpuVlc = { VLC: ค่าแพ็คเกจ }
     v.roi.cust    = ยอดรวมของหมู่บ้าน (ผลรวม VLC ของหมู่บ้านนั้น)                                  */
function roiVlcMap(v){
  const r = roiOf(v);
  if(!r.custVlc || typeof r.custVlc !== 'object' || Array.isArray(r.custVlc)) r.custVlc = {};
  return r.custVlc;
}
function roiArpuMap(v){
  const r = roiOf(v);
  if(!r.arpuVlc || typeof r.arpuVlc !== 'object' || Array.isArray(r.arpuVlc)) r.arpuVlc = {};
  return r.arpuVlc;
}
/* ยอดรวมหมู่บ้านของเดือน m = ผลรวม VLC ที่มีข้อมูล · ไม่มีข้อมูล VLC เลย = ลบเดือนนั้น */
function roiSyncMonth(v, m, extra){
  const map = roiVlcMap(v);
  let has = false, t = 0;
  villageVLCs(v).forEach(k=>{ const x = map[k]; if(x && x[m]!=null && x[m]!==''){ has = true; t += +x[m]||0; } });
  if(extra!=null){ has = true; t += +extra||0; }
  if(has) roiOf(v).cust[m] = t; else delete roiOf(v).cust[m];
}
function roiSetVlcMonth(v, code, m, val){
  const map = roiVlcMap(v), codes = villageVLCs(v);
  /* ยอดรวมเดิมที่ยังไม่ได้แยก VLC (ส่วนเหลือ) — คงไว้ ตราบที่ยังมี VLC ของเดือนนี้ที่ยังไม่กรอก */
  const oldTot = roiOf(v).cust[m];
  const oldSum = codes.reduce((t,k)=> t + (+((map[k]||{})[m])||0), 0);
  const rest = (oldTot!=null && oldTot!=='') ? Math.max(0, (+oldTot||0) - oldSum) : 0;
  const oldV = +((map[code]||{})[m]) || 0;
  if(val===''||val==null){ if(map[code]) delete map[code][m]; }
  else (map[code] = map[code] || {})[m] = +val||0;
  const newV = +((map[code]||{})[m]) || 0;
  /* ยอดเดิมรวมทุก VLC อยู่แล้ว → ส่วนที่เพิ่งแยกออกมา หักจากส่วนเหลือ (ยอดรวมไม่บวกซ้ำ) */
  const left = rest > 0 ? Math.max(0, rest - (newV - oldV)) : 0;
  const missing = codes.some(k=>{ const x = map[k]; return !(x && x[m]!=null && x[m]!==''); });
  roiSyncMonth(v, m, (codes.length > 1 && missing && left > 0) ? left : undefined);
}
/* ข้อมูลรวมเดิมของหมู่บ้านหลาย VLC ที่ยังไม่ได้แยก VLC */
function roiRest(v){
  const codes = villageVLCs(v); if(codes.length < 2) return null;
  const map = roiVlcMap(v), cust = roiOf(v).cust;
  const rest = {}; let any = false;
  Object.keys(cust).filter(m=>ROI_MON.test(m)).forEach(m=>{
    const d = (+cust[m]||0) - codes.reduce((t,k)=> t + (+((map[k]||{})[m])||0), 0);
    rest[m] = Math.max(0, d); if(d > 0) any = true;
  });
  return any ? rest : null;
}
/* สัดส่วนเงินลงทุนของหมู่บ้านต่อ VLC (ตามจำนวนหลังในตาราง Unit) */
function roiVillageAlloc(v){
  const codes = villageVLCs(v);
  if(!codes.length) return [];
  const hc = {}; codes.forEach(k=> hc[k] = 0);
  (v.houses||[]).forEach(h=>{ const k = vlcClean(h && h.vlc); if(k in hc) hc[k]++; });
  const tot = codes.reduce((t,k)=>t+hc[k],0);
  return codes.map(k=>({ k, houses:hc[k], share: tot ? hc[k]/tot : 1/codes.length,
                         ports: codes.length===1 ? (+v.ports||hc[k]) : hc[k] }));
}
/* สร้างหน่วยติดตามทั้งหมด (เรียงตามลำดับหมู่บ้าน) */
function roiUnits(){
  const units = [], byKey = {};
  sortVillages(state.villages.slice()).forEach(v=>{
    const inv = roiInvest(v), al = roiVillageAlloc(v);
    if(!al.length){
      units.push({ key:'vil:'+v.id, type:'village', vlc:'', villages:[v],
                   parts:[{ v, share:1, invest:inv, houses:(v.houses||[]).length }], ports:+v.ports||0 });
      return;
    }
    let given = 0;
    al.forEach((a,i)=>{
      const part = (i===al.length-1) ? Math.max(0, inv-given) : Math.round(inv*a.share);
      given += part;
      let u = byKey['vlc:'+a.k];
      if(!u){ u = byKey['vlc:'+a.k] = { key:'vlc:'+a.k, type:'vlc', vlc:a.k, villages:[], parts:[], ports:0 }; units.push(u); }
      u.villages.push(v); u.parts.push({ v, share:a.share, invest:part, houses:a.houses, nVlc:al.length }); u.ports += a.ports;
    });
    if(al.length >= 2 && roiRest(v))
      units.push({ key:'rest:'+v.id, type:'rest', vlc:'', villages:[v], parts:[{ v, share:0, invest:0, houses:0 }], ports:0 });
  });
  return units;
}
function roiUnitByKey(key){ return roiUnits().find(u=>u.key===key) || null; }
/* จำนวนลูกค้าของหน่วย: VLC เดียวกันหลายเฟส = นับครั้งเดียว (ค่าที่บันทึกตาม VLC ก่อน · ไม่มีค่อยใช้ข้อมูลรวมเดิมของหมู่บ้าน VLC เดียว) */
function roiUnitCust(u){
  if(u.type==='village') return roiOf(u.villages[0]).cust;
  if(u.type==='rest') return roiRest(u.villages[0]) || {};
  const out = {}, legacy = {};
  u.villages.forEach(v=>{
    const m = roiVlcMap(v)[u.vlc] || {};
    Object.keys(m).forEach(k=>{ if(ROI_MON.test(k) && out[k]==null && m[k]!=null && m[k]!=='') out[k] = +m[k]||0; });
    /* หมู่บ้าน VLC เดียว: เดือนที่ยังไม่มีค่าราย VLC = ข้อมูลรวมเดิมของหมู่บ้าน (หลายเฟส = บวกกัน) */
    if(villageVLCs(v).length===1){
      const c = roiOf(v).cust;
      Object.keys(c).forEach(k=>{ if(ROI_MON.test(k) && (m[k]==null || m[k]==='')) legacy[k] = (legacy[k]||0) + (+c[k]||0); });
    }
  });
  Object.keys(legacy).forEach(k=>{ if(out[k]==null) out[k] = legacy[k]; });
  return out;
}
/* ===== ข้อมูลแพ็คเกจรายเดือน =====
   v.roi.packVlc = { VLC: { 'YYYY-MM': [ {k:'ชื่อแพ็คเกจ', p:ราคา/เดือน, n:จำนวนคน}, ... ] } }
   v.roi.pack    = { 'YYYY-MM': [...] }   (หมู่บ้านที่ยังไม่มี VLC)
   VLC ที่ใช้ร่วมหลายเฟส เก็บค่าเดียวกันทุกเฟส (เหมือนจำนวนลูกค้า)                                  */
function roiPackVlcMap(v){
  const r = roiOf(v);
  if(!r.packVlc || typeof r.packVlc !== 'object' || Array.isArray(r.packVlc)) r.packVlc = {};
  return r.packVlc;
}
function roiPackVil(v){
  const r = roiOf(v);
  if(!r.pack || typeof r.pack !== 'object' || Array.isArray(r.pack)) r.pack = {};
  return r.pack;
}
function roiUnitPacks(u){
  if(u.type==='village') return roiPackVil(u.villages[0]);
  if(u.type!=='vlc') return {};
  const out = {};
  u.villages.forEach(v=>{
    const m = roiPackVlcMap(v)[u.vlc] || {};
    Object.keys(m).forEach(k=>{ if(ROI_MON.test(k) && !out[k] && Array.isArray(m[k]) && m[k].length) out[k] = m[k]; });
  });
  return out;
}
/* ===== แพ็คเกจปัจจุบัน (สัดส่วนแพ็คเกจ ณ วันนี้ อ้างอิงจำนวนลูกค้าปัจจุบัน) =====
   v.roi.mixVlc = { VLC: { at:'YYYY-MM-DD', lines:[{k,p,n}] } } · v.roi.mix = {at, lines} (หมู่บ้านไม่มี VLC)
   ใช้หาค่าแพ็คเกจเฉลี่ย → คูณจำนวนลูกค้าทุกเดือนตั้งแต่ 2018                                    */
function roiMixVlcMap(v){
  const r = roiOf(v);
  if(!r.mixVlc || typeof r.mixVlc !== 'object' || Array.isArray(r.mixVlc)) r.mixVlc = {};
  return r.mixVlc;
}
function roiUnitMix(u){
  if(u.type==='village'){ const m = roiOf(u.villages[0]).mix; return (m && Array.isArray(m.lines) && m.lines.length) ? m : null; }
  if(u.type!=='vlc') return null;
  for(const v of u.villages){ const m = roiMixVlcMap(v)[u.vlc]; if(m && Array.isArray(m.lines) && m.lines.length) return m; }
  return null;
}
function roiMixStats(mix){
  let rev = 0, n = 0;
  ((mix && mix.lines) || []).forEach(l=>{ rev += (+l.p||0)*(+l.n||0); n += (+l.n||0); });
  return { rev, n, avg: n ? rev/n : 0 };

const roiV2NonSig = n => { const t = roiV2NormNon(n); return t ? stableSig(t.list) : 'null'; };
/* ข้อมูลจากระบบ → v.roi (full = ครบ · ไม่ full = จำนวนลูกค้าอย่างเดียว) */
function roiV2Build(v, data, full){
  const vil = ((data && data.vil) || {})[v.cloudId || v.id] || {};
  const r = {};
  if(full) Object.assign(r, JSON.parse(JSON.stringify(roiV2NormVil(vil))));
  else { if(roiObjHas(vil.cust)) r.cust = vil.cust; if(vil.vlcExtra) r.vlcExtra = vil.vlcExtra; }
  villageVLCs({ houses: v.houses, roi: r }).forEach(code=>{
    const d = ((data && data.vlc) || {})[code]; if(!d) return;
    if(!full){ if(roiObjHas(d)) (r.custVlc = r.custVlc || {})[code] = d; return; }
    const n = JSON.parse(JSON.stringify(roiV2NormVlc(d)));
    if(n.cust) (r.custVlc = r.custVlc || {})[code] = n.cust;
    if(n.pack) (r.packVlc = r.packVlc || {})[code] = n.pack;
    if(n.mix)  (r.mixVlc  = r.mixVlc  || {})[code] = n.mix;
    if(n.arpu) (r.arpuVlc = r.arpuVlc || {})[code] = n.arpu;

}
/* ต้องโหลดข้อมูลความคุ้มทุนเพิ่มก่อนใช้งานไหม (ไม่ต้อง = ทำต่อได้ทันที) */

/* ชุดเลข Non ที่ "แก้ในเครื่องจริง" ยังไม่ได้ส่ง (เก็บในหมู่บ้าน — อยู่รอดแม้ปิดเปิดหน้าใหม่) */
function roiNonDirtySet(){
  const D = new Set();
  state.villages.forEach(v=>{ (v._nonDirty||[]).forEach(k=> D.add(k)); });
  Object.keys(window._nonTouched||{}).forEach(k=> D.add(k));

function roiMarkNonDirty(u){

/* รวมของในเครื่อง (ที่ค้างส่ง) กับของเต็มบนระบบ: ส่วนที่ในเครื่องไม่มี เติมจากระบบ

function roiMergeLocal(cloud, loc){

  loc = loc || {};
  ['custVlc','packVlc'].forEach(key=>{
    const L = loc[key]; if(!L || typeof L!=='object') return;
    out[key] = out[key] || {};
    Object.keys(L).forEach(code=>{ if(L[code] && typeof L[code]==='object') out[key][code] = Object.assign({}, out[key][code]||{}, L[code]); });
  });
  ['mixVlc','arpuVlc','nonVlc'].forEach(key=>{
    const L = loc[key]; if(!L || typeof L!=='object') return;
    out[key] = out[key] || {};
    Object.keys(L).forEach(code=>{ if(L[code] != null) out[key][code] = L[code]; });
  });
  if(loc.cust && typeof loc.cust==='object') out.cust = Object.assign({}, out.cust||{}, loc.cust);
  if(loc.pack && typeof loc.pack==='object') out.pack = Object.assign({}, out.pack||{}, loc.pack);
  ['mix','arpu','non','vlcExtra'].forEach(k=>{ if(loc[k] != null && loc[k] !== '') out[k] = loc[k]; });
  return out;
}
let _roiFullP = null;
async function ensureRoiFull(){
  if(!window._roiV2 || !isAdmin() || !cloudOn || !cloudUser) return true;
  if(!state.villages.some(v=> (!v._roiFull || v._roiMerge) && v.cloudId)) return true;
  if(_roiFullP) return _roiFullP;
  _roiFullP = (async()=>{
    let r; try{ r = await sb.rpc('roi2_get'); }catch(e){ r = { error:e }; }
    if(!r || r.error || !r.data){ window._roiSaveErr = errMsg(r && r.error || 'โหลดไม่สำเร็จ'); return false; }
    const data = r.data;
    window._roiSrvVer = +data.ver || 1;
    state.villages.forEach(v=>{
      if(v._roiMerge && v.cloudId){                  /* ค้างส่งจากรอบก่อน → รวมกับของเต็มบนระบบก่อน */
        v.roi = roiMergeLocal(roiV2Build(v, data, true), v.roi); v._roiFull = true; delete v._roiMerge; return;
      }
      if(v._roiFull) return;                         /* ของในเครื่องที่ยังไม่บันทึก — คงไว้ */
      if(!v.cloudId){ v._roiFull = true; return; }   /* หมู่บ้านใหม่ ยังไม่มีบนระบบ */
      v.roi = roiV2Build(v, data, true); v._roiFull = true;
    });
    const sig = window._roiCloudSig;
    Object.keys(data.vlc||{}).forEach(c=> sig['vlc:'+c] = stableSig(roiV2NormVlc(data.vlc[c])));
    Object.keys(data.vil||{}).forEach(id=> sig['vil:'+id] = stableSig(roiV2NormVil(data.vil[id])));
    window._nonN = data.nonN || {};
    persistLocalOnly();
    return true;
  })();
  try{ return await _roiFullP; }catch(e){ window._roiSaveErr = errMsg(e); return false; } finally { _roiFullP = null; }
}
/* อ่านเลข Non จากระบบแบบแบ่งหน้า — Supabase ส่งกลับได้สูงสุด ~1,000 แถวต่อครั้ง (เกินนั้นถูกตัดเงียบๆ) */
async function roiNonFetch(keys){
  const PAGE = 1000, out = [];
  for(let from = 0, i = 0; i < 500; i++){
    let q = sb.rpc('roi2_non', keys ? { keys } : {});
    const paged = !!(q && typeof q.range === 'function');
    if(paged) q = q.range(from, from + PAGE - 1);
    let r; try{ r = await q; }catch(e){ r = { error:e }; }
    if(!r || r.error) return r || { error: new Error('โหลดเลข Non ไม่สำเร็จ') };
    const d = r.data || []; for(const x of d) out.push(x);
    if(!paged || !d.length) break;
    from += d.length;                                  /* ระบบอาจจำกัดน้อยกว่า 1,000 → เลื่อนตามที่ได้จริง */
  }
  return { data: out };
}
/* เลข Non: keys = ['vlc:XXX', 'vil:<id>'] หรือ null = ทั้งหมด */
async function ensureNon(keys){
  if(!window._roiV2 || !isAdmin() || !cloudOn || !cloudUser) return true;
  if(!(await ensureRoiFull())) return false;
  const need = keys ? keys.filter(k=> k && !window._nonLoaded[k]) : null;
  if(keys && !need.length) return true;
  if(!keys && window._nonAll) return true;
  const r = await roiNonFetch(need);
  if(!r || r.error){ window._roiSaveErr = errMsg(r && r.error || 'โหลดเลข Non ไม่สำเร็จ'); return false; }
  const by = {};
  (r.data||[]).forEach(x=>{ const o = by[x.unit_key] = by[x.unit_key] || { at:x.at||'', list:[] };
    const it = { no:String(x.no) }; if(x.k) it.k = x.k; if(+x.p>0) it.p = +x.p; if(x.h) it.h = String(x.h); o.list.push(it); });
  /* กันโหลดไม่ครบ: จำนวนที่ได้ต้องเท่ากับจำนวนบนระบบ (ไม่ครบ = ไม่ใช้ ไม่งั้นบันทึกรอบหน้าจะลบส่วนที่ขาด) */
  const shortOf = NN=> Object.keys(NN||{}).filter(k=> (!need || need.indexOf(k)>=0) && (+NN[k]||0) > ((by[k] && by[k].list.length) || 0));
  let short = shortOf(window._nonN);
  if(short.length){                                   /* จำนวนในเครื่องอาจเก่า (อีกเครื่องเพิ่งลบ) → ขอจำนวนล่าสุดแล้วเทียบอีกครั้ง */
    try{ const g = await sb.rpc('roi2_get'); if(g && !g.error && g.data && g.data.nonN) window._nonN = g.data.nonN; }catch(e){}
    short = shortOf(window._nonN);

  if(short.length){ window._roiSaveErr = 'โหลดเลข Non ไม่ครบ ('+short.slice(0,3).join(', ')+(short.length>3?' …':'')+') — ลองใหม่อีกครั้ง'; return false; }
  const D = roiNonDirtySet();
  const targetKeys = need || roiUnits().map(roiNonKey).filter(Boolean).concat(Object.keys(by));

    if(D.has(key)) return;                           /* แก้ในเครื่องแล้ว ยังไม่บันทึก — ไม่ทับ */
    const val = by[key] && by[key].list.length ? by[key] : null;
    if(key.indexOf('vlc:')===0){
      const code = key.slice(4);
      villageByVLC(code).forEach(v=>{ const mm = roiNonVlcMap(v); if(val) mm[code] = JSON.parse(JSON.stringify(val)); else delete mm[code]; });
    } else {
      const v = state.villages.find(x=> 'vil:'+x.cloudId === key);
      if(v){ if(val) roiOf(v).non = JSON.parse(JSON.stringify(val)); else delete roiOf(v).non; }
    }
    window._nonLoaded[key] = true;
    window._roiCloudSig['non:'+key] = roiV2NonSig(val);
  });
  if(!keys) window._nonAll = true;
  return true;
}
/* พร้อมใช้งานหน้า/ปุ่มความคุ้มทุน: ถ้ายังไม่พร้อม → โหลดแล้วค่อยทำ (ทำทันทีถ้าพร้อมแล้ว) */
function roiWhenReady(withNon, fn){

/* สร้างชุดที่ต้องบันทึก — เฉพาะส่วนที่ต่างจากระบบ

   ห้ามส่ง VLC ที่ว่างเปล่า (กันสำเนาว่างของหมู่บ้านที่เพิ่งผูก VLC ไปลบข้อมูลบนระบบ) */
function roiV2Payload(){
  const payload = { vlc:{}, vil:{}, non:{} }, sigs = {};
  let n = 0;
  const sig = window._roiCloudSig, cand = {};
  state.villages.forEach(v=>{
    /* ส่งได้เฉพาะหมู่บ้านที่ในเครื่องมีข้อมูลเต็ม (โหลดครบ/รวมกับระบบแล้ว) — ของย่อห้ามส่ง */
    if(!v._roiFull || v._roiMerge || !v.cloudId || !v.roi) return;
    const r = v.roi;
    const vp = roiV2NormVil(r), vk = 'vil:'+v.cloudId, s1 = stableSig(vp);
    if(sig[vk] !== s1 && !(sig[vk]===undefined && !Object.keys(vp).length)){ payload.vil[v.cloudId] = vp; sigs[vk] = s1; n++; }
    villageVLCs(v).forEach(code=>{
      const d = roiV2NormVlc({ cust:(r.custVlc||{})[code], pack:(r.packVlc||{})[code], mix:(r.mixVlc||{})[code], arpu:(r.arpuVlc||{})[code] });
      /* นับเฉพาะข้อมูลจริง (ลูกค้า/แพ็ค) — สำเนาที่เหลือแค่ค่าแพ็คกรอกมือ ถือว่าว่าง (ส่งไปจะลบลูกค้าบนระบบ) */
      const rich = Object.keys(d.cust||{}).length + Object.keys(d.pack||{}).length + (d.mix?50:0);
      const score = rich ? (v._roiDirty ? 1e6 : 0) + rich : -1;
      if(!cand[code] || score > cand[code].score) cand[code] = { d, score };
    });
  });
  Object.keys(cand).forEach(code=>{
    const d = cand[code].d, k = 'vlc:'+code, s2 = stableSig(d);
    if(cand[code].score < 0) return;                   /* ไม่ส่งของว่าง */
    if(sig[k] === s2) return;
    payload.vlc[code] = d; sigs[k] = s2; n++;
  });
  /* เลข Non: ส่งเฉพาะชุดที่ "แก้ในเครื่องจริง" (นำเข้า/แก้มือ/ย้อน) — ชุดที่แค่โหลดมาหรือยังไม่ได้โหลด ห้ามส่ง */
  const D = roiNonDirtySet();
  roiUnits().forEach(u=>{
    const key = roiNonKey(u); if(!key) return;
    if(!D.has(key) && !D.has('local:'+u.key)) return;
    if(!u.villages.every(v=> v._roiFull && !v._roiMerge)) return;
    const val = roiV2NormNon(roiUnitNon(u)), s3 = roiV2NonSig(val);
    if(sig['non:'+key] === s3) return;
    payload.non[key] = val; sigs['non:'+key] = s3; n++;
  });
  return { payload, sigs, n };
}
/* ส่งทีละรอบ (คิว) — กันสองรอบทับกัน */
let _roiPushChain = Promise.resolve();
function pushRoiV2(force){
  const p = _roiPushChain.then(()=> pushRoiV2Run(force));

  if(!r || r.error){
    const m = errMsg(r && r.error);
    /* ด่านกันข้อมูลหาย (ฝั่งระบบ): ข้อมูลบนระบบจะลดลงมาก → ต้องยืนยันก่อน */
    if(/ROI_GUARD/.test(m)){ window._roiSaveErr = 'ระบบหยุดการบันทึก เพราะข้อมูลบนระบบจะลดลงมาก: '+m.replace(/^.*ROI_GUARD:\s*/,''); return { ok:false, guard:true, err: window._roiSaveErr }; }

  }

    /* อ่านกลับเฉพาะส่วนที่เพิ่งส่ง (เร็ว) · ระบบรุ่นเก่ายังไม่มีฟังก์ชันนี้ → อ่านทั้งหมดแบบเดิม */

    Object.keys(payload.vil).forEach(id=>{ if(stableSig(roiV2NormVil((d.vil||{})[id])) !== sigs['vil:'+id]){
      const v = state.villages.find(x=> x.cloudId===id); bad.push(v ? v.name : id); } });

    if(nk.length){

  Object.keys(payload.non).forEach(k=>{ window._nonLoaded[k] = true;
    const val = payload.non[k]; if(val) window._nonN[k] = val.list.length; else delete window._nonN[k]; });
  const clean = settle();
  window._roiLastSaved = new Date();
  return { ok:true, n, verified:true, pending: !clean, parts:{ vlc:Object.keys(payload.vlc).length, vil:Object.keys(payload.vil).length, non:Object.keys(payload.non).length } };
}
/* บันทึกเฉพาะความคุ้มทุน (แยกจากปุ่มบันทึกหลัก) — ใช้หลังนำเข้า และปุ่มในหน้าความคุ้มทุน */
let _roiSaving = null;
async function saveRoiNow(force){
  if(!isAdmin()) return { ok:false, err:'เฉพาะผู้ดูแล' };
  if(!cloudOn || !cloudUser) return { ok:false, mode:'offline', err:'ไม่ได้เชื่อมต่อระบบ — ข้อมูลอยู่ในเครื่องนี้' };
  if(!window._roiV2) return { ok:false, mode:'nosql', err:'ยังไม่ได้รัน แยกข้อมูลความคุ้มทุนตาม-VLC.sql ใน Supabase — ข้อมูลอยู่ในเครื่องนี้เท่านั้น' };
  _roiSaving = (async()=>{
    /* หมู่บ้านใหม่ที่ยังไม่มีบนระบบ → ต้องบันทึกหลักก่อน (ได้เลขอ้างอิงหมู่บ้าน) */
    if(state.villages.some(v=> v._roiDirty && !v.cloudId)){
      await saveNow(true);
      return { ok: !state.villages.some(v=> v._roiDirty), n:1, verified:true, err: window._roiSaveErr };
    }
    let r;
    try{ r = await pushRoiV2(force); }catch(e){ r = { ok:false, err:errMsg(e) }; }
    persistLocalOnly();
    if(r && r.ok && r.pending) scheduleRoiSave();      /* แก้เพิ่มระหว่างส่ง → ส่งต่ออีกรอบ */
    return r;
  })();
  try{ return await _roiSaving; } finally { _roiSaving = null; }
}

/* ===== สำเนากันหายในเครื่อง (IndexedDB · เก็บ 8 ชุดล่าสุด) =====
   ถ่ายสำเนาข้อมูลความคุ้มทุนทั้งหมดในเครื่อง ก่อนโหลดจากระบบทุกครั้ง (ซ้ำกับชุดล่าสุด = ไม่เก็บ)
   ถ้าข้อมูลบนระบบหาย/ถูกทับ → กู้คืนจากสำเนาในเครื่องได้ (ปุ่ม 🛟 ในหน้าความคุ้มทุน) */
const ROI_SNAP_DB = 'ftth-safety', ROI_SNAP_KEEP = 8;
function roiSnapDb(){
  return new Promise((res, rej)=>{
    try{
      const rq = indexedDB.open(ROI_SNAP_DB, 1);
      rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore('roi', { keyPath:'at' }); }catch(e){} };
      rq.onsuccess = ()=> res(rq.result); rq.onerror = ()=> rej(rq.error);
    }catch(e){ rej(e); }
  });
}
function roiSnapCount(vs){
  let vlc = 0, non = 0, mon = 0;
  Object.values(vs).forEach(r=>{
    Object.keys(r.custVlc||{}).forEach(c=>{ vlc++; mon += Object.keys(r.custVlc[c]||{}).length; });
    Object.values(r.nonVlc||{}).forEach(x=>{ non += (x && x.list ? x.list.length : 0); });
    if(r.non && r.non.list) non += r.non.list.length;
  });
  return { villages: Object.keys(vs).length, vlc, non, mon };
}
let _roiSnapLastSig = '';
function roiSnapTake(reason){
  try{
    if(!isAdmin() || typeof indexedDB === 'undefined') return Promise.resolve(false);
    const vs = {};
    state.villages.forEach(v=>{ if(v.roi && roiHasData(v.roi) && v._roiFull !== false) vs[v.id] = v.roi; });
    if(!Object.keys(vs).length) return Promise.resolve(false);
    const json = JSON.stringify(vs);
    const sig = json.length + ':' + json.slice(0,200) + json.slice(-200);
    if(sig === _roiSnapLastSig) return Promise.resolve(false);
    const snap = { at: new Date().toISOString(), reason: reason||'', count: roiSnapCount(vs),
                   names: Object.fromEntries(state.villages.filter(v=> vs[v.id]).map(v=> [v.id, v.name])), json };
    return roiSnapDb().then(db=> new Promise(res=>{
      const tx = db.transaction('roi', 'readwrite'), st = tx.objectStore('roi');
      st.put(snap);
      const kr = st.getAllKeys();
      kr.onsuccess = ()=>{ const ks = (kr.result||[]).sort(); ks.slice(0, Math.max(0, ks.length - ROI_SNAP_KEEP)).forEach(k=> st.delete(k)); };
      tx.oncomplete = ()=>{ _roiSnapLastSig = sig; res(true); }; tx.onerror = ()=> res(false);
    })).catch(()=> false);
  }catch(e){ return Promise.resolve(false); }
}
function roiSnapList(){
  return roiSnapDb().then(db=> new Promise(res=>{
    const rq = db.transaction('roi').objectStore('roi').getAll();
    rq.onsuccess = ()=> res((rq.result||[]).sort((a,b)=> a.at<b.at?1:-1)); rq.onerror = ()=> res([]);
  })).catch(()=> []);
}

  $('roiModal').classList.add('open');

function roiPackStats(packs){
  let rev = 0, n = 0, months = 0;
  Object.keys(packs||{}).forEach(m=>{
    const ls = packs[m]; if(!Array.isArray(ls) || !ls.length) return;
    months++;
    ls.forEach(l=>{ rev += (+l.p||0)*(+l.n||0); n += (+l.n||0); });
  });
  return { rev, n, months, avg: n ? rev/n : 0 };
}
/* ค่าเฉลี่ยรวมทุกโครงการ (นับ VLC ที่ใช้ร่วมหลายเฟสครั้งเดียว) */
function roiGlobalPackAvg(){
  let rev = 0, n = 0; const seen = new Set();
  (state.villages||[]).forEach(v=>{
    if(!v || !v.roi) return;
    const pv = v.roi.packVlc || {};
    Object.keys(pv).forEach(code=>{
      if(seen.has(code)) return; seen.add(code);
      const s = roiPackStats(pv[code]); rev += s.rev; n += s.n;
    });
    const s2 = roiPackStats(v.roi.pack || {}); rev += s2.rev; n += s2.n;
    const mv = v.roi.mixVlc || {};
    Object.keys(mv).forEach(code=>{
      if(seen.has('mix:'+code)) return; seen.add('mix:'+code);
      const s3 = roiMixStats(mv[code]); rev += s3.rev; n += s3.n;
    });
    if(v.roi.mix){ const s4 = roiMixStats(v.roi.mix); rev += s4.rev; n += s4.n; }
  });
  return n ? rev/n : 0;
}
/* ค่าแพ็คเกจเฉลี่ยที่ใช้คูณจำนวนลูกค้า (เดือนที่ไม่มีข้อมูลแพ็คเกจรายเดือน)
   1) แพ็คเกจปัจจุบันของ VLC นี้  2) ข้อมูลแพ็คเกจรายเดือนของ VLC นี้  3) ค่าที่กรอกเอง  4) เฉลี่ยทุกโครงการ */
function roiUnitArpuInfo(u){
  const mx = roiMixStats(roiUnitMix(u));
  if(mx.n) return { avg: mx.avg, src:'mix', label:'จากแพ็คเกจปัจจุบัน' };
  const own = roiPackStats(roiUnitPacks(u));
  if(own.n) return { avg: own.avg, src:'own', label:'เฉลี่ยจากแพ็คเกจจริง' };
  /* ไม่มีข้อมูลแพ็คเกจของ VLC/หมู่บ้านนี้ → ไม่มีค่าเฉลี่ย (ไม่ยืมค่าจากที่อื่น ไม่ใช้ค่ากรอกเอง) */
  return { avg: 0, src:'none', label:'ยังไม่มีข้อมูลแพ็คเกจ' };

/* บันทึกแพ็คเกจของเดือน (lines ว่าง = ลบ) — จำนวนลูกค้าของเดือน = ผลรวมทุกแพ็คเกจ */
function roiUnitSetPack(u, m, lines){
  const ls = (lines||[]).filter(l=> l && (+l.n||0) > 0).map(l=>({ k:String(l.k||'').slice(0,80), p:+l.p||0, n:+l.n||0 }));
  const tot = ls.reduce((t,l)=>t+l.n,0);
  if(u.type==='vlc'){
    u.villages.forEach(v=>{
      const pm = roiPackVlcMap(v);
      if(ls.length) (pm[u.vlc] = pm[u.vlc] || {})[m] = ls; else if(pm[u.vlc]) delete pm[u.vlc][m];
      roiSetVlcMonth(v, u.vlc, m, ls.length ? tot : '');
    });
  } else if(u.type==='village'){
    const v = u.villages[0], pk = roiPackVil(v);
    if(ls.length){ pk[m] = ls; roiOf(v).cust[m] = tot; } else { delete pk[m]; delete roiOf(v).cust[m]; }
  }
  u.villages.forEach(v=>{ v._dirty = true; v._roiDirty = true; window._roiGen = (window._roiGen||0) + 1; });

function roiUnitArpu(u){
  if(u.type==='vlc'){ for(const v of u.villages){ const a = +roiArpuMap(v)[u.vlc]; if(a>0) return a; } }
  for(const v of u.villages){ const a = +roiOf(v).arpu; if(a>0) return a; }
  return 0;
}
/* OLT ของหน่วย: รวมจากตาราง Unit ของบ้านที่ VLC ตรงกัน (ไม่ซ้ำ) */
function roiUnitOLT(u){
  const out = [];
  u.villages.forEach(v=> (v.houses||[]).forEach(h=>{
    if(u.type==='vlc' && vlcClean(h && h.vlc)!==u.vlc) return;
    const o = String(h && h.olt || '').trim();
    if(o && o!=='-' && o!=='0' && out.indexOf(o)<0) out.push(o);
  }));
  return out.join(', ');
}
function roiUnitInvest(u){ return u.parts.reduce((t,p)=>t+(+p.invest||0),0); }
/* ===== ต้นทุนและกำไรสุทธิ (แยกจากรายได้) — สมมติฐานจากผู้ดูแล 2026-10-11 =====
   N = จำนวนลูกค้า (Active ล่าสุด) · Capex จ่ายครั้งเดียวเดือนแรก · Opex รายเดือนตามจำนวนลูกค้าเดือนนั้น
   วิเคราะห์ 10 ปี นับจากเดือนแรกที่มีลูกค้า · เดือนที่ยังไม่ถึง = คาดการณ์ (ลูกค้า/รายได้คงที่เท่าเดือนล่าสุด)
   ปีที่ 6 เปลี่ยนอุปกรณ์ลูกค้ารอบสอง                                                                    */
const ROI_COST = {
  oltPer:25, oltCost:3125,         /* OLT = ceil(N ÷ 25) × 3,125 */
  osp:35000,                       /* ค่าลาก OSP (fiber วันแรก ไม่มีค่าขยาย) — ต่อ 1 VLC */
  install:550, equip:1000, commission:100,   /* ต่อลูกค้า */
  omPct:0.02,                      /* Network O&M ต่อปี = 2% × (BOQ + ค่าลาก + OLT) */
  csMonth:25, bwMonth:25,          /* Customer service / Bandwidth ต่อลูกค้าต่อเดือน */
  sgaPct:0.08, nbtcPct:0.035, badPct:0.02,   /* % ของรายได้ */
  equipLife:5,                     /* อุปกรณ์ลูกค้าเปลี่ยนรอบใหม่ทุก 5 ปี (ปีที่ 6, 11, ...) */
  minYears:5, maxYears:50          /* ตารางรายปีแสดงอย่างน้อย 5 ปี · คำนวณจนคืนทุนแต่ไม่เกิน 50 ปี */
};
function roiCostModel(u, c){
  if(!u || u.type==='rest' || !c) return null;
  const K = ROI_COST, N = +c.cur||0, boq = +c.invest||0;
  const olt = Math.ceil(N / K.oltPer) * K.oltCost;
  const capex = { boq, olt, osp:K.osp, install:N*K.install, equip:N*K.equip, commission:N*K.commission };
  capex.total = capex.boq + capex.olt + capex.osp + capex.install + capex.equip + capex.commission;
  const omYear = K.omPct * (boq + K.osp + olt), varPct = K.sgaPct + K.nbtcPct + K.badPct;
  const revYear = (+c.monthly||0) * 12;
  const opexYear = { om:omYear, cs:N*K.csMonth*12, bw:N*K.bwMonth*12, sga:K.sgaPct*revYear, nbtc:K.nbtcPct*revYear, bad:K.badPct*revYear };
  opexYear.total = opexYear.om + opexYear.cs + opexYear.bw + opexYear.sga + opexYear.nbtc + opexYear.bad;
  const out = { N, capex, opexYear, revYear, start:null, years:[], toDate:null, payback:null, total:null };
  const rows = (c.rows||[]);
  const first = rows.find(r=> (+r.n||0) > 0) || rows[0];
  if(!first) return out;                             /* ยังไม่มีลูกค้า */
  const by = {}; rows.forEach(r=> by[r.m] = r);
  const last = c.lastMonth;
  out.start = first.m;
  let cum = -capex.total, nPrev = 0, payback = null, repl = 0;
  const td = { rev:0, opex:0, capex:capex.total };
  /* เดินทีละเดือนจนคืนทุน (ไม่จำกัด 10 ปี · กันวนไม่จบที่ 50 ปี) — อย่างน้อยถึงเดือนล่าสุดที่มีข้อมูล */
  const lastIdx = last ? Math.max(0, ymDiff(first.m, last)) : 0;
  let endIdx = Math.max(lastIdx, K.minYears*12 - 1);
  for(let i=0; i<K.maxYears*12; i++){
    if(i > endIdx) break;
    const m = ymAdd(first.m, i), k = Math.floor(i/12);
    if(!out.years[k]) out.years.push({ y:k+1, from:ymAdd(first.m, k*12), to:ymAdd(first.m, k*12+11), rev:0, opex:0, capex: k===0 ? capex.total : 0, net:0, cum:0, proj:false });
    const Y = out.years[k];
    let n, rev, proj = false;
    if(last && m <= last){ const r = by[m]; n = r ? (+r.n||0) : nPrev; rev = r ? (+r.rev||0) : 0; }
    else { n = N; rev = +c.monthly||0; proj = true; }
    nPrev = n;
    const opex = omYear/12 + n*(K.csMonth + K.bwMonth) + varPct*rev;
    let cap = 0;
    if(i > 0 && i % (K.equipLife*12) === 0){ cap = n * K.equip; if(!repl) repl = cap; Y.capex += cap; }   /* เปลี่ยนอุปกรณ์ทุก 5 ปี (ปีที่ 6, 11, ...) */
    Y.rev += rev; Y.opex += opex; if(proj) Y.proj = true;
    cum += rev - opex - cap;
    if(!proj){ td.rev += rev; td.opex += opex; td.capex += cap; }
    if(payback===null && cum >= 0){ payback = { m, proj, idx:i, years: (i+1)/12 }; endIdx = Math.max(endIdx, k*12 + 11); }
    else if(payback===null && i === endIdx) endIdx++;      /* ยังไม่คืนทุน → เดินต่อ */
  }
  let run = 0;
  out.years.forEach(Y=>{ Y.net = Y.rev - Y.opex - Y.capex; run += Y.net; Y.cum = run; });
  td.net = td.rev - td.opex - td.capex;
  out.toDate = td; out.payback = payback; out.repl = repl || N*K.equip;   /* ค่าเปลี่ยนอุปกรณ์ต่อรอบ (ลูกค้าปัจจุบัน) */
  const T = out.years.reduce((a,Y)=>({ rev:a.rev+Y.rev, opex:a.opex+Y.opex, capex:a.capex+Y.capex }), { rev:0, opex:0, capex:0 });
  T.net = T.rev - T.opex - T.capex; T.yrs = out.years.length;
  out.total = T;

}

const MON_UP = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function monShort(m){ if(!m) return ''; const [y,mo] = String(m).split('-'); return MON_UP[(+mo||1)-1] + String(y).slice(-2); }
function ymDiff(a, b){ const [y1,m1] = a.split('-').map(Number), [y2,m2] = b.split('-').map(Number); return (y2-y1)*12 + (m2-m1); }
/* "6.2 ปี (AUG30)" */
function paybackText(C){
  if(!C || !C.payback) return C && C.years && C.years.length ? 'ไม่คืนทุน' : '-';
  return (Math.round(C.payback.years*10)/10).toFixed(1) + ' ปี (' + monShort(C.payback.m) + ')';

function roiUnitCalc(u){
  const info = roiUnitArpuInfo(u);
  const c = roiCalcCore(roiUnitCust(u), roiUnitInvest(u), info.avg, u.ports, roiUnitPacks(u));
  c.arpuSrc = info.src; c.arpuLabel = info.label;
  /* ไม่มีข้อมูลแพ็คเกจเลย → คำนวณรายได้/คืนทุนไม่ได้ (ไม่แสดงตัวเลขที่เดาเอง) */
  c.noPack = info.src==='none' && !c.rows.some(r=> r.lines && r.lines.length);
  if(c.noPack){ c.roiPct = null; c.monthsLeft = null; c.paybackMonth = null; }
  c.cost = roiCostModel(u, c);
  return c;
}
function roiUnitName(u){
  const a = []; u.villages.forEach(v=>{ if(a.indexOf(v.name)<0) a.push(v.name); });
  return a.join(' + ');
}
function roiUnitVendors(u){
  const a = []; u.villages.forEach(v=>{ const c = v.contractor||''; if(c && a.indexOf(c)<0) a.push(c); });
  return a.join(', ');
}
function roiUnitClosed(u){ return u.villages.every(isClosed); }
function roiUnitSrc(u){
  const n = u.villages.filter(isClosed).length;
  return n===0 ? 'ตั้งงบ' : (n===u.villages.length ? 'ใช้จริง' : 'ตั้งงบ+ใช้จริง');
}
/* ป้ายอธิบายแถว */
function roiUnitNote(u){
  if(u.type==='rest') return 'ไม่ระบุ VLC (ข้อมูลรวมเดิม)';
  if(u.type==='village') return 'ยังไม่มี VLC';
  if(u.villages.length > 1) return 'รวม '+u.villages.length+' เฟส · VLC เดียวกัน';
  const p = u.parts[0];
  if(p && p.nVlc > 1) return 'แยก VLC '+(villageVLCs(p.v).indexOf(u.vlc)+1)+'/'+p.nVlc+' · สัดส่วน '+Math.round(p.share*100)+'%';
  return '';
}
/* บันทึกจำนวนลูกค้าของหน่วย (val '' = ลบเดือนนั้น) */
function roiUnitSet(u, m, val){
  val = (val==null) ? '' : String(val).trim();
  if(val===''){                      /* ลบเดือน = ลบข้อมูลแพ็คเกจของเดือนนั้นด้วย */
    if(u.type==='vlc') u.villages.forEach(v=>{ const pm = roiPackVlcMap(v); if(pm[u.vlc]) delete pm[u.vlc][m]; });
    else if(u.type==='village') delete roiPackVil(u.villages[0])[m];
  }
  if(u.type==='village'){
    const c = roiOf(u.villages[0]).cust;
    if(val==='') delete c[m]; else c[m] = +val||0;
  } else if(u.type==='vlc'){
    u.villages.forEach(v=> roiSetVlcMonth(v, u.vlc, m, val));
  } else if(u.type==='rest'){
    roiSyncMonth(u.villages[0], m, val==='' ? null : val);
  }
  u.villages.forEach(v=>{ v._dirty = true; v._roiDirty = true; window._roiGen = (window._roiGen||0) + 1; });
}
function roiUnitSetArpu(u, val){
  const a = +val||0;
  u.villages.forEach(v=>{
    if(u.type==='vlc'){
      roiArpuMap(v)[u.vlc] = a;
      if(villageVLCs(v).length===1) roiOf(v).arpu = a;
    } else roiOf(v).arpu = a;
    v._dirty = true; v._roiDirty = true; window._roiGen = (window._roiGen||0) + 1;
  });
}
function roiUnitMatch(u, q, vend, po){
  if(!u.villages.some(v=> matchVendor(v, vend) && matchPO(v, po))) return false;
  if(!q) return true;
  const nq = normName(q), lq = q.toLowerCase();
  return u.villages.some(v=> normName(v.name).includes(nq)) || (u.vlc && u.vlc.toLowerCase().includes(lq));
}

function fitStickyTables(){
  try{
    /* แถบที่ลอยติดขอบบน (ไม่นับปุ่มลอยด้านล่าง เช่น ปุ่ม +) */
    let top = 0;
    const shell = document.getElementById('appShell');
    if(shell) Array.from(shell.children).forEach(el=>{
      const cs = getComputedStyle(el);
      if(!(cs.position==='sticky' || cs.position==='fixed') || !el.offsetHeight || cs.display==='none') return;
      if(cs.top==='auto' || el.getBoundingClientRect().top > 40) return;
      top += el.offsetHeight;
    });
    const docH = document.documentElement.scrollHeight, sy = window.scrollY || 0, vh = window.innerHeight;
    document.querySelectorAll('.tbl-sticky').forEach(b=>{
      if(!b.offsetParent) return;                       /* ซ่อนอยู่ (แท็บอื่น) */
      /* พื้นที่ใต้ตารางจนสุดหน้า (ขอบกล่อง/ระยะเผื่อปุ่ม) — หักออก เพื่อให้เลื่อนสุดแล้วเห็นหัวตารางพอดีจอ ไม่เหลือที่ว่าง */
      const below = Math.max(0, docH - (b.getBoundingClientRect().bottom + sy));
      const tail = below < vh*0.35 ? below : 0;
      const h = Math.max(260, Math.floor(vh - top - tail - 4));
      if(b.style.maxHeight !== h+'px') b.style.maxHeight = h + 'px';
    });
  }catch(e){}
}
window.addEventListener('resize', ()=>{ clearTimeout(window._fitT); window._fitT = setTimeout(fitStickyTables, 120); });

  if(!requireAdmin('ดูข้อมูลความคุ้มทุน')) return;

function roiNonFilter(q){
  q = String(q||'').trim().toLowerCase();

}
function clearRoiNon(){
  if(!requireAdmin('ล้างเลข Non')) return;
  const u = roiUnitByKey(ui.roiKey); if(!u) return;
  if(!confirm('ล้างเลข Non Mobile ทั้งหมดของ '+(u.vlc?'VLC '+u.vlc:roiUnitName(u))+' ?')) return;
  roiUnitSetNon(u, []);
  roiAfterEdit();
  toast('ล้างเลข Non แล้ว');
}
function clearRoiMix(){
  if(!requireAdmin('ล้างแพ็คเกจ')) return;
  const u = roiUnitByKey(ui.roiKey); if(!u) return;
  if(!confirm('ล้างแพ็คเกจปัจจุบันของ '+(u.vlc?'VLC '+u.vlc:roiUnitName(u))+' ?')) return;
  roiUnitSetMix(u, []);
  roiAfterEdit();
  toast('ล้างแพ็คเกจปัจจุบันแล้ว');
}
function roiAfterEdit(){ persist(); openRoiUnit(ui.roiKey); renderRoiMode(); scheduleRoiSave(); }
/* แก้ความคุ้มทุนในแอป → บันทึกขึ้นระบบให้เอง (รอ 2 วินาทีเผื่อแก้ต่อ) · ไม่สำเร็จ = แจ้ง และยังค้างให้กดบันทึก */
let _roiSaveTimer = null;
function scheduleRoiSave(){
  if(!window._roiV2 || !isAdmin() || !cloudOn || !cloudUser) return;
  clearTimeout(_roiSaveTimer);
  _roiSaveTimer = setTimeout(async ()=>{
    const r = await saveRoiNow();
    if(r && r.ok){ if(r.n) toast('☁️ บันทึกความคุ้มทุนขึ้นระบบแล้ว (ตรวจสอบตรงกัน)'); }
    else if(r) toast('⚠️ ความคุ้มทุนยังไม่ขึ้นระบบ: '+(r.err||'')+' — กด 💾 บันทึกความคุ้มทุน');
    try{ if(ui.mode==='roi' && !$('roiModal').classList.contains('open')) renderRoiMode(); }catch(e){}
  }, 2000);
}
function setRoiVlc(vid, val){
  if(!requireAdmin('แก้ VLC')) return;
  const v = state.villages.find(x=>x.id===vid); if(!v) return;
  const t = String(val||'').split(/[,;\s]+/).map(vlcClean).filter((x,i,a)=> x && a.indexOf(x)===i).join(', ');
  roiOf(v).vlcExtra = t;
  v._dirty = true; v._roiDirty = true; window._roiGen = (window._roiGen||0) + 1;
  /* หน่วยเดิมอาจเปลี่ยน (เช่น หมู่บ้านไม่มี VLC → มี VLC) — เปิดหน่วยแรกของหมู่บ้านนี้แทน */
  if(!roiUnitByKey(ui.roiKey)){ const u = roiUnits().find(x=> x.villages.some(y=>y.id===vid)); if(u) ui.roiKey = u.key; }
  roiAfterEdit();
  toast(t ? 'บันทึก VLC แล้ว: '+t : 'ล้าง VLC เพิ่มเติมแล้ว');
}
function setRoiUnitArpu(val){
  if(!requireAdmin('แก้ค่าแพ็คเกจ')) return;
  const u = roiUnitByKey(ui.roiKey); if(!u) return;
  roiUnitSetArpu(u, val);
  roiAfterEdit();
}
function addRoiMonth(){
  if(!requireAdmin('บันทึกจำนวนลูกค้า')) return;
  const m = $('roiNewM').value, n = $('roiNewN').value;
  if(!m || !ROI_MON.test(m)){ toast('เลือกเดือนก่อน'); return; }
  if(m < ROI_START){ toast('ระบบเริ่มนับลูกค้าตั้งแต่ ม.ค. 2561 (2018-01)'); return; }
  const u = roiUnitByKey(ui.roiKey); if(!u) return;
  roiUnitSet(u, m, String(+n||0));
  roiAfterEdit();
  toast('บันทึก '+thMonth(m)+' · '+(+n||0)+' ราย');
}
function setRoiMonth(m, val){
  if(!requireAdmin('แก้จำนวนลูกค้า')) return;
  const u = roiUnitByKey(ui.roiKey); if(!u) return;
  roiUnitSet(u, m, String(+val||0));
  roiAfterEdit();
}
function delRoiMonth(m){
  if(!requireAdmin('ลบข้อมูล')) return;
  const u = roiUnitByKey(ui.roiKey); if(!u) return;
  roiUnitSet(u, m, '');
  roiAfterEdit();
}

        }).join('') || '<tr><td colspan="3" style="color:var(--muted)">ไม่มีโครงการ</td></tr>'}
      </table>
    </div>`;
  $('roiUpdateModal').classList.add('open');
}
function saveRoiUpdate(){
