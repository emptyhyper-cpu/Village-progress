        &nbsp;&nbsp;<span style="display:inline-block;width:12px;height:3px;background:var(--green);vertical-align:middle"></span> เดินสายแล้ว
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span class="unit-count">${esc(trendScopeName())}</span>
        <button class="btn btn-dark btn-sm" onclick="capTrendChart()">📸 Cap กราฟ</button>
        ${isAdmin()?`<button class="btn btn-green btn-sm" onclick="trendSyncNow()">🔄 อัปเดตเดือนล่าสุด</button>
        <button class="btn btn-ghost btn-sm" onclick="trendEdit()">✏️ แก้ตัวเลข</button>`:''}
      </div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:640px;height:auto;display:block">
      ${grid}
      <polyline points="${lineT}" fill="none" stroke="#9AA5A0" stroke-width="2.5"/>
      <polyline points="${lineD}" fill="none" stroke="var(--green)" stroke-width="3.5"/>
      ${rows.map((r,i)=>`
        <circle cx="${x(i)}" cy="${y(+r.done||0)}" r="3.5" fill="var(--green)"/>
        <text x="${x(i)}" y="${y(+r.total||0)-9}" text-anchor="middle" font-size="10.5" fill="#5C6B60">${+r.total||0}</text>
        <text x="${x(i)}" y="${y(+r.done||0)+16}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--forest)">${+r.done||0}</text>
        <text x="${x(i)}" y="${H-14}" text-anchor="middle" font-size="10.5" fill="#5C6B60">${esc(r.m)}</text>`).join('')}
    </svg>
    <div style="font-size:12.5px;color:var(--muted);margin-top:4px">
      เดือนล่าสุด <b style="color:var(--forest)">${esc(last.m)}</b> · เดินสายแล้ว <b style="color:var(--green-dark)">${+last.done||0}</b> จาก <b>${+last.total||0}</b> หลัง · คงเหลือ <b style="color:var(--amber-dk)">${gap}</b> หลัง
    </div>
  </div>`;
}

/* ชิปสรุป/กรองหมู่บ้านที่ไม่ขยับ */
function staleChipsHTML(list){
  const open = (list||[]).filter(v=>!isClosed(v));
  const warn = open.filter(v=>staleInfo(v).level==='warn').length;
  const late = open.filter(v=>staleInfo(v).level==='late').length;
  if(!warn && !late) return '';
  const cur = ui.staleFilter||'';
  return `<div class="stale-chips">
    ${late?`<button class="stale-chip ${cur==='late'?'on':''}" onclick="setStaleFilter('late')" title="ไม่มีการเดินสายเพิ่มเกิน 6 เดือน">
      <i class="sdot late" style="margin:0"></i> ค้างเกิน 6 เดือน <span class="n">${late}</span></button>`:''}
    ${warn?`<button class="stale-chip ${cur==='warn'?'on':''}" onclick="setStaleFilter('warn')" title="ไม่มีการเดินสายเพิ่มเกิน 3 เดือน">
      <i class="sdot warn" style="margin:0"></i> ค้างเกิน 3 เดือน <span class="n">${warn}</span></button>`:''}
    ${cur?`<button class="stale-chip" onclick="setStaleFilter('')">✕ ล้างตัวกรอง</button>`:''}
  </div>`;
}
function setStaleFilter(k){ ui.staleFilter = (ui.staleFilter===k)?'':k; renderDash(); }
function staleApply(list){
  const k = ui.staleFilter;
  if(!k) return list;
  return (list||[]).filter(v=> !isClosed(v) && staleInfo(v).level===k);
}
/* บรรทัดเล็กใต้ชื่อ — แสดงเฉพาะที่ค้างจริง เพื่อไม่ให้รกตา */
/* เตือนเมื่อพอร์ตกับจำนวนหลังไม่ตรง (ทำให้ตัวเลขดูขัดกัน) */
function portsWarn(v){
  const m = portsMismatch(v);
  if(!m || isClosed(v)) return '';
  if(m.type==='noports') return `<i class="sdot none" title="ยังไม่ได้กรอกจำนวนพอร์ต — ระบบใช้จำนวนหลังจากข้อมูล Unit (${m.unit} หลัง) แทน"></i>`;
  return `<i class="sdot none" title="พอร์ตที่กรอกไว้ ${m.ports} · ข้อมูลรายหลังมี ${m.unit} หลัง — ระบบใช้ตัวที่มากกว่า"></i>`;
}
function staleNote(v){
  const s = staleInfo(v);
  if(s.level!=='warn' && s.level!=='late') return '';
  const m = Math.floor(s.days/30);
  const col = s.level==='late' ? 'var(--red)' : 'var(--amber-dk)';
  return `<br><small style="color:${col};font-weight:600">ไม่ขยับ ${m} เดือน</small>`;
}
function secCap(title, targetId){

/* อ่านชื่อกล่องจากหัวข้อที่คู่กับ id นั้น */
function capTitleOf(id){
  const row = document.querySelector('.sec-head-row[data-cap="'+id+'"] .section-label');
  return row ? row.textContent.trim() : 'Dashboard';
}
/* แคปกล่องใดๆ เป็นรูป → คลิปบอร์ด (สำรอง: ดาวน์โหลด) */
function capSection(id, title){
  if(title==null) title = capTitleOf(id);
  const el = document.getElementById(id);
  if(!el){ toast('ไม่พบส่วนนี้'); return; }
  if(typeof html2canvas === 'undefined'){ toast('ยังโหลดตัวแคปไม่เสร็จ ลองใหม่อีกครั้ง'); return; }

  /* หาความกว้างจริงที่ต้องใช้ — วัดจากตารางที่ถูกบีบอยู่ ไม่ใช่แค่กล่องนอก
     (บนมือถือ scrollWidth ของกล่องมักเท่าจอ ทำให้รูปขาดคอลัมน์ท้าย) */
  let need = el.scrollWidth || 0;
  el.querySelectorAll('.tbl-scroll, table, .kpis, .kpi-grid').forEach(n=>{
    need = Math.max(need, n.scrollWidth || 0, n.offsetWidth || 0);
  });
  /* วัดจากตัวตาราง: เอาความกว้างที่มากที่สุดของแต่ละคอลัมน์จากทุกแถว
     (บนมือถือ offsetWidth มักถูกบีบ จึงประมาณจากจำนวนตัวอักษรควบคู่ไปด้วย) */
  el.querySelectorAll('table').forEach(tb=>{
    const rows = tb.querySelectorAll('tr');
    if(!rows.length) return;
    const colW = [];
    rows.forEach(r=>{
      [...r.querySelectorAll('th,td')].forEach((c,ci)=>{
        const span = +c.getAttribute('colspan') || 1;
        if(span > 1) return;                       /* ข้ามช่องรวม */
        const txt = (c.textContent||'').trim();
        const longest = txt.split(/\s{2,}|\n/).reduce((m,x)=>Math.max(m,x.length),0) || txt.length;
        const est = Math.min(longest, 34) * 10 + 26;     /* ไทย ~10px/ตัว + ขอบ */
        const w = Math.max(c.scrollWidth||0, c.offsetWidth||0, est);
        colW[ci] = Math.max(colW[ci]||0, w);
      });
    });
    const sum = colW.reduce((a,b)=>a+(b||0),0);
    /* กันแคบ: อย่างน้อย 96px ต่อคอลัมน์ */
    need = Math.max(need, sum, colW.length * 96);
  });
  need = Math.max(Math.ceil(need) + 40, 760);   /* เผื่อขอบ + กันแคบเกินบนมือถือ */
  need = Math.min(need, 3000);                  /* กันกว้างเกินจนไฟล์ใหญ่ */

  toast('กำลังสร้างรูป...');
  html2canvas(el, {
    scale: Math.min(2, Math.max(1.5, 1400/need)),
    backgroundColor:'#FFFFFF',
    width: need,
    windowWidth: need,
    scrollX: 0, scrollY: 0,
    useCORS: true,
    /* แก้บนสำเนา ไม่แตะหน้าจอจริง — คลี่ทุกกล่องที่เลื่อนได้ให้เห็นครบ */
    onclone: (doc)=>{
      const t = doc.getElementById(id);
      if(!t) return;
      t.style.width = need + 'px';
      t.style.maxWidth = 'none';
      t.style.overflow = 'visible';
      doc.querySelectorAll('#'+id+' .tbl-scroll').forEach(n=>{
        n.style.overflow = 'visible';
        n.style.width = 'max-content';
        n.style.background = 'none';        /* เอาเงาบอกเลื่อนออก */
      });
      doc.querySelectorAll('#'+id+' table').forEach(n=>{
        n.style.width = 'max-content';
        n.style.minWidth = '100%';
        n.style.tableLayout = 'auto';
      });
      doc.querySelectorAll('#'+id+' .panel').forEach(n=>{
        n.style.overflow = 'visible';
        n.style.width = 'max-content';
        n.style.minWidth = '100%';
      });
      doc.querySelectorAll('#'+id+' td, #'+id+' th').forEach(n=>{ n.style.whiteSpace = 'nowrap'; });
      doc.querySelectorAll('#'+id+' .cap-btn').forEach(n=>{ n.style.display = 'none'; });
    }
  })
   .then(cv=>{
     const out = document.createElement('canvas');
     const pad = 18, head = 52;
     out.width = cv.width + pad*2;
     out.height = cv.height + pad*2 + head;
     const cx = out.getContext('2d');
     cx.fillStyle='#fff'; cx.fillRect(0,0,out.width,out.height);
     const fs = Math.max(22, Math.round(out.width/48));
     cx.fillStyle='#0F3D24'; cx.font='700 '+fs+'px Sarabun, Tahoma, sans-serif'; cx.textBaseline='middle';
     cx.fillText(String(title||'Dashboard'), pad, head/2 - 4);
     cx.fillStyle='#5C6B60'; cx.font='500 '+Math.round(fs*0.62)+'px Sarabun, Tahoma, sans-serif';
     cx.textAlign='right';
     cx.fillText('อัปเดต '+thDate(todayISO()), out.width-pad, head/2 - 4);
     cx.textAlign='left';
     cx.fillStyle='#78BE20'; cx.fillRect(pad, head-10, out.width-pad*2, 3);
     cx.drawImage(cv, pad, head + pad - 8);
     out.toBlob(blob=>{
       if(!blob){ toast('สร้างรูปไม่สำเร็จ'); return; }
       const fname='dashboard-'+String(title||'').replace(/[^\u0E00-\u0E7F\w]+/g,'-').slice(0,40)+'-'+todayISO()+'.png';
       const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
                      setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('⬇️ บันทึกรูปแล้ว'); };
       try{
         if(navigator.clipboard && window.ClipboardItem){
           navigator.clipboard.write([new ClipboardItem({'image/png':blob})])
             .then(()=>toast('📋 คัดลอกแล้ว — ไปที่ไลน์กด Ctrl+V')).catch(dl);
         } else dl();
       }catch(e){ dl(); }
     },'image/png');
   })
   .catch(()=>{ toast('สร้างรูปไม่สำเร็จ ลองใหม่อีกครั้ง'); });
}
function capTrendChart(){
  const box = $('trendChartBox');
  const svg = box && box.querySelector('svg');
  if(!svg){ toast('ยังไม่มีกราฟให้บันทึก'); return; }
  const rows = trendRows();
  const last = rows.length ? rows[rows.length-1] : null;

  // แปลงตัวแปรสีให้เป็นสีจริง เพราะ SVG เดี่ยวๆ ไม่รู้จัก var()
  let sv = new XMLSerializer().serializeToString(svg);
  sv = sv.replace(/var\(--green\)/g,'#78BE20').replace(/var\(--forest\)/g,'#0F3D24')
         .replace(/var\(--amber-dk\)/g,'#B57A00').replace(/var\(--muted\)/g,'#5C6B60');
  if(!/font-family/.test(sv)) sv = sv.replace('<svg', '<svg font-family="Sarabun, Tahoma, sans-serif"');

  const vb = (svg.getAttribute('viewBox')||'0 0 900 320').split(/\s+/).map(Number);
  const W = vb[2]||900, H = vb[3]||320;
  const SC = 2;                                   // ความละเอียด 2 เท่า
  const titleH = 58, footH = 34;
  const cv = document.createElement('canvas');
  cv.width = W*SC; cv.height = (H+titleH+footH)*SC;
  const ctx = cv.getContext('2d');
  ctx.scale(SC, SC);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H+titleH+footH);

  const img = new Image();
  img.onload = function(){
    // หัวเรื่อง
    ctx.fillStyle = '#0F3D24';
    ctx.font = '700 22px Sarabun, Tahoma, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('FTTH Progress · ' + trendScopeName(), 20, 26);
    ctx.fillStyle = '#78BE20'; ctx.fillRect(20, 44, W-40, 3);
    // กราฟ
    ctx.drawImage(img, 0, titleH, W, H);
    // ท้ายภาพ
    ctx.fillStyle = '#5C6B60';
    ctx.font = '500 14px Sarabun, Tahoma, sans-serif';
    const info = last ? ('ล่าสุด ' + last.m + ' · เดินสายแล้ว ' + (+last.done||0) + ' จาก ' + (+last.total||0) + ' หลัง · คงเหลือ ' + ((+last.total||0)-(+last.done||0)) + ' หลัง') : '';
    ctx.fillText(info, 20, H+titleH+16);
    ctx.textAlign = 'right';
    ctx.fillText('อัปเดต ' + new Date().toLocaleDateString('th-TH'), W-20, H+titleH+16);
    ctx.textAlign = 'left';

    cv.toBlob(function(blob){
      if(!blob){ toast('สร้างรูปไม่สำเร็จ'); return; }
      const fname = 'progress-' + trendScopeName().replace(/\s+/g,'-') + '-' + todayISO() + '.png';
      const dl = function(){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = fname; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
        toast('⬇️ บันทึกรูปกราฟแล้ว — ส่งเข้าไลน์ได้เลย');
      };
      try{
        if(navigator.clipboard && window.ClipboardItem){
          navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ])
            .then(()=>toast('📋 คัดลอกกราฟแล้ว — ไปที่ไลน์แล้วกด Ctrl+V'))
            .catch(dl);
        } else dl();
      }catch(e){ dl(); }
    }, 'image/png');
  };
  img.onerror = function(){ toast('สร้างรูปไม่สำเร็จ'); };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(sv)));
}

function trendSyncNow(){
  if(!requireAdmin('บันทึกข้อมูลกราฟ')) return;
  const vil = dashScopeVillages();
  const now = trendAutoNow(vil);
  const rows = trendList();
  const m = prompt('อัปเดตเดือนไหน? (เช่น Jun-26)  — กราฟของ: '+trendScopeName(), rows.length? rows[rows.length-1].m : 'Jun-26');
  if(!m) return;
  const found = rows.find(r=>r.m===m.trim());
  if(found){ found.total = now.total; found.done = now.done; }
  else rows.push({m:m.trim(), total:now.total, done:now.done});
  bqPersist(); renderDash();
  toast('อัปเดต '+m+' ('+trendScopeName()+') → ทั้งหมด '+now.total+' · เดินสายแล้ว '+now.done);
}

  const rows = trendList();
  return `<div class="panel">
    <div class="section-label">✏️ แก้ตัวเลขรายเดือน · ${esc(trendScopeName())}</div>
    <div style="overflow-x:auto"><table class="sum">
      <tr><th>เดือน</th><th class="r">บ้านทั้งหมด</th><th class="r">เดินสายแล้ว</th><th></th></tr>
      ${rows.map((r,i)=>`<tr>
        <td><input value="${esc(r.m)}" onchange="trendSet(${i},'m',this.value)" style="width:90px;font-family:'Sarabun',sans-serif;font-size:13px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px"></td>
        <td class="r"><input type="number" value="${+r.total||0}" onchange="trendSet(${i},'total',this.value)" style="width:90px;text-align:right;font-family:'Sarabun',sans-serif;font-size:13px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px"></td>
        <td class="r"><input type="number" value="${+r.done||0}" onchange="trendSet(${i},'done',this.value)" style="width:90px;text-align:right;font-family:'Sarabun',sans-serif;font-size:13px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px"></td>
        <td class="r"><button class="btn btn-red btn-sm" onclick="trendDel(${i})">✕</button></td>
      </tr>`).join('')}
    </table></div></div>
    <div class="data-row"><button class="btn btn-green btn-sm" onclick="trendAdd()">＋ เพิ่มเดือน</button>
      <button class="btn btn-ghost btn-sm" onclick="trendEdit()">เสร็จสิ้น</button></div>
  </div>`;
}
function trendSet(i, key, val){
  if(!requireAdmin('แก้ข้อมูลกราฟ')) return;
  const rows = trendList();
  if(!rows[i]) return;
  rows[i][key] = (key==='m') ? String(val) : (+val||0);
  bqPersist();
  const box = $('trendChartBox'); if(box) box.innerHTML = trendChartHTML(dashScopeVillages());
}
function trendAdd(){
  if(!requireAdmin('เพิ่มข้อมูลกราฟ')) return;
  const rows = trendList();
  const now = trendAutoNow(dashScopeVillages());
  rows.push({m:'', total:now.total, done:now.done});
  bqPersist(); renderDash();
}
function trendDel(i){
  if(!requireAdmin('ลบข้อมูลกราฟ')) return;
  const rows = trendList();
  rows.splice(i,1); bqPersist(); renderDash();
}

function renderDash(){
  let vil = visibleVillages();
  let jobs = canViewAll() ? B.jobs : B.jobs.filter(j=>j.vendorId===session.vendorId);
  // ===== ตัวกรอง Vendor → PO (PO ขึ้นเมื่อเลือก Vendor และผูกตาม Vendor นั้น) =====
  let filterBar = '', fv = null;
  if(!canViewAll()){ ui.dashVendor = null; ui.dashPO = null; }
  if(canViewAll() && realVendors().length){
    if(ui.dashVendor){
      fv = B.vendors.find(x=>x.id===ui.dashVendor) || null;
      if(!fv){ ui.dashVendor = null; ui.dashPO = null; }
    }
    if(fv){
      const nm = fv.name.trim();
      vil = vil.filter(v=> v.vendorId===fv.id || (v.contractor||'').trim()===nm);
      const ids = new Set(vil.map(v=>v.id));
      jobs = jobs.filter(j=> j.vendorId===fv.id || ids.has(j.villageId));
    }
    filterBar = `<div class="filter-bar">
      <div class="unit-toolbar" style="margin-bottom:0">
        <span class="unit-count" style="min-width:52px">👷 Vendor</span>
        <button class="tab ${!ui.dashVendor?'on':''}" onclick="dashPickVendor('')">ทั้งหมด</button>
        ${realVendors().map(x=>`<button class="tab ${ui.dashVendor===x.id?'on':''}" onclick="dashPickVendor('${x.id}')">${esc(x.name)}</button>`).join('')}
      </div>`;
    if(fv && (B.pos||[]).length){
      const myPos = B.pos.filter(p=> poJobs(p.id).some(j=> j.vendorId===fv.id));
      if(ui.dashPO && !myPos.some(p=>p.id===ui.dashPO)) ui.dashPO = null;
      if(ui.dashPO){
        const vids = new Set(poJobs(ui.dashPO).filter(j=>j.vendorId===fv.id).map(j=>j.villageId));
        vil = vil.filter(v=> vids.has(v.id));
        jobs = jobs.filter(j=> j.poId===ui.dashPO);
      }
      filterBar += myPos.length
        ? `<div class="unit-toolbar" style="margin:8px 0 0">
             <span class="unit-count" style="min-width:52px">📄 PO</span>
             <select class="vfilter" onchange="dashPickPO(this.value)">
               <option value="">📄 ทุก PO (${myPos.length} ใบ)</option>
               ${myPos.map(p=>{
                  const cnt = poJobs(p.id).filter(j=>j.vendorId===fv.id).length;
                  return `<option value="${p.id}" ${ui.dashPO===p.id?'selected':''}>${esc(p.code||p.name)}${p.amount?' · วงเงิน '+fmt(p.amount)+' ฿':''} · ${cnt} โครงการ</option>`;
                }).join('')}
             </select>
             ${ui.dashPO?`<button class="btn btn-ghost btn-sm" onclick="dashPickPO('')">✕ ล้าง</button>`:''}
           </div>`
        : `<div class="unit-count" style="margin-top:8px">— ${esc(fv.name)} ยังไม่มีงานผูกกับ PO —</div>`;
    } else if(!fv && (B.pos||[]).length){
      filterBar += `<div class="unit-count" style="margin-top:8px">เลือก Vendor ก่อน เพื่อกรองตาม PO</div>`;
    }
    filterBar += `</div>`;
  }
  const n = vil.length;
  const done = vil.filter(v=>overall(v)>=100).length;
  const doing = vil.filter(v=>{const p=overall(v);return p>0&&p<100;}).length;
  const avg = n ? Math.round(vil.reduce((s,v)=>s+overall(v),0)/n) : 0;
  const closedList = vil.filter(isClosed);
  const closedN = closedList.length;
  const closedBudget = closedList.reduce((s,v)=>s+(+v.builtBudget||0),0);
  const closedHomes  = closedList.reduce((s,v)=>s+(+v.builtHomes||0),0);
  const closedOpenH  = closedList.reduce((s,v)=>s+(+v.openHomes||0),0);
  const closedPlanB  = closedList.reduce((s,v)=>s+(+v.planBudget||0),0);
  const ports = vil.reduce((s,v)=>s+(+v.ports||0),0);
  const homes = vil.reduce((s,v)=>s+(+v.homesDone||0),0);
  const po = jobs.reduce((s,j)=>s+jobBudget(j),0);
  const built = jobs.reduce((s,j)=>s+jobCost(j),0);
  const overPo = po && built > po;

  let vendorTable = '';
  const vendorsForTable = fv ? [fv] : realVendors();
  if(canViewAll() && vendorsForTable.length){
    vendorTable = `
    ${secCap('แยกราย Vendor'+(fv?' · '+esc(fv.name):'')+(ui.dashPO?' · '+esc((poById(ui.dashPO)||{}).code||''):''), 'secVendorTbl')}
    <div class="panel" id="secVendorTbl"><div class="tbl-scroll">
      <table class="sum">
        <tr><th>Vendor</th><th class="r">จำนวนงาน</th><th class="r">งาน %</th><th class="r">เดินสาย (หลัง)</th><th class="r">เดินสายแล้ว (หลัง)</th><th class="r">ค่างานสร้าง</th><th class="r">งบ PO</th><th class="r">คงเหลือ</th></tr>
        ${vendorsForTable.map(vd=>{
          const vv = vil.filter(x=>x.vendorId===vd.id || (x.contractor||'').trim()===vd.name.trim());
          const vvIds = new Set(vv.map(x=>x.id));
          const jj = jobs.filter(j=>j.vendorId===vd.id && (!j.villageId || vvIds.has(j.villageId)));
          const a = vv.length ? Math.round(vv.reduce((s,x)=>s+overall(x),0)/vv.length) : 0;
          const h = vv.reduce((s,x)=>s+(+x.homesDone||0),0);
          const pt = vv.reduce((s,x)=>s+targetHomes(x),0);
          const c = jj.reduce((s,j)=>s+jobCost(j),0);
          const b = jj.reduce((s,j)=>s+jobBudget(j),0);
          const d = b - c;
          const doneN = vv.filter(x=>overall(x)>=100).length;
          return `<tr style="cursor:pointer" onclick="ui.dashVendor='${vd.id}';renderDash()">
            <td>${esc(vd.name)}</td>
            <td class="r"><b>${vv.length}</b>${doneN?` <small style="color:var(--muted)">(เสร็จ ${doneN})</small>`:''}</td>
            <td class="r">${a}%</td><td class="r">${pt||'-'}</td><td class="r"><b>${h}</b></td>
            <td class="r">${fmt(c)}</td><td class="r">${fmt(b)}</td>
            <td class="r money ${d<0?'neg':'pos'}">${fmt(d)}</td></tr>`;
        }).join('')}
      </table>
    </div></div>`;
  }

  $('modeDash').innerHTML = filterBar + `
  ${secCap('1 · ภาพรวมงานสรุป'+(canViewAll()&&ui.dashVendor?' · '+esc((realVendors().find(x=>x.id===ui.dashVendor)||{}).name||''):''), 'secSummary')}
  <div class="panel" id="secSummary">
    <div style="display:flex;align-items:baseline;gap:10px">
      <b style="font-family:'Taviraj',serif;font-size:42px;color:var(--forest);line-height:1">${avg}%</b>
      <span style="font-size:13px;color:var(--muted)">ความคืบหน้าเฉลี่ย ${n} หมู่บ้าน</span>
    </div>
    <div class="bar" style="margin-top:10px"><i style="width:${avg}%"></i></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <span class="chip idle">ยังไม่เริ่ม ${n-doing-done}</span>
      <span class="chip doing">กำลังดำเนินการ ${doing}</span>
      <span class="chip done">ส่งมอบแล้ว ${Math.max(0,done-closedN)}</span>
      ${closedN?`<span class="chip closed">✔ ปิดโครงการ ${closedN}</span>`:''}
    </div>
    ${closedN?`<div style="font-size:12.5px;color:var(--green-dark);margin-top:8px;font-weight:600">ปิดแล้ว ${closedN} โครงการ · บ้าน ${fmt(closedHomes)}/${fmt(closedOpenH)} หลัง · งบใช้ ${fmt(closedBudget)}/${fmt(closedPlanB)} ฿ · ${closedBudget<=closedPlanB?'ประหยัด '+fmt(closedPlanB-closedBudget):'เกิน '+fmt(closedBudget-closedPlanB)} ฿</div>`:''}
  </div>

  ${secCap('2 · ความเคลื่อนไหวรายเดือน (หลัง)', 'trendChartBox')}
  <div id="trendChartBox">${trendChartHTML(vil)}</div>
  ${isAdmin()?trendEditHTML():''}

  ${secCap('3 · เดินสายเข้าบ้านสำเร็จ', 'secHomes')}
  <div class="panel" id="secHomes">
    <div style="display:flex;align-items:baseline;gap:10px">
      <b style="font-family:'Taviraj',serif;font-size:42px;color:var(--forest);line-height:1">${homes}</b>
      <span style="font-size:13px;color:var(--muted)">หลัง ${ports?'จากทั้งหมด '+ports+' หลัง ('+Math.round(homes/ports*100)+'%)':''}</span>
    </div>
    ${ports?`<div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,Math.round(homes/ports*100))}%"></i></div>`:''}
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px">กรอกจำนวนหลังที่สำเร็จได้ในหน้าหมู่บ้านแต่ละแห่ง (ช่อง "เดินสายเข้าบ้านสำเร็จ")</div>
  </div>

  ${secCap('4 · งบประมาณ · ข้อมูลภายใน', 'secBudget')}
  <div id="secBudget">
  <div class="kpis">
    <div class="kpi"><span class="lbl">งบใน PO</span><b>${fmt(po)} ฿</b><small>${jobs.length} งาน BOQ</small></div>
    <div class="kpi"><span class="lbl">งบที่สร้างงานไปแล้ว</span><b style="color:${overPo?'var(--red)':'var(--forest)'}">${fmt(built)} ฿</b><small class="${overPo?'neg':'pos'}" style="font-weight:700">${po? (overPo?'เกิน PO '+fmt(built-po):'คงเหลือ '+fmt(po-built))+' ฿':''}</small></div>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)"><span>เบิกใช้จาก PO</span><span>${po?Math.round(built/po*100)+'%':'-'}</span></div>
    <div class="budget-bar"><i class="${overPo?'over':''}" style="width:${po?Math.min(100,built/po*100):0}%"></i></div>
  </div>
  </div>
  ${vendorTable}
  ${staleChipsHTML(vil)}
  ${secCap('รายหมู่บ้าน'+(ui.staleFilter?(ui.staleFilter==='late'?' · ค้างเกิน 6 เดือน':' · ค้างเกิน 3 เดือน'):'ทั้งหมด')+' ('+staleApply(vil).length+')', 'secVillageTbl')}
  <div class="panel" id="secVillageTbl"><div class="tbl-scroll">
    <table class="sum">
      <tr>
        <th>Vendor</th><th>PO</th><th>หมู่บ้าน</th>
        <th class="r">%</th><th class="r">จำนวนหลัง</th><th class="r">ต้องเดินสาย</th><th class="r">เดินสายแล้ว</th><th class="r">คงเหลือ</th>
        <th class="r">งบโครงการ</th><th class="r">ใช้ไปแล้ว</th><th class="r">งบคงเหลือ</th>
      </tr>
      ${sortVillages(staleApply(vil)).map(v=>{
        const p = overall(v);
        const jj = villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId);
        const b = villageBudget(v);
        const c = villageCost(v);
        const poNm = jj.length ? jobPOName(jj[0]) : '';
        const ports = targetHomes(v), done = +v.homesDone||0;
        const left = Math.max(0, ports - done), bLeft = b ? b-c : 0;
        const cl = isClosed(v);
        return `<tr class="${cl?'closed-row':''}" style="cursor:pointer" onclick="openVillagePeek('${v.id}')">
          <td>${esc(v.contractor||'-')}</td>
          <td>${poNm?esc(poNm):'<span style="color:var(--muted)">-</span>'}</td>
          <td class="vname">${cl?'✔ ':''}${esc(v.name)}${staleDot(v)}${portsWarn(v)}${staleNote(v)}</td>
          <td class="r num">${p}%</td>
          <td class="r num">${unitHomes(v)||'-'}</td>
          <td class="r num">${ports||'-'}</td>
          <td class="r num" style="color:var(--green-dark)"><b>${done}</b></td>
          <td class="r num" style="color:${left>0?'var(--amber-dk)':'var(--muted)'}">${ports?left:'-'}</td>
          <td class="r num">${b?fmt(b):'-'}</td>
          <td class="r num">${c?fmt(c):'-'}</td>
          <td class="r num ${b&&bLeft<0?'neg':'pos'}">${b?fmt(bLeft):'-'}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="10" style="color:var(--muted)">ยังไม่มีหมู่บ้าน</td></tr>'}
      ${(()=>{
        const rows = staleApply(vil);              /* ต้องตรงกับแถวที่แสดงจริง */
        if(!rows.length) return '';
        const sNeed = rows.reduce((a,v)=>a+targetHomes(v),0);
        const sDone = rows.reduce((a,v)=>a+(+v.homesDone||0),0);
        const sLeft = rows.reduce((a,v)=>a+Math.max(0, targetHomes(v)-(+v.homesDone||0)),0);
        const sB = rows.reduce((a,v)=>a+villageBudget(v),0);
        const sC = rows.reduce((a,v)=>a+villageCost(v),0);
        const sPct = Math.round(rows.reduce((a,v)=>a+overall(v),0)/rows.length);
        return `<tr style="border-top:2px solid var(--forest)">
        <td colspan="3"><b>รวม ${rows.length} โครงการ</b></td>
        <td class="r num"><b>${sPct}%</b></td>
        <td class="r num"><b>${fmt(rows.reduce((a,v)=>a+unitHomes(v),0))}</b></td>
        <td class="r num"><b>${fmt(sNeed)}</b></td>
        <td class="r num" style="color:var(--green-dark)"><b>${fmt(sDone)}</b></td>
        <td class="r num"><b>${fmt(sLeft)}</b></td>
        <td class="r num"><b>${sB?fmt(sB):'-'}</b></td>
        <td class="r num"><b>${sC?fmt(sC):'-'}</b></td>
        <td class="r num ${sB&&(sB-sC)<0?'neg':'pos'}"><b>${sB?fmt(sB-sC):'-'}</b></td>
      </tr>`;
      })()}
    </table>
  </div></div>`;
}

</script>
</body>
</html>
