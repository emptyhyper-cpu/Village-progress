function saveRoiUpdate(){
  if(!requireAdmin('บันทึกลูกค้า')) return;
  const m = ui.roiUpM || monthKey();
  let n = 0;
  document.querySelectorAll('#roiUpBody input.roi-up').forEach(el=>{
    const val = el.value.trim();
    if(val==='') return;
    const v = state.villages.find(x=>x.id===el.dataset.vid);
    if(v){ roiOf(v).cust[m] = +val||0; n++; }
  });
  persist();
  $('roiUpdateModal').classList.remove('open');
  renderRoiMode();
  toast('บันทึก '+thMonth(m)+' · '+n+' โครงการ');
}

/* ---------- Excel: นำเข้า/ส่งออกข้อมูลความคุ้มทุน ---------- */
function roiParseMonth(x){
  if(x==null) return null;
  if(x instanceof Date) return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
  const t = String(x).trim();
  let m = /^(\d{4})[-\/](\d{1,2})$/.exec(t);                    // 2017-01 · 2017/1
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0');
  m = /^(\d{1,2})[-\/](\d{4})$/.exec(t);                        // 01-2017
  if(m) return m[2]+'-'+String(+m[1]).padStart(2,'0');
  m = /^(\d{4})(\d{2})$/.exec(t);                               // 201701
  if(m) return m[1]+'-'+m[2];
  const d = new Date(t);
  if(!isNaN(d.getTime()) && /\d{4}/.test(t)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return null;
}
function importRoiExcel(ev){
  const f = ev.target.files[0]; if(!f){ return; }
  if(!requireAdmin('นำเข้าข้อมูลความคุ้มทุน')){ ev.target.value=''; return; }
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      /* เลือก sheet ที่มีข้อมูลจริง: มีคอลัมน์เดือน (แบบกว้าง) หรือ เดือน+ลูกค้า (แบบยาว) */
      let a=null, hdr=null, cName=-1, cArpu=-1, cMon=-1, cCust=-1;
      for(const sn of wb.SheetNames){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
        if(rows.length<2) continue;
        const h = (rows[0]||[]).map(x=>String(x==null?'':x).trim());
        const iName = h.findIndex(x=>/โครงการ|หมู่บ้าน|village/i.test(x));
        if(iName<0) continue;
        const iMon  = h.findIndex(x=>/^เดือน$|^month$/i.test(x));
        const iCust = h.findIndex(x=>/^จำนวนลูกค้า|^ลูกค้า$|customer|subscriber/i.test(x));
        const hasMonthCols = h.some((x,i)=> i!==iName && roiParseMonth(x));
        if(hasMonthCols || (iMon>=0 && iCust>=0)){
          a=rows; hdr=h; cName=iName; cMon=iMon; cCust=iCust;
          cArpu = h.findIndex(x=>/แพ็?ค|package|arpu|ค่าบริการ/i.test(x));
          break;
        }
      }
      if(!a){ toast('ไม่พบชีตที่มีคอลัมน์เดือน (เช่น 2017-01) หรือคอลัมน์ เดือน+จำนวนลูกค้า'); ev.target.value=''; return; }
      let updated=0, notFound=[], cells=0;
      const touch = new Set();
      if(cMon>=0 && cCust>=0){
        /* รูปแบบยาว: โครงการ | เดือน | จำนวนลูกค้า */
        for(let r=1;r<a.length;r++){
          const nm = String(a[r][cName]||'').trim(); if(!nm) continue;
          const v = findVillageByName(nm);
          if(!v){ if(notFound.indexOf(nm)<0) notFound.push(nm); continue; }
          const mk = roiParseMonth(a[r][cMon]); if(!mk) continue;
          roiOf(v).cust[mk] = +a[r][cCust]||0; cells++; touch.add(v.id);
          if(cArpu>=0 && +a[r][cArpu]>0) roiOf(v).arpu = +a[r][cArpu];
        }
      } else {
        /* รูปแบบกว้าง: โครงการ | ARPU | 2017-01 | 2017-02 | ... */
        const monCols = hdr.map((h,i)=>({i, m:roiParseMonth(h)})).filter(x=>x.m && x.i!==cName && x.i!==cArpu);
        if(!monCols.length){ toast('ไม่พบคอลัมน์เดือน (เช่น 2017-01)'); ev.target.value=''; return; }
        for(let r=1;r<a.length;r++){
          const nm = String(a[r][cName]||'').trim(); if(!nm) continue;
          const v = findVillageByName(nm);
          if(!v){ if(notFound.indexOf(nm)<0) notFound.push(nm); continue; }
          if(cArpu>=0 && +a[r][cArpu]>0) roiOf(v).arpu = +a[r][cArpu];
          monCols.forEach(mc=>{
            const raw = a[r][mc.i];
            if(raw==='' || raw==null) return;
            roiOf(v).cust[mc.m] = +raw||0; cells++;
          });
          touch.add(v.id);
        }
      }
      updated = touch.size;
      persist();
      renderRoiMode();
      toast('นำเข้าสำเร็จ · ' + updated + ' โครงการ · ' + cells + ' เดือน'
            + (notFound.length ? ' · ไม่พบชื่อ ' + notFound.length + ' โครงการ' : ''));
      if(notFound.length) showRoiNotFound(notFound);
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ: '+(err.message||'')); }
    ev.target.value='';
  };
  rd.readAsArrayBuffer(f);
}

/* ============ ปิดโครงการ (Close Project) ============
   ปิดแล้ว: ยูนิตที่ตั้งงบ → บันทึกเป็นยูนิตที่สร้าง · งบที่ตั้ง → บันทึกเป็นงบก่อสร้าง
   ตัวเลขถูกล็อก ไม่เปลี่ยนตามการแก้ภายหลัง และแก้ข้อมูลไม่ได้ */
function isClosed(v){ return !!(v && v.closed); }
function villageClosed(id){ const v = state.villages.find(x=>x.id===id); return isClosed(v); }
function jobClosed(job){
  if(!job) return false;
  const v = state.villages.find(x=>x.id===job.villageId);
  return isClosed(v);
}
/* ยอดยูนิตที่ตั้งงบไว้ (นับจากจำนวนตั้งงบทุกรายการ) */
/* ยอดปริมาณงานที่ใช้จริง — แยกตามหน่วย (M / EA / Set …) เพราะบวกรวมคละหน่วยไม่มีความหมาย */
function closeVillage(id){
  if(!requireAdmin('ปิดโครงการ')) return;
  const v = state.villages.find(x=>x.id===id); if(!v) return;
  const jobs = B.jobs.filter(j=>j.villageId===id);
  /* ตอนเปิด = สิ่งที่ตั้งไว้ · ตอนปิด = ที่ทำได้จริง */
  const openHomes  = +v.ports||0;                                  // บ้านที่ตั้งเป้าไว้ตอนเปิด
  const openBudget = jobs.reduce((a,j)=>a+jobBudget(j),0);         // งบที่ตั้งไว้ตอนเปิด
  const doneHomes  = +v.homesDone||0;                              // บ้านที่ implement จริง
  const doneBudget = jobs.reduce((a,j)=>a+jobCost(j),0);           // งบที่ใช้จริง
  /* หมู่บ้านหนึ่งอาจมีหลายผู้รับเหมา */
  const byVendor = {};
  jobs.forEach(j=>{
    const nm = (vendorById(j.vendorId)||{}).name || 'ไม่ระบุ';
    byVendor[nm] = byVendor[nm] || {budget:0, cost:0, jobs:0};
    byVendor[nm].budget += jobBudget(j);
    byVendor[nm].cost   += jobCost(j);
    byVendor[nm].jobs++;
  });
  const vNames = Object.keys(byVendor);
  ui.closeVid = id;
  ui.closeOpen = { homes:openHomes, budget:openBudget };
  const empty = (!doneHomes && !doneBudget);
  $('closeBody').innerHTML = `
    <div style="font-size:14px;margin-bottom:10px">ปิดโครงการ <b>${esc(v.name)}</b></div>
    ${empty?`<div class="notice" style="background:#FBEAEA;border-color:#F0C7C7;color:var(--red);text-align:left">
      ⚠️ <b>ยังไม่มีตัวเลขผลงานในระบบ</b> — กรอกตัวเลขจริงด้านล่างก่อนปิด</div>`:''}

    ${vNames.length>1?`<div class="notice" style="text-align:left">
      👷 โครงการนี้มี <b>${vNames.length} ผู้รับเหมา</b> — ตัวเลขด้านล่างเป็นยอดรวมทุกเจ้า</div>`:''}

    <div class="section-label" style="margin-top:4px">เทียบ ตอนเปิด · ตอนปิด</div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <table class="sum" style="margin:0">
        <tr><th></th><th class="r">ตอนเปิดโครงการ</th><th class="r">ตอนปิด (จริง)</th><th class="r">ส่วนต่าง</th></tr>
        <tr>
          <td><b>บ้าน (หลัง)</b></td>
          <td class="r num">${fmt(openHomes)}</td>
          <td class="r num"><input id="clHomes" type="number" value="${doneHomes||''}" placeholder="0"
              oninput="closeRecalc()" style="width:96px;text-align:right;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;padding:6px 8px;border:1.5px solid var(--green);border-radius:8px"></td>
          <td class="r num" id="clDiffHomes">-</td>
        </tr>
        <tr>
          <td><b>งบประมาณ (บาท)</b></td>
          <td class="r num">${fmt(openBudget)}</td>
          <td class="r num"><input id="clBudget" type="number" value="${doneBudget||''}" placeholder="0"
              oninput="closeRecalc()" style="width:118px;text-align:right;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;padding:6px 8px;border:1.5px solid var(--green);border-radius:8px"></td>
          <td class="r num" id="clDiffBudget">-</td>
        </tr>
      </table>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6">
      ส่วนต่างติดลบ = ทำได้น้อยกว่าที่ตั้งไว้ · <span style="color:var(--green-dark)">งบเหลือ = ประหยัดได้</span><br>
      Progress จะใช้ตัวเลข <b>ตอนปิด</b> เท่านั้น · แก้ได้ก่อนยืนยัน
    </div>
    ${(openBudget||openHomes)?`<div class="data-row" style="margin:8px 0 0">
      <button class="btn btn-ghost btn-sm" onclick="closeUsePlan()">↧ ใช้ตัวเลขตอนเปิด (ทำได้ครบตามแผน)</button></div>`:''}

    ${vNames.length?`
    <div class="section-label">แยกตามผู้รับเหมา</div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <table class="sum" style="margin:0">
        <tr><th>ผู้รับเหมา</th><th class="r">งานที่รับ</th><th class="r">งบที่ตั้ง</th><th class="r">ใช้จริง</th><th class="r">คงเหลือ</th></tr>
        ${vNames.map(nm=>{
          const d=byVendor[nm];
          return `<tr><td class="vname">${esc(nm)}</td><td class="r num">${d.jobs}</td>
            <td class="r num">${fmt(d.budget)}</td><td class="r num">${fmt(d.cost)}</td>
            <td class="r num ${d.budget-d.cost<0?'neg':'pos'}">${fmt(d.budget-d.cost)}</td></tr>`;
        }).join('')}
      </table>
    </div>`:''}`;
  $('closeModal').classList.add('open');
  closeRecalc();
}
function closeRecalc(){
  const o = ui.closeOpen || {homes:0,budget:0};
  const h = +($('clHomes')||{}).value||0, b = +($('clBudget')||{}).value||0;
  const dh = h - o.homes, db = b - o.budget;
  const eh = $('clDiffHomes'), eb = $('clDiffBudget');
  if(eh){ eh.innerHTML = `<b style="color:${dh<0?'var(--amber-dk)':(dh>0?'var(--green-dark)':'var(--muted)')}">${dh>0?'+':''}${fmt(dh)}</b>`; }
  if(eb){ eb.innerHTML = `<b style="color:${db>0?'var(--red)':(db<0?'var(--green-dark)':'var(--muted)')}">${db>0?'+':''}${fmt(db)}</b>${db<0?'<br><small style="color:var(--green-dark)">ประหยัด</small>':(db>0?'<br><small style="color:var(--red)">เกินงบ</small>':'')}`; }
}

/* ค่าที่ใช้แสดง: ปิดแล้วใช้ค่าที่ล็อกไว้ */
function villageBudget(v){
  if(isClosed(v)) return +v.builtBudget||0;   // ปิดแล้ว: งบ = ที่ใช้ implement
  return villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId).reduce((a,j)=>a+jobBudget(j),0);
}
function villageCost(v){
  if(isClosed(v)) return +v.builtBudget||0;   // ปิดแล้ว งบที่ตั้ง = งบก่อสร้างที่ใช้จริง
  return villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId).reduce((a,j)=>a+jobCost(j),0);
}

function poById(id){ return (B.pos||[]).find(p=>p.id===id); }
function poJobs(poId){ return B.jobs.filter(j=> j.poId===poId); }
function poAllocated(poId){ return poJobs(poId).reduce((s,j)=>s+jobBudget(j),0); }   // งบที่ตั้งไว้รวมทุกโครงการใน PO
function poSpent(poId){ return poJobs(poId).reduce((s,j)=>s+jobCost(j),0); }          // ค่างานที่ใช้จริงรวม
function poCeiling(po){ return +((po||{}).amount)||0; }                                // วงเงิน PO
function jobPOName(job){ const p = poById(job.poId); return p ? (p.code || p.name || '') : ''; }

function jobBudget(job){
  if(!job) return 0;
  let has=false, t=0;
  Object.keys(job.bqty||{}).forEach(k=>{
    const idx = +k.slice(1);
    if(!ITEMS[idx]) return;
    const q = +job.bqty[k]||0;
    if(q>0){ has=true; t += q * jobPrice(job, idx); }
  });
  return has ? t : (+job.budget||0);
}
function setBQty(jid, idx, val){
  const job = B.jobs.find(j=>j.id===jid); if(!job) return;
  if(jobClosed(job)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  job.bqty = job.bqty || {};
  if(val==='' || +val===0) delete job.bqty['i'+idx];
  else job.bqty['i'+idx] = +val;
  bqPersist();
  refreshJobTotals(job);
}
function refreshJobTotals(job){
  const bud = jobBudget(job), cost = jobCost(job);
  const g1=$('grandBudget'), g2=$('grandTotal'), g3=$('grandRemain');
  if(g1) g1.textContent = fmt(bud);
  if(g2) g2.textContent = fmt(cost);
  if(g3){ g3.textContent = fmt(bud-cost); g3.style.color = (bud && cost>bud)? '#FF9B9B' : ''; }
}
function jobCost(job){
  if(jobClosed(job)){
    const v = state.villages.find(x=>x.id===job.villageId);
    const jobs = B.jobs.filter(j=>j.villageId===job.villageId);
    return jobs.length===1 ? (+v.builtBudget||0) : (+v.builtBudget||0)/jobs.length;
  }
  let t = 0;
  Object.keys(job.qty||{}).forEach(k=>{
    const idx = +k.slice(1);
    if(!ITEMS[idx]) return;
    t += (+job.qty[k]||0) * jobPrice(job, idx);
  });
  return t;
}
function setJobPrice(jid, idx, val){
  const job = B.jobs.find(j=>j.id===jid); if(!job) return;
  if(jobClosed(job)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }
  job.prices = job.prices || {};
  if(val === '') delete job.prices['i'+idx];
  else job.prices['i'+idx] = +val;
  bqPersist();
  refreshItemList();
  refreshJobTotals(job);
}

/* ================= ซิงค์เรียลไทม์ =================
   1) ฟังการเปลี่ยนแปลงจากฐานข้อมูลโดยตรง (Realtime)
   2) ดึงซ้ำเมื่อกลับมาที่หน้าจอ / ออนไลน์อีกครั้ง
   3) ตรวจเป็นระยะเผื่อ Realtime หลุด
   กติกา: ถ้ามีข้อมูลค้างยังไม่บันทึก จะไม่ดึงทับ แต่จะเตือนแทน            */
let rtChannel = null, rtLastPull = 0, rtPollTimer = null, rtPending = false;
let rtOk = false, rtRetry = 0, rtRetryTimer = null;
/* ต่อใหม่เองแบบถอยเวลาเพิ่มขึ้น (5s → 10s → 20s → สูงสุด 60s) */
function rtReconnect(){
  if(!cloudOn || !cloudUser || !session.role) return;
  clearTimeout(rtRetryTimer);
  const wait = Math.min(60000, 5000 * Math.pow(2, Math.min(rtRetry, 4)));
  rtRetry++;
  rtRetryTimer = setTimeout(()=>{ rtStart(); }, wait);
}

function rtStamp(){
  const el = document.getElementById('syncStamp');
  if(!el) return;
  if(!navigator.onLine){ el.textContent = '⚠ ไม่มีอินเทอร์เน็ต'; el.style.color='var(--red)'; return; }
  if(!cloudOn){ el.textContent = 'ทำงานแบบออฟไลน์'; el.style.color='var(--muted)'; return; }
  el.style.color = 'var(--muted)';
  const t = rtLastPull ? new Date(rtLastPull) : null;
  if(!t){ el.textContent = 'กำลังเชื่อมต่อ...'; return; }
  const hhmm = t.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  if(rtPending){ el.textContent = '🔵 มีข้อมูลใหม่ · โหลดล่าสุด ' + hhmm; el.style.color='#0B3D91'; return; }
  el.textContent = (rtOk ? '🟢 ' : '🟡 ') + 'โหลดล่าสุด ' + hhmm;
}
/* ไม่ดึงข้อมูลเอง — แค่ "แจ้งว่ามีของใหม่" แล้วรอผู้ใช้กดปุ่ม */
function rtRefresh(reason){
  if(!cloudOn || !cloudUser || !session.role) return;
  if(_saving) return;
  rtPending = true;
  refreshSaveBtn();
  rtStamp();
}
/* ดึงข้อมูลจริง — เรียกจากปุ่มเท่านั้น */
async function pullNow(){
  if(_saving) return;
  if(hasPending()){
    if(!confirm('มีข้อมูลที่คุณยังไม่ได้บันทึก\n\nถ้าโหลดข้อมูลใหม่ตอนนี้ งานที่ยังไม่บันทึกอาจถูกทับ\n\nแนะนำให้กด "บันทึก" ก่อน — ต้องการโหลดต่อเลยไหม?')) return;
  }
  _saving = true; refreshSaveBtn();
  try{
    await cloudPull();
    rtLastPull = Date.now(); rtPending = false;
    _saving = false;
    rtStamp(); render(); refreshSaveBtn();
    toast('โหลดข้อมูลล่าสุดแล้ว');
  }catch(e){
    _saving = false; refreshSaveBtn();
    toast('โหลดไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วลองใหม่');
  }
}
/* เริ่มฟังการเปลี่ยนแปลง */
function rtStart(){
  if(!cloudOn || !cloudUser) { rtStamp(); return; }
  rtStop();
  try{
    rtChannel = sb.channel('ftth-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'villages'}, ()=>rtQueue())
      .on('postgres_changes', {event:'*', schema:'public', table:'houses'},   ()=>rtQueue())
      .on('postgres_changes', {event:'*', schema:'public', table:'boq_jobs'}, ()=>rtQueue())
      .subscribe(st=>{
        if(st==='SUBSCRIBED'){ rtOk = true; rtRetry = 0; rtLastPull = rtLastPull || Date.now(); rtStamp(); }
        else if(st==='CHANNEL_ERROR' || st==='TIMED_OUT' || st==='CLOSED'){ rtOk = false; rtStamp(); rtReconnect(); }
      });
  }catch(e){ rtOk = false; rtReconnect(); }
  rtStamp();
}
function rtStop(){
  try{ if(rtChannel) sb.removeChannel(rtChannel); }catch(e){}
  rtChannel = null;
  clearInterval(rtPollTimer); rtPollTimer = null;
}
/* รวบการแจ้งเตือนที่ถี่ให้เหลือครั้งเดียว */
let rtQueueTimer = null;
function rtQueue(){
  clearTimeout(rtQueueTimer);
  rtQueueTimer = setTimeout(()=>rtRefresh('realtime'), 700);
}
/* กลับมาที่หน้าจอ / ออนไลน์อีกครั้ง → ดึงทันที */

/* ===== ปุ่มบันทึก ===== */
let _unsaved = false, _saving = false, _loading = false;
let _pushOnly = null;          /* รายชื่อหมู่บ้านที่ต้องส่งรอบนี้ (null = ส่งทั้งหมด) */
function hasPending(){
  if(_unsaved || cloudDirty) return true;
  return (state.villages||[]).some(v=>v._hDirty);
}
function markUnsaved(){
  if(_loading) return;              /* กำลังโหลดจากระบบ ไม่ใช่การแก้ของผู้ใช้ */

/* บันทึกให้เองหลังหยุดพิมพ์ 2.5 วินาที — ผู้ใช้ไม่ต้องกดเอง */
function refreshSaveBtn(){
  /* ปุ่มโหลด: เตือนเมื่อมีข้อมูลใหม่จากคนอื่น */
  const pb = document.getElementById('pullBtn'), pd = document.getElementById('pullDot');
  if(pb && pd){
    pb.classList.toggle('hasnew', !!rtPending);
    pd.textContent = rtPending ? '⬇️ มีใหม่ !' : '⬇️ โหลด';
    pb.title = rtPending ? 'มีข้อมูลใหม่จากทีม — กดเพื่อโหลดลงเครื่องนี้' : 'โหลดข้อมูลล่าสุดจากระบบ';
  }
  const btn = document.getElementById('syncBtn'), dot = document.getElementById('syncDot');
  if(!btn || !dot) return;
  btn.classList.remove('dirty','saving','saved');
  if(_saving){ btn.classList.add('saving'); dot.textContent='⏳ กำลังบันทึก'; btn.title='กำลังบันทึกขึ้นระบบ...'; return; }
  if(hasPending()){
    btn.classList.add('dirty');
    dot.textContent = '💾 บันทึก •';
    btn.title = 'มีข้อมูลที่ยังไม่ได้บันทึก — กดเพื่อบันทึกขึ้นระบบ';
  } else {
    dot.textContent='💾 บันทึก';
    btn.title = cloudOn ? 'ข้อมูลล่าสุดถูกบันทึกแล้ว' : 'บันทึกในเครื่อง';
  }
}

async function cloudPush(){
  if(!cloudOn || !cloudUser || !cloudDirty) return;
  cloudDirty = false;
  const dot = document.getElementById('syncDot'); if(dot) dot.textContent='⏳ กำลังบันทึก';
  try{
    /* vendors (admin เท่านั้นที่มีสิทธิ์เขียนทุกราย) */
    if(isAdmin()){
      /* ส่งเฉพาะรายที่ยังไม่มีบน cloud หรือถูกแก้ — ปกติจะไม่ส่งเลย ประหยัด 1 รอบ */
      const vd = realVendors().filter(v=> !v.cloudId || v._dirty);
      await Promise.all(vd.map(v=>
        sb.from('vendors').upsert({ id:v.cloudId||undefined, name:v.name, prices:v.prices||{} }, {onConflict:'id'})
          .then(r=>{ if(r.data&&r.data[0]) v.cloudId=r.data[0].id; delete v._dirty; })
      ));
    }
    /* PO (admin เท่านั้น) */
    let posTableOk = true;
    let closeColsOk = true, roiColOk = true;
    if(isAdmin() && (B.pos||[]).length){
      const pd = B.pos.filter(p=> !p.cloudId || p._dirty);
      if(pd.length){
        try{
          await Promise.all(pd.map(async p=>{
            const { data, error } = await sb.from('pos').upsert({ id:p.cloudId||undefined, code:p.code, name:p.name||'', amount:+p.amount||0 }, {onConflict:'id'}).select('id').single();
            if(error) throw error;
            if(data){ p.cloudId = data.id; delete p._dirty; }
          }));
        }catch(e){ posTableOk = false; }   /* ยังไม่ได้รัน supabase-po.sql — ข้ามไปก่อน */
      }
      if(!posTableOk) showCloudSchemaWarning('PO / วงเงิน', 'supabase-po.sql');
    }
    /* villages + jobs + houses (เฉพาะที่เห็นได้ตาม RLS) */
    /* ส่งเฉพาะรายการที่เปลี่ยนจริง — เร็วขึ้นมากเมื่อมี 28 หมู่บ้าน/2,400 หลัง */
    const allV = visibleVillages();
    let targets;
    if(Array.isArray(_pushOnly)){
      const set = new Set(_pushOnly);
      targets = allV.filter(v => set.has(v.id) || !v.cloudId);
    } else {
      const chg = allV.filter(v => v._dirty || v._hDirty || !v.cloudId);
      targets = chg.length ? chg : allV;          /* ไม่มีร่องรอย = ส่งทั้งหมด (ครั้งแรก) */
    }
    /* ส่งหลายหมู่บ้านพร้อมกันครั้งละ 4 — เร็วขึ้นมากเมื่อแก้หลายหมู่บ้าน */
    const pushOne = async (v)=>{
      const vrow = { id:v.cloudId||undefined, name:v.name, contractor:v.contractor||'', vendor_id: vendorCloudId(v.vendorId), ports:String(v.ports||''), homes_done:+v.homesDone||0, start_date:v.start||'', end_date:v.end||'', issue:v.issue||'', tasks:jTasks(v), updated_at:new Date().toISOString() };
      if(isAdmin() && roiColOk && v.roi && (v.roi.arpu || Object.keys(v.roi.cust||{}).length)) vrow.roi = v.roi;
      if(closeColsOk && v.lastMove) vrow.last_move = v.lastMove;
      if(closeColsOk){
        vrow.closed = !!v.closed;
        vrow.closed_at = v.closedAt||'';
        vrow.built_homes = +v.builtHomes||0;
        vrow.built_budget = +v.builtBudget||0;
        vrow.open_homes = +v.openHomes||0;
        vrow.plan_budget = +v.planBudget||0;
        vrow.plan_units = +v.planUnits||0;
      }
      let data = null;
      try{
        const r = await sb.from('villages').upsert(vrow, {onConflict:'id'}).select('id').single();
        if(r.error) throw r.error;
        data = r.data;
      }catch(e){
        /* คอลัมน์ปิดโครงการยังไม่มีใน cloud -> ส่งใหม่แบบไม่มีฟิลด์นั้น */
        if('roi' in vrow){ roiColOk = false; delete vrow.roi; }
        delete vrow.last_move;
        closeColsOk = false;
        ['closed','closed_at','built_homes','built_budget','open_homes','plan_budget','plan_units','last_move'].forEach(k=>delete vrow[k]);
        const r2 = await sb.from('villages').upsert(vrow, {onConflict:'id'}).select('id').single();
        data = r2.data;
        showCloudSchemaWarning('ปิดโครงการ', 'supabase-close-project.sql');
      }
      if(data){ v.cloudId = data.id; }
      if(v.cloudId) delete v._dirty;
      /* houses (Unit) — ส่งขึ้นเมื่อมีการเปลี่ยนแปลง */
      if(v.cloudId && v._hDirty){
        try{
          await sb.from('houses').delete().eq('village_id', v.cloudId);
          const hrows = dedupeHouses(v.houses||[]).filter(h=>h.no||h.st||h.name).map(h=>({
            village_id:v.cloudId, no:h.no||'', status:h.st||'',
            lat:(+h.lat||null), lng:(+h.lng||null), solution:h.sol||'', estimate:h.est||'',
            detail:h.detail||'', vlc:h.vlc||'', olt:h.olt||'',
            cust_name:h.name||'', cust_addr:h.addr||'', cust_phone:h.phone||'', interest:h.interest||'', sub_contract:h.sub||''
          }));
          const hc=[]; for(let i=0;i<hrows.length;i+=1000) hc.push(hrows.slice(i,i+1000));
          await Promise.all(hc.map(c=> sb.from('houses').insert(c)));
          delete v._hDirty;
        }catch(e){ /* คงธงไว้ ลองใหม่รอบหน้า */ }
      }
      const jb = B.jobs.find(j=>j.villageId===v.id);
      if(jb && v.cloudId){
        const poRow = (B.pos||[]).find(p=>p.id===jb.poId);
        const jrow = { id:jb.cloudId||undefined, village_id:v.cloudId, vendor_id:vendorCloudId(jb.vendorId), prices:jb.prices||{}, bqty:jb.bqty||{}, qty:jb.qty||{}, updated_at:new Date().toISOString() };
        if(posTableOk) jrow.po_id = poRow && poRow.cloudId ? poRow.cloudId : null;
        let jd = null;
        try{
          const r = await sb.from('boq_jobs').upsert(jrow, {onConflict:'id'}).select('id').single();
          jd = r.data;
        }catch(e){
          delete jrow.po_id;   /* คอลัมน์ po_id ยังไม่มี -> ส่งใหม่โดยไม่มี po_id */
          const r2 = await sb.from('boq_jobs').upsert(jrow, {onConflict:'id'}).select('id').single();
          jd = r2.data;
        }
        if(jd) jb.cloudId = jd.id;
      }
    };
    for(let i=0;i<targets.length;i+=4){
      await Promise.all(targets.slice(i,i+4).map(v=>pushOne(v).catch(()=>{})));
      if(dot && targets.length>4) dot.textContent = '⏳ '+Math.min(i+4,targets.length)+'/'+targets.length;
    }
    persistLocalOnly();
    if(dot){ dot.textContent='✅ บันทึกแล้ว'; setTimeout(refreshSaveBtn, 1200); }
  }catch(e){
    if(dot){ dot.textContent='⚠️'; dot.title='ซิงค์ไม่สำเร็จ: '+e.message; }
    cloudDirty = true;
  }
}

}
function persistLocalOnly(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); localStorage.setItem(LS, JSON.stringify(B)); }catch(e){}
}
/* Supabase ส่งกลับสูงสุด 1000 แถว/ครั้ง — ต้องดึงเป็นชุดจนครบ
   (ข้อมูลจริง 2,400+ หลัง ถ้าไม่ทำจะได้ไม่ครบ หมู่บ้านท้ายๆ จะขึ้น 0) */
async function fetchAll(table){
  const SZ = 1000;
  let out = [], from = 0;
  for(let guard=0; guard<200; guard++){
    const r = await sb.from(table).select('*').range(from, from+SZ-1);
    if(r.error) throw r.error;
    const rows = r.data || [];
    out = out.concat(rows);
    if(rows.length < SZ) break;
    from += SZ;
  }
  return out;
}
async function cloudPull(){
  if(!cloudOn || !cloudUser) return;
  _loading = true;
  const dot = document.getElementById('syncDot'); if(dot) dot.textContent='⏳ กำลังโหลด';
  try{
    const { data:vends } = await sb.from('vendors').select('*');
    const vils = await fetchAll('villages');
    const jobs = await fetchAll('boq_jobs');
    let posRows = null, posOk = false;
    try{
      const r = await sb.from('pos').select('*');
      if(!r.error){ posRows = r.data || []; posOk = true; }
    }catch(e){ /* ตาราง pos ยังไม่มี -> เก็บ PO ในเครื่องไว้ */ }
    const hs = await fetchAll('houses');
    /* ===== กันข้อมูลหาย: cloud ว่างแต่ในเครื่องมีข้อมูล = อย่าล้างทิ้ง =====
       เกิดได้ตอนใช้ cloud ครั้งแรก หรือฐานข้อมูลถูกล้าง */
    if((!vils || !vils.length) && (state.villages||[]).length){
      _loading = false;
      cloudDirty = true;
      try{ refreshSaveBtn(); }catch(e){}
      toast('ระบบยังไม่มีข้อมูล — เก็บข้อมูลในเครื่องไว้ กด 💾 บันทึก เพื่ออัปขึ้นระบบ');
      return;
    }
    if(vends){
      B.vendors = vends.filter(x=> vendorRoleOf(x)==='vendor')
        .map(x=>({ id:x.id, cloudId:x.id, name:x.name, user:'', pass:'', prices:x.prices||{}, role:'vendor' }));
    }
    const houseBy = {};
    (hs||[]).forEach(h=>{ (houseBy[h.village_id]=houseBy[h.village_id]||[]).push({ no:h.no, st:h.status, lat:h.lat||'', lng:h.lng||'', sol:h.solution, est:h.estimate, detail:h.detail, vlc:h.vlc, olt:h.olt, name:h.cust_name, addr:h.cust_addr, phone:h.cust_phone, interest:h.interest, sub:h.sub_contract||'' }); });
    /* กันข้อมูล Unit ในเครื่องหาย: ถ้า cloud ยังไม่มี ให้เก็บของเดิมไว้แล้วตั้งธงส่งขึ้นรอบถัดไป */
    const localByCloud = {}, localByName = {};
    (state.villages||[]).forEach(v=>{
      if(v.cloudId) localByCloud[v.cloudId] = v;
      if(v.name) localByName[String(v.name).trim()] = v;
    });
    let rescued = 0, closeRescued = false, roiRescued = false;
    state.villages = (vils||[]).map(v=>{
      const cloudHouses = houseBy[v.id] || [];
      const prev = localByCloud[v.id] || localByName[String(v.name||'').trim()];
      let houses = cloudHouses, dirty = false;
      if(!cloudHouses.length && prev && (prev.houses||[]).length){
        houses = prev.houses; dirty = true; rescued += houses.length;
      }
      const nv = { id:v.id, cloudId:v.id, name:v.name, contractor:v.contractor||'', vendorId:v.vendor_id,
                   ports:v.ports||'', homesDone:v.homes_done||0, start:v.start_date||'', end:v.end_date||'',
                   issue:v.issue||'', tasks:v.tasks||[], houses:houses };
      /* สถานะปิดโครงการ: ใช้ของ cloud ถ้ามีคอลัมน์ · ถ้ายังไม่มี ให้คงของในเครื่องไว้แล้วส่งขึ้นรอบหน้า */
      if(Object.prototype.hasOwnProperty.call(v,'closed')){
        if(v.closed){
          nv.closed = true;
          nv.closedAt = v.closed_at||'';
          nv.builtHomes = +v.built_homes||0;
          nv.builtBudget = +v.built_budget||0;
          nv.openHomes = +v.open_homes||0;
          nv.planBudget = +v.plan_budget||0;
          nv.planUnits = +v.plan_units||0;
        }
      } else if(prev && prev.closed){
        nv.closed = true;
        nv.closedAt = prev.closedAt||'';
        nv.builtHomes = +prev.builtHomes||0;
        nv.builtBudget = +prev.builtBudget||0;
        nv.openHomes = +prev.openHomes||0;
        nv.planBudget = +prev.planBudget||0;
        nv.planUnits = +prev.planUnits||0;
        closeRescued = true;
      }
      if(v.last_move) nv.lastMove = String(v.last_move).slice(0,10);
      else if(prev && prev.lastMove) nv.lastMove = prev.lastMove;
      /* ROI: admin เท่านั้น · ถ้า cloud ยังไม่มี ให้คงของในเครื่องไว้ */
      if(v.roi && typeof v.roi==='object') nv.roi = v.roi;
      else if(prev && prev.roi){ nv.roi = prev.roi; if(isAdmin()) roiRescued = true; }
      if(dirty){
        nv._hDirty = true;
        nv.homesDone = houses.filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
      }
      return nv;
    });
    if(rescued || closeRescued || roiRescued){
      cloudDirty = true;                        /* รอผู้ใช้กด 💾 บันทึก — ไม่ส่งเอง */
      try{ markUnsaved(); }catch(e){}
    }
    autoFixShifted();
    /* PO: ใช้ของ cloud เมื่อดึงได้จริงและมีข้อมูล มิฉะนั้นคง PO ในเครื่องไว้ (กันหาย) */
    const localPos = (B.pos||[]).slice();
    let poRescued = false;
    if(posOk && posRows && posRows.length){
      B.pos = posRows.map(p=>({ id:p.id, cloudId:p.id, code:p.code, name:p.name||'', amount:+p.amount||0 }));
    } else if(localPos.length){
      B.pos = localPos; poRescued = true;      // cloud ยังไม่มี -> เก็บของเดิมไว้แล้วส่งขึ้นรอบหน้า
    } else {
      B.pos = [];
    }
    /* จับคู่ poId เดิมไว้ เผื่อ cloud ยังไม่มีคอลัมน์ po_id */
    const prevJobPO = {};
    (B.jobs||[]).forEach(j=>{ if(j.cloudId && j.poId) prevJobPO[j.cloudId] = j.poId; });
    const poCloudToLocal = {};
    (B.pos||[]).forEach(p=>{ if(p.cloudId) poCloudToLocal[p.cloudId] = p.id; });
    B.jobs = (jobs||[]).map(j=>{
      let poId = '';
      if(j.po_id) poId = poCloudToLocal[j.po_id] || j.po_id;
      else if(prevJobPO[j.id]) poId = prevJobPO[j.id];      // cloud ไม่มีข้อมูล -> คงของเดิม
      return { id:j.id, cloudId:j.id, villageId:j.village_id, vendorId:j.vendor_id, poId:poId, prices:j.prices||{}, bqty:j.bqty||{}, qty:j.qty||{} };
    });
    if(poRescued && isAdmin()){
      cloudDirty = true;                        /* รอผู้ใช้กด 💾 บันทึก — ไม่ส่งเอง */
      try{ markUnsaved(); }catch(e){}
    }
    try{ normalizeData(); }catch(e){}
    const dupN = dedupeAll();
    if(dupN){
      cloudDirty = true;
      toast('พบข้อมูลรายหลังซ้ำ '+dupN+' แถว — ล้างให้แล้ว กด 💾 บันทึก เพื่ออัปเดตระบบ');
    }
    persistLocalOnly();
    if(session.role) render();
    _loading = false;
    if(!hasPending()) _unsaved = false;
    rtLastPull = Date.now();
    try{ rtStamp(); refreshSaveBtn(); }catch(e){}
    if(dot && !dupN){ dot.textContent='✅ ข้อมูลล่าสุด'; setTimeout(refreshSaveBtn, 1200); }
  }catch(e){
    _loading = false;
    try{ refreshSaveBtn(); }catch(e2){}
    if(dot) dot.textContent='⚠️ โหลดไม่สำเร็จ';
  }
}
/* อัปโหลดข้อมูลในเครื่องขึ้น cloud ครั้งแรก (รวม houses) */
async function cloudSeedFromLocal(){
  if(!requireAdmin('อัปโหลดข้อมูลขึ้น cloud')) return;
  if(!cloudOn || !cloudUser){ toast('ยังไม่ได้ตั้งค่า cloud'); return; }
  if(!confirm('อัปโหลดข้อมูลในเครื่องทั้งหมดขึ้น cloud? (ใช้ครั้งแรกครั้งเดียว)')) return;
  toast('กำลังอัปโหลดขึ้น cloud...');
  try{
    for(const p of (B.pos||[])){
      const { data } = await sb.from('pos').upsert({ id:p.cloudId||undefined, code:p.code, name:p.name||'', amount:+p.amount||0 }, {onConflict:'id'}).select('id').single();
      if(data) p.cloudId = data.id;
    }
    for(const vd of B.vendors){
      const { data } = await sb.from('vendors').upsert({ id:vd.cloudId||undefined, name:vd.name, prices:vd.prices||{} }, {onConflict:'id'}).select('id').single();
      if(data) vd.cloudId = data.id;
    }
    for(const v of state.villages){
      const seedRow = { id:v.cloudId||undefined, name:v.name, contractor:v.contractor||'', vendor_id:vendorCloudId(v.vendorId), ports:String(v.ports||''), homes_done:+v.homesDone||0, start_date:v.start||'', end_date:v.end||'', issue:v.issue||'', tasks:v.tasks||[],
        closed:!!v.closed, closed_at:v.closedAt||'', built_homes:+v.builtHomes||0, built_budget:+v.builtBudget||0, open_homes:+v.openHomes||0, plan_budget:+v.planBudget||0, plan_units:+v.planUnits||0 };
      let data = null;
      try{
        const r = await sb.from('villages').upsert(seedRow, {onConflict:'id'}).select('id').single();
        if(r.error) throw r.error;
        data = r.data;
      }catch(e){
        ['closed','closed_at','built_homes','built_budget','open_homes','plan_budget','plan_units','last_move'].forEach(k=>delete seedRow[k]);
        const r2 = await sb.from('villages').upsert(seedRow, {onConflict:'id'}).select('id').single();
        data = r2.data;
      }
      if(data){
        v.cloudId = data.id;
        if((v.houses||[]).length){
          await sb.from('houses').delete().eq('village_id', v.cloudId);
          const rows = v.houses.map(h=>({ village_id:v.cloudId, no:h.no||'', status:h.st||'', lat:h.lat||null, lng:h.lng||null, solution:h.sol||'', estimate:h.est||'', detail:h.detail||'', vlc:h.vlc||'', olt:h.olt||'', cust_name:h.name||'', cust_addr:h.addr||'', cust_phone:h.phone||'', interest:h.interest||'', sub_contract:h.sub||'' }));
          for(let i=0;i<rows.length;i+=500){ await sb.from('houses').insert(rows.slice(i,i+500)); }
        }
        const jb = B.jobs.find(j=>j.villageId===v.id);
        if(jb){
          const pRow = (B.pos||[]).find(p=>p.id===jb.poId);
          const { data:jd } = await sb.from('boq_jobs').upsert({ id:jb.cloudId||undefined, village_id:v.cloudId, vendor_id:vendorCloudId(jb.vendorId), po_id: pRow&&pRow.cloudId ? pRow.cloudId : null, prices:jb.prices||{}, bqty:jb.bqty||{}, qty:jb.qty||{} }, {onConflict:'id'}).select('id').single();
          if(jd) jb.cloudId=jd.id;
        }
      }
    }
    persistLocalOnly();
    toast('อัปโหลดขึ้น cloud สำเร็จ');
  }catch(e){ toast('อัปโหลดไม่สำเร็จ: '+e.message); }
}

async function doLogin(){
  const u = $('loginUser').value.trim();
  const p = $('loginPass').value;
  if(cloudOn){
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email:u, password:p });
      if(error) throw error;
      cloudUser = data.user;
      const { data:me } = await sb.from('vendors').select('*').eq('auth_uid', cloudUser.id).single();
      await cloudPull();
      const r = me ? vendorRoleOf(Object.assign({}, me, {user: me.user || (cloudUser&&cloudUser.email) || ''})) : null;
      if(r === 'admin'){ enterApp('admin', null); }
      else if(r === 'planning'){
        enterApp('planning', null);
        checkPlanningAccess(me);
      }
      else if(me){
        let lv = B.vendors.find(x=>x.cloudId===me.id);
        if(!lv){ lv={id:me.id, cloudId:me.id, name:me.name, prices:me.prices||{}}; B.vendors.push(lv); }
        enterApp('vendor', lv.id);
      } else { toast('บัญชีนี้ยังไม่ได้ผูกกับ Vendor — ติดต่อผู้ดูแล'); }
      return;
    }catch(e){ toast('เข้าสู่ระบบไม่สำเร็จ: '+(e.message||'')); return; }
  }
  if(u === B.adminUser && p === B.adminPass){ enterApp('admin', null); return; }
  const v = B.vendors.find(v=> v.user === u && v.pass === p);
  if(v){ enterApp('vendor', v.id); }
  else toast('Username หรือ Password ไม่ถูกต้อง');
}

async function addVendor(){
  if(!requireAdmin('สร้างบัญชี')) return;
  const name = $('nvName').value.trim(), user = $('nvUser').value.trim(), pass = $('nvPass').value.trim();
  const role = $('nvRole') ? $('nvRole').value : 'vendor';
  if(!name || !user || !pass){ toast('กรอกชื่อ, '+(cloudOn?'อีเมล':'Username')+' และ Password ให้ครบ'); return; }
  if(cloudOn){
    if(pass.length < 6){ toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัว'); return; }
    const email = user.includes('@') ? user : user+'@ais.local';
    try{
      const { data, error } = await sb.rpc('admin_create_account', {
        new_email: email, new_password: pass, disp_name: name, make_admin: (role==='admin')
      });
      if(error) throw error;
      if(role !== 'admin'){
        B.vendors.push({id:data, cloudId:data, name, user:email, pass:'', prices:{}});
        bqPersist();
      }
      $('nvName').value=''; $('nvUser').value=''; $('nvPass').value='';
      toast('สร้างบัญชี '+name+' แล้ว — login ด้วย '+email);
      renderAccounts();
    }catch(e){
      toast('สร้างไม่สำเร็จ: '+(e.message||'')+' (ถ้าเป็นครั้งแรก ต้องรัน supabase-admin-users.sql ก่อน)');
    }
    return;
  }
  if(user === B.adminUser || B.vendors.some(v=>v.user===user)){ toast('Username นี้ถูกใช้แล้ว'); return; }
  B.vendors.push({id:uid(), name, user, pass, prices:{}});
  bqPersist(); renderVendorMode(); toast('เพิ่ม '+name+' แล้ว');
}
function setVendorCred(id, key, val){
  const v = vendorById(id); if(!v) return;
  val = val.trim();
  if(!val){ toast('ค่าว่างไม่ได้'); bqRender(); return; }
  if(key==='user' && (val===B.adminUser || B.vendors.some(x=>x.id!==id && x.user===val))){ toast('Username นี้ถูกใช้แล้ว'); bqRender(); return; }
  v[key] = val; bqPersist(); toast('บันทึกแล้ว');
}
async function delVendor(id){
  const vd = B.vendors.find(v=>v.id===id);
  if(!confirm('ลบ Vendor นี้? งานที่ผูกอยู่จะไม่ถูกลบแต่จะไม่มีราคา')) return;
  const cid = vd && vd.cloudId;
  B.vendors = B.vendors.filter(v=>v.id!==id);
  bqPersist(); refreshAdminUI();
  if(cloudOn && cloudUser && cid){
    try{ await sb.from('vendors').delete().eq('id', cid); toast('ลบ Vendor ออกจาก cloud แล้ว'); }
    catch(e){ toast('ลบในเครื่องแล้ว แต่ลบบน cloud ไม่สำเร็จ'); }
  }
}
function saveAdminCred(){
  const u = $('adminUserIn').value.trim(), p = $('adminPassIn').value.trim();
  if(!u || !p){ toast('Username / Password ว่างไม่ได้'); return; }
  if(B.vendors.some(v=>v.user===u)){ toast('Username นี้ซ้ำกับ Vendor'); return; }
  B.adminUser = u; B.adminPass = p; bqPersist(); toast('บันทึกบัญชีผู้ดูแลแล้ว');
}

/* เซลล์รายบรรทัดของหน้างาน: ราคา · ตั้งงบ · ใช้แล้ว · คงเหลือ */
function itemsInUse(job){
  const set = new Set();
  ['prices','bqty','qty'].forEach(k=>Object.keys(job[k]||{}).forEach(x=>{ if(job[k][x]!=='' && job[k][x]!=null) set.add(x); }));
  return set.size;
}
function openAddItem(jid){
  ui.addItemJob = jid; ui.addItemQ = '';
  $('addItemModal').classList.add('open');
  renderAddItemList();
  setTimeout(()=>{ const el=$('aiSearch'); if(el) el.focus(); }, 60);
}
function renderAddItemList(){
  const job = B.jobs.find(j=>j.id===ui.addItemJob); if(!job) return;
  const q = (ui.addItemQ||'').trim().toLowerCase();
  const inUse = new Set(Object.keys(job.bqty||{}).concat(Object.keys(job.qty||{})).concat(Object.keys(job.prices||{})));
  let html = '', lastSec = '';
  let shown = 0;
  ITEMS.forEach((it, idx)=>{
    if(inUse.has('i'+idx)) return;
    if(q && !(it.n.toLowerCase().includes(q) || it.s.toLowerCase().includes(q))) return;
    if(shown >= 200) return;
    if(it.s !== lastSec){ html += `<div class="sec-head" style="margin:8px 0 4px">${esc(it.s)}</div>`; lastSec = it.s; }
    html += `<div class="irow" style="cursor:pointer" onclick="addItemToJob(${idx})">
      <div class="nm">${esc(it.n)}<br><small>${esc(it.u)}</small></div>
      <button class="btn btn-green btn-sm">เพิ่ม</button>
    </div>`;
    shown++;
  });
  $('aiList').innerHTML = html || '<div style="padding:12px;color:var(--muted);font-size:13px">ไม่พบรายการ (หรือเพิ่มครบแล้ว)</div>';
}
function addItemToJob(idx){
  const job = B.jobs.find(j=>j.id===ui.addItemJob); if(!job) return;
  job.bqty = job.bqty || {};
  if(!job.bqty['i'+idx]) job.bqty['i'+idx] = 0;
  job.prices = job.prices || {};
  if(job.prices['i'+idx] == null) job.prices['i'+idx] = '';
  bqPersist();
  renderAddItemList();
  toast('เพิ่ม ' + ITEMS[idx].n.slice(0,40) + ' แล้ว');
}
function closeAddItem(){ $('addItemModal').classList.remove('open'); bqRender(); }

function jobRowCells(job, v, idx){
  if(jobClosed(job)){
    const bq0 = (job.bqty||{})['i'+idx] || '';
    const p0 = jobPrice(job, idx);
    return `<div class="line-total" style="width:88px;font-weight:500;color:var(--muted)">${fmt(p0)}</div>
      <div class="line-total" style="width:74px;color:var(--green-dark)"><b>${bq0||''}</b></div>
      <div class="line-total" style="width:74px;color:var(--muted)">—</div>
      <div class="line-total" style="width:92px;color:var(--green-dark)">${bq0? fmt(bq0*p0)+' ฿':''}</div>`;
  }
  const bq = (job.bqty||{})['i'+idx] || '';
  const uq = (job.qty||{})['i'+idx] || '';
  const p = jobPrice(job, idx);
  const pv = (job.prices||{})['i'+idx];
  const remain = ((+bq||0) - (+uq||0)) * p;
  const priceCell = isAdmin()
    ? `<input type="number" class="bq-in" style="width:88px" title="ราคา/หน่วย โครงการนี้" value="${pv!=null?pv:''}" placeholder="ราคา" onchange="setJobPrice('${job.id}',${idx},this.value)">`
    : `<div class="line-total" style="width:88px;font-weight:500;color:var(--muted)">${fmt(p)}</div>`;
  return `${priceCell}
    <input type="number" class="bq-in" style="width:74px" title="จำนวนตั้งงบ" placeholder="ตั้งงบ" value="${bq}" onchange="setBQty('${job.id}',${idx},this.value)">
    <input type="number" class="bq-in" style="width:74px" title="จำนวนที่ใช้แล้ว" placeholder="ใช้แล้ว" value="${uq}" onchange="setQty('${job.id}',${idx},this.value)">
    <div class="line-total" style="width:92px;color:${bq&&remain<0?'var(--red)':''}">${bq? fmt(remain)+' ฿':''}</div>`;
}

/* item list rows shared by prices & job views */
function toggleSec(si){
  ui.openSecs = ui.openSecs || {};
  ui.openSecs[si] = !ui.openSecs[si];
  refreshItemList();
}
function itemRows(rightCellFn, job){
  ui.openSecs = ui.openSecs || {};
  const q = (ui.q||'').toLowerCase();
  // group by section
  const secs = [];
  ITEMS.forEach((it, idx)=>{
    if(q && !(it.n.toLowerCase().includes(q) || it.s.toLowerCase().includes(q))) return;
    /* แสดงถ้ามีข้อมูลอะไรก็ตาม: ราคา หรือ ตั้งงบ หรือ ใช้แล้ว */
    if(job && ui.qtyOnly
       && !((job.qty||{})['i'+idx] > 0)
       && !((job.bqty||{})['i'+idx] > 0)
       && !((job.prices||{})['i'+idx] > 0)) return;
    if(!secs.length || secs[secs.length-1].name !== it.s) secs.push({name:it.s, idxs:[]});
    secs[secs.length-1].idxs.push(idx);
  });
  if(!secs.length) return '<div style="color:var(--muted);font-size:13px;padding:10px">ไม่พบรายการ</div>';
  let html = '';
  secs.forEach((sec, si)=>{
    const qtyN = job ? sec.idxs.filter(i=>(job.qty||{})['i'+i] > 0 || (job.bqty||{})['i'+i] > 0 || (job.prices||{})['i'+i] > 0).length : 0;
    const key = sec.name.replace(/'/g,''); const open = !!ui.openSecs[key] || !!q || (job && ui.qtyOnly);
    html += `<div class="sec-head" style="cursor:pointer;user-select:none" onclick="toggleSec('${sec.name.replace(/'/g,'')}')">
      ${open?'▾':'▸'} ${esc(sec.name)} <span style="font-weight:500;opacity:.75">· ${sec.idxs.length} รายการ${qtyN?' · กรอกแล้ว '+qtyN:''}</span></div>`;
    if(!open) return;
    sec.idxs.forEach(idx=>{
      const it = ITEMS[idx];
      const has = job && (job.qty||{})['i'+idx] > 0;
      const priceOnly = job && !has && !((job.bqty||{})['i'+idx] > 0) && (job.prices||{})['i'+idx] > 0;
      html += `<div class="irow ${has?'hasqty':''} ${priceOnly?'priceonly':''}">
        <div class="nm">${esc(it.n)}${priceOnly?' <span class="need-qty" title="มีราคาแล้ว แต่ยังไม่ได้ใส่จำนวน จึงยังไม่คิดเป็นงบ">ยังไม่ใส่จำนวน</span>':''}<br><small>${esc(it.u)}</small></div>
        ${rightCellFn(idx)}
      </div>`;
    });
  });
  return html;
}
function refreshItemList(){
  const el = $('itemList'); if(!el) return;
  if(ui.tab==='prices'){
    const v = vendorById(session.role==='admin'? ui.vendorSel : session.vendorId);
    el.innerHTML = itemRows((idx)=>{
      const custom = v.prices && v.prices['i'+idx] != null && v.prices['i'+idx] !== '';
      return session.role==='admin'
        ? `<input type="number" placeholder="ราคา" value="${custom? v.prices['i'+idx]:''}" onchange="setPrice('${v.id}',${idx},this.value)">`
        : `<div class="line-total">${fmt(priceOf(v,idx))}</div>`;
    }, null);
  } else if(ui.jobSel){
    const job = B.jobs.find(j=>j.id===ui.jobSel);
    const v = vendorById(job.vendorId);
    el.innerHTML = itemRows((idx)=> jobRowCells(job, v, idx), job);

}

function poHintHTML(job){
  const p = poById(job.poId); if(!p) return '';
  const ceil = poCeiling(p); if(!ceil) return '';
  const alloc = poAllocated(p.id);
  const free = ceil - alloc;
  const others = poJobs(p.id).filter(j=>j.id!==job.id);
  return `<div class="notice" style="text-align:left;margin-top:10px;${free<0?'background:#FBEAEA;border-color:#F0C7C7;color:var(--red)':''}">
    📄 <b>${esc(p.code||p.name)}</b> · วงเงิน ${fmt(ceil)} ฿ · ตั้งงบไปแล้วรวม ${fmt(alloc)} ฿
    <br><b>${free>=0?'โยกเพิ่มเข้างานนี้ได้อีก '+fmt(free)+' ฿':'ตั้งงบเกินวงเงิน PO อยู่ '+fmt(-free)+' ฿ ต้องลดงานใดงานหนึ่ง'}</b>

function poCardHTML(p, isAdmin){
  const viewAll = canViewAll();
  const allJobs = poJobs(p.id);
  const jobs = allJobs.filter(j=> viewAll || j.vendorId===session.vendorId);
  const soleVendor = !viewAll && allJobs.length && allJobs.every(j=> j.vendorId===session.vendorId);
  const ceil = (viewAll || soleVendor) ? poCeiling(p) : 0;
  const alloc = viewAll ? poAllocated(p.id) : jobs.reduce((s,j)=>s+jobBudget(j),0);
  const spent = viewAll ? poSpent(p.id)     : jobs.reduce((s,j)=>s+jobCost(j),0);
  const free = ceil - alloc;
  const overAlloc = ceil && alloc > ceil;
  const overSpent = ceil && spent > ceil;
  const shared = !viewAll && !soleVendor && allJobs.length > jobs.length;
  return `
  <div class="panel" style="border:1.5px solid ${overAlloc?'var(--red)':'var(--line)'}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div>
        <h3 style="font-size:16px;color:var(--forest)">📄 ${esc(p.code||'(ไม่มีเลข PO)')}</h3>
        ${p.name?`<div class="sub" style="font-size:12px;color:var(--muted)">${esc(p.name)}</div>`:''}
        <div class="sub" style="font-size:12px;color:var(--muted)">${jobs.length} โครงการ${shared?' ของคุณ (PO นี้มีผู้รับเหมารายอื่นร่วมด้วย)':''}</div>
      </div>
      ${isAdmin?`<div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="editPO('${p.id}')">แก้ไข</button>
        <button class="btn btn-red btn-sm" onclick="delPO('${p.id}')">ลบ</button>
      </div>`:''}
    </div>

    <table class="sum" style="margin-top:10px">
      ${(viewAll||soleVendor)?`<tr><td>วงเงินตาม PO</td><td class="r money">${ceil?fmt(ceil):'— ยังไม่ระบุ —'}</td></tr>`:''}
      <tr><td>${viewAll?'จัดสรรให้โครงการแล้ว (ตั้งงบ)':'งบที่ตั้งไว้ของงานคุณ'}</td><td class="r money ${overAlloc?'neg':''}">${fmt(alloc)}</td></tr>
      <tr><td>ค่างานที่ใช้จริง</td><td class="r money">${fmt(spent)}</td></tr>
      ${ceil?`<tr><td><b>${free>=0?'วงเงินคงเหลือให้จัดสรร':'จัดสรรเกินวงเงิน'}</b></td><td class="r money ${free<0?'neg':'pos'}"><b>${fmt(Math.abs(free))}</b></td></tr>`:''}
      ${ceil?`<tr><td>คงเหลือจริง (วงเงิน − ใช้จริง)</td><td class="r money ${overSpent?'neg':'pos'}">${fmt(ceil-spent)}</td></tr>`:''}
    </table>
    ${ceil?`<div class="budget-bar" style="margin-top:8px"><i class="${overSpent?'over':''}" style="width:${Math.min(100,spent/ceil*100)}%"></i></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:4px">ใช้ไป ${Math.round(spent/ceil*100)}% ของวงเงิน PO</div>`:''}
    ${overAlloc?`<div class="notice" style="background:#FBEAEA;border-color:#F0C7C7;color:var(--red);margin-top:8px">⚠️ ตั้งงบรวมเกินวงเงิน PO อยู่ ${fmt(alloc-ceil)} ฿ — ต้องโยกงบออกจากบางโครงการ</div>`:''}

    ${jobs.length?`
    <div class="section-label" style="margin-top:12px">โครงการใน PO นี้ · แตะเพื่อเข้าไปโยกงบ</div>
    <table class="sum">
      <tr><th>โครงการ</th><th class="r">ตั้งงบ</th><th class="r">ใช้แล้ว</th><th class="r">คงเหลือ</th>${isAdmin?'<th></th>':''}</tr>
      ${jobs.map(j=>{
        const b=jobBudget(j), c=jobCost(j), d=b-c;
        return `<tr>
          <td style="cursor:pointer" onclick="ui.jobSel='${j.id}';ui.tab='jobs';bqRender()">${esc(jobName(j))}<br><small style="color:var(--muted)">${esc((vendorById(j.vendorId)||{}).name||'-')}</small></td>
          <td class="r money">${fmt(b)}</td>
          <td class="r">${fmt(c)}</td>
          <td class="r money ${d<0?'neg':'pos'}">${fmt(d)}</td>
          ${isAdmin?`<td class="r"><button class="btn btn-ghost btn-sm" onclick="setJobPO('${j.id}','')" title="เอาออกจาก PO นี้">✕</button></td>`:''}

      <tr style="border-top:2px solid var(--forest)"><td><b>รวม</b></td><td class="r money"><b>${fmt(alloc)}</b></td><td class="r"><b>${fmt(spent)}</b></td><td class="r money"><b>${fmt(alloc-spent)}</b></td>${isAdmin?'<td></td>':''}</tr>
    </table>`:'<div style="font-size:13px;color:var(--muted);margin-top:8px">ยังไม่มีโครงการใน PO นี้</div>'}

function addPO(){
  if(!requireAdmin('สร้าง PO')) return;
  const code=$('npoCode').value.trim(), amt=$('npoAmt').value, name=$('npoName').value.trim();
  if(!code){ toast('ใส่เลขที่ PO ก่อนครับ'); return; }
  if((B.pos||[]).some(p=>p.code.trim()===code)){ toast('เลขที่ PO นี้มีอยู่แล้ว'); return; }
  B.pos = B.pos || [];
  B.pos.push({id:uid(), code, name, amount:+amt||0});
  bqPersist(); bqRender(); toast('สร้าง PO '+code+' แล้ว');
}
function editPO(id){
  if(!requireAdmin('แก้ PO')) return;
  const p=poById(id); if(!p) return;
  const code=prompt('เลขที่ PO', p.code); if(code===null) return;
  const amt=prompt('วงเงินตาม PO (บาท)', p.amount||0); if(amt===null) return;
  const name=prompt('รายละเอียด', p.name||''); if(name===null) return;
  p.code=code.trim(); p.amount=+amt||0; p.name=name.trim();
  bqPersist(); bqRender(); toast('บันทึกแล้ว');
}
function delPO(id){
  if(!requireAdmin('ลบ PO')) return;
  const p=poById(id); if(!p) return;
  const n=poJobs(id).length;
  if(!confirm('ลบ PO '+(p.code||'')+' ?'+(n?'\n\nโครงการ '+n+' รายการจะกลับไปเป็น "ยังไม่ผูก PO" (ข้อมูลงบไม่หาย)':''))) return;
  B.jobs.forEach(j=>{ if(j.poId===id) j.poId=''; });
  B.pos = B.pos.filter(x=>x.id!==id);
  bqPersist(); bqRender(); toast('ลบ PO แล้ว');
}
function setJobPO(jid, poId){
  if(!requireAdmin('ผูก PO')) return;
  const j=B.jobs.find(x=>x.id===jid); if(!j) return;
  j.poId = poId || '';
  bqPersist(); bqRender();
}

function exportJobBOQ(jid){
  const job = B.jobs.find(j=>j.id===jid); if(!job) return;
  const v = vendorById(job.vendorId);
  const aoa = [
    ['BOQ งาน', jobName(job)],
    ['Vendor', (v||{}).name||'-'],
    ['กรอบงบประมาณ (บาท)', jobBudget(job)||''],
    ['วันที่', todayISO()],
    [],
    ['ลำดับ','หมวด','รายการ','หน่วย','จำนวน','ราคา/หน่วย','รวม (บาท)']
  ];
  let n=0, total=0;
  ITEMS.forEach((it,idx)=>{
    const q = +(job.qty||{})['i'+idx]||0;
    if(!q) return;
    const p = jobPrice(job,idx), line = q*p; total+=line; n++;
    aoa.push([n, it.s, (it.on||it.n), it.u, q, p, line]);
  });
  aoa.push([]);
  aoa.push(['','','','','','รวมทั้งงาน', total]);
  const jbud = jobBudget(job);
  if(jbud) aoa.push(['','','','','', jbud-total>=0?'คงเหลือจากงบ':'เกินงบ', Math.abs(jbud-total)]);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);

let importFor = null; // 'prices:<vid>' | 'job:<jid>'
$('boqXlsxIn').addEventListener('change', function(ev){
  const f = ev.target.files[0]; if(!f || !importFor) return;
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
      const nameIdx = {}; ITEMS.forEach((it,i)=> nameIdx[it.n.trim()] = i);
      let hit = 0;
      if(importFor.startsWith('prices:')){
        const v = vendorById(importFor.slice(7));
        // รับทั้งไฟล์ราคาจากแอปนี้ (คอลัมน์ รายการ/ราคา) และไฟล์มาตรฐาน (Description/Unit Price)
        const hi = aoa.findIndex(r=> r && (String(r[2]).trim()==='รายการ' || String(r[1]).trim().toLowerCase()==='description'));
        if(hi>=0){
          const isApp = String(aoa[hi][2]).trim()==='รายการ';
          for(let i=hi+1;i<aoa.length;i++){
            const r = aoa[i]; if(!r) continue;
            const nm = String(isApp? r[2] : r[1]).trim();
            const pr = +(isApp? r[4] : r[5]);
            if(nm && nameIdx[nm]!=null && !isNaN(pr)){ v.prices['i'+nameIdx[nm]] = pr; hit++; }
          }
        }
        bqPersist(); refreshAdminUI(); toast('อัปเดตราคา '+hit+' รายการ');
      } else if(importFor.startsWith('job:')){
        const job = B.jobs.find(j=>j.id===importFor.slice(4));
        const hi = aoa.findIndex(r=> r && String(r[2]).trim()==='รายการ' && String(r[4]).trim()==='จำนวน');
        if(hi>=0){
          for(let i=hi+1;i<aoa.length;i++){
            const r = aoa[i]; if(!r) continue;
            const nm = String(r[2]).trim(); const q = +r[4];
            if(nm && nameIdx[nm]!=null && q>0){ job.qty['i'+nameIdx[nm]] = q; hit++; }
          }
        }
        bqPersist(); bqRender(); toast('อัปเดตจำนวน '+hit+' รายการ');
      }
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ'); }
    importFor = null; ev.target.value='';
  };
  rd.readAsArrayBuffer(f);
});

/* ================= Mode switch (Progress <-> BOQ) ================= */
function switchMode(m){
  const map = {dash:'modeDash', progress:'modeProgress', boq:'modeBoq', vendor:'modeVendor', unit:'modeUnit', roi:'modeRoi', plan:'modePlan'};
  const btn = {dash:'mbDash', progress:'mbProgress', boq:'mbBoq', vendor:'mbVendor', unit:'mbUnit', roi:'mbRoi', plan:'mbPlan'};
  Object.keys(map).forEach(k=>{
    $(map[k]).style.display = (k===m) ? '' : 'none';
    $(btn[k]).classList.toggle('on', k===m);
  });
  if(m==='progress'){ render(); }
  else {
    $('fabAdd').style.display='none';
    if(m==='boq') bqRender();
    else if(m==='vendor') renderVendorMode();
    else if(m==='unit') renderUnitMode();
    else if(m==='roi') renderRoiMode();
    else if(m==='plan'){
      renderPlanPicker();
      const cat = visibleVillages().map(v=>{
        const jb = B.jobs.find(j=>j.villageId===v.id);
        const p  = jb && jb.poId ? poById(jb.poId) : null;
        return {
          name: v.name,
          contractor: v.contractor||'',
          vendor: v.contractor||'',
          po: p ? (p.code||p.name||'') : '',
          closed: !!v.closed,
          houses: (v.houses||[]).map(h=>({addr:h.no, status:h.st||''}))
        };
      });
      try{ localStorage.setItem('plan-status-catalog', JSON.stringify(cat)); }catch(e){}
      const fr = $('planFrame');
      if(!fr.getAttribute('src')) fr.src = 'plan-status.html';
      else { try{ fr.contentWindow.postMessage({type:'ftth-catalog', data:cat}, '*'); }catch(e){} }
    }
    else renderDash();
  }
  window.scrollTo(0,0);
}

async function acctSetPassword(id){
  if(!requireAdmin('เปลี่ยนรหัสผ่าน')) return;
  const el = $('pw-'+id); const pw = el ? el.value.trim() : '';
  if(pw.length < 6){ toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัว'); return; }
  try{
    const { error } = await sb.rpc('admin_set_password', { target_id:id, new_password:pw });
    if(error) throw error;
    el.value=''; toast('เปลี่ยนรหัสผ่านแล้ว');
  }catch(e){ toast('เปลี่ยนรหัสไม่สำเร็จ: '+(e.message||'')); }
}
async function acctSetEmail(id, email){
  if(!requireAdmin('เปลี่ยนอีเมล')) return;
  email = email.trim(); if(!email){ toast('อีเมลว่างไม่ได้'); renderAccounts(); return; }
  try{
    const { error } = await sb.rpc('admin_set_email', { target_id:id, new_email:email });
    if(error) throw error;
    toast('เปลี่ยนอีเมลแล้ว'); renderAccounts();
  }catch(e){ toast('เปลี่ยนอีเมลไม่สำเร็จ: '+(e.message||'')); renderAccounts(); }
}
async function acctSetName(id, name){
  name = name.trim(); if(!name){ toast('ชื่อว่างไม่ได้'); renderAccounts(); return; }
  try{
    const { error } = await sb.from('vendors').update({ name }).eq('id', id);
    if(error) throw error;
    const lv = B.vendors.find(v=>v.cloudId===id || v.id===id);
    if(lv){ lv.name = name; bqPersist(); }
    toast('บันทึกชื่อแล้ว');
  }catch(e){ toast('บันทึกไม่สำเร็จ: '+(e.message||'')); }
}
async function acctDelete(id, name){
  if(!requireAdmin('ลบบัญชี')) return;
  if(!confirm('ลบบัญชี "'+name+'" ? ผู้ใช้นี้จะ login ไม่ได้อีก')) return;
  try{
    const { error } = await sb.rpc('admin_delete_account', { target_id:id });
    if(error) throw error;
    B.vendors = B.vendors.filter(v=>v.cloudId!==id && v.id!==id);
    bqPersist(); toast('ลบบัญชีแล้ว'); renderAccounts();
  }catch(e){ toast('ลบไม่สำเร็จ: '+(e.message||'')); }
}
function previewAsByName(nm){
  const v = B.vendors.find(x=>x.name.trim()===nm.trim());

  else toast('ยังไม่มีข้อมูลของ '+nm+' ในเครื่อง — กด ⬇️ ดึงข้อมูลล่าสุดก่อน');

function exportVendorPackageByName(nm){

function openVillagePeek(id){
  const v = state.villages.find(x=>x.id===id); if(!v) return;
  const si = staleInfo(v), u = unitStats(v);
  const need = targetHomes(v), done = +v.homesDone||0;
  const b = villageBudget(v), c = villageCost(v);
  const jj = villageJobs(v).filter(j=> canViewAll() || j.vendorId===session.vendorId);
  const poNm = jj.length ? jobPOName(jj[0]) : '';
  const mm = portsMismatch(v);
  const cl = isClosed(v);

  let moveBox;
  if(cl){
    moveBox = `<div class="peek-box" style="background:#EAF7E4;border-color:#B9DCA8">
      <div class="peek-k">สถานะ</div>
      <div class="peek-v" style="color:var(--green-dark)">✔ ปิดโครงการแล้ว</div>
      <div class="peek-s">วันที่ปิด ${thDate(v.closedAt)}</div></div>`;
  } else if(si.level==='none'){
    moveBox = `<div class="peek-box">
      <div class="peek-k">เดินสายเพิ่มล่าสุด</div>
      <div class="peek-v" style="color:var(--muted)">ยังไม่มีประวัติ</div>
      <div class="peek-s">ระบบเริ่มเก็บเมื่อมีการเดินสายเพิ่มครั้งถัดไป</div></div>`;
  } else {
    const m = Math.floor(si.days/30);
    const col = si.level==='late' ? 'var(--red)' : (si.level==='warn' ? '#7A5200' : 'var(--green-dark)');
    const bg  = si.level==='late' ? '#FBEAEA' : (si.level==='warn' ? '#FDF0D8' : '#EAF7E4');
    const bd  = si.level==='late' ? '#E5A0A0' : (si.level==='warn' ? 'var(--amber)' : '#B9DCA8');
    const ic  = si.level==='late' ? '🔴' : (si.level==='warn' ? '🟡' : '🟢');
    moveBox = `<div class="peek-box" style="background:${bg};border-color:${bd}">
      <div class="peek-k">เดินสายเพิ่มล่าสุด</div>
      <div class="peek-v" style="color:${col}">${ic} ${thDate(si.date)}</div>
      <div class="peek-s" style="color:${col}">${si.days===0?'วันนี้':'ผ่านมาแล้ว '+si.days+' วัน'+(m?' (~'+m+' เดือน)':'')}</div></div>`;
  }

  $('peekBody').innerHTML = `
    <div class="peek-title">${cl?'✔ ':''}${esc(v.name)}</div>
    <div class="peek-sub">${esc(v.contractor||'ยังไม่ระบุผู้รับเหมา')}${poNm?' · PO '+esc(poNm):''}</div>
    ${moveBox}
    <div class="peek-grid">
      <div class="peek-box"><div class="peek-k">ความคืบหน้า</div><div class="peek-v">${overall(v)}%</div>
        <div class="peek-s">${u.total?('พร้อม ONU '+u.done+'/'+u.total+' หลัง'):'คิดจากขั้นตอนงาน'}</div></div>
      <div class="peek-box"><div class="peek-k">เดินสาย</div><div class="peek-v">${fmt(done)}<span style="font-size:14px;color:var(--muted)">/${fmt(need)}</span></div>
        <div class="peek-s">${need-done>0?('คงเหลือ '+fmt(need-done)+' หลัง'):'ครบแล้ว'}</div></div>
      ${b?`<div class="peek-box"><div class="peek-k">งบโครงการ</div><div class="peek-v">${fmt(b)}</div>
        <div class="peek-s">ใช้ไป ${fmt(c)} · เหลือ ${fmt(b-c)}</div></div>`:''}
      <div class="peek-box"><div class="peek-k">กำหนดส่งมอบ</div><div class="peek-v" style="font-size:17px">${v.end?thDate(v.end):'-'}</div>
        <div class="peek-s">${v.start?'เริ่ม '+thDate(v.start):''}</div></div>
    </div>
    ${mm?`<div class="peek-note">⚠ ${mm.type==='noports'
      ? 'ยังไม่ได้กรอกจำนวนพอร์ต — ระบบใช้จำนวนหลังจาก Unit ('+mm.unit+' หลัง)'
      : 'พอร์ตที่กรอก '+mm.ports+' · ข้อมูลรายหลัง '+mm.unit+' หลัง'}</div>`:''}
    ${v.issue?`<div class="peek-note">📌 ${esc(v.issue)}</div>`:''}`;
  $('peekOpen').setAttribute('onclick', "closePeek(); gotoVillage('"+v.id+"')");
  $('peekModal').classList.add('open');
}

const UNIT_STATUSES = ['','พร้อมติดตั้ง ONU','บ้านยังไม่พร้อมร้อยสาย','ท่อ Main ตัน','บ่อพักไม่พร้อมร้อยสาย','ท่อภายในบ่อพักไปตู้ Post ตัน','ท่อภายในบ้านตัน','อยู่ระหว่างการเดินสาย Main Fiber','อยู่ระหว่างการเดินสาย Drop Fiber เข้าบ้าน','อยู่ระหว่างการ Terminate ปล่อยสัญญาณ','ปล่อยสัญญาณที่ตู้ Post','สายที่โครงการร้อยไว้ขาด','โครงการไม่ได้ร้อยสาย','ลูกค้าไม่สนใจ ไม่ให้ร้อยสาย'];

const UNIT_HEADS  = ['บ้านเลขที่','สถานะ','Sub-Contract Underground','Solution','Estimate','Lat','Long','ชื่อลูกค้า','เบอร์โทร','สนใจ/ไม่สนใจ','Detail'];

let uSel = null, uDragging = false;
function unitVillage(){ return state.villages.find(v=>v.id===ui.unitVil); }
function uRange(){
  if(!uSel) return null;
  return { r1:Math.min(uSel.ar,uSel.fr), r2:Math.max(uSel.ar,uSel.fr),
           c1:Math.min(uSel.ac,uSel.fc), c2:Math.max(uSel.ac,uSel.fc) };
}
function uPaint(){
  const g = document.getElementById('ugridBody'); if(!g) return;
  g.querySelectorAll('td.ucell').forEach(td=>td.classList.remove('sel','anchor'));
  const R = uRange(); if(!R) return;
  for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++){
    const td = g.querySelector('td.ucell[data-r="'+r+'"][data-c="'+c+'"]');
    if(td) td.classList.add('sel');
  }
  const a = g.querySelector('td.ucell[data-r="'+uSel.ar+'"][data-c="'+uSel.ac+'"]');
  if(a) a.classList.add('anchor');
  const n = (R.r2-R.r1+1)*(R.c2-R.c1+1);
  const lab = document.getElementById('uSelInfo');
  if(lab) lab.textContent = n>1 ? ('เลือก '+n+' ช่อง · Delete=ล้าง · Ctrl+C=คัดลอก') : '';
}
function uCellDown(ev, r, c){
  if(ev.shiftKey && uSel){ uSel.fr=r; uSel.fc=c; }
  else { uSel = {ar:r, ac:c, fr:r, fc:c}; uDragging = true; }
  uPaint();
}
function uCellEnter(r, c){ if(!uDragging || !uSel) return; uSel.fr=r; uSel.fc=c; uPaint(); }
document.addEventListener('mouseup', ()=>{ uDragging=false; });

function unitOptsHTML(vil){
  const q = (ui.unitQ||'').trim().toLowerCase();
  let list = vil.filter(x=> matchVendor(x, ui.unitVendor) && matchPO(x, ui.unitPO));
  if(q) list = list.filter(x=> String(x.name||'').toLowerCase().includes(q) || String(x.contractor||'').toLowerCase().includes(q));
  if(!list.length) list = vil.filter(x=> matchVendor(x, ui.unitVendor) && matchPO(x, ui.unitPO));
  if(!list.length) list = vil;
  return sortVillages(list).map(x=>`<option value="${x.id}" ${x.id===ui.unitVil?'selected':''}>${isClosed(x)?'✔ ':''}${esc(x.name)} (${(x.houses||[]).length})</option>`).join('');
}
function setUnitVendorFilter(vid){
  ui.unitVendor = vid; ui.unitPO = null;
  unitJumpFirst();
}
function setUnitPOFilter(pid){
  ui.unitPO = pid;

}
function unitJumpFirst(){
  const pool = visibleVillages().filter(x=> matchVendor(x, ui.unitVendor) && matchPO(x, ui.unitPO));

function unitFilterVillages(q){
  ui.unitQ = q;
  const vil = visibleVillages();
  const sel = $('unitSelect'); if(!sel) return;
  sel.innerHTML = unitOptsHTML(vil);
  const qq = (q||'').trim().toLowerCase();
  const pool = vil.filter(x=> matchVendor(x, ui.unitVendor) && matchPO(x, ui.unitPO));
  const matched = qq ? pool.filter(x=> String(x.name||'').toLowerCase().includes(qq) || String(x.contractor||'').toLowerCase().includes(qq)) : pool;
  const lab = $('unitMatch');
  if(lab) lab.textContent = qq ? ('พบ '+matched.length+' หมู่บ้าน · Enter เพื่อเลือกอันแรก') : '';

function unitRow(v, h, i){
  const done = h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'');
  const cell = (c, inner, extraCls)=>
    `<td class="ucell ${extraCls||''}" data-r="${i}" data-c="${c}" onmousedown="uCellDown(event,${i},${c})" onmouseenter="uCellEnter(${i},${c})">${inner}</td>`;
  const inp = (c, val, w)=> cell(c, `<input value="${esc(val==null?'':val)}" ${w?`style="width:${w}px"`:''} onchange="unitSet(${i},'${UNIT_FIELDS[c]}',this.value)" onkeydown="uKeyNav(event,${i},${c})">`);
  const isDup = (window._uDupSet && window._uDupSet.has(i));
  /* ใช้ตัวเลือกที่สร้างไว้แล้ว แค่ย้ายเครื่องหมาย selected — เร็วกว่าสร้างใหม่ทุกแถวมาก */
  const curSt = h.st || '';
  const stOpts = (window._stOptsCache || '').replace('value="'+curSt.replace(/"/g,'&quot;')+'"',
                                                     'value="'+curSt.replace(/"/g,'&quot;')+'" selected');
  const subCur = h.sub||'';
  const subOpts = (window._subOptsCache || '') +
    (subCur ? ((window._subNamesCache||[]).indexOf(subCur)>=0
        ? '' : `<option value="${esc(subCur)}" selected>${esc(subCur)}</option>`) : '');
  return `<tr class="${isDup?'dup-row':''}">
    <td class="rownum">${i+1}${isDup?'<span class="dup-flag" title="บ้านเลขที่ซ้ำกับแถวอื่น">!</span>':''}</td>
    ${inp(0, h.no)}
    ${cell(1, `<select onchange="unitSet(${i},'st',this.value)">${stOpts}</select>`, done?'ustat-done':'')}
    ${cell(2, `<select onchange="unitSet(${i},'sub',this.value)" title="ผู้รับเหมาที่ทำงานหลังนี้ · เว้นว่าง = ใช้ Vendor ของหมู่บ้าน" ${subCur?'':'style="color:var(--muted)"'}>${subCur? subOpts.replace('value="'+subCur.replace(/"/g,'&quot;')+'"','value="'+subCur.replace(/"/g,'&quot;')+'" selected') : subOpts}</select>`)}
    ${inp(3, h.sol)}
    ${inp(4, h.est)}
    ${inp(5, h.lat, 74)}
    ${inp(6, h.lng, 74)}
    ${inp(7, h.name)}
    ${inp(8, h.phone)}
    ${inp(9, h.interest)}
    ${inp(10, h.detail)}
    <td class="del"><button onclick="unitDel(${i})" title="ลบแถวนี้">✕</button></td>
  </tr>`;
}

/* เติม Sub-Contract ทุกหลังในหมู่บ้านนี้จาก Vendor ที่ทำงานจริง */
function fillSubFromVendor(){
  const v = unitVillage(); if(!v) return;

function unitRecount(v){

function unitSave(v){

  markMoved(v);                 /* ลงข้อมูลในหน้า Unit = มีความเคลื่อนไหว */

}
function unitSet(i, key, val){
  const v = unitVillage(); if(!v || !v.houses || !v.houses[i]) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); renderUnitMode(); return; }
  if(key === 'no'){
    const d = dupRowIndex(v, val, i);
    if(d >= 0){
      toast('⚠ บ้านเลขที่ ' + String(val).trim() + ' มีอยู่แล้วในแถวที่ ' + (d+1) + ' — ห้ามซ้ำ');
      renderUnitMode();
      setTimeout(()=>{ const el=document.querySelector('#ugridBody tr:nth-child('+(d+1)+')'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'center'}); }, 60);
      return;
    }
  }
  if(key === 'no'){
    const d = dupRowIndex(v, val, i);
    if(d >= 0){
      toast('⚠ บ้านเลขที่ "' + String(val).trim() + '" มีอยู่แล้วที่แถว ' + (d+1) + ' — ห้ามซ้ำ');
      renderUnitMode();
      setTimeout(()=>{ const el=document.querySelector('#ugridBody tr:nth-child('+(d+1)+')'); if(el) el.scrollIntoView({block:'center'}); }, 60);
      return;
    }
  }
  v.houses[i][key] = val;
  unitRecount(v); unitSave(v);
  if(key==='st'){
    const td = document.querySelector('#ugridBody td.ucell[data-r="'+i+'"][data-c="1"]');
    if(td) td.classList.toggle('ustat-done', val==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(val||''));
  }
}
function unitAddRows(n){

  for(let k=0;k<n;k++) v.houses.push({no:'',st:'',sol:'',est:'',lat:'',lng:'',name:'',phone:'',interest:'',detail:''});

}
function unitDel(i){
  const v = unitVillage(); if(!v) return;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return; }

  unitRecount(v); unitSave(v); uSel=null; renderUnitMode();
}

function uKeyNav(ev, r, c){
  const k = ev.key;
  let nr=r, nc=c;
  if(k==='ArrowDown' || k==='Enter') nr=r+1;
  else if(k==='ArrowUp') nr=r-1;
  else if(k==='Tab'){ nc = ev.shiftKey ? c-1 : c+1; }
  else return;
  ev.preventDefault();
  const v = unitVillage(); if(!v) return;
  if(nc<0){ nc=UNIT_FIELDS.length-1; nr--; }
  if(nc>=UNIT_FIELDS.length){ nc=0; nr++; }
  if(nr<0) nr=0;
  if(nr>=v.houses.length){ if(k==='Enter'||k==='ArrowDown'||k==='Tab'){ unitAddRows(1); } else nr=v.houses.length-1; }
  uSel={ar:nr,ac:nc,fr:nr,fc:nc}; uPaint();
  const td = document.querySelector('#ugridBody td.ucell[data-r="'+nr+'"][data-c="'+nc+'"]');
  const fEl = td && td.querySelector('input,select'); if(fEl){ fEl.focus(); if(fEl.select) fEl.select(); }
}
function uClearSelected(){
  const v = unitVillage(); const R = uRange(); if(!v || !R) return 0;
  let n=0;
  for(let r=R.r1;r<=R.r2;r++){
    if(!v.houses[r]) continue;
    for(let c=R.c1;c<=R.c2;c++){ v.houses[r][UNIT_FIELDS[c]] = ''; n++; }
  }
  unitRecount(v); unitSave(v); renderUnitMode();
  return n;
}
function uCopySelected(){
  const v = unitVillage(); const R = uRange(); if(!v || !R) return '';
  const out=[];
  for(let r=R.r1;r<=R.r2;r++){
    const row=[];
    for(let c=R.c1;c<=R.c2;c++) row.push(v.houses[r] ? (v.houses[r][UNIT_FIELDS[c]]||'') : '');
    out.push(row.join(String.fromCharCode(9)));
  }
  return out.join(String.fromCharCode(10));
}
function normStatus(str){
  str = String(str||'').trim();
  if(!str) return '';
  const exact = UNIT_STATUSES.find(x=> x && x===str);
  if(exact) return exact;
  const loose = UNIT_STATUSES.find(x=> x && (x.indexOf(str)>=0 || str.indexOf(x)>=0));
  return loose || str;
}
function uPasteText(txt, r0, c0){
  window._pasteDupWarn = null;
  const v = unitVillage(); if(!v || !txt) return 0;
  if(isClosed(v)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); return 0; }
  v.houses = v.houses || [];
  const NL = String.fromCharCode(10), TAB = String.fromCharCode(9);
  let rows = txt.split(NL).map(function(x){ return x.replace(String.fromCharCode(13),''); });
  while(rows.length && rows[rows.length-1].trim()==='') rows.pop();
  if(!rows.length) return 0;
  const skipped = [];
  let applied = 0;
  rows.forEach(function(line, ri){
    const cells = line.split(TAB);
    const R = r0 + ri;
    /* ถ้าคอลัมน์ที่วางครอบคลุม "บ้านเลขที่" ให้ตรวจซ้ำก่อน */
    if(c0 === 0){
      const noVal = String(cells[0]==null?'':cells[0]).trim();
      if(noVal && /\d/.test(noVal) && dupRowIndex(v, noVal, R) >= 0){
        skipped.push(noVal);
        return;                       /* ข้ามแถวนี้ ไม่เขียนทับ */
      }
    }
    while(v.houses.length <= R) v.houses.push({no:'',st:'',sol:'',est:'',lat:'',lng:'',name:'',phone:'',interest:'',detail:''});
    cells.forEach(function(val, ci){
      const C = c0 + ci;
      if(C >= UNIT_FIELDS.length) return;
      const key = UNIT_FIELDS[C];
      val = String(val).trim();
      v.houses[R][key] = (key==='st') ? normStatus(val) : val;
    });
    applied++;
  });
  unitRecount(v); unitSave(v); renderUnitMode();
  if(skipped.length){
    const ex = skipped.slice(0,5).join(', ') + (skipped.length>5 ? ' …' : '');
    toast('⚠ ข้าม ' + skipped.length + ' แถวที่บ้านเลขที่ซ้ำ (' + ex + ') · วางสำเร็จ ' + applied + ' แถว');
  }
  return applied;
}
document.addEventListener('keydown', function(ev){
  const md = document.getElementById('modeUnit');
  if(!md || md.style.display==='none' || !uSel) return;
  const R = uRange(); if(!R) return;
  const multi = (R.r2-R.r1)>0 || (R.c2-R.c1)>0;
  const tag = (ev.target.tagName||'').toLowerCase();
  if(ev.key==='Delete' || ev.key==='Backspace'){
    if(multi || tag==='td' || tag==='select'){
      ev.preventDefault();
      const n = uClearSelected();
      toast('ล้าง '+n+' ช่องแล้ว');
    }
    return;
  }
  if((ev.ctrlKey||ev.metaKey) && (ev.key==='c'||ev.key==='C') && multi){
    const txt = uCopySelected();
    if(txt && navigator.clipboard) navigator.clipboard.writeText(txt);
    toast('คัดลอกแล้ว วางใน Excel ได้เลย');
    ev.preventDefault();
  }
});
document.addEventListener('paste', function(ev){
  const md = document.getElementById('modeUnit');
  if(!md || md.style.display==='none' || !uSel) return;
  const txt = (ev.clipboardData || window.clipboardData).getData('text');
  const TAB = String.fromCharCode(9), NL = String.fromCharCode(10);
  if(!txt || (txt.indexOf(TAB)<0 && txt.indexOf(NL)<0)) return;
  ev.preventDefault();
  const R = uRange();
  const n = uPasteText(txt, R.r1, R.c1);
  toast('วาง '+n+' แถวลงตารางแล้ว');
});

function unitImportExcel(ev){
  const f = ev.target.files[0]; if(!f) return;
  const v = unitVillage();
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sn = wb.SheetNames.find(x=>x==='Unit') || wb.SheetNames[0];
      const ua = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''});
      if(!ua.length){ toast('ไม่พบข้อมูลในไฟล์'); return; }
      const uh = (ua[0]||[]).map(x=>String(x).toLowerCase());
      const col = (...keys)=>{ for(const key of keys){ const i=uh.findIndex(h=>h.includes(key)); if(i>=0) return i; } return -1; };
      const cVil=col('โครงการ'), cNo=col('บ้านเลขที่','address'), cLat=col('lat'), cLng=col('lot','lng','long'),
            cSt=col('status','สถานะ'), cSol=col('solution'), cEst=col('estimate'), cDet=col('detail'),
            cName=col('name','ชื่อ'), cPhone=col('phone','เบอร์'), cInt=col('สนใจ','interest'), cSub=col('sub-contract','subcontract','ผู้รับเหมาย่อย');
      const grouped = {};
      for(let r=1;r<ua.length;r++){
        const row = ua[r];
        const vname = cVil>=0 ? String(row[cVil]||'').trim() : (v? v.name : '');
        if(!vname) continue;
        (grouped[vname]=grouped[vname]||[]).push({
          no: cNo>=0?String(row[cNo]||'').trim():'', st: cSt>=0?normStatus(String(row[cSt]||'')):'',
          lat: cLat>=0?(row[cLat]||''):'', lng: cLng>=0?(row[cLng]||''):'',
          sol: cSol>=0?String(row[cSol]||''):'', est: cEst>=0?String(row[cEst]||''):'',
          detail: cDet>=0?String(row[cDet]||''):'', name: cName>=0?String(row[cName]||''):'',
          phone: cPhone>=0?String(row[cPhone]||''):'', interest: cInt>=0?String(row[cInt]||''):'', sub: cSub>=0?String(row[cSub]||''):''
        });
      }
      let updated=0, created=0, skipped=0, uDup=0;
      const mine = new Set(visibleVillages().map(x=>normName(x.name)));
      Object.keys(grouped).forEach(vn=>{
        let tv = findVillageByName(vn);
        if(tv) markMoved(tv);
        if(!isAdmin()){
          // ผรม.: อัปเดตได้เฉพาะหมู่บ้านของตัวเอง และสร้างหมู่บ้านใหม่ไม่ได้
          if(!tv || !mine.has(normName(vn))){ skipped++; return; }
          updated++;
        } else if(!tv){
          tv = {id:uid(), name:vn, contractor:'', vendorId:null, ports:'', homesDone:0, start:'', end:'', issue:'',
                tasks:TEMPLATE.map(t=>({id:uid(),name:t.name,w:t.w,p:0,note:''})), houses:[]};
          state.villages.push(tv);
          B.jobs.push({id:uid(), name:vn, villageId:tv.id, vendorId:'', budget:'', qty:{}, bqty:{}, prices:{}, date:todayISO()});
          created++;
        } else updated++;
        const _rawU = grouped[vn];
        tv.houses = dedupeHouses(_rawU);
        if(_rawU.length !== tv.houses.length) uDup += (_rawU.length - tv.houses.length);
        tv._hDirty = true;
        tv.homesDone = tv.houses.filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
        if(cloudOn) cloudSaveHouses(tv);
      });
      persist(); bqPersist();
      renderUnitMode();
      toast('นำเข้าสำเร็จ: อัปเดต '+updated+(isAdmin()? ' · ใหม่ '+created : '')+' โครงการ'
            + (skipped? ' · ข้าม '+skipped+' โครงการที่ไม่ใช่ของคุณ' : '')
            + (uDup? ' · ตัดเลขที่ซ้ำ '+uDup+' แถว' : ''));
    }catch(err){ toast('อ่านไฟล์ไม่สำเร็จ'); }
  };
  rd.readAsArrayBuffer(f);
  ev.target.value = '';
}

/* timer แยกรายหมู่บ้าน — สลับหมู่บ้านแล้วงานที่ค้างต้องไม่หาย */
const unitSaveTimers = {};
function cloudSaveHouses(v){
  if(!v) return;
  v._hDirty = true;               /* ทำเครื่องหมายไว้ · ส่งขึ้นระบบเมื่อกดปุ่มบันทึก */
  markUnsaved();
}
/* ส่งข้อมูลรายหลังของหมู่บ้านเดียวขึ้น cloud */
async function pushHouses(v){
  if(!cloudOn || !cloudUser || !v) return false;
  if(!v.cloudId){                          /* ยังไม่เคยขึ้น cloud → สร้างแถวหมู่บ้านก่อน */
    try{
      const row = { name:v.name, contractor:v.contractor||'', vendor_id:vendorCloudId(v.vendorId),
                    ports:String(v.ports||''), homes_done:+v.homesDone||0,
                    start_date:v.start||'', end_date:v.end||'', issue:v.issue||'', tasks:jTasks(v),
                    updated_at:new Date().toISOString() };
      const r = await sb.from('villages').upsert(row).select('id').single();
      if(r.data) v.cloudId = r.data.id; else return false;
      persistLocalOnly();
    }catch(e){ return false; }
  }
  try{
    /* ลบของเดิม — ถ้า error ให้หยุด (กันข้อมูลซ้ำ) · ไม่ต้อง query นับซ้ำ ประหยัด 1 รอบ/หมู่บ้าน */
    const del = await sb.from('houses').delete().eq('village_id', v.cloudId);
    if(del && del.error){
      toast('ลบข้อมูลเก่าบนระบบไม่สำเร็จ — ยังไม่บันทึกทับ เพื่อกันข้อมูลซ้ำ');
      return false;
    }
    const rows = dedupeHouses(v.houses||[]).filter(h=>h.no||h.st||h.name).map(h=>({
      village_id:v.cloudId, no:h.no||'', status:h.st||'', lat:(+h.lat||null), lng:(+h.lng||null),
      solution:h.sol||'', estimate:h.est||'', detail:h.detail||'', cust_name:h.name||'',
      cust_phone:h.phone||'', interest:h.interest||'', sub_contract:h.sub||'' }));
    const chunks = [];
    for(let i=0;i<rows.length;i+=1000) chunks.push(rows.slice(i,i+1000));
    /* ส่งข้อมูลหลัง + อัปเดตยอดพร้อมกันในรอบเดียว */
    await Promise.all(chunks.map(c=> sb.from('houses').insert(c))
      .concat([ sb.from('villages').update({ homes_done:+v.homesDone||0 }).eq('id', v.cloudId) ]));
    delete v._hDirty; delete v._dirty;
    persistLocalOnly();
    refreshSaveBtn();
    return true;
  }catch(e){ return false; }
}
/* บันทึกทุกหมู่บ้านที่ยังค้างอยู่ (ใช้ตอนกดปุ่มบันทึก / ก่อนปิดหน้า) */
async function flushPendingHouses(){
  Object.keys(unitSaveTimers).forEach(k=>clearTimeout(unitSaveTimers[k]));
  const pend = state.villages.filter(v=>v._hDirty);
  const dot0 = document.getElementById('syncDot');
  let doneN = 0;
  const tick = ()=>{ if(dot0 && pend.length>1) dot0.textContent = '⏳ '+(++doneN)+'/'+pend.length; };
  /* ส่งหลายหมู่บ้านพร้อมกัน ครั้งละ 3 (เร็วขึ้นแต่ไม่ถล่มเซิร์ฟเวอร์) */
  for(let i=0;i<pend.length;i+=6){
    await Promise.all(pend.slice(i,i+6).map(v=>pushHouses(v).then(r=>{ tick(); return r; })));
  }
  return pend.length;
}

/* ===== ซ่อมข้อมูลที่คอลัมน์เลื่อนอัตโนมัติ (ช่องพอร์ตได้เลข PO มา) ===== */
function autoFixShifted(){
  const bad = (state.villages||[]).filter(v=>{
    const p = String(v.ports==null?'':v.ports).trim();
    return /^\d+$/.test(p) && +p >= 100000;
  });
  if(!bad.length) return 0;
  bad.forEach(v=>{
    const poNumber = String(v.ports).trim();
    v.ports = v.homesDone || '';
    v.homesDone = (v.houses||[]).filter(h=> h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')).length;
    let p = (B.pos||[]).find(x=>String(x.code).trim()===poNumber);
    if(!p){ B.pos = B.pos||[]; p = {id:uid(), code:poNumber, name:'', amount:0}; B.pos.push(p); }
    const jb = B.jobs.find(j=>j.villageId===v.id);
    if(jb && !jb.poId) jb.poId = p.id;
  });
  persist(); bqPersist();
  return bad.length;
}


/* ===== กราฟความเคลื่อนไหวรายเดือน ===== */
/* กราฟแยกตามสิทธิ์: admin ไม่กรอง = ภาพรวมทั้งหมด · กรอง Vendor หรือ login เป็นผรม. = ของรายนั้น */
function trendKey(){
  if(!canViewAll()) return session.vendorId || '_none';
  return ui.dashVendor ? ui.dashVendor : '_all';
}
function trendScopeName(){
  const k = trendKey();
  if(k === '_all') return 'ภาพรวมทั้งหมด';

  return v ? v.name : 'ของคุณ';
}
function trendList(){
  B.trends = B.trends || {};
  const k = trendKey();
  if(!B.trends[k]) B.trends[k] = [];
  return B.trends[k];
}
function trendRows(){ return trendList().slice(); }
function trendAutoNow(vil){
  return { total: vil.reduce((s,v)=>s+(+v.ports||0),0), done: vil.reduce((s,v)=>s+(+v.homesDone||0),0) };
}
function trendChartHTML(vil){

      ${isAdmin()?`<div class="data-row"><button class="btn btn-green btn-sm" onclick="trendSyncNow()">＋ เริ่มบันทึกเดือนแรกจากข้อมูลจริง</button></div>`:''}

  const W = 900, H = 320, PL = 54, PR = 16, PT = 26, PB = 42;

  const top = Math.ceil(maxV/1000)*1000 + 1000;
  const x = i => PL + (W-PL-PR) * (rows.length>1 ? i/(rows.length-1) : .5);
  const y = v => PT + (H-PT-PB) * (1 - (v/top));
  const lineT = rows.map((r,i)=>`${x(i)},${y(+r.total||0)}`).join(' ');

            <text x="${PL-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8A9690">${Math.round(v)}</text>`;
