<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AIS Fibre · Village Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- supabase ต้องพร้อมก่อน (ใช้ตอน login) · ตัวอื่นโหลดทีหลังได้ ไม่บล็อกหน้าจอ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --amber-dk:#B57A00;
    --green:#78BE20; --green-dark:#5A9417; --forest:#0F3D24; --forest2:#14532D;
    --tint:#F0F7E8; --paper:#FFFFFF; --ink:#1B2A20; --muted:#5C6B60;
    --amber:#F5A623; --line:#DCE8D2; --red:#D64545;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Sarabun',system-ui,sans-serif; background:var(--tint); color:var(--ink);
    min-height:100vh; font-size:15px;
  }
  h1,h2,h3,.display{font-family:'Taviraj',serif;}

  /* ===== Header ===== */
  header{
    background:linear-gradient(135deg,var(--forest) 0%,var(--forest2) 70%);
    color:#fff; padding:18px 16px 20px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;background:var(--green);
    display:flex;align-items:center;justify-content:center;
    font-family:'Taviraj',serif;font-weight:700;font-size:20px;color:var(--forest);
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .brand h1{font-size:20px;font-weight:600;line-height:1.15;}
  .brand small{display:block;font-family:'Sarabun',sans-serif;font-weight:400;font-size:12px;opacity:.75;letter-spacing:.4px;}
  .header-stats{display:flex;gap:8px;margin-top:14px;}
  .hstat{
    flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:8px 10px;
  }
  .hstat b{font-size:20px;font-family:'Taviraj',serif;color:var(--green);display:block;line-height:1.1;}
  .hstat span{font-size:11px;opacity:.8;}

  main{max-width:760px;margin:0 auto;padding:14px 12px 90px;}

  /* ===== Village cards ===== */
  .vcard{
    background:var(--paper);border-radius:var(--radius);padding:14px;margin-bottom:12px;
    border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,61,36,.06);cursor:pointer;
    transition:box-shadow .15s;
  }
  .vcard:active{box-shadow:0 0 0 2px var(--green);}
  .vcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .vcard h3{font-size:17px;font-weight:600;}
  .vcard .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .chip{
    font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;
  }
  .chip.done{background:#E4F3D2;color:var(--green-dark);}
  .chip.doing{background:#FDF0D8;color:#A86E08;}
  .chip.idle{background:#EDEFEA;color:var(--muted);}
  .bar{height:9px;background:#E9EFE3;border-radius:99px;margin-top:12px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#9BD84A);transition:width .3s;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .bar-row .bar{flex:1;margin-top:0;}
  .pct{font-family:'Taviraj',serif;font-weight:700;font-size:19px;color:var(--forest);min-width:52px;text-align:right;}

  /* ===== Buttons ===== */
  .btn{
    font-family:'Sarabun',sans-serif;font-size:14px;font-weight:600;border:none;border-radius:10px;
    padding:10px 16px;cursor:pointer;transition:filter .12s;
  }
  .btn:active{filter:brightness(.92);}
  .btn-green{background:var(--green);color:var(--forest);}
  .btn-lime{background:#DCEFC4;color:var(--forest);border:1.5px solid var(--green);}
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px;}
  .btn-grid .btn{padding:12px 10px;font-size:13.5px;line-height:1.35;}
  @media(max-width:480px){ .btn-grid{grid-template-columns:1fr;} }
  .btn-dark{background:var(--forest);color:#fff;}
  .btn-ghost{background:transparent;color:var(--forest);border:1.5px solid var(--line);}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn-red{background:#FBEAEA;color:var(--red);}

  .fab{
    position:fixed;bottom:18px;right:16px;z-index:30;
    box-shadow:0 4px 14px rgba(15,61,36,.35);font-size:15px;padding:13px 20px;border-radius:99px;
  }

  /* ===== Detail view ===== */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .back{background:none;border:none;font-size:22px;cursor:pointer;color:var(--forest);padding:4px 8px;}
  .section-label{
    font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--green-dark);
    text-transform:uppercase;margin:18px 0 8px;
  }
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .field input,.field textarea,.field select{
    width:100%;font-family:'Sarabun',sans-serif;font-size:15px;padding:9px 11px;
    border:1.5px solid var(--line);border-radius:9px;background:#FBFDF8;color:var(--ink);
  }
  .field input:focus,.field textarea:focus{outline:2px solid var(--green);border-color:transparent;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ===== Task rows ===== */
  .task{
    border-bottom:1px dashed var(--line);padding:12px 0;
  }
  .task:last-child{border-bottom:none;}
  .task-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .task-name{font-weight:600;font-size:14.5px;flex:1;}
  .task-name input{
    width:100%;border:none;background:transparent;font:inherit;color:inherit;padding:2px 0;
  }
  .task-name input:focus{outline:none;border-bottom:1.5px solid var(--green);}
  .task-pct{font-family:'Taviraj',serif;font-weight:700;font-size:16px;min-width:44px;text-align:right;}
  .task-pct.p100{color:var(--green-dark);}
  .task-pct.p0{color:#B7C2BA;}
  .task-pct.pmid{color:var(--amber);}
  .qchips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .q{
    border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 0;width:46px;
    font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;
  }
  .q.on{background:var(--green);border-color:var(--green);color:var(--forest);}
  .task input[type=range]{width:100%;margin-top:8px;accent-color:var(--green);}
  .task-meta{display:flex;gap:8px;margin-top:8px;}
  .task-meta input{
    flex:1;font-family:'Sarabun',sans-serif;font-size:13px;padding:6px 9px;
    border:1.5px solid var(--line);border-radius:8px;background:#FBFDF8;
  }
  .task-meta .w{flex:0 0 84px;}
  .task-del{background:none;border:none;color:#C4CFC7;font-size:16px;cursor:pointer;padding:2px 6px;}
  .weight-warn{font-size:12.5px;color:var(--red);margin-top:8px;font-weight:600;}

  /* ===== LINE report card (signature) ===== */
  .report-wrap{margin-top:10px;}
  .report{
    background:linear-gradient(160deg,var(--forest) 0%,var(--forest2) 100%);
    color:#fff;border-radius:16px;padding:18px 16px;position:relative;overflow:hidden;
  }
  .report::after{
    content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(120,190,32,.28),transparent 70%);
  }
  .report .r-brand{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .report .r-dot{width:10px;height:10px;border-radius:50%;background:var(--green);}
  .report .r-brand span{font-size:12px;letter-spacing:1.6px;font-weight:700;opacity:.85;}
  .report h3{font-size:21px;font-weight:600;margin-bottom:2px;}
  .report .r-sub{font-size:12.5px;opacity:.7;margin-bottom:12px;}
  .report .r-big{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .report .r-big b{font-family:'Taviraj',serif;font-size:44px;font-weight:700;color:var(--green);line-height:1;}
  .report .r-big span{font-size:13px;opacity:.75;}
  .report .bar{background:rgba(255,255,255,.15);margin:8px 0 14px;}
  .r-task{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;}
  .r-task .ic{width:18px;text-align:center;}
  .r-task .nm{flex:1;opacity:.92;}
  .r-task .pv{font-weight:700;font-family:'Taviraj',serif;}
  .r-issue{
    margin-top:12px;background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.4);
    border-radius:10px;padding:8px 11px;font-size:13px;
  }
  .r-foot{margin-top:12px;font-size:11.5px;opacity:.6;display:flex;justify-content:space-between;}
  .report-actions{display:flex;gap:8px;margin-top:10px;}
  .report-actions .btn{flex:1;}

  /* ===== Gantt / ตารางแผนงาน ===== */
  .gantt{background:#fff;border-radius:12px;padding:14px 12px 12px;}
  .g-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-bottom:2px solid var(--forest);padding-bottom:8px;margin-bottom:12px;}
  .g-title{font-family:'Taviraj',serif;font-weight:600;font-size:16px;color:var(--forest);}
  .g-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .g-brand{font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:var(--green-dark);border:1.5px solid var(--green);border-radius:99px;padding:3px 9px;white-space:nowrap;}
  .g-axis{position:relative;height:18px;margin-bottom:4px;}
  .g-tick{position:absolute;top:0;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;}
  .g-body{position:relative;}
  .g-gridline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #DCE8D2;}
  .g-row{position:relative;padding:4px 0 9px;}
  .g-label{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px;}
  .g-label .g-dates{font-weight:500;color:var(--muted);font-size:11px;white-space:nowrap;}
  .g-track{height:20px;background:#F2F6EE;border-radius:6px;position:relative;}
  .g-bar{position:absolute;top:0;height:100%;background:#D8ECBC;border-radius:6px;overflow:hidden;min-width:8px;}
  .g-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-dark));}
  .g-bar.late i{background:linear-gradient(90deg,var(--amber),#D98C0A);}
  .g-today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--red);z-index:2;}
  .g-legend{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;}
  .g-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;}
  .g-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:20px 10px;}

  /* ===== Date steppers (ปรับวันแบบเร็ว) ===== */
  .dctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;}
  .dgroup{display:flex;align-items:center;gap:3px;background:#F6FAF1;border:1.5px solid var(--line);border-radius:9px;padding:3px 4px;}
  .dgroup label{font-size:11px;color:var(--muted);font-weight:700;padding:0 3px;}
  .dbtn{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:27px;height:27px;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;color:var(--forest);cursor:pointer;padding:0 3px;}
  .dbtn:active{background:var(--green);}
  .dval{font-size:12.5px;font-weight:700;color:var(--forest);min-width:54px;text-align:center;}
  .dend{font-size:11.5px;color:var(--muted);font-weight:600;}
  .chain-btn{border:1.5px dashed var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Sarabun',sans-serif;}
  .chain-btn:active{border-color:var(--green);color:var(--green-dark);}
  .shift-all{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600;}

  .vgroup{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;gap:8px;}
  .vgroup h2{font-size:15px;color:var(--forest);font-weight:600;}
  .vgroup span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .vgroup:first-child{margin-top:4px;}

  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
    background:var(--forest);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;
  }
  .toast.show{opacity:1;}

  .empty{
    text-align:center;padding:50px 20px;color:var(--muted);
  }
  .empty .display{font-size:19px;color:var(--forest);margin-bottom:6px;}

  /* modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(15,61,36,.45);display:none;
    align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:#fff;border-radius:18px 18px 0 0;padding:18px 16px 24px;width:100%;max-width:760px;
    max-height:88vh;overflow:auto;
  }
  .modal h2{font-size:19px;margin-bottom:14px;color:var(--forest);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .btn{flex:1;}

  .data-row{display:flex;gap:8px;margin-top:10px;}
  .data-row .btn{flex:1;}
  @media(min-width:600px){
    .modal-bg{align-items:center;}
    .modal{border-radius:18px;}
  }
  @media(prefers-reduced-motion:reduce){ *{transition:none!important;} }


  /* ===== Unit editor (Excel-like) ===== */
  .ugrid-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;}
  table.ugrid{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px;}
  table.ugrid th{background:var(--forest);color:#fff;padding:7px 6px;text-align:left;position:sticky;top:0;white-space:nowrap;font-weight:600;font-size:11.5px;}
  table.ugrid td{border:1px solid var(--line);padding:0;}
  table.ugrid td input,table.ugrid td select{width:100%;border:none;background:transparent;font-family:'Sarabun',sans-serif;font-size:12.5px;padding:6px 6px;color:var(--ink);}
  table.ugrid td input:focus,table.ugrid td select:focus{outline:2px solid var(--green);background:#F7FBF1;}
  table.ugrid tr:nth-child(even) td{background:#FAFCF7;}
  table.ugrid td.rownum{background:#EEF4E6;text-align:center;color:var(--muted);font-weight:600;width:36px;padding:6px 4px;}
  table.ugrid td.del{width:34px;text-align:center;}
  /* ความกว้างขั้นต่ำรายคอลัมน์ — สถานะต้องอ่านออกทั้งข้อความ
     (1=# 2=รหัส 3=บ้านเลขที่ 4=สถานะ 5=Sub-Contract) */
  table.ugrid th:nth-child(3),table.ugrid td:nth-child(3){min-width:96px;}
  table.ugrid th:nth-child(4),table.ugrid td:nth-child(4){min-width:230px;}
  table.ugrid th:nth-child(5),table.ugrid td:nth-child(5){min-width:150px;}
  table.ugrid td select{text-overflow:ellipsis;}
  @media(max-width:700px){
    table.ugrid{min-width:1100px;}                 /* เลื่อนดูได้ ไม่บีบจนอ่านไม่ออก */
    table.ugrid th:nth-child(4),table.ugrid td:nth-child(4){min-width:210px;}
    #ugridBody select.st-cell{font-size:12px;padding:5px 4px;}
  }
  table.ugrid td.del button{border:none;background:none;color:#C4CFC7;cursor:pointer;font-size:14px;padding:4px;}
  table.ugrid td.del button:hover{color:var(--red);}
  .ustat-done{background:#E4F3D2 !important;}
  .unit-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .unit-count{font-size:12.5px;color:var(--muted);font-weight:600;}
  .sec-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px;}
  .sec-head-row .section-label{flex:1;min-width:0;}
  .sync-sec{margin-top:12px;background:#F7FBF1;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;}
  .sync-h{font-size:13.5px;font-weight:800;color:var(--forest);margin-bottom:3px;}
  .sync-note{font-size:12px;color:var(--muted);line-height:1.5;background:#FDF0D8;border:1px solid var(--amber);
    color:#7A5200;border-radius:8px;padding:7px 10px;margin:5px 0;}
  .sync-sec ul{margin:5px 0 0 18px;padding:0;font-size:12.5px;line-height:1.7;}
  .sync-steps{margin-top:12px;background:#EAF3DD;border:1.5px solid #B9DCA8;border-radius:11px;padding:10px 13px;}
  .sync-steps ol{margin:4px 0 0 18px;padding:0;font-size:12.5px;line-height:1.8;}
  .peek-title{font-size:18px;font-weight:800;color:var(--forest);line-height:1.3;}
  .peek-sub{font-size:13px;color:var(--muted);margin:2px 0 12px;font-weight:600;}
  .peek-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .peek-box{background:#F7FBF1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;}
  .peek-k{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.2px;}
  .peek-v{font-size:20px;font-weight:800;color:var(--forest);line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums;}
  .peek-s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .peek-note{margin-top:8px;background:#FDF0D8;border:1.5px solid var(--amber);color:#7A5200;
    border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.5;}
  @media(max-width:420px){ .peek-grid{grid-template-columns:1fr} }
  .dup-warn{display:inline-flex;align-items:center;background:#FBEAEA;border:1.5px solid #E5A0A0;color:#8A1F1F;
    border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:help;}
  tr.dup-row td{background:#FBEAEA!important;}
  tr.dup-row td input, tr.dup-row td select{border-color:#E5A0A0!important;}
  .dup-flag{display:inline-block;margin-left:4px;background:var(--red);color:#fff;border-radius:50%;
    width:15px;height:15px;line-height:15px;text-align:center;font-size:10px;font-weight:800;cursor:help;}
  .dup-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBEAEA;
    border:1.5px solid #E5A0A0;color:#8A1F1F;border-radius:11px;padding:9px 13px;margin:0 0 8px;font-size:13px;font-weight:700;}
  .irow.priceonly{background:#FFFBF0;}
  .need-qty{display:inline-block;background:var(--amber);color:#5A3E00;font-size:10px;font-weight:800;
    padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;}
  /* ===== ตารางรายหมู่บ้าน =====
     จอคอม: บีบให้พอดีจอ · มือถือ: คงความกว้างจริงแล้วเลื่อนดู (กันตัวเลขทับกัน) */
  /* ชื่อหมู่บ้าน · % · วันเดินสายล่าสุด — บรรทัดเดียว (จอแคบตัดขึ้นบรรทัดใหม่เอง) */
  #secVillageTbl td.vname .vline{display:flex;flex-wrap:wrap;align-items:center;column-gap:7px;row-gap:2px;line-height:1.3;}
  #secVillageTbl td.vname .vnm{font-weight:600;}
  #secVillageTbl td.vname .vpct{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;}

<script>
/* ================= Default underground task template ================= */
/* ================= Default task template: แผนทีม 9 ขั้นตอน ================= */
const TEMPLATE = [
  {name:'Presale (sale AIS)', w:5},
  {name:'ติดตั้งตู้ ภายในโครงการ', w:15},
  {name:'เชื่อมต่อสาย ภายในตู้ ในโครงการ', w:10},
  {name:'เดินสายชุมสายภายนอกเข้าตู้โครงการ', w:15},
  {name:'เทสสัญญาณ เตรียมพร้อมให้บริการในโครงการ', w:5},
  {name:'เดินสาย Fiber Main จากตู้โครงการ เชื่อมต่อหัวต่อในโครงการ', w:20},
  {name:'เดินสาย Fiber 1 Core จากหัวต่อเข้าบ้านลูกบ้านตามรีเควส', w:15},
  {name:'เทสค่าสัญญาณภายในบ้านลูกบ้าน พร้อมติดตั้งอินเทอร์เน็ต', w:5},
  {name:'สมัครและติดตั้งอินเทอร์เน็ตบ้านที่เทสแล้วเสร็จ', w:10},
];

let state = { villages: [] };
let currentId = null;


/* ================= Persistence ================= */
const LS_KEY = 'ftth-village-progress';

/* ==================================================================
   ☁️ CLOUD (Supabase) — ใส่ค่า 2 บรรทัดนี้เพื่อเปิดโหมด cloud
   ดูวิธีหาค่าในคู่มือ (Settings > API): Project URL และ anon public key
   ถ้าเว้นว่างไว้ = แอปทำงานแบบเดิม (เก็บในเครื่อง) ไม่พัง
================================================================== */
const SUPABASE_URL = 'https://fxlxmqrgczbpgjliquft.supabase.co';   // ✅ เชื่อม cloud แล้ว
/* ปิด cloud เมื่อไหร่ ให้ลบค่าใน 2 บรรทัดนี้ให้เหลือ '' */
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bHhtcXJnY3picGdqbGlxdWZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NTIxNjMsImV4cCI6MjEwMDMyODE2M30._Vd-qNcjfodT3a3CzbRegRZ0EC0KxmmCk6oTBWvsTSI';

let sb = null, cloudOn = false, cloudUser = null;
/* ไลบรารีที่โหลดทีหลัง — ตรวจก่อนใช้ ไม่ให้กดแล้วเงียบ */
function needLib(name, why){
  if(window[name]) return true;
  toast('ยังโหลดตัวช่วยไม่เสร็จ (' + name + ') — รอสักครู่แล้วลองใหม่' + (why? ' · '+why : ''));
  return false;
}
function initCloud(){
  if(SUPABASE_URL && SUPABASE_KEY && window.supabase){
    try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); cloudOn = true; }catch(e){ cloudOn=false; }
  }
}
function persist(){
  if(window._checkerMode) return;       /* หน้าตรวจสอบ: ห้ามเขียนทับข้อมูลในเครื่อง */
  try{ if(session && session.role) markUnsaved(); }catch(e){}
  try{ if(currentId){ const cv = state.villages.find(x=>x.id===currentId); if(cv) cv._dirty = true; } }catch(e){}
  saveStateLocal(JSON.stringify(state));
  cloudQueue();
}
/* ===== ที่เก็บข้อมูลในเครื่อง =====
   หลัก = IndexedDB (จุได้หลายร้อย MB) · สำรอง = localStorage (จุ ~5 MB — ข้อมูลใหญ่กว่านี้เก็บไม่ได้)
   เขียนทั้งคู่ · localStorage เต็ม = ลบสำเนาเก่าในนั้นทิ้ง (กันโหลดของเก่าขึ้นมา) แล้วใช้ IndexedDB อย่างเดียว
   เปิดหน้าใหม่ → ใช้ชุดที่ใหม่กว่า (เทียบเวลาที่บันทึก) */
const KV_DB = 'ftth-store', LS_T_KEY = 'ftth-state-t';
let _kvDbP = null;
function kvDb(){
  if(_kvDbP) return _kvDbP;
  _kvDbP = new Promise((res, rej)=>{
    try{
      const rq = indexedDB.open(KV_DB, 1);
      rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore('kv'); }catch(e){} };
      rq.onsuccess = ()=> res(rq.result); rq.onerror = ()=> rej(rq.error); rq.onblocked = ()=> rej(new Error('blocked'));
    }catch(e){ rej(e); }
  });
  _kvDbP.catch(()=>{ _kvDbP = null; });
  return _kvDbP;
}
function kvPut(key, val){
  return kvDb().then(db=> new Promise((res, rej)=>{
    const tx = db.transaction('kv', 'readwrite');
    if(val === undefined) tx.objectStore('kv').delete(key); else tx.objectStore('kv').put(val, key);
    tx.oncomplete = ()=> res(true); tx.onerror = ()=> rej(tx.error); tx.onabort = ()=> rej(tx.error);
  }));
}
function kvGet(key){
  return kvDb().then(db=> new Promise((res, rej)=>{
    const rq = db.transaction('kv').objectStore('kv').get(key);
    rq.onsuccess = ()=> res(rq.result); rq.onerror = ()=> rej(rq.error);
  }));
}
let _lsFull = false, _idbPending = null, _idbTimer = null, _idbOk = null;
function saveStateLocal(json){
  if(window._checkerMode) return;
  const t = Date.now();
  if(!_lsFull){
    try{ localStorage.setItem(LS_KEY, json); localStorage.setItem(LS_T_KEY, String(t)); }
    catch(e){ _lsFull = true; try{ localStorage.removeItem(LS_KEY); localStorage.setItem(LS_T_KEY, '0'); }catch(_){} }
  }
  /* IndexedDB: รวมการเขียนที่ถี่ ๆ เป็นครั้งเดียว (ล่าสุดชนะ) */
  _idbPending = { t, json };
  clearTimeout(_idbTimer);
  _idbTimer = setTimeout(flushStateLocal, 250);
}
async function flushStateLocal(){
  clearTimeout(_idbTimer);
  const rec = _idbPending; if(!rec) return true;
  _idbPending = null;
  try{ await window._stateReady; }catch(e){}
  try{ await kvPut(LS_KEY, rec); _idbOk = true; window._lsFail = false; const b = document.getElementById('lsFailBar'); if(b) b.remove(); return true; }
  catch(e){ _idbOk = false; if(_lsFull) lsFailWarn(e, rec.json.length); return false; }
}
/* เปิดหน้า: ถ้าใน IndexedDB ใหม่กว่า localStorage → ใช้ชุดนั้น (รอไม่เกิน 4 วินาที) */
window._stateReady = (async ()=>{
  try{
    if(typeof indexedDB === 'undefined') return;
    const rec = await Promise.race([ kvGet(LS_KEY), new Promise(r=> setTimeout(()=> r('timeout'), 4000)) ]);
    if(!rec || rec === 'timeout' || !rec.json) return;
    const lsT = +(localStorage.getItem(LS_T_KEY)||0);
    const lsHas = !!localStorage.getItem(LS_KEY);
    if(rec.t > lsT || !lsHas){
      const st = JSON.parse(rec.json);
      if(st && Array.isArray(st.villages)){ state = st; try{ normalizeData(); }catch(e){} }
    }
  }catch(e){}
})();
window.addEventListener('pagehide', ()=>{ try{ flushStateLocal(); }catch(e){} });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden'){ try{ flushStateLocal(); }catch(e){} } });

/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
/* วันที่ตามเวลาเครื่อง (ไทย) — เดิมใช้เวลา UTC ทำให้ก่อน 7 โมงเช้ายังเป็น "เมื่อวาน" */
function localISO(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return localISO(new Date()); }
function thDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  const m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return dt.getDate() + ' ' + m[dt.getMonth()] + ' ' + (dt.getFullYear()+543);
}
function thDateShort(d){
  if(!d) return '-';

  const m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return dt.getDate() + ' ' + m[dt.getMonth()];
}
function dayDiff(a,b){ return Math.round((new Date(b) - new Date(a))/86400000); }
function addDays(d,n){
  const dt = new Date(d); dt.setDate(dt.getDate()+n);
  return dt.toISOString().slice(0,10);
}
/* จำนวนหลังที่ต้องเดินสาย — ใช้ข้อมูลรายหลังถ้ามี (แม่นกว่าพอร์ตที่อาจไม่ได้กรอก) */
/* ต้องเดินสาย = พอร์ต (Progress คอลัมน์ D) · ถ้ายังไม่กรอกจึงใช้จำนวนหลังแทน */
function targetHomes(v){
  if(!v) return 0;
  const p = +v.ports||0;
  if(p > 0) return p;
  return (v.houses||[]).length;
}
/* จำนวนหลัง = แถวที่ลงข้อมูลไว้ในแท็บ Unit */
function unitHomes(v){ return (v && v.houses ? v.houses.length : 0); }
/* พอร์ตกับข้อมูลรายหลังไม่ตรงกัน — ใช้เตือนให้ไปแก้ */
function portsMismatch(v){
  const u = (v&&v.houses||[]).length, p = +(v&&v.ports)||0;
  if(!u) return null;
  if(!p) return {type:'noports', unit:u};
  if(p !== u) return {type:'diff', unit:u, ports:p};
  return null;
}
/* ผู้รับเหมาที่ทำงานจริงของบ้านหลังนี้
   ลำดับ: ค่าที่ระบุรายหลัง → Vendor ของหมู่บ้าน → งาน BOQ ที่ผูกไว้ */
function houseSub(v, h){
  const own = String((h&&h.sub)||'').trim();
  if(own) return own;
  const byVillage = String((v&&v.contractor)||'').trim();
  if(byVillage) return byVillage;
  const jb = B.jobs.find(j=>j.villageId===(v&&v.id));
  return jb ? ((vendorById(jb.vendorId)||{}).name || '') : '';
}
/* ===== ติดตามความเคลื่อนไหว: บันทึกวันที่ยอดเดินสายเพิ่มขึ้นล่าสุด ===== */
/* บันทึกวันที่มีการอัปเดตข้อมูลรายหลัง (ผู้ใช้กรอกเอง/วางจาก Excel/นำเข้า) */
function markMoved(v){
  if(!v || isClosed(v)) return;
  const d = todayISO();
  if(v.lastMove === d) return;
  v.lastMove = d;
  v._lastHomes = +v.homesDone||0;
}
function touchProgress(v){
  if(!v) return;
  const now = +v.homesDone || 0;
  const prev = (v._lastHomes == null) ? null : +v._lastHomes;
  if(prev === null){ v._lastHomes = now; if(!v.lastMove) v.lastMove = todayISO(); return; }
  if(now > prev){ v.lastMove = todayISO(); }     /* เพิ่มขึ้นเท่านั้นถึงนับว่าขยับ */
  v._lastHomes = now;
}
/* สถานะความเคลื่อนไหวของหมู่บ้าน */
/* เกณฑ์ติดตามความเคลื่อนไหว (นับจากวันเดินสายเพิ่มล่าสุด) */
const STALE_WARN = 90;    /* 3 เดือน → เหลือง */
const STALE_LATE = 180;   /* 6 เดือน → แดง   */
function staleInfo(v){
  if(!v || isClosed(v)) return {level:'closed', days:0, date:v&&v.lastMove};
  const d = v.lastMove;
  if(!d) return {level:'none', days:null, date:null};
  const t = new Date(d + 'T00:00:00');
  if(isNaN(t.getTime())) return {level:'none', days:null, date:null};
  const days = Math.floor((Date.now() - t.getTime()) / 86400000);
  let level = 'ok';
  if(days >= STALE_LATE) level = 'late';        /* เกิน 6 เดือน */
  else if(days >= STALE_WARN) level = 'warn';   /* เกิน 3 เดือน */
  return {level, days, date:d};
}
/* นาฬิกาบอกวันเดินสายล่าสุด — สีเปลี่ยนตามระดับเตือน
   เทา = ปกติ · เหลือง = ค้างเกิน 3 เดือน · แดง = ค้างเกิน 6 เดือน */
function staleClock(v){
  const s = staleInfo(v);
  const CLK = '\uD83D\uDD57';
  if(s.level === 'closed')
    return '<span class="clk done" title="โครงการปิดแล้ว">\u2714 ปิดโครงการ' + (s.date? ' \u00B7 '+thDate(s.date) : '') + '</span>';
  if(!s.date)
    return '<span class="clk none" title="ยังไม่มีประวัติการเดินสายเพิ่ม">' + CLK + ' ยังไม่มีการเดินสาย</span>';
  const m = Math.floor(s.days/30);
  const tip = 'เดินสายเพิ่มล่าสุด ' + thDate(s.date) + ' \u00B7 ไม่ขยับมา ' + s.days + ' วัน';
  const lv = (s.level==='late' || s.level==='warn') ? s.level : 'ok';
  const tail = (lv==='ok') ? '' : ' <b>\u00B7 ค้าง ' + m + ' เดือน</b>';
  return '<span class="clk ' + lv + '" title="' + tip + '">' + CLK + ' ' + thDate(s.date) + tail + '</span>';
}
function staleDot(v){
  const s = staleInfo(v);
  if(s.level === 'closed' || s.level === 'ok') return '';
  if(s.level === 'none') return `<i class="sdot none" title="ยังไม่มีประวัติการเดินสายเพิ่ม"></i>`;
  const m = Math.floor(s.days/30);
  return `<i class="sdot ${s.level}" title="เดินสายเพิ่มล่าสุด ${thDate(s.date)} · ไม่ขยับมา ${s.days} วัน (~${m} เดือน)"></i>`;
}
/* บ้านเลขที่ซ้ำในหมู่บ้านเดียวกันไม่ควรมี — เก็บแถวที่ข้อมูลครบกว่า */
/* ===== เรียงบ้านเลขที่แบบธรรมชาติ =====
   9/1 · 9/2 … 9/9 · 9/10 · 9/11 … 9/100 · 9/101   (ไม่ใช่ 9/1 · 9/10 · 9/100 · 9/2)
   ป้ายอาคาร (Clubhouse1, Security2) ไปท้ายสุด เรียง ก-ฮ/A-Z แล้วตามเลข         */
function houseKey(no){
  const raw = String(no==null?'':no).trim();
  /* แยกเป็นชิ้น: ตัวเลข ↔ ตัวอักษร */
  const parts = raw.match(/\d+|[^\d]+/g) || [];
  const hasDigit = /\d/.test(raw);
  const startsDigit = /^\s*\d/.test(raw);
  /* กลุ่ม 0 = บ้านเลขที่ (ขึ้นต้นด้วยตัวเลข) · 1 = ป้ายอาคาร · 2 = ช่องว่าง */
  const grp = !raw ? 2 : (startsDigit ? 0 : 1);
  return {grp, parts, raw};
}
function cmpHouse(a, b){
  const A = houseKey(a), B = houseKey(b);
  if(A.grp !== B.grp) return A.grp - B.grp;
  const n = Math.max(A.parts.length, B.parts.length);
  for(let i=0;i<n;i++){
    const x = A.parts[i], y = B.parts[i];
    if(x === undefined) return -1;
    if(y === undefined) return 1;
    const xn = /^\d+$/.test(x), yn = /^\d+$/.test(y);
    if(xn && yn){
      const d = (+x) - (+y);            /* ตัวเลขเทียบเป็นตัวเลข → 10 มาหลัง 9 */
      if(d) return d;
    } else if(xn !== yn){
      return xn ? -1 : 1;               /* ตัวเลขมาก่อนตัวอักษร */
    } else {
      const d = x.localeCompare(y, 'th'); /* ตัวอักษรเรียง ก-ฮ/A-Z */
      if(d) return d;
    }
  }
  return 0;
}
function sortHouses(list){
  return (list||[]).slice().sort((a,b)=> cmpHouse(a && a.no, b && b.no));
}
function dedupeHouses(list){
  const out = [], seen = new Map();
  (list||[]).filter(Boolean).forEach(h=>{
    const raw = String(h.no==null?'':h.no).trim();
    const k = normName(raw);
    /* ลบซ้ำเฉพาะ "บ้านเลขที่จริง" (ต้องมีตัวเลข) —
       ป้ายอาคารอย่าง GUARD / Club House ซ้ำชื่อได้ ไม่ถือว่าซ้ำ */
    if(!k || !/\d/.test(raw)){ out.push(h); return; }
    if(seen.has(k)){
      const i = seen.get(k), old = out[i];
      const score = x => (x.st?2:0)+(x.name?1:0)+(x.lat?1:0)+(x.phone?1:0);
      if(score(h) >= score(old)) out[i] = h;
    } else { seen.set(k, out.length); out.push(h); }
  });
  return out;
}
/* บ้านเลขที่นี้ซ้ำกับแถวอื่นไหม (ข้ามแถวตัวเอง) — ใช้เฉพาะเลขที่ที่มีตัวเลข */
function dupRowIndex(v, no, skipIdx){
  const raw = String(no==null?'':no).trim();
  if(!raw || !/\d/.test(raw)) return -1;
  const k = normName(raw);
  const hs = (v && v.houses) || [];
  for(let i=0;i<hs.length;i++){
    if(i===skipIdx) continue;
    const r = String(hs[i].no==null?'':hs[i].no).trim();
    if(/\d/.test(r) && normName(r)===k) return i;
  }
  return -1;
}
/* รายการเลขที่ซ้ำทั้งหมดในหมู่บ้าน */
function dupNumbers(v){
  const seen = {}, dup = [];
  ((v&&v.houses)||[]).forEach(h=>{
    const raw = String(h.no==null?'':h.no).trim();
    if(!raw || !/\d/.test(raw)) return;
    const k = normName(raw);
    seen[k] = (seen[k]||0)+1;
    if(seen[k]===2) dup.push(raw);
  });
  return dup;
}
/* แถวไหนบ้างที่ซ้ำกับแถวอื่น (ใช้ทำไฮไลต์) */
function dupRowSet(v){
  const seen = new Map(), dup = new Set();
  ((v&&v.houses)||[]).forEach((h,i)=>{
    const raw = String(h&&h.no==null?'':h.no).trim();
    if(!raw || !/\d/.test(raw)) return;
    const k = normName(raw);
    if(seen.has(k)){ dup.add(seen.get(k)); dup.add(i); }
    else seen.set(k, i);
  });
  return dup;
}
function dedupeVillage(v){
  if(!v || !Array.isArray(v.houses)) return 0;
  const before = v.houses.length;
  v.houses = sortHouses(dedupeHouses(v.houses));
  const removed = before - v.houses.length;
  if(removed){ v.homesDone = v.houses.filter(unitDone).length; v._hDirty = true; v._dirty = true; }
  return removed;
}
function dedupeAll(){
  let n = 0; (state.villages||[]).forEach(v=>{ n += dedupeVillage(v); }); return n;
}

/* ===== ลงสีคอลัมน์สถานะในไฟล์ Excel =====

/* บันทึกไฟล์พร้อมฝังสี — ใช้แทน XLSX.writeFile เมื่อมีสีที่จดไว้ */
/* ===== สีแบบมีเงื่อนไข (Conditional Formatting) — สีเปลี่ยนเองตามค่าในไฟล์ =====
   _cfJobs: [{ sheet, sqref:'E2:E99', rules:[{ type:'cellIs', op:'greaterThan', f:'0', bg, ink } | { type:'expression', f:'$E2>0', bg, ink }] }] */
let _cfJobs = [], _tabJobs = {}, _txtColJobs = {};   /* _txtColJobs: { ชื่อชีต: [คอลัมน์ 0-based] } → ตั้งรูปแบบ "ข้อความ" ทั้งคอลัมน์ */
/* สีแท็บชีต: { ชื่อชีต: 'RRGGBB' } */
/* คอลัมน์ที่พิมพ์แล้ว Excel ต้องไม่แปลงเป็นวันที่/ตัวเลข (บ้านเลขที่ 5/12 → 5 ธ.ค., เลข Non 0812… → 812…)
   → ตั้งรูปแบบเริ่มต้นของทั้งคอลัมน์เป็น "ข้อความ" (@) */
async function injectTextCols(zip, jobs){
  const names = Object.keys(jobs||{}).filter(n=> (jobs[n]||[]).length); if(!names.length) return;
  let styles = await zip.file('xl/styles.xml').async('string');
  const m = styles.match(/<cellXfs\b[^>]*count="(\d+)"[^>]*>/); if(!m) return;
  const xf = +m[1];
  styles = styles.replace(/(<cellXfs\b[^>]*count=")(\d+)("[^>]*>[\s\S]*?)(<\/cellXfs>)/,
    (a,p1,n,mid,end)=> p1+(+n+1)+mid+'<xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+end);
  zip.file('xl/styles.xml', styles);
  const wbXml  = await zip.file('xl/workbook.xml').async('string');
  const relXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const relMap = {};
  [...relXml.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)].forEach(r=> relMap[r[1]] = r[2].replace(/^\/?xl\//,'').replace(/^\.\//,''));
  for(const sm of wbXml.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)){
    const nm = sm[1].replace(/&amp;/g,'&'); if(!jobs[nm] || !jobs[nm].length) continue;
    const path = 'xl/' + relMap[sm[2]], f = zip.file(path); if(!f) continue;
    let xml = await f.async('string');
    const want = new Set(jobs[nm].map(c=> c+1));                  /* <col> ใช้เลข 1-based */
    const per = {};                                                /* คอลัมน์ → แอตทริบิวต์เดิม */
    const cm = xml.match(/<cols>([\s\S]*?)<\/cols>/);
    if(cm) for(const c of cm[1].matchAll(/<col\b([^>]*?)\/>/g)){
      const a = c[1], lo = +(a.match(/\bmin="(\d+)"/)||[])[1], hi = +(a.match(/\bmax="(\d+)"/)||[])[1];
      if(!(lo>0) || !(hi>=lo)) continue;
      const rest = a.replace(/\s*\b(min|max)="\d+"/g,'').trim();
      for(let i=lo; i<=Math.min(hi, lo+20000); i++) per[i] = rest;
    }
    want.forEach(i=>{ const r = (per[i]||'').replace(/\s*\bstyle="\d+"/,''); per[i] = (r ? r+' ' : '')+'style="'+xf+'"'; });
    const out = Object.keys(per).map(Number).sort((a,b)=>a-b).map(i=> '<col min="'+i+'" max="'+i+'" '+per[i]+'/>').join('');
    if(cm) xml = xml.replace(/<cols>[\s\S]*?<\/cols>/, '<cols>'+out+'</cols>');
    else xml = xml.replace(/<sheetData\b/, '<cols>'+out+'</cols><sheetData');
    zip.file(path, xml);
  }
}
async function injectTabColors(zip, tabs){
  const names = Object.keys(tabs||{}); if(!names.length) return;
  const wbXml  = await zip.file('xl/workbook.xml').async('string');
  const relXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const relMap = {};
  [...relXml.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)].forEach(m=> relMap[m[1]] = m[2].replace(/^\/?xl\//,'').replace(/^\.\//,''));
  for(const m of wbXml.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)){
    const nm = m[1].replace(/&amp;/g,'&'); if(!tabs[nm]) continue;
    const path = 'xl/' + relMap[m[2]], f = zip.file(path); if(!f) continue;
    let xml = await f.async('string');
    const tab = '<tabColor rgb="FF'+tabs[nm]+'"/>';
    if(/<sheetPr\b[^>]*\/>/.test(xml)) xml = xml.replace(/<sheetPr\b([^>]*)\/>/, '<sheetPr$1>'+tab+'</sheetPr>');
    else if(/<sheetPr\b[^>]*>/.test(xml)) xml = xml.replace(/<sheetPr\b([^>]*)>/, '<sheetPr$1>'+tab);
    else xml = xml.replace(/(<worksheet\b[^>]*>)/, '$1<sheetPr>'+tab+'</sheetPr>');
    zip.file(path, xml);
  }
}
function xmlEsc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function injectCF(zip, jobs){
  if(!jobs || !jobs.length) return;
  let styles = await zip.file('xl/styles.xml').async('string');
  /* dxf = รูปแบบที่ใช้กับเงื่อนไข */
  const dxfIdx = {}; let dxfXml = '', n = 0;
  const m0 = styles.match(/<dxfs count="(\d+)"\s*\/>/), m1 = styles.match(/<dxfs count="(\d+)">([\s\S]*?)<\/dxfs>/);
  if(m1){ n = +m1[1]; dxfXml = m1[2]; }
  const dk = r=> r.bg+'|'+(r.plain ? 'plain' : r.ink);
  jobs.forEach(j=> j.rules.forEach(r=>{
    const k = dk(r); if(k in dxfIdx) return;
    dxfXml += r.plain ? '<dxf><fill><patternFill><bgColor rgb="FF'+r.bg+'"/></patternFill></fill></dxf>'
                      : '<dxf><font><b/><color rgb="FF'+r.ink+'"/></font><fill><patternFill><bgColor rgb="FF'+r.bg+'"/></patternFill></fill></dxf>';
    dxfIdx[k] = n++;
  }));
  const block = '<dxfs count="'+n+'">'+dxfXml+'</dxfs>';
  if(m1) styles = styles.replace(m1[0], block);
  else if(m0) styles = styles.replace(m0[0], block);
  else if(/<\/cellStyles>/.test(styles)) styles = styles.replace('</cellStyles>', '</cellStyles>'+block);
  else styles = styles.replace('</cellXfs>', '</cellXfs>'+block);
  zip.file('xl/styles.xml', styles);
  const wbXml  = await zip.file('xl/workbook.xml').async('string');
  const relXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const relMap = {};
  [...relXml.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)].forEach(m=> relMap[m[1]] = m[2].replace(/^\/?xl\//,'').replace(/^\.\//,''));
  const sheetPath = {};
  [...wbXml.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)].forEach(m=>{ const t = relMap[m[2]]; if(t) sheetPath[m[1]] = 'xl/' + t; });
  let pri = 1;
  const bySheet = {};
  jobs.forEach(j=> (bySheet[j.sheet] = bySheet[j.sheet] || []).push(j));
  for(const sh of Object.keys(bySheet)){
    const path = sheetPath[sh]; const file = path && zip.file(path); if(!file) continue;
    let xml = await file.async('string');
    const cf = bySheet[sh].map(j=> '<conditionalFormatting sqref="'+j.sqref+'">' + j.rules.map(r=>
      r.type==='expression'
        ? '<cfRule type="expression" dxfId="'+dxfIdx[dk(r)]+'" priority="'+(pri++)+'"><formula>'+xmlEsc(r.f)+'</formula></cfRule>'
        : '<cfRule type="cellIs" dxfId="'+dxfIdx[dk(r)]+'" priority="'+(pri++)+'" operator="'+r.op+'"><formula>'+xmlEsc(r.f)+'</formula></cfRule>'
    ).join('') + '</conditionalFormatting>').join('');
    /* ต้องอยู่หลัง sheetData/mergeCells และก่อน pageMargins ฯลฯ ตามลำดับของ Excel */
    const tags = ['<dataValidations','<hyperlinks','<printOptions','<pageMargins','<pageSetup','<headerFooter','<rowBreaks','<colBreaks',
                  '<customProperties','<cellWatches','<ignoredErrors','<smartTags','<drawing','<legacyDrawing','<legacyDrawingHF','<picture',
                  '<oleObjects','<controls','<webPublishItems','<tableParts','<extLst','</worksheet>'];
    let at = -1; tags.forEach(t=>{ const i = xml.indexOf(t); if(i>=0 && (at<0 || i<at)) at = i; });
    if(at < 0) continue;
    xml = xml.slice(0, at) + cf + xml.slice(at);
    zip.file(path, xml);
  }
}
async function writeBookColored(wb, fname){
  if(!_paintJobs.length && !_tableJobs.length && !_cfJobs.length && !Object.keys(_tabJobs).length){ XLSX.writeFile(wb, fname); return; }
  const jobs = _paintJobs; _paintJobs = [];
  const hadTables = _tableJobs.length;
  try{
    const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
    const out = await injectFills(buf, wb.SheetNames, jobs);
    const url = URL.createObjectURL(new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a = document.createElement('a'); a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    _tableJobs = []; _cfJobs = []; _tabJobs = {}; _txtColJobs = {};
    XLSX.writeFile(wb, fname);          /* ฝังไม่ได้ ก็ยังได้ไฟล์ปกติ */
    toast(hadTables
      ? 'บันทึกไฟล์แล้ว — แต่ไม่ได้ใส่ตาราง ต้องจัดรูปแบบเป็นตารางใน Excel ก่อนนำเข้า SharePoint'
      : 'บันทึกไฟล์แล้ว (ลงสีไม่สำเร็จ)');
  }
}

/* ฝังสีลงไฟล์ .xlsx โดยตรง — แก้ styles.xml + sheetN.xml ในไฟล์ zip */
async function injectFills(buf, sheetNames, jobs){
  if(typeof JSZip === 'undefined') throw new Error('no zip');
  const zip = await JSZip.loadAsync(buf);
  /* 1) เพิ่มสีลง styles.xml แล้วจำหมายเลขรูปแบบไว้ */
  const cfJobs = _cfJobs; _cfJobs = [];
  const tabJobs = _tabJobs; _tabJobs = {};
  const txtJobs = _txtColJobs; _txtColJobs = {};
  await injectCF(zip, cfJobs);
  await injectTabColors(zip, tabJobs);
  await injectTextCols(zip, txtJobs);                     /* ก่อนอ่าน styles.xml — injectCF เพิ่ม dxfs ลงไฟล์นี้ */
  let styles = await zip.file('xl/styles.xml').async('string');
  const palette = {};
  jobs.forEach(j=> j.cells.forEach(c=> { palette[c.bg+'|'+c.ink] = true; }));
  const keys = Object.keys(palette);
  if(!keys.length){                       /* ไม่มีสี — ข้ามไปฝังตารางอย่างเดียว */
    await injectTables(zip, sheetNames);
    return await zip.generateAsync({type:'arraybuffer', compression:'DEFLATE'});
  }

  const fillsM = styles.match(/<fills count="(\d+)">([\s\S]*?)<\/fills>/);
  const fontsM = styles.match(/<fonts count="(\d+)"[^>]*>([\s\S]*?)<\/fonts>/);
  const xfsM   = styles.match(/<cellXfs count="(\d+)">([\s\S]*?)<\/cellXfs>/);
  if(!fillsM || !fontsM || !xfsM) throw new Error('bad styles');

  let nFill = +fillsM[1], fillsXml = fillsM[2];
  let nFont = +fontsM[1], fontsXml = fontsM[2];
  let nXf   = +xfsM[1],   xfsXml   = xfsM[2];
  keys.forEach(k=>{
    const [bg, ink] = k.split('|');
    fillsXml += '<fill><patternFill patternType="solid"><fgColor rgb="FF'+bg+'"/><bgColor indexed="64"/></patternFill></fill>';
    fontsXml += '<font><b/><color rgb="FF'+ink+'"/><sz val="11"/><name val="Calibri"/></font>';
    xfsXml   += '<xf numFmtId="0" fontId="'+nFont+'" fillId="'+nFill+'" borderId="0" xfId="0" applyFill="1" applyFont="1"/>';
    palette[k] = nXf;
    nFill++; nFont++; nXf++;
  });
  styles = styles.replace(fillsM[0], '<fills count="'+nFill+'">'+fillsXml+'</fills>')
                 .replace(fontsM[0], '<fonts count="'+nFont+'">'+fontsXml+'</fonts>')
                 .replace(xfsM[0],   '<cellXfs count="'+nXf+'">'+xfsXml+'</cellXfs>');
  zip.file('xl/styles.xml', styles);

  /* 2) หาไฟล์ชีตที่แท้จริงของแต่ละชื่อ (ลำดับใน zip ไม่ตรงกับลำดับในหนังสือเสมอ) */
  const wbXml  = await zip.file('xl/workbook.xml').async('string');
  const relXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const relMap = {};
  [...relXml.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)]
    .forEach(m=> relMap[m[1]] = m[2].replace(/^\/?xl\//,'').replace(/^\.\//,''));
  const sheetPath = {};
  [...wbXml.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)]
    .forEach(m=>{ const t = relMap[m[2]]; if(t) sheetPath[m[1]] = 'xl/' + t; });

  /* 3) ใส่หมายเลขรูปแบบให้แต่ละช่อง */
  for(const j of jobs){
    const path = sheetPath[j.sheet];
    if(!path) continue;
    const file = zip.file(path);
    if(!file) continue;
    let xml = await file.async('string');
    const want = {};
    j.cells.forEach(c=> { want[c.ref] = palette[c.bg+'|'+c.ink]; });
    xml = xml.replace(/<c r="([A-Z]+\d+)"([^>]*?)(\/?)>/g, (m, ref, attrs, selfClose)=>{
      const sIdx = want[ref];
      if(sIdx === undefined) return m;
      const a = attrs.replace(/\s+s="\d+"/, '');
      return '<c r="'+ref+'" s="'+sIdx+'"'+a+selfClose+'>';
    });
    zip.file(path, xml);
  }
  await injectTables(zip, sheetNames);
  return await zip.generateAsync({type:'arraybuffer', compression:'DEFLATE'});
}

/* สร้าง "ตาราง Excel" ในไฟล์ เพื่อให้ SharePoint นำเข้าเป็น List ได้ทันที */
async function injectTables(zip, sheetNames){
  const jobs = _tableJobs; _tableJobs = [];
  if(!jobs.length) return;
  const wbXml  = await zip.file('xl/workbook.xml').async('string');
  const relXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const relMap = {};
  [...relXml.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)]
    .forEach(m=> relMap[m[1]] = m[2].replace(/^\/?xl\//,'').replace(/^\.\//,''));
  const sheetPath = {};
  [...wbXml.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)]
    .forEach(m=>{ const t = relMap[m[2]]; if(t) sheetPath[m[1]] = 'xl/' + t; });

  let ct = await zip.file('[Content_Types].xml').async('string');
  let n = 0;

  for(const j of jobs){
    const path = sheetPath[j.sheet];
    if(!path) continue;
    const file = zip.file(path);
    if(!file) continue;
    let xml = await file.async('string');
    if(/<tableParts/.test(xml)) continue;          /* มีตารางอยู่แล้ว */

    /* อ่านหัวตารางจากแถวแรกของชีต เพื่อใส่ชื่อคอลัมน์ให้ตรง */
    const sst = zip.file('xl/sharedStrings.xml');
    let shared = [];
    if(sst){
      const sx = await sst.async('string');
      shared = [...sx.matchAll(/<si>([\s\S]*?)<\/si>/g)]
        .map(m=> [...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''));
    }
    const row1 = (xml.match(/<row r="1"[^>]*>([\s\S]*?)<\/row>/)||[])[1] || '';
    const heads = [...row1.matchAll(/<c r="([A-Z]+)1"([^>]*)>([\s\S]*?)<\/c>/g)].map(c=>{
      const isS = /t="s"/.test(c[2]);
      const v = (c[3].match(/<v>([\s\S]*?)<\/v>/)||[])[1] || '';
      const txt = isS ? (shared[+v] || '') : v;
      return txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    });
    if(!heads.length) continue;

    n++;
    const tid = n;
    const cols = heads.map((h,i)=> '<tableColumn id="'+(i+1)+'" name="'+(h||('คอลัมน์'+(i+1)))+'"/>').join('');
    const tXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<table xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      + 'id="'+tid+'" name="'+j.name+'" displayName="'+j.name+'" ref="'+j.ref+'" totalsRowShown="0">'
      + '<autoFilter ref="'+j.ref+'"/>'
      + '<tableColumns count="'+heads.length+'">'+cols+'</tableColumns>'
      + '<tableStyleInfo name="TableStyleMedium2" showFirstColumn="0" showLastColumn="0" '
      + 'showRowStripes="1" showColumnStripes="0"/></table>';
    zip.file('xl/tables/table'+tid+'.xml', tXml);

    /* ผูกตารางเข้ากับชีต */
    const relPath = path.replace(/xl\/worksheets\/(.+)$/, 'xl/worksheets/_rels/$1.rels');
    const rid = 'rIdTbl'+tid;
    const relFile = zip.file(relPath);
    if(relFile){
      let r = await relFile.async('string');
      r = r.replace('</Relationships>',
        '<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table'+tid+'.xml"/></Relationships>');
      zip.file(relPath, r);
    } else {
      zip.file(relPath, '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table'+tid+'.xml"/></Relationships>');
    }

    /* ลบ autoFilter ระดับชีตทิ้ง — ห้ามซ้อนกับ autoFilter ของตาราง */
    xml = xml.replace(/<autoFilter[^>]*\/>/g, '').replace(/<autoFilter[^>]*>[\s\S]*?<\/autoFilter>/g, '');
    /* อ้างถึงตารางในชีต — ต้องอยู่ท้ายสุดก่อนปิด worksheet */
    xml = xml.replace(/<\/worksheet>/, '<tableParts count="1"><tablePart r:id="'+rid+'"/></tableParts></worksheet>');
    zip.file(path, xml);

    /* ประกาศชนิดไฟล์ */
    if(ct.indexOf('/xl/tables/table'+tid+'.xml') < 0){
      ct = ct.replace('</Types>',
        '<Override PartName="/xl/tables/table'+tid+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/></Types>');
    }
  }
  zip.file('[Content_Types].xml', ct);
}
/* แถบสรุปสถานะของหมู่บ้านนี้ — เห็นภาพรวมทันทีว่าติดอะไรกี่หลัง */
function stLegendHTML(v){
  const hs = (v && v.houses) || [];
  if(!hs.length) return '';
  const cnt = {};
  hs.forEach(h=>{ const k = String(h.st||'').trim() || '(ยังไม่ระบุ)'; cnt[k] = (cnt[k]||0)+1; });
  const rows = Object.entries(cnt).sort((a,b)=> b[1]-a[1]);
  if(!rows.length) return '';
  return `<div class="st-legend">` + rows.map(([k,n])=>{
    const bg = stColor(k) || '#E8ECE6';
    return `<span class="st-chip" title="${esc(k)} · ${n} หลัง"><i style="background:${bg}"></i>${esc(k)} <b>${n}</b></span>`;
  }).join('') + `</div>`;
}
/* เลือกสีตัวอักษรให้อ่านออกบนพื้นสีนั้น */
function stInk(hex){
  if(!hex) return '';
  const n = parseInt(hex.slice(1), 16);
  const lum = (((n>>16)&255)*299 + ((n>>8)&255)*587 + (n&255)*114) / 1000;
  return lum > 150 ? '#1A2E1A' : '#FFFFFF';
}
/* รหัสรายหลัง — สร้างอัตโนมัติจากรหัสโครงการ + บ้านเลขที่
   ตรงกับคอลัมน์ A/Q ในไฟล์ที่ส่งออก ใช้จับคู่กับไฟล์กลางได้ทันที

   ป้ายอาคาร (Clubhouse, Security, ป้อมยาม) ซ้ำชื่อกันได้หลายหลัง
   จึงต่อลำดับให้ → V001-Clubhouse#1, V001-Clubhouse#2 เพื่อไม่ให้รหัสชน  */
function rowCode(v, h){
  const cd = ensureCode(v);
  const no = String((h && h.no) || '').trim();
  if(!no) return cd;
  if(/\d/.test(no)) return cd + '-' + no;        /* บ้านเลขที่จริง ไม่ซ้ำอยู่แล้ว */
  /* ไม่มีตัวเลข = ป้ายอาคาร → ต่อลำดับที่เท่าไหร่ของชื่อนี้ */
  const k = normName(no);
  let seq = 0, total = 0;
  (v.houses||[]).forEach(x=>{
    if(normName(x && x.no) !== k) return;
    total++;
    if(x === h) seq = total;
  });
  return (total > 1) ? (cd + '-' + no + '#' + (seq||1)) : (cd + '-' + no);
}
/* ===== ข้อมูลลูกค้า (ชื่อ · เบอร์โทร) =====

/* ชั้นที่ 1 — สวิตช์รวม: ทุกสิทธิ์ต้องกดดวงตาบนสุดก่อนเสมอ
   ไม่บันทึกลงเครื่อง · ปิดเองเมื่อออกจากระบบ/สลับสิทธิ์/รีเฟรช           */
let custReveal = false;
function toggleCustReveal(){
  const v = unitVillage();
  if(!custReveal){
    /* จะเปิด — เตือนเรื่องความรับผิดชอบก่อน */

      + 'ข้อมูลนี้เป็นข้อมูลส่วนบุคคล ใช้เพื่องานติดตั้งเท่านั้น\n'
      + 'ห้ามคัดลอก ส่งต่อ หรือเผยแพร่\n\nยืนยันเปิดดู?')) return;
    custReveal = true;
    toast('เปิดดูข้อมูลลูกค้าแล้ว — ปิดเองเมื่อออกจากระบบ');
  } else {
    custReveal = false;
    toast('ปิดข้อมูลลูกค้าแล้ว');
  }
  renderUnitMode();

/* ชั้นที่ 2 — เงื่อนไขเดิม (เฉพาะผรม.) */
function custAllowedFor(v){
  if(canViewAll()) return true;               /* admin + planning ผ่านชั้นนี้ */
  if(!v || isClosed(v)) return false;          /* ปิดโครงการ = ปิดข้อมูล */
  const u = custOpenUntil(v);
  if(!u) return false;
  return todayISO() <= u;                      /* ยังไม่หมดเวลา */
}
/* ต้องผ่านทั้ง 2 ชั้นถึงจะเห็น */
function custVisibleFor(v){
  return custReveal && custAllowedFor(v);
}
/* สถานะสำหรับแสดงผลบนปุ่ม */
function custState(v){
  if(!v) return {open:false, label:'ปิดอยู่', note:''};
  if(isClosed(v)) return {open:false, label:'ปิดถาวร', note:'โครงการปิดแล้ว'};
  const u = custOpenUntil(v);
  if(!u) return {open:false, label:'ปิดอยู่', note:'ผรม.มองไม่เห็นข้อมูลลูกค้า'};
  if(todayISO() > u) return {open:false, label:'หมดเวลาแล้ว', note:'เปิดถึง '+thDate(u)};
  const days = Math.max(0, Math.round((new Date(u+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000));
  return {open:true, label:'เปิดอยู่', note:'ถึง '+thDate(u)+(days? ' (อีก '+days+' วัน)':' (วันนี้วันสุดท้าย)')};
}
/* ปิดบังข้อมูลเมื่อไม่มีสิทธิ์ดู */
function maskCust(v, val){
  if(custVisibleFor(v)) return String(val==null?'':val);
  return String(val==null?'':val).trim() ? '••••••' : '';
}
/* ค่าที่ถูกปิดบังไว้ (••••••) ห้ามนำเข้าไปทับข้อมูลจริง */
/* คงข้อมูลลูกค้าเดิมไว้ เมื่อไฟล์ที่นำเข้าไม่มีข้อมูลส่วนนั้น
   (เช่น ไฟล์ที่ export ตอนปิดดวงตา หรือไฟล์ที่ตัดคอลัมน์ลูกค้าออก) */
function keepCustData(v, rows){
  if(!v || !rows) return;
  const old = {};
  (v.houses||[]).forEach(h=>{ const k = normName(h && h.no); if(k) old[k] = h; });
  rows.forEach(h=>{
    const o = old[normName(h && h.no)];
    if(!o) return;
    ['name','phone','addr'].forEach(k=>{
      if(!String(h[k]||'').trim() && String(o[k]||'').trim()) h[k] = o[k];
    });
  });
}
function isMasked(x){
  const t = String(x==null?'':x).trim();
  return !!t && /^[\u2022\u00B7*.]{3,}$/.test(t);
}
function unitDone(h){ return h && (h.st==='พร้อมติดตั้ง ONU' || /สำเร็จ/.test(h.st||'')); }
function unitStats(v){
  const hs = (v && v.houses) || [];
  const done = hs.filter(unitDone).length;
  return { total: hs.length, done, pending: hs.length-done,
           pct: hs.length ? Math.round(done/hs.length*100) : null };
}
function overall(v){
  if(isClosed(v)) return 100;
  /* % = เดินสายแล้ว ÷ ต้องเดินสาย (พอร์ต) */
  const need = targetHomes(v);
  if(need > 0){
    const done = +v.homesDone || unitStats(v).done || 0;
    return Math.min(100, Math.round(done / need * 100));
  }
  const tw = v.tasks.reduce((s,t)=>s+(+t.w||0),0);
  if(!tw) return 0;
  return Math.round(v.tasks.reduce((s,t)=>s+(+t.w||0)*(+t.p||0),0)/tw);
}
function statusOf(pct){
  if(pct>=100) return ['done','ส่งมอบแล้ว'];
  if(pct>0) return ['doing','กำลังดำเนินการ'];
  return ['idle','ยังไม่เริ่ม'];
}
function emojiBar(pct){
  const n = Math.round(pct/10);
  return '▰'.repeat(n) + '▱'.repeat(10-n);
}
function taskIcon(p){ return p>=100 ? '✅' : (p>0 ? '🔶' : '⬜'); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
/* ทำให้ข้อมูลมีรูปร่างถูกต้องเสมอ — กันแอปพังเมื่อเจอข้อมูลไม่ครบ */
/* ระบุ role ของแถวบัญชี — ทนกรณียังไม่ได้รัน supabase-planning-role.sql
   (คอลัมน์ role ยังไม่มี → เดาจาก is_admin และชื่อที่ระบบตั้งให้ทีม Planning) */
function vendorRoleOf(x){
  if(!x) return 'vendor';
  if(x.role) return x.role;
  if(x.is_admin) return 'admin';
  /* ยังไม่ได้รัน supabase-planning-role.sql → เดาจากชื่อ/อีเมลของทีม Planning */
  const nm = normName(x.name);
  if(nm==='ais planning' || nm.indexOf('planning')>=0) return 'planning';

}

/* เทียบชื่อโครงการแบบยืดหยุ่น: ตัดเว้นวรรคซ้อน/หัวท้าย/อักขระล่องหน + ไม่สนตัวพิมพ์ */
/* อ่านวันที่จาก Excel ได้หลายรูปแบบ: Date · 2026-08-05 · 05/08/2026 · 5 ส.ค. 2569 · ตัวเลข serial */
function parseAnyDate(x){
  if(x == null || x === '') return null;
  if(x instanceof Date && !isNaN(x)) return isoOf(x);
  if(typeof x === 'number' && x > 20000 && x < 80000){        /* Excel serial */
    const d = new Date(Date.UTC(1899,11,30) + x*86400000);
    return isNaN(d) ? null : isoOf(d);
  }
  const t = String(x).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
  if(m) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(t);       /* 05/08/2026 หรือ 05/08/2569 */
  if(m){ let y=+m[3]; if(y>2400) y-=543; return y+'-'+p2(m[2])+'-'+p2(m[1]); }
  const TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  m = /^(\d{1,2})\s+([ก-๙.]+)\s+(\d{2,4})$/.exec(t);              /* 5 ส.ค. 2569 */
  if(m){
    const mi = TH.findIndex(n=>n.replace(/\./g,'')===m[2].replace(/\./g,''));
    if(mi>=0){ let y=+m[3]; if(y<100) y+=2500; if(y>2400) y-=543; return y+'-'+p2(mi+1)+'-'+p2(m[1]); }
  }
  const d2 = new Date(t);
  return isNaN(d2) ? null : isoOf(d2);
}
function p2(n){ return String(+n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function normName(x){
  return String(x==null?'':x)
    .replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}
/* ชื่อหมู่บ้านสำหรับ "เทียบ" — ตัดสิ่งที่ไม่ใช่สาระออก
   กันเคสชื่อต่างนิดเดียวแล้วสร้างหมู่บ้านซ้ำ เช่น
     "หมู่บ้านเพอร์เฟค ... พระราม 9-กรุงเทพกรีฑา"
     "เพอร์เฟค ... พระราม 9 - กรุงเทพกรีฑา"     → ถือว่าเป็นหมู่บ้านเดียวกัน */
function coreName(x){
  return normName(x)
    .replace(/^(หมู่บ้าน|หมู่่บ้าน|โครงการ|บ้าน)\s*/,'')  /* คำนำหน้า (รวมที่พิมพ์ผิดซ้ำสระ) */
    .replace(/[\-–—_.,()/]+/g,' ')                        /* ขีด วงเล็บ จุด → ช่องว่าง */
    .replace(/\s+/g,'')                                    /* ตัดช่องว่างทั้งหมด */
    .replace(/เฟส/g,'phase');
}
function findVillageByName(name){
  const k = normName(name);
  if(!k) return null;
  /* 1) ตรงเป๊ะก่อน */
  let hit = state.villages.find(v=> normName(v.name)===k);
  if(hit) return hit;
  /* 2) เทียบแบบตัดคำนำหน้า/ขีด/ช่องว่างออก */
  const c = coreName(name);
  if(!c) return null;
  const same = state.villages.filter(v=> coreName(v.name)===c);
  if(same.length === 1) return same[0];      /* ตรงตัวเดียว = มั่นใจ */
  if(same.length > 1) return null;           /* กำกวม อย่าเดา */
  return null;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===== รหัสโครงการถาวร (ใช้เป็นกุญแจจับคู่แถวใน SharePoint) =====
   ตั้งครั้งเดียวตอนสร้างโครงการ · ไม่เปลี่ยนแม้เปลี่ยนชื่อ/ปิดงาน/ย้าย Vendor  */
function ensureCode(v){
  if(!v) return '';
  if(v.code) return v.code;
  let max = 0;
  (state.villages||[]).forEach(x=>{
    const m = /^V(\d+)$/.exec(String(x.code||''));
    if(m) max = Math.max(max, +m[1]);
  });
  v.code = 'V' + String(max + 1).padStart(3, '0');
  return v.code;
}
function ensureAllCodes(){
  /* ให้รหัสตามลำดับชื่อ เพื่อให้ครั้งแรกได้เลขเรียงสวย */
  const noCode = (state.villages||[]).filter(v=>!v.code)
    .sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''),'th'));
  noCode.forEach(v=> ensureCode(v));
  return noCode.length;
}

/* เรียงสำหรับ "แสดงผลบนจอ" — โครงการที่ปิดแล้วไปท้าย (ดูงานที่ยังทำอยู่ง่าย) */
/* เรียงหมู่บ้าน — ใช้หลักเดียวกันทุกที่ (ทุก Vendor · ทุกตัวกรอง)
   1) โครงการที่ยังดำเนินการ มาก่อนโครงการที่ปิดแล้ว
   2) วันเดินสายล่าสุด — ใหม่สุดอยู่บน (เห็นงานที่เพิ่งขยับก่อน)
   3) ยังไม่เคยเดินสาย ไปอยู่ท้ายกลุ่ม
   4) ชื่อหมู่บ้าน (กันลำดับสลับไปมาเมื่อวันเท่ากัน)                      */
function sortVillages(list){
  return list.slice().sort((a,b)=>{
    const ca = isClosed(a)?1:0, cb = isClosed(b)?1:0;
    if(ca!==cb) return ca-cb;
    const da = String(a.lastMove||'').slice(0,10);
    const db = String(b.lastMove||'').slice(0,10);
    if(da && db && da!==db) return db.localeCompare(da);   /* ใหม่สุดขึ้นก่อน */
    if(da && !db) return -1;                               /* มีวันที่ มาก่อน */
    if(!da && db) return 1;
    return String(a.name||'').localeCompare(String(b.name||''),'th');
  });
}
/* เรียงสำหรับ "ไฟล์ที่ส่งออก" — คงที่เสมอ ไม่ขึ้นกับสถานะ/ความคืบหน้า
   เรียงตามรหัสโครงการ → แถวอยู่ที่เดิมทุกครั้ง เทียบใน SharePoint ได้      */
function sortForExport(list){
  (list||[]).forEach(v=> ensureCode(v));
  return (list||[]).slice().sort((a,b)=>{
    const d = String(a.code||'').localeCompare(String(b.code||''), 'en', {numeric:true});
    if(d) return d;
    return String(a.name||'').localeCompare(String(b.name||''),'th');
  });
}
function sortJobs(list){
  return list.slice().sort((a,b)=>{
    const ca = jobClosed(a)?1:0, cb = jobClosed(b)?1:0;
    if(ca!==cb) return ca-cb;
    return String(jobName(a)||'').localeCompare(String(jobName(b)||''),'th');
  });
}
function villageGroupsHTML(list){
  const groups = {};
  list.forEach(v=>{
    const k = (v.contractor||'').trim() || 'ยังไม่ระบุ Vendor';
    (groups[k] = groups[k] || []).push(v);
  });
  return Object.keys(groups).sort((a,b)=>{
    const oa = groups[a].every(isClosed)?1:0, ob = groups[b].every(isClosed)?1:0;
    if(oa!==ob) return oa-ob;
    return a.localeCompare(b,'th');
  }).map(k=>{
    const vs = sortVillages(groups[k]);
    const avg = Math.round(vs.reduce((s,v)=>s+overall(v),0)/vs.length);
    const cN = vs.filter(isClosed).length;
    return `<div class="vgroup"><h2>👷 ${esc(k)}</h2><span>${vs.length} โครงการ${cN?' · ปิดแล้ว '+cN:''} · เฉลี่ย ${avg}%</span></div>`
      + vs.map(vcardHTML).join('');
  }).join('') || '<div class="panel" style="color:var(--muted);font-size:13px">ไม่พบโครงการที่ตรงกับคำค้น</div>';
}

function importExcelForVendor(ev){
  if(!requireAdmin('นำเข้าไฟล์ Master')){ ev.target.value=''; return; }
  const vid = ui.importVendorId;
  const vd = vendorById(vid);
  const f = ev.target.files[0]; if(!f || !vd){ ev.target.value=''; return; }
  const rd = new FileReader();
  rd.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const before = new Set(state.villages.map(v=>v.id));
      const ok = importMaster3(wb, {authoritative:isAdmin()});
      if(!ok){ toast('ไม่พบรูปแบบที่รู้จักในไฟล์'); ev.target.value=''; return; }
      // บังคับให้ทุกโครงการที่เพิ่ง import/แตะ เป็นของ Vendor ที่เลือก
      let n=0;
      state.villages.forEach(v=>{
        if(!before.has(v.id) || !v.vendorId){
          v.vendorId = vd.id; v.contractor = vd.name;
          B.jobs.filter(j=>j.villageId===v.id).forEach(j=>{ j.vendorId = vd.id; });
          n++;
        }
      });
      const newOnes = state.villages.filter(x=>!before.has(x.id));
      finishImport(before, 'ผูกให้ ' + vd.name + ' ' + n + ' โครงการ');
      if(newOnes.length) showNewVillageWarn(newOnes);
    }catch(err){ toast('อ่านไฟล์ Excel ไม่สำเร็จ'); }
    ev.target.value='';
  };
  rd.readAsArrayBuffer(f);
}

  if(!h){ toast('ไม่พบบ้านเลขที่ '+d.addr+' ในระบบ'); return; }

/* ================= Gantt / ตารางแผนงาน ================= */
/* วันเริ่มโครงการเป็นจุดอ้างอิง: ขยับวันเริ่มโครงการ = ทุกขั้นตอน + วันส่งมอบ เลื่อนตามเท่ากัน */
function setStartAnchor(vid, val){
  if(villageClosed(vid)){ toast('โครงการปิดแล้ว แก้ไขไม่ได้'); render(); return; }
  const v = state.villages.find(v=>v.id===vid);
  const old = v.start;
  v.start = val;
  if(old && val){
    const delta = dayDiff(old, val);
    if(delta !== 0){
      v.tasks.forEach(t=>{
        if(t.s) t.s = addDays(t.s, delta);
        if(t.e) t.e = addDays(t.e, delta);
      });
      if(v.end) v.end = addDays(v.end, delta);
      toast('เลื่อนทุกขั้นตอนตามวันเริ่มโครงการ (' + (delta>0?'+':'') + delta + ' วัน)');
    }
  } else if(!old && val && v.end && !v.tasks.some(t=>t.s)){
    toast('ตั้งวันเริ่มแล้ว กด ⚡ Gen เพื่อสร้างแผนทุกขั้นตอน');
  }
  persist(); renderDetail();
}

function shiftTask(vid,tid,days){
  const t = state.villages.find(v=>v.id===vid).tasks.find(t=>t.id===tid);
  if(!t.s || !t.e) return;
  t.s = addDays(t.s,days); t.e = addDays(t.e,days);
  persist(); renderDetail();
}
function changeDur(vid,tid,days){
  const t = state.villages.find(v=>v.id===vid).tasks.find(t=>t.id===tid);
  if(!t.s || !t.e) return;
  let d = dayDiff(t.s,t.e)+1+days;
  if(d < 1) d = 1;
  t.e = addDays(t.s, d-1);
  persist(); renderDetail();
}
function chainAfterPrev(vid,tid){
  const v = state.villages.find(v=>v.id===vid);
  const i = v.tasks.findIndex(t=>t.id===tid);
  if(i <= 0){ toast('เป็นงานแรก ไม่มีงานก่อนหน้า'); return; }
  const prev = v.tasks[i-1];
  if(!prev.e){ toast('งานก่อนหน้ายังไม่มีวันที่'); return; }
  const t = v.tasks[i];
  const dur = (t.s && t.e) ? dayDiff(t.s,t.e)+1 : 7;
  t.s = addDays(prev.e,1); t.e = addDays(t.s,dur-1);
  persist(); renderDetail();
}
function quickStart(vid,tid){
  const t = state.villages.find(v=>v.id===vid).tasks.find(t=>t.id===tid);
  t.s = todayISO(); t.e = addDays(t.s,6);
  persist(); renderDetail();
}
function toggleDateEdit(tid){
  const el = $('dedit-'+tid);
  if(el) el.style.display = (el.style.display==='none') ? 'flex' : 'none';
}
function shiftAll(vid,days){
  const v = state.villages.find(v=>v.id===vid);
  v.tasks.forEach(t=>{ if(t.s && t.e){ t.s = addDays(t.s,days); t.e = addDays(t.e,days); } });
  if(v.start) v.start = addDays(v.start,days);
  if(v.end) v.end = addDays(v.end,days);
  persist(); renderDetail();
  toast(days>0 ? 'เลื่อนทั้งแผนออกไป '+days+' วัน' : 'เลื่อนทั้งแผนเข้ามา '+(-days)+' วัน');
}
function genSchedule(vid){
  const v = state.villages.find(v=>v.id===vid);
  if(!v.start || !v.end){ toast('ใส่วันเริ่มงานและกำหนดส่งมอบก่อนครับ'); return; }
  if(dayDiff(v.start, v.end) < 1){ toast('กำหนดส่งมอบต้องอยู่หลังวันเริ่มงาน'); return; }
  const total = dayDiff(v.start, v.end) + 1;
  const tw = v.tasks.reduce((s,t)=>s+(+t.w||0),0);
  let cum = 0;
  v.tasks.forEach(t=>{
    const w = tw ? (+t.w||0) : 1;
    const TW = tw || v.tasks.length;
    const startOff = Math.min(Math.round(cum/TW*total), total-1);
    cum += w;
    let endOff = Math.round(cum/TW*total) - 1;
    if(endOff < startOff) endOff = startOff;
    endOff = Math.min(endOff, total-1);
    t.s = addDays(v.start, startOff);
    t.e = addDays(v.start, endOff);
  });
  persist(); renderDetail();
  toast('สร้างแผนงานตามน้ำหนักงานแล้ว ปรับวันที่รายงานได้เลย');
}

function ganttHTML(v){
  const dated = v.tasks.filter(t=>t.s && t.e);
  if(!dated.length){
    return `<div class="g-empty">ยังไม่มีวันที่ในแผนงาน<br>ใส่วันเริ่มงาน / กำหนดส่งมอบด้านบน แล้วกด ⚡ Gen แผนงานอัตโนมัติ<br>หรือใส่วันที่รายขั้นตอนเองในแต่ละงาน</div>`;
  }
  let min = dated.reduce((m,t)=> t.s<m? t.s:m, dated[0].s);
  let max = dated.reduce((m,t)=> t.e>m? t.e:m, dated[0].e);
  if(v.start && v.start<min) min = v.start;
  if(v.end && v.end>max) max = v.end;
  const total = Math.max(dayDiff(min,max)+1, 1);
  const step = total<=60 ? 7 : (total<=180 ? 14 : 30);
  const today = todayISO();

  let ticks='', grid='';
  for(let off=0; off<total; off+=step){
    const pct = (off/total*100).toFixed(2);
    ticks += `<div class="g-tick" style="left:${pct}%">${thDateShort(addDays(min,off))}</div>`;
    grid  += `<div class="g-gridline" style="left:${pct}%"></div>`;
  }

  const rows = v.tasks.map(t=>{
    if(!t.s || !t.e) return `<div class="g-row"><div class="g-label"><span>${esc(t.name)}</span><span class="g-dates">ยังไม่กำหนดวัน</span></div><div class="g-track"></div></div>`;
    const left = (dayDiff(min,t.s)/total*100).toFixed(2);
    const width = ((dayDiff(t.s,t.e)+1)/total*100).toFixed(2);
    const late = today > t.e && +t.p < 100;
    return `<div class="g-row">
      <div class="g-label"><span>${esc(t.name)}</span><span class="g-dates">${thDateShort(t.s)} – ${thDateShort(t.e)} · ${t.p}%</span></div>
      <div class="g-track"><div class="g-bar ${late?'late':''}" style="left:${left}%;width:${width}%"><i style="width:${t.p}%"></i></div></div>
    </div>`;
  }).join('');

  let todayLine = '';
  if(today >= min && today <= max){
    const tp = ((dayDiff(min,today)+0.5)/total*100).toFixed(2);
    todayLine = `<div class="g-today" style="left:${tp}%"></div>`;
  }

  return `<div class="gantt" id="ganttChart">
    <div class="g-head">
      <div>
        <div class="g-title">แผนงานก่อสร้าง · ${esc(v.name)}</div>
        <div class="g-sub">${esc(v.contractor)||'-'} · ${thDate(min)} – ${thDate(max)}${v.ports? ' · '+v.ports+' พอร์ต':''}</div>
      </div>
      <div class="g-brand">AIS FIBRE</div>
    </div>
    <div class="g-axis">${ticks}</div>
    <div class="g-body">${grid}${todayLine}${rows}</div>
    <div class="g-legend">
      <span><i style="background:#D8ECBC"></i>แผนงาน</span>
      <span><i style="background:linear-gradient(90deg,var(--green),var(--green-dark))"></i>ผลงานจริง</span>
      <span><i style="background:var(--amber)"></i>ล่าช้ากว่าแผน</span>
      <span><i style="background:var(--red);width:3px;border-radius:1px"></i> เส้นวันนี้ (${thDateShort(today)})</span>
    </div>
  </div>`;
}

function villageAOA(v){
  const p = overall(v);
  const rows = [
    ['โครงการ', v.name],
    ['ผู้รับเหมา', v.contractor||''],
    ['พอร์ต / หลังคาเรือน', v.ports||''],
    ['วันเริ่มงาน', v.start||''],
    ['กำหนดส่งมอบ', v.end||''],
    ['ความคืบหน้ารวม (%)', p],
    ['ปัญหา / อุปสรรค', v.issue||''],
    [],
    ['ลำดับ','ขั้นตอนงาน','น้ำหนัก (%)','ความคืบหน้า (%)','วันเริ่ม','วันเสร็จ','หมายเหตุ']
  ];
  v.tasks.forEach((t,i)=>rows.push([i+1, t.name, +t.w||0, +t.p||0, t.s||'', t.e||'', t.note||'']));
  return rows;
}
function excelSheetName(base, used){
  let n = (base||'โครงการ').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,25).trim() || 'โครงการ';
  let name = n, i = 2;
  while(used.has(name)){ name = n.slice(0,22) + ' ' + i++; }
  used.add(name);
  return name;
}
function excelWidths(ws){ ws['!cols'] = [{wch:6},{wch:48},{wch:11},{wch:15},{wch:12},{wch:12},{wch:28}]; }
function exportExcelVillage(vid){
  if(!needLib('XLSX')) return;
  if(!visibleVillages().some(x=> x.id === vid)){ toast('ไม่มีสิทธิ์ดูหมู่บ้านนี้'); return; }
  const v = state.villages.find(v=>v.id===vid);
  if(!v) return;
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(villageAOA(v));
  excelWidths(ws);
  XLSX.utils.book_append_sheet(wb, ws, excelSheetName(v.name, new Set()));
  XLSX.writeFile(wb, 'progress-' + v.name.replace(/\s+/g,'-') + '-' + todayISO() + '.xlsx');
  toast('Export Excel แล้ว');
}

   ไม่มีงบ/ราคา/ROI · ข้อมูลลูกค้าถามก่อนใส่                              */

   มาโครในไฟล์ SharePoint อ่านไฟล์นี้แล้วอัปเดตให้เอง                */
/* ===== ไฟล์ความรู้สำหรับ Chatbot =====
   เขียนเป็นประโยคภาษาคน หมู่บ้านละหัวข้อ — chatbot ตอบแม่นกว่าอ่านตารางดิบมาก */

function exportChatbotKnowledge(){
  if(!requirePlanner('ออกไฟล์ความรู้ Chatbot')) return;
  const vil = sortForExport(visibleVillages());
  if(!vil.length){ toast('ยังไม่มีข้อมูล'); return; }
  const d = new Date();
  const stamp = d.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
  const L = [];
  L.push('# ข้อมูลงานติดตั้งไฟเบอร์ FTTH (ใต้ดิน) — AIS Fibre');
  L.push('');
  L.push('ข้อมูล ณ วันที่ ' + stamp + ' · รวม ' + vil.length + ' โครงการ');
  L.push('');
  L.push('## คำอธิบายศัพท์');
  L.push('- **พร้อมติดตั้ง ONU** = เดินสายเสร็จแล้ว ลูกค้าติดตั้งเน็ตได้ทันที');
  L.push('- **ต้องเดินสาย** = จำนวนพอร์ตที่วางแผนไว้ทั้งโครงการ');
  L.push('- **เดินสายแล้ว** = จำนวนบ้านที่พร้อมติดตั้ง ONU แล้ว');
  L.push('- **ความคืบหน้า** = เดินสายแล้ว ÷ ต้องเดินสาย');
  L.push('- **รหัสโครงการ** = รหัสถาวรของแต่ละหมู่บ้าน เช่น V001');
  L.push('- **Solution** = วิธีแก้ไขเพื่อให้บ้านหลังนั้นติดตั้งเน็ตได้');
  L.push('- **ค่าใช้จ่ายโดยประมาณ** = ราคาประเมินของงานแก้ไขนั้น (บาท) — เป็นตัวเลขประมาณการ ต้องสำรวจหน้างานก่อนยืนยันจริง');
  L.push('- **รายละเอียดงานที่ต้องทำ** = ขอบเขตงานที่ต้องทำเพื่อให้ติดตั้งได้');
  L.push('');
  /* ภาพรวม */
  const tNeed = vil.reduce((a,v)=>a+targetHomes(v),0);
  const tDone = vil.reduce((a,v)=>a+(+v.homesDone||0),0);
  const ready = vil.filter(v=>overall(v)>=100).length;
  L.push('## ภาพรวมทั้งหมด');
  L.push('- โครงการทั้งหมด ' + vil.length + ' แห่ง · เสร็จสมบูรณ์แล้ว ' + ready + ' แห่ง');
  L.push('- ต้องเดินสายรวม ' + fmt(tNeed) + ' พอร์ต · เดินสายแล้ว ' + fmt(tDone) + ' หลัง');
  L.push('- ความคืบหน้าเฉลี่ยทั้งหมด ' + (tNeed? Math.round(tDone/tNeed*100):0) + '%');
  L.push('');
  /* รายโครงการ */
  L.push('## รายละเอียดแต่ละโครงการ');
  L.push('');
  vil.forEach(v=>{
    const cd = ensureCode(v), need = targetHomes(v), done = +v.homesDone||0;
    const jb = villageJobs(v)[0], po = jb ? jobPOName(jb) : '';
    const hs = (v.houses||[]);
    L.push('### ' + v.name + ' (รหัส ' + cd + ')');
    L.push('');
    L.push('- **สถานะโครงการ**: ' + (isClosed(v) ? 'ปิดงานแล้ว' : 'อยู่ระหว่างดำเนินการ'));
    L.push('- **ผู้รับเหมา (Vendor)**: ' + (v.contractor || 'ยังไม่ระบุ'));
    if(po) L.push('- **เลขที่ PO**: ' + po);
    L.push('- **ความคืบหน้า**: ' + overall(v) + '% (เดินสายแล้ว ' + fmt(done) + ' จาก ' + fmt(need) + ')');
    L.push('- **จำนวนบ้านที่มีข้อมูล**: ' + fmt(hs.length) + ' หลัง');
    if(v.start) L.push('- **วันเริ่มงาน**: ' + thDate(v.start));
    if(v.end)   L.push('- **กำหนดส่งมอบ**: ' + thDate(v.end));
    if(v.lastMove) L.push('- **เดินสายเพิ่มล่าสุด**: ' + thDate(v.lastMove));
    if(v.issue) L.push('- **ปัญหา/อุปสรรค**: ' + v.issue);
    /* สรุปสถานะรายหลัง */
    if(hs.length){
      const cnt = {};
      hs.forEach(h=>{ const k=String(h.st||'').trim()||'ยังไม่ระบุสถานะ'; cnt[k]=(cnt[k]||0)+1; });
      L.push('- **สถานะรายหลัง**: ' + Object.entries(cnt).sort((a,b)=>b[1]-a[1])
              .map(([k,n])=> k+' '+n+' หลัง').join(' · '));
      /* บ้านที่พร้อมแล้ว — ตอบคำถามขายได้ทันที */
      const okList = hs.filter(unitDone).map(h=>h.no).filter(Boolean);
      if(okList.length){
        L.push('- **บ้านเลขที่ที่พร้อมติดตั้ง ONU แล้ว** (' + okList.length + ' หลัง): '
               + okList.slice(0,400).join(', ') + (okList.length>400 ? ' และอื่นๆ' : ''));
      }
      /* บ้านที่ยังไม่พร้อม — จัดกลุ่มตาม "สถานะ + วิธีแก้ + ราคา" ให้ chatbot ตอบได้ว่า
         ติดอะไร ต้องทำอะไร ราคาประมาณเท่าไหร่ */
      const notReady = hs.filter(h=>!unitDone(h));
      if(notReady.length){
        L.push('- **บ้านเลขที่ที่ยังไม่พร้อม** (' + notReady.length + ' หลัง)');
        const grp = {};
        notReady.forEach(h=>{
          const key = [String(h.st||'ยังไม่ระบุสถานะ').trim(),
                       String(h.sol||'').trim(),
                       String(h.est||'').trim(),
                       String(h.detail||'').trim()].join('|');
          (grp[key] = grp[key] || []).push(String(h.no||'').trim());
        });
        Object.keys(grp).sort((a,b)=> grp[b].length - grp[a].length).forEach(key=>{
          const [st, sol, est, det] = key.split('|');
          const list = grp[key].filter(Boolean);
          L.push('');
          L.push('  **' + st + '** — ' + list.length + ' หลัง');
          if(sol) L.push('  - วิธีแก้ (Solution): ' + sol);
          if(est) L.push('  - ค่าใช้จ่ายโดยประมาณ: ' + est + ' บาท');
          if(det) L.push('  - รายละเอียดงานที่ต้องทำ: ' + det);
          if(list.length) L.push('  - บ้านเลขที่: ' + list.slice(0,200).join(', ')
                                 + (list.length>200 ? ' และอื่นๆ' : ''));
        });
        L.push('');
      }
    }
    /* ประโยคสรุปให้ chatbot หยิบไปตอบได้ตรงๆ */
    L.push('');
    L.push('สรุป: โครงการ ' + v.name + ' รหัส ' + cd + ' ' +
           (isClosed(v) ? 'ปิดงานแล้ว ' : 'ความคืบหน้า ' + overall(v) + '% ') +
           'เดินสายแล้ว ' + fmt(done) + ' หลัง จากทั้งหมด ' + fmt(need) + ' พอร์ต' +
           (v.contractor ? ' ผู้รับเหมาคือ ' + v.contractor : '') + '');
    L.push('');
  });
  const blob = new Blob([L.join('\n')], {type:'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'FTTH-Knowledge.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('ออกไฟล์ความรู้แล้ว ' + vil.length + ' โครงการ — อัปขึ้น SharePoint ให้ Chatbot อ่าน');
}
function exportForMacro(){
  if(!needLib('XLSX')) return;
  if(!requirePlanner('ออกไฟล์อัปเดต')) return;
  const vil = sortForExport(visibleVillages());
  if(!vil.length){ toast('ยังไม่มีข้อมูล'); return; }
  /* A = รหัสโครงการ (คงที่ ใช้แทนเลขลำดับที่เปลี่ยนทุกครั้ง)
     Q = คีย์รายหลัง (รหัส-บ้านเลขที่) ใช้ VLOOKUP ทีละหลังได้           */
  const head = ['รหัสโครงการ','โครงการ','บ้านเลขที่','Lat','Lot','status','Solution','Estimate price','Detail',
                'VLC','OLT','ชื่อ Name','บ้านเลขที่ Address','เบอร์โทร Phone number','สนใจ/ไม่สนใจ',
                'Sub-Contract Underground','คีย์รายหลัง'];
  const rows = [head];
  vil.forEach(v=>{
    const cd = ensureCode(v);
    (v.houses||[]).forEach(h=>{
      const no = String(h.no||'').trim();
      if(!no) return;
      rows.push([ cd, v.name, h.no||'', h.lat||'', h.lng||'', h.st||'', h.sol||'', h.est||'', h.detail||'',
                  h.vlc||'', h.olt||'', maskCust(v,h.name), maskCust(v,h.addr), maskCust(v,h.phone), h.interest||'',
                  houseSub(v,h), rowCode(v,h) ]);
    });
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:34},{wch:14},{wch:12},{wch:12},{wch:26},{wch:12},{wch:13},{wch:16},
                 {wch:10},{wch:10},{wch:18},{wch:16},{wch:16},{wch:14},{wch:20},{wch:18}];
  ws['!freeze'] = {xSplit:3, ySplit:1};
  XLSX.utils.book_append_sheet(wb, ws, 'Unit');
  paintStatusColumn(ws, rows, 'status', 'Unit');
  writeBookColored(wb, 'FTTH-Unit-Master.xlsx');
  showMacroHelp(rows.length-1, vil.length);
}
