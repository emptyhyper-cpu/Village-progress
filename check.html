<style>

  .ck-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(15,61,36,.08);}
  .ck-lb{display:block;font-size:13px;font-weight:700;margin:4px 0 6px;}
  .ck-lb span{font-weight:500;color:var(--muted);}
  .ck-lb .ck-req{color:var(--red);}
  .ck-in{width:100%;box-sizing:border-box;font-family:inherit;font-size:16px;padding:12px 14px;

  .ck-open{margin-top:12px;border-top:1px dashed #BFDDB0;padding-top:12px;}

  .ck-xy{margin-top:10px;background:#fff;border:1.5px solid #D5EBC8;border-radius:12px;padding:10px 12px;}

  .ck-xyrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #EEF5E8;}
  .ck-xyrow span{flex:none;font-size:12.5px;color:var(--muted);font-weight:700;}
  .ck-xyrow b{flex:1;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.2px;user-select:all;word-break:break-all;}

  .ov-cands{margin-top:10px;display:flex;flex-direction:column;gap:6px;}

  .ov-cand span{margin-left:auto;background:var(--forest);color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;}
  .ov-warn{margin-top:10px;font-size:12.5px;background:#FDF0D8;color:#7A5200;border-radius:9px;padding:8px 10px;line-height:1.6;}
  .ov-file{display:block;text-align:center;cursor:pointer;}
  .ov-plan{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;}

  .ov-pl-skip{color:var(--muted);}
  .ov-done{margin-top:12px;background:#EAF7E4;color:var(--green-dark);font-weight:700;border-radius:10px;padding:10px 12px;}
  .ck-clr:disabled{opacity:.5;}
  .ck-ovtag{background:#E6F0FB !important;color:#1F5F99 !important;}
  .ov-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #EEF2EC;}
  .ov-main{flex:1;min-width:0;} .ov-main b{display:block;font-size:14.5px;} .ov-main small{display:block;color:var(--muted);font-size:12px;word-break:break-word;}
  .ov-btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:700;color:var(--forest);}
  .ov-del{color:#B42318;border-color:#F0D0CC;}
  .lg-err{margin-top:12px;font-size:13px;background:#FBEAEA;color:#8A1F1F;border-radius:10px;padding:10px 12px;line-height:1.6;}
  .lg-lb{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--forest);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;
    transition:.2s;pointer-events:none;z-index:99;max-width:calc(100% - 32px);text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<body>
<div id="root" class="ck-wrap">
  <div class="ck-top">
    <div class="ck-brand"><div class="ck-mark">F</div>
      <div><b>ตรวจสอบพร้อมให้บริการ</b><small>AIS Fibre · Full Underground</small></div></div>
    <div id="topRight"></div>
  </div>
  <div class="ck-body" id="main"><div class="ck-wait">⏳ กำลังโหลด...</div></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   หน้าตรวจสอบพร้อมให้บริการ — สำหรับน้องทีม Key สมัคร
   • ต้องล็อกอินด้วยบัญชีที่ผู้ดูแลเปิดสิทธิ์ (role = checker) หรือผู้ดูแล/Planning
   • ข้อมูลทั้งหมดมาจาก check_unit() ในฐานข้อมูลเท่านั้น
     ไม่ดาวน์โหลดข้อมูลโครงการ ไม่มีชื่อ/เบอร์ลูกค้า ไม่มีงบ/ราคา
   • ไม่เก็บอะไรในเครื่อง นอกจากสถานะการล็อกอินของ Supabase
   ============================================================ */
const SUPABASE_URL = 'https://fxlxmqrgczbpgjliquft.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bHhtcXJnY3picGdqbGlxdWZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NTIxNjMsImV4cCI6MjEwMDMyODE2M30._Vd-qNcjfodT3a3CzbRegRZ0EC0KxmmCk6oTBWvsTSI';
const PAGE_VERSION = '2026-10-01-I';

let sb = null, cloudUser = null, _ckWho = '', _ckBusy = false;
try{ if(window.supabase && SUPABASE_URL) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){}

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Math.round((+n||0)*100)/100).toLocaleString('th-TH'); }
function thDate(d){
  if(!d) return '-';
  const dt = new Date(d); if(isNaN(dt)) return String(d);
  const m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return dt.getDate() + ' ' + m[dt.getMonth()] + ' ' + (dt.getFullYear()+543);
}
let _toastT = 0;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT = setTimeout(()=> t.classList.remove('show'), 2400);
}

/* ---------------- ล็อกอิน ---------------- */
function renderLogin(msg){
  $('topRight').innerHTML = '';
  $('main').innerHTML = `
    <div class="ck-card">
      <div style="font-size:17px;font-weight:800">เข้าสู่ระบบ</div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px">ใช้บัญชีที่ผู้ดูแลสร้างให้ · สำหรับเช็คก่อนเปิดระบบให้ Key สมัคร</div>
      <form onsubmit="doLogin(event)" autocomplete="on">
        <label class="lg-lb" for="lgU">อีเมล</label>
        <input id="lgU" class="ck-in" type="text" inputmode="email" autocomplete="username" placeholder="เช่น key01@ais.local" autocapitalize="none" spellcheck="false">
        <label class="lg-lb" for="lgP">รหัสผ่าน</label>
        <input id="lgP" class="ck-in" type="password" autocomplete="current-password">
        <button class="ck-go" id="lgBtn" type="submit" style="margin-top:14px">เข้าสู่ระบบ</button>
      </form>
      <div id="lgMsg">${msg || ''}</div>
    </div>
    <div class="ck-foot">ใช้ภายในเท่านั้น ห้ามส่งต่อให้บุคคลภายนอก</div>`;
  setTimeout(()=>{ const n = $('lgU'); if(n) n.focus(); }, 60);
}
function loginErr(t){ return `<div class="lg-err">${t}</div>`; }

async function doLogin(ev){
  if(ev) ev.preventDefault();
  if(!sb){ $('lgMsg').innerHTML = loginErr('โหลดระบบไม่สำเร็จ — ตรวจอินเทอร์เน็ต แล้วรีเฟรชหน้านี้'); return; }
  let u = String($('lgU').value || '').trim().toLowerCase();
  const p = String($('lgP').value || '');
  if(!u || !p){ $('lgMsg').innerHTML = loginErr('กรอกอีเมลและรหัสผ่าน'); return; }
  if(u.indexOf('@') < 0) u += '@ais.local';
  const btn = $('lgBtn'); btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email: u, password: p });
    if(error) throw error;
    await afterLogin(data.user);
  }catch(e){
    const m = String((e && e.message) || e);
    let t = 'เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง';
    if(/invalid login|invalid credentials/i.test(m)) t = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
    else if(/querying schema|database error/i.test(m)) t = '<b>ระบบยืนยันตัวตนขัดข้อง</b> — ไม่ใช่ที่รหัสผ่านของคุณ แจ้งผู้ดูแลระบบ';
    else if(/failed to fetch|network|load failed/i.test(m)) t = 'เชื่อมต่อระบบไม่ได้ — ตรวจอินเทอร์เน็ต';
    else if(/rate|too many/i.test(m)) t = 'ลองหลายครั้งเกินไป — รอสักครู่แล้วลองใหม่';
    const box = $('lgMsg'); if(box) box.innerHTML = loginErr(t);
    if(btn){ btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; }
  }
}

/* หลังล็อกอิน — เช็คสิทธิ์กับฐานข้อมูลก่อนเปิดหน้า */
async function afterLogin(user){
  cloudUser = user;
  let ok = false, missing = false;
  try{
    const [a, b] = await Promise.all([ sb.rpc('is_checker'), sb.rpc('can_view_all') ]);
    ok = !!((a && a.data === true) || (b && b.data === true));
    missing = !!(a && a.error && b && b.error);
  }catch(e){ missing = true; }
  if(!ok){
    try{ await sb.auth.signOut(); }catch(e){}
    cloudUser = null;
    renderLogin(loginErr(missing
      ? 'ระบบยังไม่พร้อมใช้งาน — ผู้ดูแลยังไม่ได้ติดตั้ง <b>supabase-checker.sql</b>'
      : 'บัญชีนี้ยังไม่ได้เปิดสิทธิ์ใช้หน้าตรวจสอบ — ติดต่อผู้ดูแลระบบ'));
    return;
  }
  _ckWho = '';
  try{
    const r = await sb.from('vendors').select('name').eq('auth_uid', user.id).limit(1);
    if(r && r.data && r.data[0]) _ckWho = r.data[0].name || '';
  }catch(e){}
  if(!_ckWho) _ckWho = user.email || '';
  _isBoss = false;
  try{ const rb = await sb.rpc('is_boss'); _isBoss = !!(rb && rb.data === true); }catch(e){}
  renderApp();
}

async function logout(){
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();            /* โหลดใหม่ — ไม่เหลือผลค้นหาค้างบนจอ */
}

/* ---------------- หน้าตรวจสอบ ---------------- */
let _isBoss = false, _openVils = null, _openErr = '', _ovEdit = null;
let _vilLoading = false;
let _tab = 'txt', _vils = null, _vilErr = '', _vilSel = null, _houses = [], _hFilter = 'all';
const _hCache = {};

function renderApp(){
  $('topRight').innerHTML = `<button class="ck-out" onclick="logout()">ออกจากระบบ</button>`;
  $('main').innerHTML = `

/* ---------- เลือกหมู่บ้าน ---------- */
const _norm = x=> String(x == null ? '' : x).replace(/\s+/g, '').toLowerCase();
function natCmp(a, b){
  const pa = String(a).split(/(\d+)/), pb = String(b).split(/(\d+)/);
  for(let i = 0; i < Math.max(pa.length, pb.length); i++){
    const x = pa[i] || '', y = pb[i] || '';
    if(x === y) continue;
    const nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
    if(nx && ny) return (+x) - (+y);
    return x.localeCompare(y, 'th');
  }
  return 0;
}
async function loadOpenVils(force){
  if(_openVils && !force) return _openVils;
  try{
    const { data, error } = await sb.rpc('check_open_villages');
    if(error) throw error;
    _openVils = (data || []).slice(); _openErr = '';
  }catch(e){
    _openVils = [];
    _openErr = /could not find|does not exist|schema cache|PGRST202/i.test(String((e && e.message) || e)) ? 'missing' : 'err';
  }
  return _openVils;
}
async function loadVillages(){
  if(!$('vselU')) return;
  if(_vils){ vilFilter(); return; }
  _vilLoading = true; vilFilter();
  loadOpenVils().then(()=> vilFilter());
  try{
    const { data, error } = await sb.rpc('check_villages');
    if(error) throw error;
    _vils = (data || []).slice().sort((a, b)=> String(a.village_name).localeCompare(String(b.village_name), 'th'));
    _vilErr = '';
  }catch(e){
    const m = String((e && e.message) || e);
    _vilErr = /could not find|does not exist|schema cache|PGRST202/i.test(m)
      ? 'ผู้ดูแลยังไม่ได้รัน supabase-checker.sql รุ่นใหม่ — ใช้แท็บ "วางข้อความเซล" ไปก่อน'
      : (/ถี่เกินไป/.test(m) ? 'ค้นหาถี่เกินไป รอสักครู่แล้วกดรีเฟรช' : 'โหลดรายชื่อหมู่บ้านไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วรีเฟรช');
    _vils = null;
  }
  _vilLoading = false;
  vilFilter();
}
function vilFilter(){
  const sU = $('vselU'), sO = $('vselO'); if(!sU || !sO) return;
  const q = _norm(($('vq') || {}).value);
  /* กลุ่มใต้ดิน */
  let hitU = [];
  if(!_vils){
    sU.innerHTML = `<option>${_vilLoading ? '⏳ กำลังโหลด...' : '—'}</option>`; sU.disabled = true;
    $('vinfo').innerHTML = _vilErr ? ckMsg('err', _vilErr, '') : '';
  } else {
    hitU = q ? _vils.filter(v=> _norm(v.village_name).includes(q) || _norm(v.village_code) === q || _norm(v.village_code).startsWith(q)) : _vils;
    sU.disabled = false;
    sU.innerHTML = `<option value="">${hitU.length ? `— เลือก (${hitU.length}) —` : (q ? 'ไม่พบในกลุ่มนี้' : 'ยังไม่มีข้อมูล')}</option>`
      + hitU.map(v=> `<option value="${esc(v.village_id)}"${_vilSel === v.village_id ? ' selected' : ''}>${esc(v.village_name)}${v.village_code ? ' · ' + esc(v.village_code) : ''}  (พร้อม ${v.n_ready}/${v.n_total})</option>`).join('');
  }
  /* กลุ่มพิเศษที่เปิดหน้าเว็บ */
  const hitO = (_openVils || []).filter(o=> !q || _norm(o.name).includes(q) || _norm(o.aliases).includes(q));
  sO.disabled = !_openVils;
  sO.innerHTML = `<option value="">${!_openVils ? '⏳ กำลังโหลด...' : (hitO.length ? `— เลือก (${hitO.length}) —` : (q ? 'ไม่พบในกลุ่มนี้' : 'ยังไม่มีรายการ'))}</option>`
    + hitO.map(o=> `<option value="${esc('o:' + o.id)}"${_vilSel === 'o:' + o.id ? ' selected' : ''}>🌐 ${esc(o.name)}</option>`).join('');
  /* พิมพ์จนเหลือหมู่บ้านเดียวทั้ง 2 กลุ่ม = เลือกให้เลย */
  if(q && hitU.length + hitO.length === 1){
    const val = hitU.length ? hitU[0].village_id : 'o:' + hitO[0].id;
    if(_vilSel !== val){ (hitU.length ? sU : sO).value = val; vilChoose(hitU.length ? 'U' : 'O', val); }
  }
}

function hSetFilter(k){ _hFilter = k; const v = (_vils || []).find(x=> x.village_id === _vilSel); const q = ($('hq') || {}).value || ''; renderHouseBox(v); const n = $('hq'); if(n) n.value = q; hFilter(); }

/* ============ ตัวอ่านข้อความ + ตัดสินผล (ชุดเดียวกับในแอปหลัก) ============ */
/* ---------- อ่านข้อความจากเซล ---------- */
const CK_ADDR = /\s(?=แขวง|เขต|ตำบล|ต\.|อำเภอ|อ\.|จังหวัด|จ\.|กรุงเทพ|กทม|ถนน|ถ\.|หมู่ที่|ม\.\s*\d)|\d{5}/;
function ckCleanVillage(v){
  let t = String(v || '')
    .replace(/\([^)]*\)/g, ' ')                                   /* (GRADV) */
    .split(CK_ADDR)[0]                                           /* ตัดที่อยู่ท้ายชื่อ */
    .replace(/^\s*(รบกวน)?\s*(ช่วย)?\s*(ขอ)?\s*(เปิด|เช็[คก]|ตรวจสอบ)?\s*(หน้า\s*เว[็]?[บปว]|หน้าเวป|หน้าเวบ)?\s*/, '')
    .replace(/^\s*(บ้าน\s*)?เลขที่\s*/, '')
    .replace(/^\s*(หมู่บ้าน|โครงการ|มบ\.)\s*/, '')
    .replace(/\s*(ด้วย)?\s*(นะ)?\s*(ค่ะ|คะ|ครับ|จ้า|จ้ะ)+\s*$/, '')
    .replace(/\s+/g, ' ')
    .replace(/^[\s,.:\-–]+|[\s,.:\-–]+$/g, '')
    .trim();
  return t.length >= 2 ? t : '';
}
function ckParseLine(line){
  let t = String(line || '').replace(/[\u200b\u00a0]/g, ' ').trim();
  const out = {};
  if(!t) return out;
  /* มีชื่อหมู่บ้านชัดเจน / จบที่อยู่ด้วยรหัสไปรษณีย์ — ใช้แยกคำขอที่เซลส่งติดกัน */
  if(/หมู่บ้าน|โครงการ|มบ\./.test(t)) out.strong = true;
  /* พิกัด — ต้องอยู่ในประเทศไทย */
  const mc = t.match(/(-?\d{1,2}\.\d{3,})\s*[,，\s]\s*(-?\d{2,3}\.\d{3,})/);
  if(mc){
    const la = +mc[1], lo = +mc[2];
    if(la >= 5 && la <= 21 && lo >= 97 && lo <= 106){ out.lat = la; out.lng = lo; }
    t = t.replace(mc[0], ' ');
  }
  if(/(^|[^\d\/.])[1-9]\d{4}(?![\d\/.])/.test(t)) out.closed = true;
  /* บ้านเลขที่ — 9/103 · 9/ 103 · 12/3/4 */
  let before = '', after = '', rest = t;
  const mh = t.match(/(^|[^\d.\/])(\d{1,5})\s*\/\s*(\d{1,5})(?:\s*\/\s*(\d{1,4}))?(?![\d.])/);
  if(mh){
    out.house = mh[2] + '/' + mh[3] + (mh[4] ? '/' + mh[4] : '');
    const st = mh.index + mh[1].length, en = mh.index + mh[0].length;
    before = t.slice(0, st); after = t.slice(en); rest = before + ' ' + after;
  } else {
    const mn = t.match(/(^|\s)(\d{1,4})\s*(?=หมู่บ้าน|มบ\.|ม\.\s*\d)/);
    if(mn){
      out.house = mn[2];
      const st = mn.index + mn[1].length, en = st + mn[2].length;
      before = t.slice(0, st); after = t.slice(en); rest = before + ' ' + after;
    }
  }
  /* ชื่อหมู่บ้าน */
  let vil = '';
  const hv = rest.search(/หมู่บ้าน|โครงการ|มบ\./);
  if(hv >= 0) vil = rest.slice(hv);
  else if(out.house) vil = ckCleanVillage(after) ? after : before;
  vil = ckCleanVillage(vil);
  if(vil) out.village = vil;
  return out;
}
function ckParse(text){
  const out = []; let cur = null;
  const flush = ()=>{ if(cur && (cur.house || cur.lat != null || cur.village)) out.push(cur); cur = null; };
  String(text || '').split(/\r?\n/).forEach(line=>{
    const p = ckParseLine(line);
    if(!(p.house || p.lat != null || p.village)) return;
    if(!cur) cur = {};
    /* ข้อมูลชนิดเดียวกันซ้ำ = คำขอใหม่
       ที่อยู่ที่จบด้วยรหัสไปรษณีย์แล้ว + บรรทัดใหม่มีบ้านเลขที่/ชื่อหมู่บ้าน = คำขอใหม่
       (พิกัดที่ตามหลังที่อยู่ ยังนับเป็นของคำขอเดิม) */
    const clash = (p.lat != null && cur.lat != null) || (p.house && cur.house)
               || (p.village && cur.village && !p.house && p.lat == null)
               || ((p.house || p.village) && cur.village && cur.closed
                   && (cur.house || cur.lat != null || (p.house && p.village)));
    if(clash){ flush(); cur = {}; }
    if(p.closed) cur.closed = true;
    if(p.lat != null){ cur.lat = p.lat; cur.lng = p.lng; }
    if(p.house) cur.house = p.house;
    if(p.village && !cur.village) cur.village = p.village;
  });
  flush();
  return out.slice(0, 10);
}

/* ---------- ถามระบบ ---------- */
async function ckQuery(qv, qh, lat, lng){
  try{
    if(sb && cloudUser){
      const args = { q_village: qv || '', q_house: qh || '' };
      if(lat != null && lng != null){ args.q_lat = lat; args.q_lng = lng; }
      const { data, error } = await sb.rpc('check_unit', args);
      if(error) return { err: error.message || String(error) };
      return { rows: data || [] };
    }
    return { err: 'offline' };
  }catch(e){ return { err: (e && e.message) || String(e) }; }
}
/* ชื่อหมู่บ้านที่เซลพิมพ์มักไม่ตรงเป๊ะ — ลองชื่อเต็มก่อน แล้วค่อยสั้นลง */
async function ckRun(e){
  const hasXY = e.lat != null;
  if(!e.house && !hasXY) return { need: true };
  const w = String(e.village || '').split(/\s+/).filter(Boolean);
  const tries = [];
  if(e.village) tries.push(e.village);
  if(w.length > 2) tries.push(w.slice(0, 2).join(' '));
  if(w.length > 1 && w[0].length >= 3) tries.push(w[0]);
  tries.push('');
  const seen = new Set();
  for(const v of tries){
    if(seen.has(v)) continue; seen.add(v);
    const r = await ckQuery(v, e.house || '', e.lat, e.lng);
    if(r.err) return { err: r.err };
    if(r.rows.length) return { rows: r.rows, usedVillage: v };
  }
  return { rows: [], usedVillage: '' };
}

async function checkUnit(){
  if(_ckBusy) return;
  const out = $('ckOut'); if(!out) return;
  window._ckCopy = ''; window._ckItems = [];   /* ล้างคำตอบรอบก่อน — กันคัดลอกคำตอบผิดหลัง */
  const txt = String(($('ckTxt') || {}).value || '').trim();
  await loadOpenVils();
  let reqs = ckParse(txt);
  /* พิมพ์มาแค่ชื่อหมู่บ้าน (ไม่มีคำว่า "หมู่บ้าน") — ลองเทียบกับหมู่บ้านกลุ่มพิเศษที่เปิดหน้าเว็บ */
  if(!reqs.length && (_openVils || []).length){
    reqs = txt.split(/\r?\n/).map(l=> ckCleanVillage(l)).filter(v=> v && ckOpenMatch({ village: v })).slice(0, 10).map(v=> ({ village: v }));
  }
  if(!reqs.length){
    out.innerHTML = ckMsg('warn', 'ยังอ่านบ้านเลขที่หรือพิกัดไม่ได้',
      'พิมพ์บ้านเลขที่ เช่น <b>9/103</b> ตามด้วยชื่อหมู่บ้าน หรือวางข้อความจากเซลที่มีพิกัด');
    const n = $('ckTxt'); if(n) n.focus();
    return;
  }
  _ckBusy = true;
  out.innerHTML = `<div class="ck-wait">⏳ กำลังตรวจสอบ ${reqs.length} คำขอ...</div>`;
  const res = [];
  for(const e of reqs){ res.push(await ckRun(e)); if(res[res.length-1].err) break; }
  _ckBusy = false;
  const firstErr = res.find(r=> r.err);
  if(firstErr && res.length === 1){ out.innerHTML = ckErr(firstErr.err); return; }
  const judged = reqs.map((e, i)=>{
    const r = res[i]; if(!r) return null;
    const ov = ckOpenFor(e, r);
    return ov ? ckJudgeOpen(e, ov, i) : ckJudge(e, r, i, reqs.length);
  }).filter(Boolean);
  window._ckReqs = reqs; window._ckJudged = judged; window._ckErr = firstErr;
  ckRenderOut();
}
function ckRenderOut(){
  const out = $('ckOut'); if(!out) return;
  const judged = window._ckJudged || [], firstErr = window._ckErr;
  window._ckCopy = judged.map(j=> j.copy).join('\n');
  window._ckItems = judged.map(j=> j.copy);
  const n = k=> judged.filter(j=> j.kind === k).length;
  const sum = true
    ? `<div class="ck-sum">
        <span>ตรวจแล้ว <b>${judged.length}</b> คำขอ</span>
        ${n('ok')      ? `<span class="s-ok">✅ พร้อม ${n('ok')}</span>` : ''}
        ${n('build')   ? `<span class="s-build">🚧 สร้างงาน ${n('build')}</span>` : ''}
        ${n('special') ? `<span class="s-no">💰 กลุ่มพิเศษ ${n('special')}</span>` : ''}
        ${n('ask')     ? `<span class="s-ask">⚠️ ต้องยืนยัน ${n('ask')}</span>` : ''}
        <button class="ck-copy" onclick="ckCopyAll()">📋 คัดลอกคำตอบส่งเซล</button>
      </div>` : '';
  out.innerHTML = sum + judged.map((j, i)=> `<div id="ckg${i}">${j.html}</div>`).join('')
    + (firstErr ? ckErr(firstErr.err) : '');
}

/* ---------- ตัดสินคำตอบของแต่ละคำขอ ---------- */
function ckJudge(e, r, i, total){
  const norm = x=> String(x == null ? '' : x).replace(/\s+/g, '').toLowerCase();
  const xy = e.lat != null ? `${e.lat.toFixed(5)}, ${e.lng.toFixed(5)}` : '';
  const ask = [e.house ? 'บ้านเลขที่ ' + e.house : '', e.village ? e.village : '', xy ? '📍 ' + xy : ''].filter(Boolean).join(' · ');
  const who = [e.house || '', e.village || (xy ? 'พิกัด ' + xy : '')].filter(Boolean).join(' ');
  const head = `<div class="ck-rq"><b>คำขอที่ ${i + 1}</b><span>อ่านได้ว่า: ${esc(ask) || '—'}</span></div>`;
  const map = xy ? `<a class="ck-map" href="https://www.google.com/maps?q=${e.lat},${e.lng}" target="_blank" rel="noopener">📍 ดูพิกัดในแผนที่</a>` : '';
  const wrap = (kind, body, copy)=> ({ kind, copy, html: `<div class="ck-grp">${head}${body}
      <div class="ck-act">${map}<button class="ck-c1" onclick="ckCopyOne(${i})">📋 คัดลอกข้อนี้</button></div></div>` });

  if(r.err)  return wrap('ask', ckErr(r.err), `❓ ${who} — ตรวจสอบไม่สำเร็จ`);
  if(r.need) return wrap('ask', ckMsg('warn', 'ข้อมูลไม่พอ', 'มีแค่ชื่อหมู่บ้าน — ขอ <b>บ้านเลขที่</b> หรือ <b>พิกัด</b> จากเซลเพิ่ม'),
                          `⚠️ ${who} — ขอบ้านเลขที่หรือพิกัดเพิ่มเพื่อตรวจสอบ`);
  const rows = r.rows || [];

  /* ไม่พบเลย */
  if(!rows.length){
    const body = e.house
      ? '• ตรวจการสะกดบ้านเลขที่อีกครั้ง<br>• ถ้ายังไม่พบ แปลว่าบ้านหลังนี้ยังไม่อยู่ในแผนงาน — <b>ยังเปิดระบบให้สมัครไม่ได้</b> สอบถามทีม Planning'
      : 'ไม่มีบ้านในระบบในรัศมี 250 ม. จากพิกัดนี้ — หมู่บ้านนี้น่าจะยังไม่อยู่ในแผนงาน <b>ยังเปิดระบบให้สมัครไม่ได้</b>';
    return wrap('ask', ckMsg('warn', 'ต้องยืนยัน · ไม่พบในระบบ', body), `⚠️ ${who} — ไม่พบในระบบ ยังเปิดให้บริการไม่ได้ ขอตรวจข้อมูลกับเซล/ทีม Planning ก่อน`);
  }

  /* มีแต่พิกัด — บอกได้ว่าอยู่หมู่บ้านไหน แต่ต้องขอบ้านเลขที่ */
  if(!e.house){
    const vils = [...new Set(rows.map(x=> x.village_name))];
    const list = rows.map(x=> `<div class="ck-mini"><b>${esc(x.house_no)}</b><span>${CK_KIND[ckKind(x)].short}</span><small>${x.distance_m != null ? '~' + x.distance_m + ' ม.' : ''}</small></div>`).join('');
    const vtxt = vils.length === 1 ? vils[0] : vils.join(' / ');
    return wrap('ask',
      `<div class="ck-res warn"><div class="ck-verdict">⚠️ ต้องยืนยัน</div><div class="ck-where" style="margin-top:6px"><b>📍 พิกัดนี้อยู่ใน ${esc(vtxt)}</b></div>
        <div class="ck-say">หมู่บ้านนี้มีในระบบ — <b>ขอบ้านเลขที่จากเซล</b> เพื่อยืนยันก่อนเปิดระบบ<br>
        <small>บ้านในระบบที่ใกล้พิกัดที่สุด:</small></div>${list}</div>`,
      `⚠️ พิกัด ${xy} อยู่ใน${vtxt} (มีในระบบ) — ขอบ้านเลขที่เพื่อยืนยันสถานะ`);
  }

  /* มีบ้านเลขที่ */
  const exact = rows.filter(x=> norm(x.house_no) === norm(e.house));
  if(!exact.length){
    return wrap('ask',
      ckMsg('warn', 'ต้องยืนยัน · ไม่พบบ้านเลขที่ ' + e.house + ' ในระบบ',
        '• ตรวจการสะกดอีกครั้ง<br>• บ้านเลขที่ใกล้เคียงที่มีในระบบ: ' + esc(rows.slice(0, 6).map(x=> x.house_no).join(', ')) + '<br>• ถ้าไม่ใช่ แปลว่ายังไม่อยู่ในแผนงาน — <b>ยังเปิดระบบไม่ได้</b>'),
      `⚠️ ${who} — ไม่พบบ้านเลขที่นี้ในระบบ ยังเปิดให้บริการไม่ได้ ขอตรวจบ้านเลขที่กับเซลก่อน`);
  }
  const pick = exact[0];
  const near = pick.distance_m != null && pick.distance_m <= 300;
  const nameOk = !e.village || r.usedVillage !== '';
  /* ชื่อหมู่บ้านไม่ตรง และพิกัดยืนยันไม่ได้ → ห้ามตัดสินแทน */
  if(!nameOk && !near){
    return wrap('ask',
      `<div class="ck-res warn"><div class="ck-verdict">⚠️ ต้องยืนยันก่อน</div>
        <div class="ck-say">ไม่พบบ้านเลขที่ ${esc(e.house)} ใน <b>${esc(e.village)}</b><br>
        แต่พบบ้านเลขที่เดียวกันใน: <b>${esc([...new Set(exact.map(x=> x.village_name))].join(' / '))}</b><br>
        <b>ห้ามเปิดระบบ</b> จนกว่าจะยืนยันกับเซลว่าเป็นหมู่บ้านเดียวกัน</div></div>`,
      `⚠️ ${who} — ไม่พบในหมู่บ้านที่ระบุ ต้องยืนยันชื่อหมู่บ้านกับเซลก่อน`);
  }
  /* บ้านเลขที่ซ้ำหลายหมู่บ้าน และไม่มีอะไรแยก */
  const others = exact.filter(x=> x !== pick);
  if(others.length && !near && !e.village){
    return wrap('ask',
      `<div class="ck-note">⚠️ บ้านเลขที่นี้มีใน <b>${exact.length} หมู่บ้าน</b> — ดูชื่อหมู่บ้านให้ตรงกับของลูกค้า</div>` + exact.map(x=> ckCard(x)).join(''),
      `⚠️ ${e.house} — มีหลายหมู่บ้าน ขอชื่อหมู่บ้านจากเซลเพื่อยืนยัน`);
  }
  const extra = [];
  if(pick.distance_m != null) extra.push(pick.distance_m <= 300
    ? `📍 ตรงกับพิกัดที่เซลส่ง (ห่าง ~${pick.distance_m} ม.)`
    : `⚠️ พิกัดที่เซลส่งห่างจากบ้านหลังนี้ ~${(pick.distance_m / 1000).toFixed(1)} กม. — ตรวจบ้านเลขที่/หมู่บ้านกับเซลอีกครั้ง`);
  if(!nameOk && near) extra.push(`ชื่อหมู่บ้านในระบบ: <b>${esc(pick.village_name)}</b> (ยืนยันด้วยพิกัด)`);
  if(others.length) extra.push(`มีบ้านเลขที่เดียวกันในหมู่บ้านอื่นอีก ${others.length} แห่ง (ไม่ใช่หลังนี้)`);
  const far = pick.distance_m != null && pick.distance_m > 1000;
  return wrap(far ? 'ask' : ckKind(pick), ckCard(pick, extra, e.lat != null ? { lat: e.lat, lng: e.lng } : null),
    far ? `⚠️ ${who} — พิกัดไม่ตรงกับบ้านเลขที่ ต้องยืนยันกับเซล` : ckCopyLine(pick));
}

   ✅ ok       พร้อมให้บริการ

const CK_SPECIAL = ['ลูกค้าไม่สนใจ ไม่ให้ร้อยสาย', 'ปล่อยสัญญาณที่ตู้ Post'];
const CK_KIND = {

  special: { ico:'💰', short:'💰 กลุ่มพิเศษ', title:'กลุ่มพิเศษ · มีค่าใช้จ่ายเพิ่มเติม', say:'ยังไม่ต้องเปิดระบบ — ต้องทำงานเพิ่ม แจ้งเซลตามวิธีแก้และค่าใช้จ่าย' },

};
function ckReady(r){ return r && (r.ready === true || r.ready === 'true' || r.ready === 't'); }
function ckKind(r){
  if(ckReady(r)) return 'ok';
  const st = String((r && r.status) || '').trim();
  if(CK_SPECIAL.some(x=> st.replace(/\s+/g, '') === x.replace(/\s+/g, ''))) return 'special';
  return 'build';
}
function ckCopyLine(x){
  const k = ckKind(x), st = String(x.status || '').trim() || 'ยังไม่มีการบันทึกสถานะ';
  const who = `${x.house_no} ${x.village_name}`;
  if(k === 'ok') return `✅ ${who} — พร้อมให้บริการ เปิดระบบได้`;
  if(k === 'build') return `🚧 ${who} — อยู่ระหว่างสร้างงาน (${st}) ยังเปิดระบบไม่ได้`;
  const bits = [st];
  if(x.solution) bits.push('แก้ไขโดย ' + x.solution);
  if(x.work_detail) bits.push(x.work_detail);
  bits.push(x.estimate_cost ? 'ค่าใช้จ่ายประมาณ ' + ckCost(x.estimate_cost) + ' (ต้องสำรวจก่อน)' : 'ยังไม่มีการประเมินค่าใช้จ่าย');
  return `💰 ${who} — กลุ่มพิเศษ ยังให้บริการไม่ได้: ${bits.join(' · ')}`;
}
function ckCopyOne(i){ ckCopyText((window._ckItems || [])[i] || ''); }
function ckCopyAll(){ ckCopyText(window._ckCopy || ''); }
function ckCopyText(t, msg){
  if(!t){ toast('ยังไม่มีคำตอบ'); return; }
  const done = ()=> toast(msg || 'คัดลอกแล้ว — วางตอบเซลใน LINE ได้เลย');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, fallback); return; }
  }catch(e){}
  fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('คัดลอกไม่ได้ — กดค้างที่ข้อความเพื่อคัดลอกเอง'); }
    ta.remove();
  }
}

function ckMsg(kind, title, body){
  const ico = kind === 'none' ? '🔎' : '⚠️';
  return `<div class="ck-res ${kind}"><div class="ck-verdict">${ico} ${esc(title)}</div>

function ckErr(err){
  const e = String(err || '');
  if(/ไม่มีสิทธิ์/.test(e))
    return ckMsg('err', 'บัญชีนี้ยังไม่ได้เปิดสิทธิ์ใช้หน้าตรวจสอบ', 'ติดต่อผู้ดูแลระบบให้เปิดสิทธิ์');
  if(/ถี่เกินไป/.test(e))
    return ckMsg('warn', 'ค้นหาถี่เกินไป', 'รอสักครู่ประมาณ 1 นาที แล้วลองใหม่');
  if(/กรุณาระบุ/.test(e))
    return ckMsg('warn', 'กรุณาใส่บ้านเลขที่ หรือพิกัด', '');
  if(/could not find|does not exist|schema cache|PGRST202|42883/i.test(e))
    return ckMsg('err', 'ระบบยังไม่พร้อมใช้งาน', 'ผู้ดูแลยังไม่ได้ติดตั้ง supabase-checker.sql');
  if(/jwt|expired|not authenticated|invalid.*token/i.test(e))
    return ckMsg('err', 'หมดเวลาการเข้าใช้', 'กรุณากด "ออกจากระบบ" แล้วเข้าใหม่');
  if(e === 'offline' || /failed to fetch|network|load failed/i.test(e))
    return ckMsg('err', 'เชื่อมต่อระบบไม่ได้', 'ตรวจสอบอินเทอร์เน็ต แล้วลองใหม่อีกครั้ง');
  return ckMsg('err', 'ตรวจสอบไม่สำเร็จ', 'ลองใหม่อีกครั้ง · ถ้ายังไม่ได้ แจ้งผู้ดูแลพร้อมข้อความนี้: ' + esc(e.slice(0, 160)));
}

function ckCost(x){
  const t = String(x || '').trim();
  if(!t) return '';
  const m = t.replace(/,/g, '').match(/^(\d+)\s*[-–]\s*(\d+)$/);
  if(m) return fmt(+m[1]) + ' – ' + fmt(+m[2]) + ' บาท';
  if(/^\d+$/.test(t.replace(/,/g, ''))) return fmt(+t.replace(/,/g, '')) + ' บาท';
  return t;
}
function ckDate(x){
  const t = String(x || '').trim();
  return /^\d{4}-\d{2}-\d{2}/.test(t) ? thDate(t.slice(0, 10)) : t;
}

/* ---------- หมู่บ้านกลุ่มพิเศษที่เปิดหน้าเว็บ (Admin เพิ่มเอง) ---------- */
const _ovClean = x=> _norm(String(x || '').replace(/^\s*(หมู่บ้าน|โครงการ|มบ\.)\s*/, ''));
/* big มี small อยู่ข้างใน — แต่ห้ามตัดกลางตัวเลข (พฤกษา 1 ≠ พฤกษา 10) */
function _ovHas(big, small){
  let i = big.indexOf(small);
  while(i >= 0){
    const b = big[i - 1] || '', a = big[i + small.length] || '';
    if(!(/\d/.test(a) && /\d$/.test(small)) && !(/\d/.test(b) && /^\d/.test(small))) return true;
    i = big.indexOf(small, i + 1);
  }
  return false;
}
/* ชื่อเต็ม + ชื่อเรียกอื่นของหมู่บ้าน (ตัด "หมู่บ้าน" และช่องว่างออกแล้ว) */
function ovForms(o){
  return [o.name].concat(String(o.aliases || '').split(/[,;\n]/)).map(_ovClean).filter(f=> f.length >= 3);
}
function ovDist(o, e){
  const la = ckNum(o.lat), lo = ckNum(o.lng);
  if(la === null || lo === null || e.lat == null) return null;
  return Math.round(111320 * Math.hypot(la - e.lat, (lo - e.lng) * Math.cos(e.lat * Math.PI / 180)));
}
const OV_NEAR = 1500;      /* ชื่อตรง แต่พิกัดเซลห่างเกินนี้ = ต้องยืนยัน */
const OV_COORD_ONLY = 500; /* มีแต่พิกัด — หาหมู่บ้านในรัศมีนี้ (ต้องยืนยันชื่อเสมอ) */
/* เทียบชื่อแบบเข้ม — ✅ อัตโนมัติได้เฉพาะเมื่อเซลพิมพ์ "ชื่อเต็ม" ครบ
     ok  : ข้อความเซลมีชื่อเต็ม (หรือชื่อเรียกอื่น) ครบทุกตัวอักษร + พิกัดไม่ขัดกัน
     ask : พิมพ์ไม่ครบ / ชื่อคล้ายหลายหมู่บ้าน / พิกัดห่าง / มีแต่พิกัด → ให้น้องเลือกเองหลังยืนยันกับเซล */
function ckOpenMatch(e){
  const L = _openVils || []; if(!L.length) return null;
  const byDist = arr=> e.lat == null ? arr : arr.slice().sort((a, b)=> (ovDist(a, e) ?? 1e9) - (ovDist(b, e) ?? 1e9));
  if(e.village){
    const q = _ovClean(e.village);
    if(q.length >= 3){
      /* 1) ชื่อเต็มอยู่ในข้อความเซล */
      const full = [];
      L.forEach(o=>{
        const f = ovForms(o).filter(f=> f === q || _ovHas(q, f)).sort((a, b)=> b.length - a.length)[0];
        if(f) full.push({ o, len: f.length, alias: f !== _ovClean(o.name) });
      });
      if(full.length){
        full.sort((a, b)=> b.len - a.len);
        const top = full.filter(x=> x.len === full[0].len);
        if(top.length > 1)
          return { kind: 'ask', why: 'ชื่อที่เซลส่งตรงกับหลายหมู่บ้าน — เลือกให้ตรงกับของลูกค้า', cands: byDist(top.map(x=> x.o)) };
        const o = top[0].o, dm = ovDist(o, e);
        if(dm !== null && dm > OV_NEAR)
          return { kind: 'ask', why: `ชื่อตรงกับ ${o.name} แต่พิกัดที่เซลส่งห่างจากหมู่บ้านนี้ ~${(dm / 1000).toFixed(1)} กม. — อาจเป็นคนละโครงการ`, cands: [o] };
        return { kind: 'ok', o, dm, alias: top[0].alias };
      }
      /* 2) พิมพ์ไม่ครบ หรือขึ้นต้นเหมือนกัน → ต้องเลือกเอง */
      const w0 = _ovClean(String(e.village).replace(/^\s*(หมู่บ้าน|โครงการ|มบ\.)\s*/, '').split(/\s+/)[0]);
      const part = L.filter(o=> ovForms(o).some(f=> _ovHas(f, q) || (w0.length >= 3 && f.indexOf(w0) === 0)));
      if(part.length)
        return { kind: 'ask', why: 'ชื่อที่เซลส่งมาไม่ครบ — ขอชื่อเต็มพร้อมสร้อยจากเซล แล้วเลือกให้ตรง', cands: byDist(part).slice(0, 6) };
    }
  }
  /* 3) มีแต่พิกัด (หรือชื่อไม่ตรงเลย) — บอกหมู่บ้านที่อยู่ใกล้ แต่ไม่ตัดสินให้ */
  if(e.lat != null){
    const near = L.filter(o=> { const d = ovDist(o, e); return d !== null && d <= OV_COORD_ONLY; });
    if(near.length)
      return { kind: 'ask', why: `พิกัดอยู่ใกล้หมู่บ้านกลุ่มพิเศษที่เปิดหน้าเว็บ (รัศมี ${OV_COORD_ONLY} ม.) — ยืนยันชื่อหมู่บ้านกับเซลก่อน`, cands: byDist(near).slice(0, 6) };
  }
  return null;
}
/* ใช้ผลหมู่บ้านกลุ่มพิเศษที่เปิดหน้าเว็บ เมื่อค้นในโครงการใต้ดินแล้วไม่เจอบ้านหลังนั้นในหมู่บ้านที่เซลระบุ */
function ckOpenFor(e, r){
  if(!r || r.err) return null;
  const rows = r.rows || [];
  const nm = x=> _norm(x);
  if(e.house){
    if(rows.length && e.village && r.usedVillage !== '') return null;   /* ชื่อตรงหมู่บ้านใต้ดิน — ให้ระบบใต้ดินตัดสิน */
    if(!e.village && rows.some(x=> nm(x.house_no) === nm(e.house))) return null;
  } else if(!r.need && rows.length){
    return null;                                     /* พิกัดตรงกับหมู่บ้านใต้ดิน */
  }
  return ckOpenMatch(e);
}

function ckJudgeOpen(e, m, i, picked){
  const xy = e.lat != null ? `${e.lat.toFixed(5)}, ${e.lng.toFixed(5)}` : '';

    return { kind: 'ok', copy: ckOpenCopy(m.o), html: `<div class="ck-grp">${head}${ckOpenCard(m.o, fb, notes)}${act}</div>` };
  }

  return { kind: 'ask',
    copy: `⚠️ ${who} — ชื่อหมู่บ้านไม่ชัด ขอชื่อเต็มพร้อมสร้อยจากเซลก่อน (ใกล้เคียง: ${names.join(' / ')})`,
    html: `<div class="ck-grp">${head}<div class="ck-res warn">
      <div class="ck-verdict">⚠️ ต้องยืนยัน</div>
      <div class="ck-say">${esc(m.why)}</div>
      <div class="ov-cands">${list}</div>
      <div class="ck-warn">กด "เลือก" ได้เมื่อ<b>ยืนยันชื่อเต็มกับเซลแล้ว</b>เท่านั้น — ถ้าไม่ตรงสักรายการ แปลว่ายังไม่อยู่ในรายการเปิดขาย</div>
    </div>${act}</div>` };

function ckOpenPick(i, id){

/* อ่านแถวจาก Excel → แยกเป็น เพิ่มใหม่ / อัปเดต / ข้าม */
function ovPlan(aoa){
  const rows = (aoa || []).filter(r=> r && r.some(c=> String(c == null ? '' : c).trim() !== ''));
  if(!rows.length) return { err: 'ไฟล์ว่าง' };
  const h = rows[0].map(c=> _norm(c));
  const find = re=> h.findIndex(x=> re.test(x));
  let cN = find(/ชื่อหมู่บ้าน|^หมู่บ้าน|^โครงการ|ชื่อโครงการ|^name|village/);
  const cS = find(/solution|โซลูชั่น|โซลูชัน/);
  let cA = find(/^lat|ละติจูด/), cO = find(/^long|^lng|^lon|ลองจิจูด/);
  const cXY = find(/พิกัด|lat,?long|latlong|coordinate/);
  const cAl = find(/ชื่อเรียกอื่น|ชื่ออื่น|alias/);
  if(cN < 0) cN = 0;
  const out = { add: [], upd: [], skip: [] };
  const seen = new Set();
  const have = new Map((_openVils || []).map(x=> [_norm(x.name), x]));
  rows.slice(1).forEach((r, k)=>{
    const line = k + 2;
    const name = String(r[cN] == null ? '' : r[cN]).replace(/\s+/g, ' ').trim();
    if(!name){ out.skip.push({ line, why: 'ไม่มีชื่อหมู่บ้าน' }); return; }
    if(_ovClean(name).length < 4){ out.skip.push({ line, name, why: 'ชื่อสั้นเกินไป — ใส่ชื่อเต็มพร้อมสร้อย' }); return; }
    if(/ตัวอย่าง/.test(name)){ out.skip.push({ line, name, why: 'แถวตัวอย่าง' }); return; }
    const key = _norm(name);
    if(seen.has(key)){ out.skip.push({ line, name, why: 'ชื่อซ้ำในไฟล์' }); return; }
    seen.add(key);
    let la = cA >= 0 ? r[cA] : '', lo = cO >= 0 ? r[cO] : '';
    const raw = cXY >= 0 ? String(r[cXY] == null ? '' : r[cXY]) : String(la == null ? '' : la);
    const m = raw.match(/(-?\d{1,2}\.\d+)\s*[,，\s]\s*(-?\d{2,3}\.\d+)/);
    if(m){ la = m[1]; lo = m[2]; }
    const has = String(la == null ? '' : la).trim() !== '' || String(lo == null ? '' : lo).trim() !== '';
    let lat = null, lng = null;
    if(has){
      lat = ckNum(String(la).trim()); lng = ckNum(String(lo).trim());
      if(lat === null || lng === null || lat < 5 || lat > 21 || lng < 97 || lng > 106){
        out.skip.push({ line, name, why: 'พิกัดไม่ถูกต้อง' }); return;
      }
    }
    const aliases = cAl >= 0 ? String(r[cAl] == null ? '' : r[cAl]).split(/[,;\n]/).map(x=> x.trim()).filter(Boolean).join(', ') : null;
    const row = { name, solution: String(cS >= 0 && r[cS] != null ? r[cS] : '').trim(), lat, lng };
    const old = have.get(key);
    row.aliases = aliases === null ? (old ? old.aliases || '' : '') : aliases;
    if(old){
      const same = old.name === row.name && (old.solution || '') === row.solution && (old.aliases || '') === row.aliases
        && (old.lat == null ? null : +old.lat) === lat && (old.lng == null ? null : +old.lng) === lng;
      if(same) out.skip.push({ line, name, why: 'เหมือนเดิม' });
      else out.upd.push(Object.assign({ id: old.id }, row));
    } else out.add.push(row);
  });
  return out;
}
let _ovPlan = null;
async function ovImportFile(el){
  const f = el && el.files && el.files[0]; if(!f) return;
  const box = $('ovImp'); box.innerHTML = `<div class="ck-wait">⏳ กำลังอ่านไฟล์...</div>`;
  try{
    const X = await needXLSX();
    const buf = await f.arrayBuffer();
    const wb = X.read(buf, { type: 'array' });
    const aoa = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    ovShowPlan(ovPlan(aoa));
  }catch(e){ box.innerHTML = `<div class="lg-err">อ่านไฟล์ไม่ได้ — ใช้ไฟล์ .xlsx จากปุ่ม "แบบฟอร์มเปล่า"</div>`; }
  el.value = '';
}
function ovShowPlan(pl){
  const box = $('ovImp');
  if(pl.err){ box.innerHTML = `<div class="lg-err">${esc(pl.err)}</div>`; _ovPlan = null; return; }
  _ovPlan = pl;
  const n = pl.add.length + pl.upd.length;
  const li = (arr, f)=> arr.slice(0, 30).map(f).join('') + (arr.length > 30 ? `<div>… อีก ${arr.length - 30} รายการ</div>` : '');
  box.innerHTML = `<div class="ov-plan">
      <div class="ov-pl-h">ตรวจไฟล์แล้ว — ยังไม่บันทึก</div>
      ${pl.add.length ? `<div class="ov-pl-g"><b>＋ เพิ่มใหม่ ${pl.add.length}</b>${li(pl.add, x=> `<div>${esc(x.name)} <small>${esc(x.solution || '')}</small></div>`)}</div>` : ''}
      ${pl.upd.length ? `<div class="ov-pl-g"><b>✎ อัปเดต ${pl.upd.length}</b>${li(pl.upd, x=> `<div>${esc(x.name)} <small>${esc(x.solution || '')}</small></div>`)}</div>` : ''}
      ${(()=>{ const all = (_openVils || []).filter(o=> !pl.upd.some(u=> u.id === o.id)).concat(pl.upd, pl.add.map((x, k)=> Object.assign({ id: 'new' + k }, x)));
               const ws = pl.add.concat(pl.upd).map(x=> { const sv = _openVils; _openVils = all; const w = ovOverlap(Object.assign({ id: x.id || ('new' + pl.add.indexOf(x)) }, x)); _openVils = sv; return w ? esc(x.name) : ''; }).filter(Boolean);
               return ws.length ? `<div class="ov-warn">⚠️ ชื่อซ้อนกับรายการอื่น: ${ws.join(' · ')} — เซลต้องพิมพ์ชื่อเต็ม ไม่งั้นจะขึ้น "ต้องยืนยัน"</div>` : ''; })()}
      ${pl.skip.length ? `<div class="ov-pl-g ov-pl-skip"><b>ข้าม ${pl.skip.length}</b>${li(pl.skip, x=> `<div>แถว ${x.line}${x.name ? ' · ' + esc(x.name) : ''} — ${esc(x.why)}</div>`)}</div>` : ''}
      ${n ? `<div class="ck-row2"><button class="ck-go" onclick="ovImportGo()">✔ ยืนยันนำเข้า ${n} รายการ</button>
             <button class="ck-clr" onclick="_ovPlan=null;$('ovImp').innerHTML=''">ยกเลิก</button></div>`
          : `<div class="ck-hint" style="text-align:left">ไม่มีอะไรต้องบันทึก</div>`}
    </div>`;
}
async function ovImportGo(){
  const pl = _ovPlan; if(!pl) return;
  const box = $('ovImp'); box.innerHTML = `<div class="ck-wait">⏳ กำลังบันทึก...</div>`;
  let ok = 0; const bad = [];
  try{
    if(pl.add.length){
      const { error } = await sb.from('open_villages').insert(pl.add);
      if(error) throw error;
      ok += pl.add.length;
    }
  }catch(e){ bad.push('เพิ่มใหม่ไม่สำเร็จ: ' + String((e && e.message) || e).slice(0, 120)); }
  for(const u of pl.upd){
    try{
      const { error } = await sb.from('open_villages').update({ name: u.name, solution: u.solution, lat: u.lat, lng: u.lng, aliases: u.aliases }).eq('id', u.id);
      if(error) throw error;
      ok++;
    }catch(e){ bad.push(u.name + ': ' + String((e && e.message) || e).slice(0, 80)); }
  }
  _ovPlan = null;
  await renderAdmin(); vilFilter();
  const b2 = $('ovImp');
  if(b2) b2.innerHTML = bad.length
    ? `<div class="lg-err">บันทึกแล้ว ${ok} รายการ · มีปัญหา ${bad.length}<br>${bad.map(esc).join('<br>')}</div>`
    : `<div class="ov-done">✅ นำเข้าแล้ว ${ok} รายการ</div>`;
  toast('นำเข้าแล้ว ' + ok + ' รายการ');
}
/* เตือนเมื่อชื่อซ้อนกัน เช่น "นิชดา" กับ "นิชดา เอสเตท" — ไม่บล็อก แค่ให้รู้ */
function ovOverlap(x){
  const mine = ovForms(x);
  const hit = (_openVils || []).filter(o=> o.id !== x.id && ovForms(o).some(f=> mine.some(m=> f !== m && (_ovHas(f, m) || _ovHas(m, f)))));
  if(!hit.length) return '';
  return '⚠️ ชื่อนี้ซ้อนกับ: <b>' + hit.map(o=> esc(o.name)).join(' · ') + '</b><br>ไม่เป็นไร ระบบแยกให้ — แต่ถ้าเซลพิมพ์แค่ส่วนที่ซ้ำกัน จะขึ้น "ต้องยืนยัน" ให้น้องเลือกเอง';
}
function ovSplitXY(el){
  const m = String(el.value || '').match(/(-?\d{1,2}\.\d+)\s*[,，\s]\s*(-?\d{2,3}\.\d+)/);
  if(m){ el.value = m[1]; $('ovLng').value = m[2]; }
}
async function ovSave(){
  const name = String($('ovName').value || '').replace(/\s+/g, ' ').trim(), sol = String($('ovSol').value || '').trim();
  const aliases = String(($('ovAl') || {}).value || '').split(/[,;\n]/).map(x=> x.trim()).filter(Boolean).join(', ');
  const ls = String($('ovLat').value || '').trim(), gs = String($('ovLng').value || '').trim();
  const msg = t=> { $('ovMsg').innerHTML = `<div class="lg-err">${t}</div>`; };
  if(!name) return msg('กรุณาใส่ชื่อหมู่บ้าน');
  if(_ovClean(name).length < 4) return msg('ชื่อสั้นเกินไป — ใส่ชื่อเต็มพร้อมสร้อยหมู่บ้าน');
  let lat = null, lng = null;
  if(ls || gs){
    lat = ckNum(ls); lng = ckNum(gs);
    if(lat === null || lng === null || lat < 5 || lat > 21 || lng < 97 || lng > 106) return msg('พิกัดไม่ถูกต้อง — Lat 5–21, Long 97–106 (ในประเทศไทย) และต้องใส่ทั้งคู่');
  }
  const dup = (_openVils || []).find(x=> x.id !== _ovEdit && _norm(x.name) === _norm(name));
  if(dup) return msg('มีชื่อหมู่บ้านนี้ในรายการแล้ว — กด "แก้ไข" ที่รายการเดิมแทน');
  const row = { name, solution: sol, lat, lng, aliases };
  const warn = ovOverlap({ id: _ovEdit, name, aliases });
  try{
    const q = _ovEdit ? sb.from('open_villages').update(row).eq('id', _ovEdit) : sb.from('open_villages').insert(row);
    const { error } = await q;
    if(error) throw error;
    toast(_ovEdit ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่ม ' + name + ' แล้ว');
    _ovEdit = null;
    await renderAdmin(); vilFilter();
    if(warn && $('ovMsg')) $('ovMsg').innerHTML = `<div class="ov-warn">${warn}</div>`;
  }catch(e){
    const m = String((e && e.message) || e);
    msg(/row-level security|permission/i.test(m) ? 'บันทึกไม่ได้ — เฉพาะ Admin เท่านั้น' : 'บันทึกไม่สำเร็จ: ' + esc(m.slice(0, 160)));
  }
}
async function ovDel(id){
  const x = (_openVils || []).find(o=> o.id === id); if(!x) return;
  if(!confirm('ลบ "' + x.name + '" ออกจากรายการ?\nน้อง Key สมัครจะเช็คหมู่บ้านนี้ไม่เจออีก')) return;
  try{
    const { error } = await sb.from('open_villages').delete().eq('id', id);
    if(error) throw error;
    toast('ลบแล้ว');
    if(_ovEdit === id) _ovEdit = null;
    await renderAdmin(); vilFilter();
  }catch(e){ toast('ลบไม่สำเร็จ'); }
}

/* ---------- พร้อมให้บริการ: ลิงก์ระบบเปิดหน้าเว็บ + พิกัดพร้อมคัดลอก ---------- */
const OPEN_WEB_URL = 'https://newfibre.ais.co.th/Process/Login';
function ckNum(x){ const n = (x === null || x === undefined || x === '') ? NaN : +x; return isFinite(n) ? n : null; }
function ckXY(v){ return (+v).toFixed(6); }   /* ทศนิยม 6 ตำแหน่งเสมอ — ขาดเติม 0 เกินปัดทิ้ง */
function ckOpenWeb(r, fb, label){
  let la = ckNum(r.lat), lo = ckNum(r.lng), src = label || 'พิกัดบ้านในระบบ';
  if(la === null || lo === null || la < 5 || la > 21 || lo < 97 || lo > 106){
    la = fb ? ckNum(fb.lat) : null; lo = fb ? ckNum(fb.lng) : null; src = 'พิกัดจากข้อความเซล (ในระบบยังไม่มี)';
  }
  const has = la !== null && lo !== null;
  const both = has ? ckXY(la) + ', ' + ckXY(lo) : '';
  const xy = has ? `<div class="ck-xy">
      <div class="ck-xyh">📍 ${src}</div>
      <div class="ck-xyrow ck-xy1"><span>Lat, Long</span><b>${both}</b></div>
      <button class="ck-xyall" onclick="ckCopyText('${both}','คัดลอกพิกัดแล้ว — วางในระบบเปิดหน้าเว็บได้เลย')">📋 คัดลอกพิกัด</button>
    </div>`
    : `<div class="ck-warn" style="margin-top:10px">ยังไม่มีพิกัดในระบบ — ใช้พิกัดจากเซล หรือแจ้งทีม Planning</div>`;
  return `<div class="ck-open">
      <a class="ck-web" href="${OPEN_WEB_URL}" target="_blank" rel="noopener">🌐 ไปหน้าระบบเปิดหน้าเว็บ (newfibre)</a>
      ${xy}
    </div>`;
}
function ckCard(r, extra, fb){
  const k = ckKind(r), K = CK_KIND[k];
  const st = String(r.status || '').trim();
  const where = `<div class="ck-where"><b>${esc(r.village_name || '')}</b>${r.village_code ? ` <span>${esc(r.village_code)}</span>` : ''}
      <div class="ck-no">บ้านเลขที่ ${esc(r.house_no || '')}</div></div>`;
  const ex = (extra && extra.length) ? `<div class="ck-ex">${extra.map(x=> `<div>${x}</div>`).join('')}</div>` : '';
  const upd = r.last_update ? `<div class="ck-upd">ข้อมูลหมู่บ้านอัปเดตล่าสุด ${esc(ckDate(r.last_update))}</div>` : '';
  const head = `<div class="ck-verdict">${K.ico} ${K.title}</div><div class="ck-say">${K.say}</div>`;
  if(k === 'ok') return `<div class="ck-res ok">${where}${head}${ex}${ckOpenWeb(r, fb)}${upd}</div>`;
  const why = [['สถานะตอนนี้', st || 'ยังไม่มีการบันทึกสถานะ']];
  if(k === 'build'){
    return `<div class="ck-res build">${where}${head}
      <div class="ck-why">${why.map(([a, b])=> `<div class="ck-row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}</div>
      ${!st ? `<div class="ck-warn">ยังไม่มีการบันทึกสถานะ — สอบถามทีม Planning</div>` : ''}${ex}${upd}</div>`;
  }
  if(r.solution)    why.push(['แก้ไขโดย', r.solution]);
  if(r.work_detail) why.push(['งานที่ต้องทำก่อน', r.work_detail]);
  why.push(['ค่าใช้จ่ายโดยประมาณ', r.estimate_cost ? ckCost(r.estimate_cost) : 'ยังไม่มีการประเมิน']);
  return `<div class="ck-res no">${where}${head}
    <div class="ck-why">${why.map(([a, b])=> `<div class="ck-row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}</div>
    <div class="ck-warn">${r.estimate_cost ? 'ค่าใช้จ่ายเป็นตัวเลขประมาณการ ต้องสำรวจหน้างานก่อนแจ้งลูกค้า' : 'ยังไม่มีการประเมินค่าใช้จ่าย — สอบถามทีม Planning ก่อนแจ้งลูกค้า'}</div>
    ${ex}${upd}</div>`;
}


/* ---------------- เริ่มต้น ---------------- */
(async function init(){
  if(!sb){ renderLogin(loginErr('โหลดระบบไม่สำเร็จ — ตรวจอินเทอร์เน็ต แล้วรีเฟรชหน้านี้')); return; }
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user){ await afterLogin(data.session.user); return; }
  }catch(e){}
  renderLogin('');
})();
</script>
